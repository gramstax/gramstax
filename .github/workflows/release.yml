name: Release

on:
  push:
    branches:
      - main
  # Manual recovery: when a previous run bumped the version (commit) but
  # failed to publish to NPM, re-run with publish_only to publish the
  # version currently on disk WITHOUT re-versioning (`nx release publish`
  # never touches versions, tags, or changelogs).
  workflow_dispatch:
    inputs:
      publish_only:
        description: "Publish disk version to NPM without versioning (recovery)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

# One writer to main at a time. `docs.yml` commits the regenerated reference to
# the same branch, and a maintainer can push at any moment, so the release shares
# its concurrency group with the docs job. Queued runs wait instead of cancelling.
concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  # Per-package test isolation: each package runs typecheck + tests in its
  # own job/process so native resources (LMDB mmaps, worker threads) are
  # never shared across packages. Previously `bun test ./packages` ran all
  # 121 files in one process and flaked under load (see: LmdbRepository.like
  # + worker-thread RPC timeouts failing only on CI, green locally).
  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [gramstax, create-gramstax, lmdb, worker-thread]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # The cli.target-worker / cli.target-lambda suites call generate() with AOT,
      # which loads the fixture page modules. Those pages do
      # `import {Ctx} from "gramstax"`, and that bare specifier resolves to
      # packages/gramstax/dist via package.json "main" — dist is gitignored and
      # never committed, so a fresh checkout has none and the whole emit suite
      # dies on MODULE_NOT_FOUND before any assertion runs.
      - name: Build gramstax dist
        if: matrix.package == 'gramstax'
        run: bun run build:gramstax

      - name: Typecheck package
        run: bunx --package typescript@7.0.2 tsc --noEmit -p packages/${{ matrix.package }}

      - name: Test package
        run: bun test packages/${{ matrix.package }}

  release:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      # `ref: main`, not the event SHA. This job starts only after the test
      # matrix, so the branch tip is already newer than the commit that triggered
      # the run. Checking out the tip versions the code that is actually on main;
      # the sync step below closes the remaining window.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node (for NPM OIDC)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Lint and Build
        # Release covers packages/* only — the same scope nx.json already uses for
        # release.projects. A bare `nx run-many -t build` would also build
        # example-11-cloudflare-worker, which is not published and not released.
        run: |
          bun run lint:packages
          bun run build:packages

      # The test matrix and the build take minutes. If anything lands on main in
      # that window, Nx creates the version commit on a tree that is already
      # behind, and its push is rejected as non-fast-forward. Re-sync at the last
      # safe moment; when the tip moved, rebuild so the published dist matches
      # the source being versioned.
      - name: Sync to latest main
        run: |
          BEFORE=$(git rev-parse HEAD)
          git fetch origin main --tags --force
          git reset --hard origin/main
          AFTER=$(git rev-parse HEAD)
          echo "Releasing from $AFTER ($(git log -1 --format=%s))"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "main moved during the build; rebuilding on the new tip."
            bun install --frozen-lockfile
            bun run lint:packages
            bun run build:packages
          fi

      - name: Record pre-release tag
        run: |
          TAG_BEFORE=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          echo "TAG_BEFORE=$TAG_BEFORE" >> "$GITHUB_ENV"
          echo "Pre-release tag: $TAG_BEFORE"
          START_SHA=$(git rev-parse HEAD)
          echo "START_SHA=$START_SHA" >> "$GITHUB_ENV"

      # Release gate: decide whether the publish path may run.
      #
      # Two independent facts:
      # - VERSIONABLE: versionable commits (`feat:`, `fix:`, `!` breaking
      #   marker) exist since the last tag, so `nx release` would bump to a
      #   NEW version that cannot collide on the registry. Always release.
      # - ALL_PUBLISHED: the disk version is already on NPM for all four
      #   packages (re-run of an old run, or an unneeded publish_only
      #   recovery). Publishing again fails with "cannot publish over
      #   previously published versions".
      #
      # Skip ONLY when there is nothing to version AND nothing to publish.
      # A bare "already published" check must never skip versioning (that
      # mistake froze releases at 2.0.0 despite pending feats).
      - name: Decide release necessity
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          echo "Last tag: $LAST_TAG"
          DISK_VERSION=$(node -p "require('./packages/gramstax/package.json').version")
          echo "Disk version: $DISK_VERSION"
          VERSIONABLE=false
          if [ "$LAST_TAG" = "none" ]; then
            echo "No tags reachable — cannot assess; proceeding WITHOUT skip (fail loudly, never silently)."
            VERSIONABLE=true
          else
            if git log "$LAST_TAG..HEAD" --format=%s | grep -qE "^(feat|fix)(\(.+\))?!?:"; then
              echo "Versionable commits found since $LAST_TAG."
              VERSIONABLE=true
            fi
            if git log "$LAST_TAG..HEAD" --format=%B | grep -q "BREAKING CHANGE"; then
              echo "Breaking-change footer found since $LAST_TAG."
              VERSIONABLE=true
            fi
          fi
          ALL_PUBLISHED=true
          for NPM_NAME in gramstax create-gramstax "@gramstax/lmdb" "@gramstax/worker-thread"; do
            if npm view "$NPM_NAME@$DISK_VERSION" version > /dev/null 2>&1; then
              echo "$NPM_NAME@$DISK_VERSION already on NPM."
            else
              echo "$NPM_NAME@$DISK_VERSION NOT on NPM — publish needed."
              ALL_PUBLISHED=false
            fi
          done
          if [ "$VERSIONABLE" = "true" ] || [ "$ALL_PUBLISHED" = "false" ]; then
            echo "SKIP_RELEASE=false" >> "$GITHUB_ENV"
            echo "Proceeding to release (new version and/or unpublished disk version)."
          else
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
            echo "Nothing to version and disk version fully published — publish steps will be skipped."
          fi

      - name: Initialize Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Dry Run Release (with NPM OIDC)
        if: ${{ !inputs.publish_only }}
        run: bun run dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Passwordless OIDC trusted publishing requires npm >= 11.5.1 to mint
      # the short-lived registry token automatically. Node 22 bundles npm 10,
      # which sends NO auth at all — the registry then answers every PUT
      # (scoped and unscoped alike) with a misleading 404 "not in this
      # registry". Do NOT add NODE_AUTH_TOKEN: that would silently replace
      # the OIDC flow with a long-lived secret.
      - name: Upgrade npm for OIDC trusted publishing
        if: ${{ env.SKIP_RELEASE != 'true' }}
        run: npm install -g npm@11 && npm --version

      - name: Release (with NPM OIDC)
        if: ${{ !inputs.publish_only && env.SKIP_RELEASE != 'true' }}
        run: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Only (recovery, no versioning)
        if: ${{ inputs.publish_only && env.ALL_PUBLISHED != 'true' }}
        run: bun run publish:all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Safe rollback: only removes artifacts THIS run created (tag + GitHub
      # release). Never rewrites history — the version-bump commit stays, and
      # already-published NPM packages are immutable and left for manual
      # follow-up. Single workspace version (nx releaseTag v{version}), so one
      # VERSION applies to all four packages. Every deletion is VERIFIED
      # (the previous fire-and-forget `|| echo` masked failed cleanups).
      - name: Revert Release on Failure
        if: failure()
        run: |
          echo "Workflow failed. Checking state..."
          TAG_NOW=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          if [ "$TAG_NOW" = "$TAG_BEFORE" ]; then
            echo "Latest tag ($TAG_NOW) predates this run — no new tag to revert (covers publish-only runs too)."
          elif [ "$TAG_BEFORE" = "none" ]; then
            echo "❌ TAG_BEFORE is none (tagless checkout?) — refusing to delete anything: cannot prove this run created $TAG_NOW. Clean up manually if needed."
          else
            # Proof of creation (not inference): under the serialized
          # release-main group, a tag created by THIS run points at a commit
          # made after START_SHA. A pre-existing tag points inside pre-run
          # history and is always an ancestor of START_SHA.
          TAG_COMMIT=$(git rev-list -n 1 "$TAG_NOW" 2>/dev/null || echo "")
          if [ -z "$TAG_COMMIT" ] || [ -z "$START_SHA" ]; then
            echo "❌ Cannot resolve tag commit or start SHA — refusing to delete anything. Clean up manually if needed."
            mb=99
          else
            mb=0
            git merge-base --is-ancestor "$TAG_COMMIT" "$START_SHA" 2>/dev/null || mb=$?
          fi
          if [ "$mb" -eq 0 ]; then
            echo "Tag $TAG_NOW points inside pre-run history — it predates this run. Refusing to delete (tag + release left intact)."
          elif [ "$mb" -eq 1 ]; then
            echo "Tag $TAG_NOW was created by this run — proceeding with revert."
            TAG="$TAG_NOW"
            VERSION=${TAG#v}
            echo "This run created tag: $TAG (version $VERSION)"

            for NPM_NAME in gramstax create-gramstax "@gramstax/lmdb" "@gramstax/worker-thread"; do
              if npm view "$NPM_NAME@$VERSION" version > /dev/null 2>&1; then
                echo "⚠️ $NPM_NAME@$VERSION EXISTS on NPM — published before the failure. Leaving it in place (immutable); manual follow-up required."
              else
                echo "$NPM_NAME@$VERSION not on NPM — nothing to unpublish."
              fi
            done

            echo "Deleting GitHub release for $TAG (if created by this run)..."
            if gh release delete "$TAG" --yes; then
              echo "GitHub release $TAG deleted."
            else
              echo "No GitHub release for $TAG (or delete failed — verify manually)."
            fi
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "❌ GitHub release $TAG STILL EXISTS — delete it manually."
            else
              echo "Verified: no GitHub release $TAG remains."
            fi

            echo "Deleting remote tag $TAG..."
            if git push origin ":refs/tags/$TAG"; then
              echo "Remote tag push accepted."
            else
              echo "❌ Remote tag push FAILED."
            fi
            if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
              echo "❌ Remote tag $TAG STILL EXISTS — delete it manually."
            else
              echo "Verified: remote tag $TAG is gone."
            fi
          else
            echo "❌ merge-base check failed (exit $mb) — refusing to delete anything. Clean up manually if needed."
          fi
          fi

          echo "Version-bump commit left in place intentionally — no history rewrite."
          DISK_VERSION=$(node -p "require('./packages/gramstax/package.json').version")
          echo "Disk version is now $DISK_VERSION."
          echo "If NPM is missing $DISK_VERSION: fix the cause, then re-run this workflow manually with publish_only=true to publish the disk version without re-versioning."
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
