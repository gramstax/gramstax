name: Release

on:
  push:
    branches:
      - main
  # Manual recovery: when a previous run bumped the version (commit) but
  # failed to publish to NPM, re-run with publish_only to publish the
  # version currently on disk WITHOUT re-versioning (`nx release publish`
  # never touches versions, tags, or changelogs).
  workflow_dispatch:
    inputs:
      publish_only:
        description: "Publish disk version to NPM without versioning (recovery)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

# Single release at a time: concurrent runs would double-bump versions
# and race tags. Queued runs wait instead of cancelling.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (for NPM OIDC)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Verify Code
        run: |
          bun run ci:test:packages
          bun run build

      - name: Record pre-release tag
        run: |
          TAG_BEFORE=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          echo "TAG_BEFORE=$TAG_BEFORE" >> "$GITHUB_ENV"
          echo "Pre-release tag: $TAG_BEFORE"

      - name: Initialize Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Dry Run Release (with NPM OIDC)
        if: ${{ !inputs.publish_only }}
        run: bun run dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Passwordless OIDC trusted publishing requires npm >= 11.5.1 to mint
      # the short-lived registry token automatically. Node 22 bundles npm 10,
      # which sends NO auth at all — the registry then answers every PUT
      # (scoped and unscoped alike) with a misleading 404 "not in this
      # registry". Do NOT add NODE_AUTH_TOKEN: that would silently replace
      # the OIDC flow with a long-lived secret.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11 && npm --version

      - name: Release (with NPM OIDC)
        if: ${{ !inputs.publish_only }}
        run: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Only (recovery, no versioning)
        if: ${{ inputs.publish_only }}
        run: bun run publish:all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Safe rollback: only removes artifacts THIS run created (tag + GitHub
      # release). Never rewrites history — the version-bump commit stays, and
      # already-published NPM packages are immutable and left for manual
      # follow-up. Single workspace version (nx releaseTag v{version}), so one
      # VERSION applies to all four packages. Every deletion is VERIFIED
      # (the previous fire-and-forget `|| echo` masked failed cleanups).
      - name: Revert Release on Failure
        if: failure()
        run: |
          echo "Workflow failed. Checking state..."
          TAG_NOW=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          if [ "$TAG_NOW" = "$TAG_BEFORE" ]; then
            echo "Latest tag ($TAG_NOW) predates this run — no new tag to revert (covers publish-only runs too)."
          else
            TAG="$TAG_NOW"
            VERSION=${TAG#v}
            echo "This run created tag: $TAG (version $VERSION)"

            for NPM_NAME in gramstax create-gramstax "@gramstax/lmdb" "@gramstax/worker-thread"; do
              if npm view "$NPM_NAME@$VERSION" version > /dev/null 2>&1; then
                echo "⚠️ $NPM_NAME@$VERSION EXISTS on NPM — published before the failure. Leaving it in place (immutable); manual follow-up required."
              else
                echo "$NPM_NAME@$VERSION not on NPM — nothing to unpublish."
              fi
            done

            echo "Deleting GitHub release for $TAG (if created by this run)..."
            if gh release delete "$TAG" --yes; then
              echo "GitHub release $TAG deleted."
            else
              echo "No GitHub release for $TAG (or delete failed — verify manually)."
            fi
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "❌ GitHub release $TAG STILL EXISTS — delete it manually."
            else
              echo "Verified: no GitHub release $TAG remains."
            fi

            echo "Deleting remote tag $TAG..."
            if git push origin ":refs/tags/$TAG"; then
              echo "Remote tag push accepted."
            else
              echo "❌ Remote tag push FAILED."
            fi
            if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
              echo "❌ Remote tag $TAG STILL EXISTS — delete it manually."
            else
              echo "Verified: remote tag $TAG is gone."
            fi
          fi

          echo "Version-bump commit left in place intentionally — no history rewrite."
          DISK_VERSION=$(node -p "require('./packages/gramstax/package.json').version")
          echo "Disk version is now $DISK_VERSION."
          echo "If NPM is missing $DISK_VERSION: fix the cause, then re-run this workflow manually with publish_only=true to publish the disk version without re-versioning."
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
