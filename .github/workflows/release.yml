name: Release

on:
  push:
    branches:
      - main
      # Ganti 'main' dengan nama branch utama Anda jika berbeda (misalnya 'master' atau 'develop')

jobs:
  release:
    runs-on: ubuntu-latest

    # IZIN PENTING: Job ini membutuhkan izin 'contents: write'
    # agar GitHub Actions dapat membuat commit, tag, dan GitHub Releases.
    permissions:
      contents: write

    steps:
      - name: 🛑 Checkout Repo
        uses: actions/checkout@v4
        with:
          # Fetch depth 0 diperlukan agar Nx dapat menganalisis seluruh riwayat git
          fetch-depth: 0
          # Token ini digunakan oleh checkout action untuk menulis commit/tag balik
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Konfigurasi NPM:
          registry-url: "https://registry.npmjs.org"

      - name: 🛠️ Install Dependencies
        run: npm install

      - name: 🧹 Set Nx SHAs for affected commands
        uses: nrwl/nx-set-shas@v4

      - name: 🚀 Run Nx Release
        run: npx nx release
        env:
          # TOKEN GITHUB: Nx akan mengambil GITHUB_TOKEN dari secrets bawaan GitHub
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TOKEN NPM: Nx akan menggunakan token NPM yang disimpan di secrets repo Anda
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
