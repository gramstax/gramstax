name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (for NPM OIDC)
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Verify Code
        run: |
          bun run ci:test:packages
          bun run build

      - name: Initialize Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Dry Run Release (with NPM OIDC)
        run: bun run dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release (with NPM OIDC)
        run: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Revert Release on Failure
        if: failure()
        run: |
          echo "Workflow failed. Checking state..."

          # Get the tag that was just created
          TAG=$(git describe --tags --abbrev=0)
          VERSION=${TAG#v}
          PACKAGE_NAME="gramstax"

          echo "Checking if $PACKAGE_NAME@$VERSION exists on NPM..."

          if npm view "$PACKAGE_NAME@$VERSION" version > /dev/null 2>&1; then
            echo "⚠️ Package $PACKAGE_NAME@$VERSION ALREADY EXISTS on NPM."
            echo "Publishing succeeded but workflow failed elsewhere (e.g. GitHub Release)."
            echo "SKIPPING REVERT to prevent inconsistent state (orphaned NPM package)."
            echo "Please manually check the failure."
            exit 1
          else
            echo "Package not found on NPM. Proceeding with full rollback..."
            
            echo "Reverting tag: $TAG"
            
            # Delete release from GitHub
            gh release delete $TAG --yes || echo "Release not found on GitHub"
            
            # Delete tag remotely
            git push origin :refs/tags/$TAG || echo "Remote tag not found"
            
            # Reset to previous commit and force push to revert the version bump
            git reset --hard HEAD~1
            git push origin main --force
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
