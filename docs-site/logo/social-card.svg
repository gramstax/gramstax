<?xml version="1.0" encoding="UTF-8"?>
<!--
  gramstax social / Open Graph card.

  Regenerate (run from the repo root, requires bun plus the ad hoc resvg CLI, nothing
  is added to any package.json):

      cd docs-site/logo && bunx @resvg/resvg-js-cli social-card.svg social-card.png

  The `cd` matters: the rasterizer resolves the relative `gramstax.png` reference
  against the working directory, so the command has to run from this folder. Output
  is exactly 1200 x 630. The CLI always writes RGBA; the committed png has the fully
  opaque alpha channel dropped and re-deflated (about 380 KB becomes about 212 KB).
  Either file looks identical, the committed one is just the lighter web asset.

  Type: Segoe UI Black (900) for the wordmark, Cascadia Mono 600 for the tagline.
  Both ship with Windows, so the card regenerates without fetching a webfont.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <title>gramstax: page-based routing and a template system for Telegram bots</title>

  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b1e"/>
      <stop offset="0.52" stop-color="#0a1a42"/>
      <stop offset="1" stop-color="#15349b"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.70"/>
      <stop offset="0.5" stop-color="#2563eb" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-soft" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>

    <!-- faint column rules, faded out toward the lit side of the card -->
    <pattern id="rules" width="78" height="78" patternUnits="userSpaceOnUse">
      <rect width="1" height="630" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <radialGradient id="rule-fade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="rule-mask">
      <rect width="1200" height="630" fill="url(#rule-fade)" transform="matrix(0.86 0 0 1.06 -100 -20)"/>
    </mask>

    <filter id="mark-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="14"/>
      <feFlood flood-color="#020617" flood-opacity="0.55"/>
      <feComposite operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- soft left edge for the oversized ghost, so it never shows a hard seam -->
    <linearGradient id="ghost-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.15" stop-color="#ffffff"/>
    </linearGradient>
    <mask id="ghost-mask">
      <rect x="640" y="-240" width="920" height="1140" fill="url(#ghost-fade)"/>
    </mask>
  </defs>

  <!-- ground -->
  <rect width="1200" height="630" fill="url(#base)"/>
  <rect width="1200" height="630" fill="url(#rules)" mask="url(#rule-mask)"/>
  <ellipse cx="946" cy="352" rx="620" ry="470" fill="url(#glow)"/>
  <ellipse cx="1128" cy="70" rx="420" ry="300" fill="url(#glow-soft)"/>

  <!-- oversized ghost of the mark, bleeding off the right edge -->
  <g opacity="0.075" mask="url(#ghost-mask)">
    <image href="gramstax.png" xlink:href="gramstax.png" x="712" y="-70" width="780" height="780" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- mark at its native 200 px, so it stays crisp -->
  <g filter="url(#mark-shadow)">
    <image href="gramstax.png" xlink:href="gramstax.png" x="104" y="70" width="200" height="200" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <rect x="104" y="70" width="200" height="200" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>

  <!-- wordmark -->
  <text x="104" y="400" font-family="Segoe UI" font-weight="900" font-size="120" letter-spacing="-4.5" fill="#ffffff">gramstax</text>

  <!-- accent rule -->
  <rect x="104" y="454" width="88" height="6" rx="3" fill="url(#accent)"/>

  <!-- tagline -->
  <g font-family="Cascadia Mono" font-weight="600" font-size="34" fill="#e6efff" letter-spacing="-0.4">
    <text x="104" y="512">Page-based routing and a template system</text>
    <text x="104" y="558">for Telegram bots.</text>
  </g>

</svg>