<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 292" width="860" height="292" role="img" aria-label="The handle method shapes that land in routeStatic and routeStaticIntent, plus the two single-shape tables routeStaticSession and routeDynamic">
  <title>The handle method shapes and the four route tables they land in</title>

  <rect x="0.5" y="0.5" width="859" height="291" rx="14" fill="#0b1224" stroke="#1c2f52"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="30" y="40" font-size="15" font-weight="600" fill="#e6edf7">A named method lands in a route table</text>
    <text x="30" y="62" font-size="11.5" fill="#93a7c7">No registration call. The method name says what it handles and which table it joins.</text>
  </g>

  <g fill="#13233f" stroke="#3f6ec9" stroke-opacity="0.55">
    <rect x="30" y="84" width="190" height="30" rx="8"/>
    <rect x="233" y="84" width="190" height="30" rx="8"/>
    <rect x="436" y="84" width="190" height="30" rx="8"/>
    <rect x="639" y="84" width="190" height="30" rx="8"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#60a5fa">
    <text x="44" y="104">routeStatic</text>
    <text x="247" y="104">routeStaticIntent</text>
    <text x="450" y="104">routeStaticSession</text>
    <text x="653" y="104">routeDynamic</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#93a7c7">
    <text x="44" y="134">no Args in the name</text>
    <text x="247" y="134">has Args in the name</text>
    <text x="450" y="134">session step</text>
    <text x="653" y="134">outside a session</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#cbd9ee">
    <text x="44" y="160">handleText</text>
    <text x="44" y="178">handleCommandText</text>
    <text x="44" y="196">handleCallbackQueryData</text>
    <text x="44" y="214">handleCaption*</text>
    <text x="44" y="232">handleCommandCaption*</text>

    <text x="247" y="160">handleArgsText</text>
    <text x="247" y="178">handleCommandArgsText</text>
    <text x="247" y="196">handleArgsCallbackQueryData</text>
    <text x="247" y="214">handleCaptionArgs*</text>
    <text x="247" y="232">handleCommandCaptionArgs*</text>

    <text x="450" y="160">handleSession*</text>
    <text x="653" y="160">handleFree*</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10">
    <rect x="30" y="246" width="190" height="22" rx="6" fill="#0f1a2f" stroke="#22385e"/>
    <text x="44" y="261" fill="#93a7c7">exact match</text>
    <rect x="233" y="246" width="190" height="22" rx="6" fill="#0f1a2f" stroke="#22385e"/>
    <text x="247" y="261" fill="#93a7c7">startsWith after the separator</text>
  </g>
</svg>