<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 296" width="860" height="296" role="img" aria-label="Four files under src/pages and the route name each one resolves to">
  <title>Four files under src/pages and the route each one resolves to</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#2c789c"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="859" height="295" rx="14" fill="#081319" stroke="#163340"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="30" y="54" font-size="15" font-weight="600" fill="#e0eff5">The path is the route</text>
    <text x="30" y="76" font-size="11.5" fill="#82acbe">There is no router to register. The scanner walks the tree.</text>
  </g>

  <g fill="#0c1e25" stroke="#1b3c4b">
    <rect x="30" y="88" width="320" height="28" rx="7"/>
    <rect x="30" y="122" width="320" height="28" rx="7"/>
    <rect x="30" y="156" width="320" height="28" rx="7"/>
    <rect x="30" y="190" width="320" height="28" rx="7"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#bfddea">
    <text x="44" y="107">src/pages/start.ts</text>
    <text x="44" y="141">src/pages/start/index.ts</text>
    <text x="44" y="175">src/pages/start/random/number.ts</text>
    <text x="44" y="209">src/pages/admin/ban.ts</text>
  </g>

  <g stroke="#2c789c" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M362 102H551"/>
    <path d="M362 136C432 136 478 112 551 110"/>
    <path d="M362 170H551"/>
    <path d="M362 204H551"/>
  </g>

  <g fill="#0e2630" stroke="#2c789c" stroke-opacity="0.55">
    <rect x="565" y="88" width="265" height="28" rx="7"/>
    <rect x="565" y="122" width="265" height="28" rx="7"/>
    <rect x="565" y="156" width="265" height="28" rx="7"/>
    <rect x="565" y="190" width="265" height="28" rx="7"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#09acf7">
    <text x="579" y="107">start</text>
    <text x="579" y="141">start</text>
    <text x="579" y="175">start/random/number</text>
    <text x="579" y="209">admin/ban</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#82acbe">
    <text x="30" y="246">An <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#bfddea">index.ts</tspan> is its parent route, so <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#bfddea">start/index.ts</tspan> and <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#bfddea">start.ts</tspan> are one route.</text>
    <text x="30" y="268" fill="#fbbf24">A root-level <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">index.ts</tspan> has no parent route and is rejected at scan time.</text>
  </g>
</svg>