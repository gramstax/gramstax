### YamlMime:TSType
name: LmdbJobRun
uid: '@gramstax/lmdb!LmdbJobRun:class'
package: '@gramstax/lmdb!'
fullName: LmdbJobRun
summary: Persisted run-stamps and the cron schedule that honours them.
remarks: >-
  This module owns both halves of a restart-safe job, the way [LmdbQueue](xref:@gramstax/lmdb!LmdbQueue:class) owns a
  queue's metadata and lifecycle together:


  - \*\*croner\*\* decides \*when\* to fire. It cannot answer whether a run was missed, because `cron.previousRun()` is
  in-memory and dies with the process. - \*\*this class\*\* persists \*that\* answer, one `{at}` row per job name, so
  the next boot can tell whether the job is actually due.


  A bare timer gets both halves wrong. Restart a process every six hours with a daily schedule and you either run on
  every boot, or — if the timer restarts from zero — nothing covers the hours the process was down.
example:
  - |-
    ```typescript
    const jobs = new LmdbJobRun(env)
    const handle = jobs.start(`db-backup`, {
      pattern: `0 3 * * *`,
      task: () => LmdbBackup.snapshot(env, {dir: `./backups`})
    })
    await handle.runNow()
    handle.stop()
    ```
isPreview: false
isDeprecated: false
