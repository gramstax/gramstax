  - name: missed(key, opts)
    uid: '@gramstax/lmdb!LmdbJobRun#missed:member(1)'
    package: '@gramstax/lmdb!'
    fullName: missed(key, opts)
    summary: Whether a scheduled occurrence passed since the last successful run.
    remarks: >-
      Compares the persisted stamp against the most recent time `pattern` matched at or before `now`<!-- -->. `true`
      when the job never ran, or when that boundary is newer than the last success.


      Use this to decide \*whether\* to run without committing to a schedule. To run on a pattern, use
      [LmdbJobRun.start()](xref:@gramstax/lmdb!LmdbJobRun%23start:member(1))<!-- -->.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'missed(key: string, opts: IJobRunMissedOptions): boolean;'
      parameters:
        - id: key
          description: Job name.
          type: string
        - id: opts
          description: '`{pattern, timezone?, now?}` — pass `now` to make the check deterministic instead of reading the clock.'
          type: <xref uid="@gramstax/lmdb!LmdbJobRunMissedOptions:interface" />
      return:
        type: boolean
        description: '`true` when a boundary was missed.'
  - name: recordRun(key, at)
    uid: '@gramstax/lmdb!LmdbJobRun#recordRun:member(1)'
    package: '@gramstax/lmdb!'
    fullName: recordRun(key, at)
    summary: Record a successful run for `key`<!-- -->.
    remarks: >-
      Call this only after the work succeeded. Stamping before the work means a crash or a thrown error is recorded as a
      completed run, and the next boot would treat the job as satisfied.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'recordRun(key: string, at?: number): Promise<void>;'
      parameters:
        - id: key
          description: Job name.
          type: string
        - id: at
          description: Epoch ms to stamp (default `Date.now()`<!-- -->).
          type: number
      return:
        type: Promise&lt;void&gt;
        description: Nothing.
  - name: start(key, opts)
    uid: '@gramstax/lmdb!LmdbJobRun#start:member(1)'
    package: '@gramstax/lmdb!'
    fullName: start(key, opts)
    summary: Run `task` on a cron schedule, resuming across restarts.
    remarks: >-
      The job is constructed paused so the catch-up decision can be made from the persisted stamp before anything is
      armed. When a boundary passed while the process was down, exactly one run is triggered immediately; otherwise the
      schedule waits for the next boundary.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'start(key: string, opts: IJobRunScheduleOptions): IJobRunHandle;'
      parameters:
        - id: key
          description: Job name, also the key its stamp is stored under.
          type: string
        - id: opts
          description: '`{pattern, task, timezone?, runOnStart?, catchUp?, onError?, persist?}`<!-- -->.'
          type: <xref uid="@gramstax/lmdb!LmdbJobRunScheduleOptions:interface" />
      return:
        type: <xref uid="@gramstax/lmdb!LmdbJobRunHandle:interface" />
        description: A handle with `stop`<!-- -->, `runNow`<!-- -->, `lastRun`<!-- -->, `nextRun` and `label`<!-- -->.
