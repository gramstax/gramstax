    summary: Bind a run-stamp store and scheduler to an env.
    remarks: >-
      Registers [JobRunSchema](xref:@gramstax/lmdb!JobRunSchema:class) on first use and reuses it afterwards, so a
      second `LmdbJobRun` on the same env is safe and does not throw. Costs one `maxDbs` slot.
