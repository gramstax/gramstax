    uid: '@gramstax/lmdb!LmdbSyncStream.hashRowValue:member(1)'
    package: '@gramstax/lmdb!'
    fullName: hashRowValue(value)
    summary: Deterministic hash of a row value for sync verification.
    remarks: >-
      Canonicalizes key order, dates, binary, maps, sets, and bigints before hashing, so equal rows hash equal across
      envs regardless of materialized key order. Pure and total over row-shaped values.
