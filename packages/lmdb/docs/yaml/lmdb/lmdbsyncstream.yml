### YamlMime:TSType
name: LmdbSyncStream
uid: '@gramstax/lmdb!LmdbSyncStream:class'
package: '@gramstax/lmdb!'
fullName: LmdbSyncStream
summary: Differential env-to-env sync for `@gramstax/lmdb`<!-- -->.
remarks: >-
  `LmdbSyncStream` copies rows past a checkpoint through a keyset cursor in 500-row chunks: each chunk commits to the
  destination via `putMany` (indexes, search, CDC, TTL ride along), then the cursor persists to `__sync_state` under the
  stream name — so a killed run resumes mid-stream instead of restarting. Source iteration order is natively ascending,
  so destination writes ride `{sorted: true}` appends. An explicit `checkpoint` option runs one-shot past that key
  without touching the stored cursor. Sync copies upsert-style and never deletes destination-only rows; quiesce writes
  on both subs before syncing (concurrent writes defeat the verify step by design).


  Sync helpers ride as statics on this class; a run threads six pieces of state — source, destination, options, cursor,
  counters, exhaustion — across paged async iterations. Construct per run; instances are single-use.
