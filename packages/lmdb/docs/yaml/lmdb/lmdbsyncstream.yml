  - name: run()
    uid: '@gramstax/lmdb!LmdbSyncStream#run:member(1)'
    package: '@gramstax/lmdb!'
    fullName: run()
    summary: Copy rows past the checkpoint through a keyset cursor in 500-row chunks.
    remarks: >-
      Each committed chunk advances the persisted cursor, so kills resume mid-stream. An explicit `checkpoint` runs
      one-shot without touching the stored cursor. Destination writes use `{sorted: true}` appends (source order is
      natively ascending). Sync upserts — destination-only rows are never deleted.
