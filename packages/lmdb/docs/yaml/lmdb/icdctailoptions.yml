name: ICdcTailOptions
uid: '@gramstax/lmdb!ICdcTailOptions:interface'
package: '@gramstax/lmdb!'
fullName: ICdcTailOptions
summary: Tail options — consumer resume, lower bound, and batch cap.
remarks: >-
  A named `consumer` auto-registers on first tail (floor 0) and later tails resume past its ack. An explicit `from`
  repositions forward past the ack but never backward.
