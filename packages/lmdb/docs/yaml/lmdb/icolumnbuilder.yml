### YamlMime:TSType
name: IColumnBuilder
uid: '@gramstax/lmdb!IColumnBuilder:interface'
package: '@gramstax/lmdb!'
fullName: IColumnBuilder
summary: Immutable column descriptor produced by the [t](xref:@gramstax/lmdb!t:var) builders.
remarks: >-
  Metadata object carrying the column's kind, index flags, and nullability. Every modifier returns a NEW builder
  (spread-copy semantics) — the original is never mutated. `kind` is carried as a generic type parameter so
  [ValueOf](xref:@gramstax/lmdb!ValueOf:type) can map columns back to their TypeScript types. `I` carries the
  [IColumnIndexFlag](xref:@gramstax/lmdb!IColumnIndexFlag:type) literal and `N` the explicit index name literal, so
  [ISchemaIndexesOf](xref:@gramstax/lmdb!ISchemaIndexesOf:type) can produce narrow per-index keys. `V` carries the
  element/value type for `object`<!-- -->/`array` columns — set via `t.object<T>()` / `t.array<T>()` (defaults:
  `Record<string, unknown>` / `unknown`<!-- -->). `Nl` carries the nullability literal (`false` by default, `true` after
  `.optional()`<!-- -->).
example: []
isPreview: false
isDeprecated: false
type: interface
properties:
