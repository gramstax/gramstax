    package: '@gramstax/lmdb!'
    fullName: isUnique
    summary: Whether the column participates in a unique index.
    remarks: >-
      Flag form of the [IColumnBuilder.unique()](xref:@gramstax/lmdb!IColumnBuilder%23unique:member(1)) modifier — named
      `isUnique` so it cannot collide with the `unique()` method on the same object.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'readonly isUnique: boolean;'
      return:
        type: boolean
