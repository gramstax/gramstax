methods:
  - name: $defaultFn(fn)
    uid: '@gramstax/lmdb!IColumnBuilder#$defaultFn:member(1)'
    package: '@gramstax/lmdb!'
    fullName: $defaultFn(fn)
    summary: Dynamic write-time default factory, called per write.
    remarks: >-
      Same optionality as [IColumnBuilder.default()](xref:@gramstax/lmdb!IColumnBuilder%23default:member(1))<!-- -->.
      Replaces any `.default()` set before it (last call wins). The produced value is validated like any write.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: '$defaultFn(fn: () => unknown): IColumnBuilder<K, I, N, V, true>;'
      parameters:
        - id: fn
          description: Factory producing the default per write.
          type: () =&gt; unknown
      return:
        type: <xref uid="@gramstax/lmdb!IColumnBuilder:interface" />&lt;K, I, N, V, true&gt;
        description: 'A new builder with `isOptional: true` carrying the factory.'
  - name: default(value)
    uid: '@gramstax/lmdb!IColumnBuilder#default:member(1)'
    package: '@gramstax/lmdb!'
    fullName: default(value)
    summary: Static write-time default — applied when the field is `undefined`<!-- -->.
    remarks: >-
      Implies `.optional()` (the field becomes omit-able). Replaces any `.$defaultFn()` set before it (last call wins).
      Validated immediately: wrong-kind values and out-of-enum values throw `LmdbError` here, not at the first `put`<!--
      -->. The parameter stays `unknown` on purpose — typing it from the column would make the whole builder invariant
      and break `AnyColumnBuilder` assignability.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'default(value: unknown): IColumnBuilder<K, I, N, V, true>;'
      parameters:
        - id: value
          description: The default value (validated immediately against the column kind and enum).
          type: unknown
      return:
        type: <xref uid="@gramstax/lmdb!IColumnBuilder:interface" />&lt;K, I, N, V, true&gt;
        description: 'A new builder with `isOptional: true` carrying the default.'
  - name: index(name)
    uid: '@gramstax/lmdb!IColumnBuilder#index:member(1)'
    package: '@gramstax/lmdb!'
    fullName: index(name)
    summary: Mark the column as an index.
    remarks: >-
      Two forms: `.index(name?)` for a single-column index (replaces any composite marker), and `.index([`<!-- -->a`,
      `<!-- -->b`, ...])` for a concatenated-key composite over the listed columns (replaces any single marker, clears
      `unique`<!-- -->). The composite is named `a+b`<!-- -->, lives in `{db}:idx:{a+b}`<!-- -->, and is queried with
      full tuples (point), short tuples (prefix), or `{start, end}` bounds (range). By convention declare it on the
      first column; arity must be ≥ 2 (enforced at registration).
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        index<N2 extends string | undefined = undefined, const Cc extends readonly [string, ...string[]] | undefined =
        undefined>(name?: N2 | Cc): [Cc] extends [undefined] ? IColumnBuilder<K, I extends `unique` ? `unique` :
        `index`, N2 extends string ? (N2 extends `` ? undefined : N2) : undefined, V, Nl, unknown> : IColumnBuilder<K,
        `index`, IJoinPlus<NonNullable<Cc>>, V, Nl, NonNullable<Cc>>;
      parameters:
        - id: name
          description: Index name (single form), or the composite column list.
          type: N2 | Cc
      return:
        type: >-
          [Cc] extends [undefined] ? <xref uid="@gramstax/lmdb!IColumnBuilder:interface" />&lt;K, I extends `unique` ?
          `unique` : `index`, N2 extends string ? (N2 extends `` ? undefined : N2) : undefined, V, Nl, unknown&gt; :
          <xref uid="@gramstax/lmdb!IColumnBuilder:interface" />&lt;K, `index`, <xref
          uid="@gramstax/lmdb!~IJoinPlus:type" />&lt;NonNullable&lt;Cc&gt;&gt;, V, Nl, NonNullable&lt;Cc&gt;&gt;
        description: A new builder carrying the index flag.
  - name: optional()
    uid: '@gramstax/lmdb!IColumnBuilder#optional:member(1)'
    package: '@gramstax/lmdb!'
    fullName: optional()
    summary: Mark the column as optional.
    remarks: ''
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'optional(): IColumnBuilder<K, I, N, V, true>;'
      return:
        type: <xref uid="@gramstax/lmdb!IColumnBuilder:interface" />&lt;K, I, N, V, true&gt;
        description: 'A new builder with `isOptional: true`<!-- -->.'
  - name: search()
    uid: '@gramstax/lmdb!IColumnBuilder#search:member(1)'
    package: '@gramstax/lmdb!'
    fullName: search()
    summary: Mark the column as full-text searchable.
    remarks: >-
      Storage-only: the row type is unchanged. Only valid on `string` columns of row-shaped values (registration throws
      otherwise).
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'search(): IColumnBuilder<K, I, N, V, Nl>;'
      return:
        type: <xref uid="@gramstax/lmdb!IColumnBuilder:interface" />&lt;K, I, N, V, Nl&gt;
        description: 'A new builder with `isSearchable: true`<!-- -->.'
  - name: unique()
    uid: '@gramstax/lmdb!IColumnBuilder#unique:member(1)'
    package: '@gramstax/lmdb!'
    fullName: unique()
    summary: Mark the column as a unique index.
    remarks: >-
      Unique indexes ARE indexes — this implies
      [IColumnBuilder.index()](xref:@gramstax/lmdb!IColumnBuilder%23index:member(1))<!-- -->: the column registers as an
      index with `{unique: true}`<!-- -->.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'unique(): IColumnBuilder<K, `unique`, N, V, Nl>;'
      return:
        type: <xref uid="@gramstax/lmdb!IColumnBuilder:interface" />&lt;K, `unique`, N, V, Nl&gt;
        description: 'A new builder with `isUnique: true`<!-- -->.'
