  - name: hasDefault
    uid: '@gramstax/lmdb!IColumnBuilder#hasDefault:member'
    package: '@gramstax/lmdb!'
    fullName: hasDefault
    summary: Whether a static default was declared via `.default()`<!-- -->.
    remarks: ''
    example: []
    isPreview: false
