  - name: enumValues
    uid: '@gramstax/lmdb!IColumnBuilder#enumValues:member'
    package: '@gramstax/lmdb!'
    fullName: enumValues
    summary: >-
      Allowed values for enum columns (`t.enum(...)` and the literal params of `t.string(...)` / `t.number(...)` /
      `t.bigint(...)`<!-- -->).
    remarks: >-
      Carried at runtime so write paths can validate (`LmdbError` on out-of-enum values). `undefined` for non-enum
      columns (zero-cost: validation is skipped). Preserved by `.unique()` / `.index()` / `.optional()` copies.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
