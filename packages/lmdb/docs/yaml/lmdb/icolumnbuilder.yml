    uid: '@gramstax/lmdb!IColumnBuilder#compositeColumns:member'
    package: '@gramstax/lmdb!'
    fullName: compositeColumns
    summary: Composite column list for concatenated-key indexes.
    remarks: >-
      Set by `.index([...])` — the sub-DB `{db}:idx:{a+b}` keys rows by the ordered tuple. `undefined` for single-column
      indexes. Cleared by `.unique()`<!-- -->/`.index(name)`<!-- -->; preserved by the other modifiers. The tuple
      literal is carried by the `C` generic for [ISchemaIndexesOf](xref:@gramstax/lmdb!ISchemaIndexesOf:type)<!-- -->.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'readonly compositeColumns?: Array<string>;'
      return:
        type: Array&lt;string&gt;
