  - name: indexFlag
    uid: '@gramstax/lmdb!IColumnBuilder#indexFlag:member'
    package: '@gramstax/lmdb!'
    fullName: indexFlag
    summary: Literal index marker — see [IColumnIndexFlag](xref:@gramstax/lmdb!IColumnIndexFlag:type)<!-- -->.
    remarks: >-
      The type-level counterpart of `isUnique`<!-- -->/`indexName`<!-- -->: `"unique"` for columns built with
      `.unique()`<!-- -->, `"index"` for columns built with `.index(...)`<!-- -->, `"none"` otherwise. This is what
      keeps per-index keys literal in [ISchemaIndexesOf](xref:@gramstax/lmdb!ISchemaIndexesOf:type)<!-- -->.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'readonly indexFlag: I;'
      return:
        type: I
  - name: indexName
    uid: '@gramstax/lmdb!IColumnBuilder#indexName:member'
    package: '@gramstax/lmdb!'
    fullName: indexName
    summary: Explicit index name.
    remarks: >-
      `""` (set by a no-argument `.index()` call) means "index under the column name" — see
      [LmdbSchema.deriveIndexes()](xref:@gramstax/lmdb!LmdbSchema.deriveIndexes:member(1))<!-- -->. The literal (when
      supplied via `.index("name")`<!-- -->) is carried by the generic `N`<!-- -->.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'readonly indexName: N;'
      return:
        type: 'N'
  - name: isOptional
    uid: '@gramstax/lmdb!IColumnBuilder#isOptional:member'
    package: '@gramstax/lmdb!'
    fullName: isOptional
    summary: Whether the column accepts `null`<!-- -->/`undefined` values.
    remarks: >-
      Flag form of the [IColumnBuilder.optional()](xref:@gramstax/lmdb!IColumnBuilder%23optional:member(1)) modifier —
      named `isOptional` so it cannot collide with the `optional()` method on the same object. `false` by default (not
      optional); `true` after `.optional()`<!-- -->. The literal drives [ValueOf](xref:@gramstax/lmdb!ValueOf:type)
      column inference: optional columns yield `T | undefined`<!-- -->.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'readonly isOptional: Nl;'
      return:
        type: Nl
  - name: isSearchable
    uid: '@gramstax/lmdb!IColumnBuilder#isSearchable:member'
    package: '@gramstax/lmdb!'
    fullName: isSearchable
    summary: Whether the column is full-text searchable.
    remarks: >-
      Flag form of the [IColumnBuilder.search()](xref:@gramstax/lmdb!IColumnBuilder%23search:member(1)) modifier — named
      `isSearchable` so it cannot collide with the `search()` method on the same object. Storage-only: it provisions a
      `{db}:search:{column}` posting table and never changes the row type.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'readonly isSearchable: boolean;'
      return:
        type: boolean
