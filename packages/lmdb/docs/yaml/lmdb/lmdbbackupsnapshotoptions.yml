      content: 's3?: IBackupS3Options;'
      return:
        type: <xref uid="@gramstax/lmdb!LmdbBackupS3Options:interface" />
  - name: s3Keep
    uid: '@gramstax/lmdb!LmdbBackupSnapshotOptions#s3Keep:member'
    package: '@gramstax/lmdb!'
    fullName: s3Keep
    summary: 'Remote archives to retain after each tick (default: `keep`<!-- -->).'
    remarks: >-
      Separate from [LmdbBackupSnapshotOptions.keep](xref:@gramstax/lmdb!LmdbBackupSnapshotOptions%23keep:member)
      because off-host retention is usually longer than local — you prune local copies aggressively to save disk and
      keep the archive you can restore from anywhere. Falls back to `keep`<!-- -->, so a caller that never sets it
      behaves exactly as before.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 's3Keep?: number;'
      return:
        type: number
