### YamlMime:TSType
name: IIndexDef
uid: '@gramstax/lmdb!IIndexDef:interface'
package: '@gramstax/lmdb!'
fullName: IIndexDef
summary: Declarative embedded secondary index definition.
remarks: >-
  Declared via `static indexes` on a schema class:


  ```typescript

  class UserSchema extends LmdbSchema {
    static db = `user`;
    static indexes = {
      email: {unique: true},            // auto-resolved field `user.email`
      emailLower: {extractor: (u) => u.email.toLowerCase()},
      profileCity: {dbName: `user:idx:city`}  // dotted path, custom dbName
    } as const;
  }

  ```

  When `extractor` is omitted the index name is treated as a field path on the value (`username` → `value.username`<!--
  -->, `profile.email` → `value.profile.email`<!-- -->). A missing field path throws
  [LmdbError](xref:@gramstax/lmdb!LmdbError:class) on the first write; a resolved `undefined`<!-- -->/`null` value skips
  the entry.
example: []
isPreview: false
isDeprecated: false
