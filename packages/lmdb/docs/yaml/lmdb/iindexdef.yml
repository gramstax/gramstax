  - name: unique
    uid: '@gramstax/lmdb!IIndexDef#unique:member'
    package: '@gramstax/lmdb!'
    fullName: unique
    summary: Enforce uniqueness on this index.
    remarks: >-
      `true` → SQL `CREATE UNIQUE INDEX`<!-- -->: a write whose index value is already owned by a different primary key
      throws [LmdbError](xref:@gramstax/lmdb!LmdbError:class) and rolls back. `false` (default) → SQL `CREATE INDEX`
      (duplicates allowed).
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'unique?: boolean;'
      return:
        type: boolean
