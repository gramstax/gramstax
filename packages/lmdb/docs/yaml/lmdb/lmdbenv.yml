### YamlMime:TSType
name: LmdbEnv
uid: '@gramstax/lmdb!LmdbEnv:class'
package: '@gramstax/lmdb!'
fullName: LmdbEnv
summary: The root handle for one LMDB environment and its registered subs.
remarks: >-
  One env per process is the common pattern (LMDB is designed for single-writer / multi-reader). The env lazily opens
  sub-databases on first access and caches them inside lmdb-js's native store layer.


  Each instance owns a \*\*private per-instance\*\* lmdb root store (built via `openAsClass` in the constructor) so that
  sub-database (`openDB`<!-- -->) handle caches are naturally isolated across envs — lmdb-js caches handles on the store
  instance, and a single shared base class would leak handles across envs in the same process. Native store methods
  (`transaction`<!-- -->, `openDB`<!-- -->, `close`<!-- -->, `backup`<!-- -->, etc.) are forwarded explicitly.


  Collection operations are NOT on this class — register a schema class to get a typed
  [LmdbEnvSub](xref:@gramstax/lmdb!LmdbEnvSub:class) handle, or use
  [LmdbEnv.sub()](xref:@gramstax/lmdb!LmdbEnv%23sub:member(1)) to fetch an already-registered one.
example: []
isPreview: false
isDeprecated: false
type: class
constructors:
  - name: (constructor)(options)
    uid: '@gramstax/lmdb!LmdbEnv:constructor(1)'
    package: '@gramstax/lmdb!'
    fullName: (constructor)(options)
    summary: Construct a new LmdbEnv and open the underlying LMDB environment.
    remarks: >-
      Construction opens the env immediately. The `path` is required and flows through to lmdb's native `open()`<!--
      -->. No explicit `open()` call is needed. Defaults: `mapSize` = 4 GB (`4 * 1024 * 1024 * 1024` bytes), `maxDbs` =
      128.
    example:
      - |-
        ```typescript
        // Default — LMDB native msgpack
        const env = new LmdbEnv({ path: "./data" });

        // Human-readable JSON storage
        const env = new LmdbEnv({ path: "./data", encoding: "json" });

        // With compression + custom page size
        const env = new LmdbEnv({
          path: "./data",
          compression: true,
          pageSize: 8192
        });
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'constructor(options: ILmdbEnvOptions);'
      parameters:
        - id: options
          description: >-
            Env configuration. Supports the full set of LMDB `open()` parameters via
            [ILmdbEnvOptions](xref:@gramstax/lmdb!ILmdbEnvOptions:interface)<!-- -->.
          type: <xref uid="@gramstax/lmdb!ILmdbEnvOptions:interface" />
