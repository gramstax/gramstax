  - name: onWarn(listener)
    uid: '@gramstax/lmdb!LmdbEnv#onWarn:member(1)'
    package: '@gramstax/lmdb!'
    fullName: onWarn(listener)
    summary: Attach a diagnostics listener.
    remarks: >-
      The package writes nothing to `console`<!-- -->. With no listener attached its diagnostics are dropped, so attach
      one if you want to see `maxDbs` headroom warnings, CDC subscriber failures or failed scheduled ticks. Equivalent
      to the [ILmdbEnvOptions.onWarn](xref:@gramstax/lmdb!ILmdbEnvOptions%23onWarn:member) constructor option.


      A listener that throws is contained — it cannot break a commit or a tick.
    example:
