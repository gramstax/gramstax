  - name: pruneCdc(keep)
    uid: '@gramstax/lmdb!LmdbEnv#pruneCdc:member(1)'
    package: '@gramstax/lmdb!'
    fullName: pruneCdc(keep)
    summary: Delete outbox records at or below the retention cutoff.
    remarks: >-
      Cutoff is `min(minAck, newest - keep)`<!-- -->: entries consumed by every registered consumer go, the newest
      `keep` entries always stay, and an unacked consumer blocks pruning below its start. With no consumers the keep
      window alone bounds growth — call periodically (like `purgeExpired`<!-- -->) when producing without persistent
      followers.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'pruneCdc(keep?: number): Promise<number>;'
      parameters:
        - id: keep
          description: Newest entries to retain regardless of acks (default `10000`<!-- -->).
          type: number
      return:
        type: Promise&lt;number&gt;
        description: The number of records removed.
