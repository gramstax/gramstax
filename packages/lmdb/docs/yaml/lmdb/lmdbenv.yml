    package: '@gramstax/lmdb!'
    fullName: resetReadTxn()
    summary: Force a reset of the auto-managed read transaction to the latest snapshot.
    remarks: >-
      By default LMDB renews the read transaction on new event turns. Call this to force an immediate refresh — useful
      in multi-process scenarios where another process has just written data you need to read without waiting for the
      next event turn.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'resetReadTxn(): void;'
      return:
        type: void
        description: ''
