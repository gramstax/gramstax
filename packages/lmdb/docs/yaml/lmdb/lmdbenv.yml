  - name: transaction(fn)
    uid: '@gramstax/lmdb!LmdbEnv#transaction:member(1)'
    package: '@gramstax/lmdb!'
    fullName: transaction(fn)
    summary: Run a callback inside a write transaction.
    remarks: >-
      \*\*SQL equivalent\*\*:


      ```sql

      BEGIN;

      -- <writes performed via sub.put() inside fn>

      COMMIT;  -- on tx.commit() or callback return

      -- ROLLBACK;  -- on tx.abort() or callback throw

      ```

      Wraps the inherited root-store `transaction(callback)`<!-- -->. All writes performed by any sub-database inside
      the callback are batched into a single atomic commit. If the callback resolves, the transaction is committed. If
      it throws, the transaction is rolled back. If the callback calls
      [LmdbTransaction.abort()](xref:@gramstax/lmdb!LmdbTransaction%23abort:member(1)) on the wrapper, the wrapper
      throws an internal abort error which rolls back the transaction.


      \*\*Sync callback is strongly recommended.\*\* The callback runs inside lmdb-js's native write lock. An `async`
      callback yields to the event loop, creating a microtask boundary — lmdb-js may flush the pending writes before
      your next `await` completes, breaking the batching. A sync callback keeps all writes in the same event turn, so
      lmdb-js coalesces them into a single native LMDB write transaction. Sub methods are non-async, making sync
      callbacks natural.


      The callback promise MUST settle: the native write transaction (and the single writer lock) stays open until it
      does — a never-resolving promise blocks all subsequent writes process-wide.
    example:
      - |-
        ```typescript
        // ✅ Sync callback — recommended. All writes coalesced into one native
        //    LMDB write transaction. Sub methods return Promise directly
        //    without async wrapper, so no await is needed inside the callback.
        const result = await env.transaction(() => {
          users.put("u1", user);
          sessions.put("s1", session);
          return { ok: true };
        });
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'transaction<T>(fn: (tx: LmdbTransaction) => T | Promise<T>): Promise<T>;'
      parameters:
        - id: fn
          description: Callback receiving the [LmdbTransaction](xref:@gramstax/lmdb!LmdbTransaction:class) wrapper.
          type: '(tx: <xref uid="@gramstax/lmdb!LmdbTransaction:class" />) =&gt; T | Promise&lt;T&gt;'
      return:
        type: Promise&lt;T&gt;
        description: The callback's resolved value.
  - name: transactionFast(fn)
    uid: '@gramstax/lmdb!LmdbEnv#transactionFast:member(1)'
    package: '@gramstax/lmdb!'
    fullName: transactionFast(fn)
    summary: Run a callback inside an off-thread LMDB write transaction.
    remarks: >-
      \*\*SQL equivalent\*\*:


      ```sql

      BEGIN;

      -- <writes performed via putSync/removeSync inside fn>

      COMMIT;

      ```

      Gives the same atomicity as [LmdbEnv.transaction()](xref:@gramstax/lmdb!LmdbEnv%23transaction:member(1)) — one
      native LMDB write transaction, invisible to other processes until it commits — but the commit is handed to
      lmdb-js's writer thread instead of blocking the main thread, and it batches with other writes queued in the same
      event turn.


      \*\*The trade-off is rollback, and it is not available here.\*\* lmdb-js's `db.transaction()` records a callback
      error and rethrows it, but never calls `mdb_txn_abort` — the native transaction commits regardless. So:


      - [LmdbTransaction.abort()](xref:@gramstax/lmdb!LmdbTransaction%23abort:member(1)) throws `LmdbError` rather than
      silently doing nothing. - A callback that throws still propagates the error, but every write it already performed
      is \*\*committed\*\*, not discarded.


      Use [LmdbEnv.transaction()](xref:@gramstax/lmdb!LmdbEnv%23transaction:member(1)) whenever the outcome depends on
      the callback failing partway. Reach for this one when the callback cannot fail partway, or when partial
      application of a bulk write is harmless (the package uses it for `putMany`<!-- -->, `purgeExpired`<!-- -->,
      `increment` and CDC pruning).
    example:
      - |-
        ```typescript
        await env.transactionFast(() => {
          users.putSync("u1", user);
          sessions.putSync("s1", session);
        });
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'transactionFast<T>(fn: (tx: LmdbTransaction) => T | Promise<T>): Promise<T>;'
      parameters:
        - id: fn
          description: Callback receiving the [LmdbTransaction](xref:@gramstax/lmdb!LmdbTransaction:class) wrapper.
          type: '(tx: <xref uid="@gramstax/lmdb!LmdbTransaction:class" />) =&gt; T | Promise&lt;T&gt;'
      return:
        type: Promise&lt;T&gt;
        description: The callback's resolved value.
