  - name: migrate(migrations)
    uid: '@gramstax/lmdb!LmdbEnv#migrate:member(1)'
    package: '@gramstax/lmdb!'
    fullName: migrate(migrations)
    summary: Apply pending schema migrations.
    remarks: >-
      Each migration's `up` runs inside its own writer transaction and the stored version is bumped only on success.
      `transform` steps backfill first (chunked top-level transactions, resumable), then `up` runs, then the version
      bump and the per-step completion marker commit together. Concurrent callers are serialized via LMDB's
      single-writer lock — the second caller re-checks the version inside the transaction and skips already-applied
      steps.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        migrate(migrations: IMigration[]): Promise<{
                applied: IMigration[];
                currentVersion: number;
            }>;
      parameters:
        - id: migrations
          description: Array of migrations with unique monotonic `version`<!-- -->.
          type: <xref uid="@gramstax/lmdb!~IMigration:interface" />[]
      return:
        type: |-
          Promise&lt;{
                  applied: <xref uid="@gramstax/lmdb!~IMigration:interface" />[];
                  currentVersion: number;
              }&gt;
        description: The list of actually applied migrations and the current version.
