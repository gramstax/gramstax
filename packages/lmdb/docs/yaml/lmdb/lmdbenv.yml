  - name: backup(destPath, compact)
    uid: '@gramstax/lmdb!LmdbEnv#backup:member(1)'
    package: '@gramstax/lmdb!'
    fullName: backup(destPath, compact)
    summary: Take a consistent snapshot backup of the env to another path.
    remarks: >-
      Delegates to LMDB's `backup`<!-- -->, which performs a live snapshot without blocking writers. The target path
      must not already contain an LMDB env (it is overwritten).


      `compact` is your call, not a hidden default. It is a required argument in the underlying lmdb-js signature, so it
      is surfaced here rather than hardcoded:


      - `false` — plain copy. Faster, and the result keeps the free-page layout it had at snapshot time. - `true` —
      compacts while copying. Slower, and the result is rewritten densely, so it is smaller on disk and cheaper to
      restore from later.


      `true` is worth it for archives you keep or ship off-host; `false` is the right choice for a local snapshot you
      will likely replace soon.


      The destination directory \*\*must already exist\*\* — LMDB's `mdb_env_copy2` does not create it and fails with
      `ENOENT` otherwise. [LmdbBackup.backup()](xref:@gramstax/lmdb!LmdbBackup.backup:member(1)) handles this for you.
    example:
      - |-
        ```typescript
        // local snapshot, no compaction
        await env.backup("./backups/snapshot-2024-01-01");

        // long-lived archive that will be shipped somewhere
        await env.backup("./backups/compact-2024-01-01", true);
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'backup(destPath: string, compact?: boolean): Promise<void>;'
      parameters:
        - id: destPath
          description: Filesystem path for the backup env.
          type: string
        - id: compact
          description: Rewrite the copy densely (slower, smaller). Default `false`<!-- -->.
          type: boolean
      return:
        type: Promise&lt;void&gt;
        description: ''
  - name: close()
    uid: '@gramstax/lmdb!LmdbEnv#close:member(1)'
    package: '@gramstax/lmdb!'
    fullName: close()
    summary: Close the underlying LMDB environment and release all resources.
    remarks: >-
      Delegates to the inherited lmdb root store `close()` (awaitable), then clears the sub registry and purges this
      env's handles from lmdb-js's module-level `allDbs` map so repeated open/close cycles do not accumulate JS store
      wrappers for the process lifetime. Handles obtained via
      [LmdbEnv.register()](xref:@gramstax/lmdb!LmdbEnv%23register:member(1)) become unusable after close.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'close(): Promise<void>;'
      return:
        type: Promise&lt;void&gt;
        description: ''
