  - name: readTransaction(fn)
    uid: '@gramstax/lmdb!LmdbEnv#readTransaction:member(1)'
    package: '@gramstax/lmdb!'
    fullName: readTransaction(fn)
    summary: Run a callback inside a read-only transaction.
    remarks: >-
      \*\*SQL equivalent\*\*:


      ```sql

      START TRANSACTION READ ONLY;

      -- <reads performed via sub.get/has/keys/values/entries/iterate inside fn>

      COMMIT;

      ```

      Obtains a read transaction via the inherited root-store `useReadTransaction()` and wraps it in a
      [LmdbTransaction](xref:@gramstax/lmdb!LmdbTransaction:class) that auto-releases when the callback returns. All
      reads inside the callback see a consistent snapshot.


      The callback MUST settle: the raw read transaction (and one of the env's limited reader slots, default 126) stays
      pinned until it does — a never-resolving promise can exhaust readers for the whole env.
    example:
      - |-
        ```typescript
        const snapshot = await env.readTransaction(async (tx) => {
          return await users.entries({}, tx);
        });
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'readTransaction<T>(fn: (tx: LmdbTransaction) => Promise<T>): Promise<T>;'
      parameters:
        - id: fn
          description: Callback receiving the read-only [LmdbTransaction](xref:@gramstax/lmdb!LmdbTransaction:class)<!-- -->.
          type: '(tx: <xref uid="@gramstax/lmdb!LmdbTransaction:class" />) =&gt; Promise&lt;T&gt;'
      return:
        type: Promise&lt;T&gt;
        description: The callback's resolved value.
  - name: register(schemaClass)
    uid: '@gramstax/lmdb!LmdbEnv#register:member(1)'
    package: '@gramstax/lmdb!'
    fullName: register(schemaClass)
    summary: Register a [LmdbSchema](xref:@gramstax/lmdb!LmdbSchema:class) subclass as a sub-DB collection.
    remarks: >-
      Validates the schema, materializes the sub-DB state through the internal `LmdbEnvSubManager` (no anonymous-class
      synthesis, no class-registration re-entry): the schema's `static db` becomes the sub-DB name, and its derived
      indexes (from `static value`<!-- -->, via
      [LmdbSchema.deriveIndexes()](xref:@gramstax/lmdb!LmdbSchema.deriveIndexes:member(1))<!-- -->) are attached at
      registration. Optional `static hookBeforeWrite`<!-- -->/`static hookBeforeRead` transforms are forwarded as the
      sub's codec, and `static ttl` (ms) materializes a TTL sub — per-put `{ttlMs}` overrides still apply. The returned
      handle is typed from the schema class — value type via [ValueOf](xref:@gramstax/lmdb!ValueOf:type)<!-- -->, key
      type via [KeyOf](xref:@gramstax/lmdb!KeyOf:type)<!-- -->, and the index map via
      [ISchemaIndexesOf](xref:@gramstax/lmdb!ISchemaIndexesOf:type) — so `findByIndex({name: value})` queries type-check
      against the declared index names.


      Registration is STRICT: re-registering the same schema class throws
      [LmdbError](xref:@gramstax/lmdb!LmdbError:class)<!-- -->, and a schema whose `static db` is already taken throws
      [LmdbError](xref:@gramstax/lmdb!LmdbError:class)<!-- -->. `register` is the ONLY registration path.
    example:
      - |-
        ```typescript
        class UserSchema extends LmdbSchema {
          static db = `users`
          static key = t.number()
          static value = {id: t.number().unique(), username: t.string().index()}
        }
        const users = env.register(UserSchema)
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'register<S extends typeof LmdbSchema>(schemaClass: S): LmdbEnvSub<S>;'
      parameters:
        - id: schemaClass
          description: The [LmdbSchema](xref:@gramstax/lmdb!LmdbSchema:class) subclass.
          type: S
      return:
        type: <xref uid="@gramstax/lmdb!LmdbEnvSub:class" />&lt;S&gt;
        description: >-
          A typed [LmdbEnvSub](xref:@gramstax/lmdb!LmdbEnvSub:class) handle bound to the schema — cached, so
          `env.register(Schema) === env.sub(Schema)`<!-- -->.
  - name: resetReadTxn()
