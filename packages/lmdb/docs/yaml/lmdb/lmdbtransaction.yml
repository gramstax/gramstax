### YamlMime:TSType
name: LmdbTransaction
uid: '@gramstax/lmdb!LmdbTransaction:class'
package: '@gramstax/lmdb!'
fullName: LmdbTransaction
summary: Wraps the underlying `lmdb` transaction lifecycle with a stable API.
remarks: >-
  The underlying `lmdb` library uses a callback-based transaction model: - \*\*Write transactions\*\* are managed by
  `rootDb.childTransaction(callback)`<!-- -->. The wrapper detects user intent and either returns the `ABORT` sentinel
  (causing LMDB to roll back) or returns normally (causing LMDB to commit). - \*\*Read transactions\*\* are obtained via
  `db.useReadTransaction()` and released via `rawTxn.done()` when the wrapper finalizes.


  This class wraps both flavors behind a unified lifecycle API: - `commit()` marks the wrapper as committed — LMDB
  commits when the childTransaction callback returns normally. - `abort()` marks the wrapper as aborted — LMDB rolls
  back when the childTransaction callback returns the `ABORT` sentinel.


  You do not construct this class directly —
  [LmdbEnv.transaction()](xref:@gramstax/lmdb!LmdbEnv%23transaction:member(1)) and
  [LmdbEnv.readTransaction()](xref:@gramstax/lmdb!LmdbEnv%23readTransaction:member(1)) create and manage the instance.


  The constructor for this class is marked as internal. Third-party code should not call the constructor directly or
  create subclasses that extend the `LmdbTransaction` class.
example: []
