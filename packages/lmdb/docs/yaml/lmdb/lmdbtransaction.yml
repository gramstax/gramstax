methods:
  - name: abort()
    uid: '@gramstax/lmdb!LmdbTransaction#abort:member(1)'
    package: '@gramstax/lmdb!'
    fullName: abort()
    summary: Mark this transaction as aborted.
    remarks: >-
      \*\*SQL equivalent\*\*: `ROLLBACK;` — discards all writes performed inside the transaction.


      For write transactions (inside [LmdbEnv.transaction()](xref:@gramstax/lmdb!LmdbEnv%23transaction:member(1))<!--
      -->): the wrapper callback detects this flag and throws an internal abort error, causing LMDB to roll back all
      writes in the transaction.


      For read transactions: releases the underlying LMDB read transaction immediately. Safe to call multiple times.


      Inside [LmdbEnv.transactionFast()](xref:@gramstax/lmdb!LmdbEnv%23transactionFast:member(1)) this \*\*throws\*\*
      `LmdbError`<!-- -->: that path commits through lmdb-js `db.transaction()`<!-- -->, which cannot roll back.
      Silently ignoring the call would let the caller believe the writes were discarded when they are in fact committed.
    example:
      - |-
        ```typescript
        await env.transaction(async (tx) => {
          try {
            await users.put("u1", user, tx);
            await someRiskyOp();
            tx.commit();
          } catch (err) {
            tx.abort();
            throw err;
          }
        });
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'abort(): void;'
      return:
        type: void
        description: ''
  - name: commit()
    uid: '@gramstax/lmdb!LmdbTransaction#commit:member(1)'
    package: '@gramstax/lmdb!'
    fullName: commit()
    summary: Mark this transaction as committed.
    remarks: >-
      \*\*SQL equivalent\*\*: `COMMIT;` — ends the transaction and makes all writes durable.


      For write transactions (inside [LmdbEnv.transaction()](xref:@gramstax/lmdb!LmdbEnv%23transaction:member(1))<!--
      -->): sets the internal flag so the wrapper callback returns normally and LMDB commits. The actual commit is
      performed by LMDB once the wrapper returns.


      For read transactions (inside
      [LmdbEnv.readTransaction()](xref:@gramstax/lmdb!LmdbEnv%23readTransaction:member(1))<!-- -->): this is a no-op —
      the raw LMDB read transaction is released automatically when the wrapper returns.
    example:
      - |-
        ```typescript
        await env.transaction(async (tx) => {
          await users.put("u1", user, tx);
          await sessions.put("s1", session, tx);
          tx.commit();
        });
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'commit(): void;'
      return:
        type: void
        description: ''
  - name: release()
    uid: '@gramstax/lmdb!LmdbTransaction#release:member(1)'
    package: '@gramstax/lmdb!'
    fullName: release()
    summary: Mark a read transaction as finished successfully (release the raw txn without reporting an abort).
    remarks: >-
      Used by [LmdbEnv.readTransaction()](xref:@gramstax/lmdb!LmdbEnv%23readTransaction:member(1)) on normal completion
      — the wrapper lifecycle becomes `released` (not `aborted`<!-- -->), so `isAborted` stays `false` for transactions
      that simply ran to completion. Safe to call multiple times; the raw read txn is released at most once.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'release(): void;'
      return:
        type: void
        description: ''
