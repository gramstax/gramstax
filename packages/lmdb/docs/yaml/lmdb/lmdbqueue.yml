### YamlMime:TSType
name: LmdbQueue
uid: '@gramstax/lmdb!LmdbQueue:class'
package: '@gramstax/lmdb!'
fullName: LmdbQueue
summary: FIFO queue over LMDB with single-writer transaction dequeue.
remarks: >-
  Backed by a dedicated sub-DB per queue name. Enqueue bumps a monotonic sequence counter (root-DB meta sub-DB) and
  stores the payload in ONE synchronous transaction (v2 — previously the counter bump and the payload put were separate
  commits), so the zero-padded id and the payload are always visible atomically, FIFO order preserved even across
  processes. Dequeue reads the first key via a synchronous cursor and deletes it in ONE synchronous transaction — no
  async `first()` holding the write lock open across a microtask. At-least-once semantics — a crash between read and
  delete may redeliver.
example: []
isPreview: false
isDeprecated: false
type: class
constructors:
  - name: (constructor)(_env, schema)
    uid: '@gramstax/lmdb!LmdbQueue:constructor(1)'
    package: '@gramstax/lmdb!'
    fullName: (constructor)(_env, schema)
    summary: Create a queue bound to a schema's sub-DB.
    remarks: >-
      Registration is idempotent: constructing a second queue with the same schema reuses the already-created sub
      instead of throwing.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'constructor(_env: LmdbEnv, schema: S);'
      parameters:
        - id: _env
          description: Owning env (must stay open for the queue's lifetime).
          type: <xref uid="@gramstax/lmdb!LmdbEnv:class" />
        - id: schema
          description: Payload schema class; its `static db` is the queue name and its key must be string-kind.
          type: S
methods:
