### YamlMime:TSTypeAlias
name: ValueOf
uid: '@gramstax/lmdb!ValueOf:type'
package: '@gramstax/lmdb!'
fullName: ValueOf
summary: Value type inferred from a schema class.
remarks: >-
  Short alias for `IInferSchemaValue<typeof X.value>` — the value type derived from a schema class's `static value`
  columns. For scalar schemas (`static value = t.number()`<!-- -->), resolves to the scalar's TypeScript type:


  ```typescript

  type UserValue = ValueOf<typeof UserSchema>

  type CounterValue = ValueOf<typeof CounterSchema> // number

  ```

  Columns are `T` by default and become `T | undefined` only when declared optional (`.optional()`<!-- -->).
example: []
isPreview: false
isDeprecated: false
syntax: type ValueOf<S extends typeof LmdbSchema> = IValueOfDispatch<S[`value`]>;
