name: ICdcEvent
uid: '@gramstax/lmdb!ICdcEvent:interface'
package: '@gramstax/lmdb!'
fullName: ICdcEvent
summary: In-process subscriber event — exactly `{type, key, value}`<!-- -->.
remarks: >-
  Delivered to `subscribe` callbacks post-commit and persisted on outbox records. Deletes are key-only (`value` is
  `undefined`<!-- -->); clears cover a whole sub (`key` and `value` are both `undefined`<!-- -->).
