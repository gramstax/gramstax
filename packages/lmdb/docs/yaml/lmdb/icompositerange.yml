name: ICompositeRange
uid: '@gramstax/lmdb!ICompositeRange:interface'
package: '@gramstax/lmdb!'
fullName: ICompositeRange
summary: Explicit bounds for a composite index range seek.
remarks: >-
  Accepted as a `findByIndex` value for composite keys (`t.*.index(["a", "b"])`<!-- -->), queried as `{"a+b": {start,
  end}}`<!-- -->). Either bound may be omitted (open-ended); each present bound is a tuple of 1..arity elements. `start`
  is inclusive, `end` is exclusive.
example: []
