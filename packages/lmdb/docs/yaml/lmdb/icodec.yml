### YamlMime:TSType
name: ICodec
uid: '@gramstax/lmdb!ICodec:interface'
package: '@gramstax/lmdb!'
fullName: ICodec
summary: A write/read hook pair used by [LmdbEnv](xref:@gramstax/lmdb!LmdbEnv:class) for custom transforms.
remarks: >-
  Default encoding (lmdb-js native) is msgpack/JSON/etc. Use this to transform rows at the repository boundary —
  `hookBeforeWrite` runs before LMDB serializes the value, `hookBeforeRead` after it deserializes it (e.g. `Date →
  number`<!-- -->). This runs BEFORE the native LMDB encoding.
example: []
isPreview: false
isDeprecated: false
type: interface
