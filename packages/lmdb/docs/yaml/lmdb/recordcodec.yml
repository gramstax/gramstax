### YamlMime:TSType
name: RecordCodec
uid: '@gramstax/lmdb!RecordCodec:class'
package: '@gramstax/lmdb!'
fullName: RecordCodec
summary: Schema-aware positional record codec for `@gramstax/lmdb`<!-- -->.
remarks: >-
  Rows encode as positional arrays in column declaration order — field names never reach disk — and decode back to row
  objects. The codec rides the existing `hookBeforeWrite`<!-- -->/`hookBeforeRead` slot, so no read/write path changes:
  validation, defaults, enums, indexes, TTL envelopes, and search maintenance all operate on typed rows pre-encoding.


  Absent optional columns encode as `undefined` cells and decode back to absent (never present-`undefined`<!-- -->),
  preserving row shape exactly. Non-array stored values decode through untouched, so rows written before the codec (or
  raw bytes via `putBinary`<!-- -->) still read.


  Implements [ICodec](xref:@gramstax/lmdb!ICodec:interface) directly, so a registration installs it with `new
  RecordCodec(columns)` — the column order doubles as the codec's configuration, which is why this is a class; the
  dotted-path helpers ride as statics on it (alongside the [LmdbSearch](xref:@gramstax/lmdb!LmdbSearch:class) statics).
example: []
isPreview: false
isDeprecated: false
