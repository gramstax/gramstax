          type: <xref uid="@gramstax/lmdb!LmdbEnv:class" />
        - id: _schema
          description: The registered schema class.
          type: S
        - id: _state
          description: Pre-built sub-DB state (owned by the env's sub manager).
          type: <xref uid="@gramstax/lmdb!LmdbSubState:type" />
