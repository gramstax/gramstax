### YamlMime:TSType
name: LmdbEnvSub
uid: '@gramstax/lmdb!LmdbEnvSub:class'
package: '@gramstax/lmdb!'
fullName: LmdbEnvSub
summary: >-
  Typed sub-collection handle — returned by [LmdbEnv.register()](xref:@gramstax/lmdb!LmdbEnv%23register:member(1)) and
  bound to a schema class.
remarks: >-
  The handle is self-contained: it holds its own  (sub-DB handle + codec + embedded-index descriptors) so every
  operation runs directly on the sub-DB without a per-call schema lookup on the env. One schema class = one state = one
  handle (the env caches handles), so `env.register(UserSchema) === env.sub(UserSchema)`<!-- -->.


  Cross-collection work goes through [LmdbEnvSub.owner](xref:@gramstax/lmdb!LmdbEnvSub%23owner:member) — the owning env
  — for transactions (`sub.owner.transaction(...)`<!-- -->) and access to other registered subs
  (`sub.owner.sub(OtherSchema)`<!-- -->).
example: []
isPreview: false
isDeprecated: false
type: class
constructors:
  - name: (constructor)(_owner, _schema, _state)
    uid: '@gramstax/lmdb!LmdbEnvSub:constructor(1)'
