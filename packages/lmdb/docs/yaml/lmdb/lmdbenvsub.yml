  - name: search(query, options)
    uid: '@gramstax/lmdb!LmdbEnvSub#search:member(1)'
    package: '@gramstax/lmdb!'
    fullName: search(query, options)
    summary: Full-text search over `t.string().search()` columns.
    remarks: >-
      Tokenizes the query (lowercase + split) and ANDs the terms: only rows containing every term match. A match in N
      searched columns scores N, so rows matching in more columns rank first; ties keep native key order.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        search(query: string, options?: {
                limit?: number;
            }): Promise<KeyOf<S>[]>;
      parameters:
        - id: query
          description: Raw query text (at least one term required).
          type: string
        - id: options
          description: '`{limit}` caps the returned keys with flat memory.'
          type: |-
            {
                    limit?: number;
                }
      return:
        type: Promise&lt;<xref uid="@gramstax/lmdb!KeyOf:type" />&lt;S&gt;[]&gt;
        description: Matching primary keys, best first.
  - name: syncTo(dest, options)
    uid: '@gramstax/lmdb!LmdbEnvSub#syncTo:member(1)'
    package: '@gramstax/lmdb!'
    fullName: syncTo(dest, options)
    summary: Differentially copy this sub to a destination sub (any env, same schema).
    remarks: >-
      Copies rows past the checkpoint (explicit option or the persisted cursor for `name`<!-- -->, defaulting to the
      destination db) through a keyset cursor in 500-row chunks; each committed chunk advances the cursor, so kills
      resume mid-stream. An explicit `checkpoint` runs one-shot without touching the stored cursor. Sync upserts —
      destination-only rows are never deleted. Quiesce writes on both subs first: the verify step (counts plus hash
      spot-checks, on by default) throws `LmdbError` on divergence.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'syncTo(dest: LmdbEnvSub<S>, options?: ISyncOptions<S>): Promise<ISyncResult<S>>;'
      parameters:
        - id: dest
          description: Destination handle (same schema class, must differ).
          type: <xref uid="@gramstax/lmdb!LmdbEnvSub:class" />&lt;S&gt;
        - id: options
          description: '`{name?, checkpoint?, limit?, verify?}`<!-- -->.'
          type: <xref uid="@gramstax/lmdb!ISyncOptions:interface" />&lt;S&gt;
      return:
        type: Promise&lt;<xref uid="@gramstax/lmdb!ISyncResult:interface" />&lt;S&gt;&gt;
        description: '`{copied, checkpoint, verified}`<!-- -->.'
