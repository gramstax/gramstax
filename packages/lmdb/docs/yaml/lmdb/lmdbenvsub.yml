      return:
        type: >-
          Promise&lt;<xref uid="@gramstax/lmdb!IIndexResult:type" />&lt;<xref uid="@gramstax/lmdb!ValueOf:type"
          />&lt;S&gt;, <xref uid="@gramstax/lmdb!ISchemaIndexesOf:type" />&lt;S[`value`]&gt;, Q&gt;&gt;
