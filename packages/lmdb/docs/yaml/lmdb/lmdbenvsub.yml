  - name: putMany(entries, chunkSize, options)
    uid: '@gramstax/lmdb!LmdbEnvSub#putMany:member(1)'
    package: '@gramstax/lmdb!'
    fullName: putMany(entries, chunkSize, options)
    summary: Write many entries.
    remarks: >-
      Pass `{sorted: true}` when entries ascend by key (strictly, or non-decreasing for dupSort primaries) to skip the
      B-tree search per put (MDB\_APPEND) — the first inversion aborts with `LmdbError`<!-- -->. `onProgress` fires per
      committed chunk as `(done, total)`<!-- -->.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        putMany(entries: [KeyOf<S>, ValueOf<S>][], chunkSize?: number, options?: {
                sorted?: boolean;
                onProgress?: (done: number, total: number) => void;
            }): Promise<void>;
      parameters:
        - id: entries
          description: '`[key, value]` pairs to write.'
          type: '[<xref uid="@gramstax/lmdb!KeyOf:type" />&lt;S&gt;, <xref uid="@gramstax/lmdb!ValueOf:type" />&lt;S&gt;][]'
        - id: chunkSize
          description: Entries per transaction chunk (default `500`<!-- -->).
          type: number
        - id: options
          description: '`{sorted?, onProgress?}`<!-- -->.'
          type: |-
            {
                    sorted?: boolean;
                    onProgress?: (done: number, total: number) =&gt; void;
                }
      return:
        type: Promise&lt;void&gt;
        description: Resolves when all chunks are committed.
