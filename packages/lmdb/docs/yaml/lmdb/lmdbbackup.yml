    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        static pruneS3Archives(s3: IBackupS3Options, keep?: number): Promise<{
                removed: Array<string>;
            }>;
      parameters:
        - id: s3
          description: Destination (bucket + credentials or prebuilt client).
