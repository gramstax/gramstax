### YamlMime:TSType
name: LmdbBackup
uid: '@gramstax/lmdb!LmdbBackup:class'
package: '@gramstax/lmdb!'
fullName: LmdbBackup
summary: Timestamped backup lifecycle over LMDB envs — create, list, prune, restore, archive, upload, and schedule.
remarks: >-
  Dir backups are plain directories (`backup-<stamp>` holding `data.mdb`<!-- -->), so restore is a copy and inspection
  needs no tooling. Tar.gz archives need the optional `tar` peer; S3 upload needs the optional `@aws-sdk/client-s3` peer
  — both load lazily, so installs without them pay nothing and only those two paths throw (`LmdbError`<!-- -->) when
  missing. Only `backup-*` entries are ever listed or pruned — foreign files in the directory are left alone.
example: []
isPreview: false
isDeprecated: false
type: class
methods:
  - name: backup(env, baseDir, keep, compact)
    uid: '@gramstax/lmdb!LmdbBackup.backup:member(1)'
    package: '@gramstax/lmdb!'
    fullName: backup(env, baseDir, keep, compact)
    summary: Create a timestamped backup inside `baseDir` and prune to `keep`<!-- -->.
    remarks: ''
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static backup(env: LmdbEnv, baseDir: string, keep?: number, compact?: boolean): Promise<string>;'
      parameters:
        - id: env
          description: Writer env to back up (must be open).
          type: <xref uid="@gramstax/lmdb!LmdbEnv:class" />
        - id: baseDir
          description: Directory that will contain timestamped backup subdirs.
          type: string
        - id: keep
          description: Backups to retain (default `3`<!-- -->).
          type: number
        - id: compact
          description: >-
            Compact while copying (default `false`<!-- -->): slower, but the result is rewritten densely, so it is
            smaller on disk.
          type: boolean
      return:
        type: Promise&lt;string&gt;
        description: The path of the newly created backup.
  - name: clearStaleStaging(dir)
