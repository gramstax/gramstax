          description: Directory holding archives.
          type: string
      return:
        type: Array&lt;<xref uid="@gramstax/lmdb!LmdbBackupArchiveEntry:interface" />&gt;
        description: Archive entries oldest-first; `[]` when the directory is missing. directory is missing.
  - name: prune(baseDir, keep)
    uid: '@gramstax/lmdb!LmdbBackup.prune:member(1)'
    package: '@gramstax/lmdb!'
    fullName: prune(baseDir, keep)
    summary: Delete oldest backups beyond `keep`<!-- -->.
    remarks: ''
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        static prune(baseDir: string, keep?: number): Promise<{
                kept: number;
                removed: Array<string>;
            }>;
      parameters:
        - id: baseDir
          description: Directory holding timestamped backup subdirs.
