        type: Promise&lt;void&gt;
        description: ''
  - name: downloadFromS3(s3, key, destDir, fileName)
    uid: '@gramstax/lmdb!LmdbBackup.downloadFromS3:member(1)'
    package: '@gramstax/lmdb!'
    fullName: downloadFromS3(s3, key, destDir, fileName)
    summary: Download one S3 object to a local file.
    remarks: >-
      Writes to a uniquely-named `.part` sibling and renames on success, so the destination is either absent or complete
      — a failed or cancelled transfer never leaves a truncated archive that a later `restoreArchive` would accept. The
      random component also makes concurrent downloads into one directory safe. `destDir` is created if missing,
      matching [LmdbBackup.backup()](xref:@gramstax/lmdb!LmdbBackup.backup:member(1))<!-- -->.


      Destination folder and file name are separate arguments so a caller can restore several objects into one folder
      without re-joining paths, and so the returned absolute target is unambiguous.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static downloadFromS3(s3: IBackupS3Options, key: string, destDir: string, fileName: string): Promise<string>;'
      parameters:
        - id: s3
          description: Source (bucket + credentials or prebuilt client).
          type: <xref uid="@gramstax/lmdb!LmdbBackupS3Options:interface" />
        - id: key
          description: Full object key.
          type: string
        - id: destDir
          description: Local target folder, created when missing.
          type: string
        - id: fileName
          description: Local target file name inside `destDir`<!-- -->.
          type: string
      return:
        type: Promise&lt;string&gt;
        description: '`join(destDir, fileName)`<!-- -->.'
