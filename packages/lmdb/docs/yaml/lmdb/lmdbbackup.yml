                  removed: Array&lt;string&gt;;
              }&gt;
        description: Removed keys.
  - name: restore(backupPath, destPath, opts)
    uid: '@gramstax/lmdb!LmdbBackup.restore:member(1)'
    package: '@gramstax/lmdb!'
    fullName: restore(backupPath, destPath, opts)
    summary: Copy a backup to `destPath` for revival.
    remarks: ''
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        static restore(backupPath: string, destPath: string, opts?: {
                overwrite?: boolean;
            }): Promise<string>;
      parameters:
        - id: backupPath
          description: A `backup-*` dir holding `data.mdb`<!-- -->.
          type: string
        - id: destPath
          description: 'Revival target; open a new env on it. Must not exist unless `{overwrite: true}`<!-- -->.'
          type: string
        - id: opts
          description: 'Optional `{overwrite: true}` to replace `destPath`<!-- -->.'
          type: |-
            {
                    overwrite?: boolean;
                }
      return:
        type: Promise&lt;string&gt;
        description: '`destPath`<!-- -->.'
  - name: restoreArchive(archivePath, destParent, destName)
    uid: '@gramstax/lmdb!LmdbBackup.restoreArchive:member(1)'
    package: '@gramstax/lmdb!'
    fullName: restoreArchive(archivePath, destParent, destName)
    summary: >-
      Extract an archive and revive it via [LmdbBackup.restore()](xref:@gramstax/lmdb!LmdbBackup.restore:member(1))<!--
      -->.
    remarks: ''
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static restoreArchive(archivePath: string, destParent: string, destName: string): Promise<string>;'
      parameters:
        - id: archivePath
          description: A `backup-*.tar.gz` file.
          type: string
        - id: destParent
          description: Staging parent + revival parent.
          type: string
        - id: destName
          description: Revived dir name under `destParent`<!-- -->.
          type: string
      return:
        type: Promise&lt;string&gt;
        description: '`destPath` — open a new env on it.'
  - name: snapshot(env, opts)
    uid: '@gramstax/lmdb!LmdbBackup.snapshot:member(1)'
    package: '@gramstax/lmdb!'
    fullName: snapshot(env, opts)
    summary: 'Full snapshot cycle: backup, optionally archive + upload.'
    remarks: ''
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static snapshot(env: LmdbEnv, opts: IBackupSnapshotOptions): Promise<IBackupSnapshotResult>;'
      parameters:
        - id: env
          description: Writer env to back up (must be open).
          type: <xref uid="@gramstax/lmdb!LmdbEnv:class" />
        - id: opts
          description: >-
            `{dir, keep?, format?, s3?}` — `dir` keeps raw LMDB dirs via
            [LmdbBackup.backup()](xref:@gramstax/lmdb!LmdbBackup.backup:member(1))<!-- -->; `tar.gz` archives a staging
            snapshot (needs the `tar` peer), prunes archives, and uploads when `s3` is set.
          type: <xref uid="@gramstax/lmdb!LmdbBackupSnapshotOptions:interface" />
      return:
        type: Promise&lt;<xref uid="@gramstax/lmdb!LmdbBackupSnapshotResult:interface" />&gt;
        description: '`{path}` plus `uploaded` S3 key when uploaded.'
  - name: start(env, opts)
    uid: '@gramstax/lmdb!LmdbBackup.start:member(1)'
    package: '@gramstax/lmdb!'
    fullName: start(env, opts)
    summary: Run snapshots on a cron schedule, resuming across restarts.
    remarks: >-
      A thin wrapper over [LmdbJobRun.start()](xref:@gramstax/lmdb!LmdbJobRun%23start:member(1))<!-- -->: this module
      owns \*what\* to do (take a snapshot, prune, optionally upload) and the job-run module owns \*when\* to do it.
      Everything schedule-related — croner, the missed-boundary check, the overlap guard, the run-stamp — lives there,
      so any other job can opt into the same restart safety without going through this helper.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static start(env: LmdbEnv, opts: IBackupStartOptions): IBackupHandle;'
      parameters:
        - id: env
          description: Writer env to back up (must stay open).
          type: <xref uid="@gramstax/lmdb!LmdbEnv:class" />
        - id: opts
          description: '`{dir, keep?, pattern, timezone?, runOnStart?, format?, s3?, onError?, persist?, persistKey?}`<!-- -->.'
          type: <xref uid="@gramstax/lmdb!LmdbBackupStartOptions:interface" />
      return:
        type: <xref uid="@gramstax/lmdb!LmdbBackupHandle:interface" />
        description: '`{stop, runNow, lastRun, nextRun, label}` handle.'
  - name: uploadToS3(archivePath, s3, keep)
    uid: '@gramstax/lmdb!LmdbBackup.uploadToS3:member(1)'
    package: '@gramstax/lmdb!'
    fullName: uploadToS3(archivePath, s3, keep)
    summary: PUT-verified upload of one archive, then remote retention prune.
    remarks: ''
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static uploadToS3(archivePath: string, s3: IBackupS3Options, keep?: number): Promise<string>;'
      parameters:
        - id: archivePath
          description: A `backup-*.tar.gz` file.
          type: string
        - id: s3
          description: Destination (bucket + credentials or prebuilt client).
          type: <xref uid="@gramstax/lmdb!LmdbBackupS3Options:interface" />
        - id: keep
          description: Remote archives to retain (default `3`<!-- -->).
          type: number
      return:
        type: Promise&lt;string&gt;
        description: >-
          The S3 key. Never loses data: failures keep the local file and throw (callers decide —
          [LmdbBackup.snapshot()](xref:@gramstax/lmdb!LmdbBackup.snapshot:member(1)) logs and keeps).
