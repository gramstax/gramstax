functions:
  - name: metricsToPrometheus(snapshot, queueStats)
    uid: gramstax!metricsToPrometheus:function(1)
    package: gramstax!
    summary: Serializes a [MetricsStore](xref:gramstax!MetricsStore:class) snapshot into Prometheus text format.
    remarks: >-
      Emits `# HELP`<!-- -->/`# TYPE` headers, per-listener counters, per-counter cumulative totals, latency avg/max
      gauges, uptime, and optional queue stats. Zero-valued counters are skipped. Ends with a trailing newline.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        declare function metricsToPrometheus(snapshot: ReturnType<MetricsStore[`snapshot`]>, queueStats?:
        IMetricsQueueStats | null): string;
      parameters:
        - id: snapshot
          description: A `MetricsStore` snapshot (see `MetricsStore.snapshot`<!-- -->).
          type: ReturnType&lt;<xref uid="gramstax!MetricsStore:class" />[`snapshot`]&gt;
        - id: queueStats
          description: Optional webhook queue statistics.
          type: <xref uid="gramstax!IMetricsQueueStats:type" /> | null
      return:
        type: string
        description: Prometheus exposition text.
  - name: resolveGateKey(update)
    uid: gramstax!resolveGateKey:function(1)
    package: gramstax!
    summary: Resolve the concurrency-gate key for an update.
    remarks: >-
      Layered, narrowest-resource-first. The gate exists because session writes are last-write-wins with no
      compare-and-swap, so two updates touching the same logical resource must never run at once.


      1. `chat.id` — all traffic for one chat serializes regardless of sender. 2. `from.id` — chat-less user-originated
      updates (`inline_query`<!-- -->, `chosen_inline_result`<!-- -->, `poll_answer`<!-- -->, `join_request`<!-- -->,
      `my_chat_member`<!-- -->, `chat_member`<!-- -->, `chat_join_request`<!-- -->, and `callback_query` without a
      message). For an anonymous poll voter `poll_answer.voter_chat.id` stands in. 3. `update_id` — globally unique, so
      each such update gets a private slot. This degrades to "no serialization" rather than over-serializing unrelated
      updates against each other.


      Note: `poll` carries no actor — Bot API 7.0 removed `Poll.user`<!-- -->, so a poll change reaches this function's
      step 3 and gets a private slot.


      Returns `undefined` only when the update carries no `update_id`<!-- -->, in which case the caller must not gate
      it.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'declare function resolveGateKey(update: Update): string | undefined;'
      parameters:
        - id: update
          description: ''
          type: <xref uid="@grammyjs/types!Update:interface" />
      return:
        type: string | undefined
        description: ''
