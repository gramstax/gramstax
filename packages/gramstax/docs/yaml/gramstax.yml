functions:
  - name: metricsToPrometheus(snapshot, queueStats)
    uid: gramstax!metricsToPrometheus:function(1)
    package: gramstax!
    summary: Serializes a [MetricsStore](xref:gramstax!MetricsStore:class) snapshot into Prometheus text format.
    remarks: >-
      Emits `# HELP`<!-- -->/`# TYPE` headers, per-listener counters, per-counter cumulative totals, latency avg/max
      gauges, uptime, and optional queue stats. Zero-valued counters are skipped. Ends with a trailing newline.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        declare function metricsToPrometheus(snapshot: ReturnType<MetricsStore[`snapshot`]>, queueStats?:
        IMetricsQueueStats | null): string;
      parameters:
        - id: snapshot
          description: A `MetricsStore` snapshot (see `MetricsStore.snapshot`<!-- -->).
          type: ReturnType&lt;<xref uid="gramstax!MetricsStore:class" />[`snapshot`]&gt;
        - id: queueStats
          description: Optional webhook queue statistics.
          type: <xref uid="gramstax!IMetricsQueueStats:type" /> | null
      return:
        type: string
        description: Prometheus exposition text.
