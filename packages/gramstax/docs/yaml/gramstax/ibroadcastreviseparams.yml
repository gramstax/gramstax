name: IBroadcastReviseParams
uid: gramstax!IBroadcastReviseParams:type
package: gramstax!
fullName: IBroadcastReviseParams
summary: Broadcast revise selector for the `broadcast` field of `renderMedia`<!-- -->.
remarks: >-
  `photo`<!-- -->, `video`<!-- -->, `audio`<!-- -->, `document`<!-- -->, and `animation` edit in place via
  `editMessageMedia`<!-- -->; the remaining types cannot be edited, so the old message is deleted and a new one is sent.
  `reviseOptions.fallback` applies per recipient when the primary edit/resend fails.
