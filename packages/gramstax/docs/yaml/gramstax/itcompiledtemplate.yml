### YamlMime:TSTypeAlias
name: ITCompiledTemplate
uid: gramstax!ITCompiledTemplate:type
package: gramstax!
fullName: ITCompiledTemplate
summary: Compiled template structure containing all parsed template components.
remarks: >-
  This type represents the cached result of template compilation. Each property holds compiled functions for different
  template sections.
example: []
isPreview: false
isDeprecated: false
syntax: |-
  type ITCompiledTemplate = {
      media: ReturnType<typeof TemplateEngine.compileBlockGMedia>;
      message: ReturnType<typeof TemplateEngine.compileBlockGMessage>;
      keyboard: ReturnType<typeof TemplateEngine.compileBlockGKeyboards>;
      description: ReturnType<typeof TemplateEngine.compileBlockGDescription>;
  };
