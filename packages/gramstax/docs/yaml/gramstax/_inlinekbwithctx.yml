name: _InlineKbWithCtx
uid: gramstax!_InlineKbWithCtx:interface
package: gramstax!
fullName: _InlineKbWithCtx
summary: >-
  Inline keyboard whose `.text()` also accepts a page class/instance as callback data — calls
  `page.data.callbackQueryData()` automatically.
remarks: ''
example:
  - |-
    ```ts
    k.text("Settings", SettingsPage)
    // equivalent to: k.text("Settings", SettingsPage.data.callbackQueryData())
    ```
isPreview: false
isDeprecated: false
