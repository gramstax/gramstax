### YamlMime:TSTypeAlias
name: ITBroadcastEditResult
uid: gramstax!ITBroadcastEditResult:type
package: gramstax!
fullName: ITBroadcastEditResult
summary: Bulk edit/delete result with a re-drive list.
remarks: >-
  Mirrors the broadcast-send result shape: counts plus `retryable[]` (absolute `index` + `chatId` + `messageId` +
  `error`<!-- -->, completion order) for a fresh retry pass, and `skippedCount` for resumed indexes.
example: []
isPreview: false
isDeprecated: false
syntax: |-
  type ITBroadcastEditResult = {
      successCount: number;
      failedCount: number;
      totalCount: number;
      skippedCount: number;
      retryable: Array<{
          index: number;
          chatId: number;
          messageId: number;
          error: unknown;
      }>;
  };
