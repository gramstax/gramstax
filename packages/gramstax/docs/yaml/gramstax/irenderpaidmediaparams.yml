### YamlMime:TSTypeAlias
name: IRenderPaidMediaParams
uid: gramstax!IRenderPaidMediaParams:type
package: gramstax!
fullName: IRenderPaidMediaParams
summary: Parameters for `renderPaidMedia`<!-- -->.
remarks: >-
  `params = CONTENT & ROUTE`<!-- -->: the shared template content (`data`<!-- -->, `AGBaseId`<!-- -->, read from the
  `<g-paid-media>` block) on the forced-send route (`IRouteReply`<!-- -->), with the option slot narrowed to the
  `sendPaidMedia` call (`IOptPaidMedia`<!-- -->) and `keyboard` kept inline-only.


  Each item `src` is resolved through the instance media jail (local files become `InputFile` uploads, URLs and
  `file_id` values pass through) and sent with its caption as HTML. There is no degraded fallback content for paywalls.
example: []
isPreview: false
isDeprecated: false
syntax: |-
  type IRenderPaidMediaParams = IContent & Omit<IRouteForcedReply, `keyboard` | `options`> & {
      keyboard?: IInlineKb | null;
      options?: IOptPaidMedia | null;
  };
