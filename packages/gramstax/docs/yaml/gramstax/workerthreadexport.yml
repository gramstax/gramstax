type: class
methods:
  - name: init(options)
    uid: gramstax!WorkerThreadExport.init:member(1)
    package: gramstax!
    fullName: init(options)
    summary: Initialize a worker thread export with automatic environment detection.
    remarks: >-
      In worker thread context, only returns `launchGatewayClient`<!-- -->. In main thread context, returns full proxy
      with `launchWorker`<!-- -->, `launchGatewayClient`<!-- -->, and all worker methods.
    example:
      - |-
        ```typescript
        // jobs/counter.ts
        import { WorkerThreadExport, WorkerThreadInit } from "gramstax";

        class Worker extends WorkerThreadInit {
          count = 0;

          mtdGetCount() {
            return this.count;
          }
        }

        export const CounterJob = WorkerThreadExport.init({
          path: __filename,
          WTInit: Worker,
        });

        // main.ts
        import { CounterJob } from "./jobs/counter";

        await CounterJob.launchWorker();
        const count = await CounterJob.mtdGetCount();
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        static init<TWorker extends WorkerThreadInit, TMain extends WorkerThreadLaunch, TWrap = Record<any,
        any>>(options: WorkerThreadExportOpt<TWorker, TMain, TWrap>): TWrap & WorkerThreadAsyncMethods<TWorker> & {
                launchWorker: (argv?: any[]) => Promise<TMain>;
                launchGatewayClient: (serverPath?: string) => WorkerThreadGatewayProxy<TWorker> & {
                    new (owner: WorkerThreadInit): WorkerThreadAsyncMethods<TWorker>;
                };
            };
      parameters:
        - id: options
          description: Configuration options for the worker thread export.
          type: <xref uid="gramstax!WorkerThreadExportOpt:type" />&lt;TWorker, TMain, TWrap&gt;
      return:
        type: |-
          TWrap & <xref uid="gramstax!WorkerThreadAsyncMethods:type" />&lt;TWorker&gt; & {
                  launchWorker: (argv?: any[]) =&gt; Promise&lt;TMain&gt;;
                  launchGatewayClient: (serverPath?: string) =&gt; <xref uid="gramstax!WorkerThreadGatewayProxy:type" />&lt;TWorker&gt; & {
                      new (owner: <xref uid="gramstax!WorkerThreadInit:class" />): <xref uid="gramstax!WorkerThreadAsyncMethods:type" />&lt;TWorker&gt;;
                  };
              }
        description: Proxied object with `launchWorker`<!-- -->, `launchGatewayClient`<!-- -->, and worker methods.
  - name: launchGatewayClient(path)
    uid: gramstax!WorkerThreadExport.launchGatewayClient:member(1)
    package: gramstax!
    fullName: launchGatewayClient(path)
    summary: Create a typed gateway client proxy for inter-worker communication.
    remarks: ''
    example:
      - |-
        ```typescript
        // Static usage
        const OtherWorkerGateway = WorkerThreadExport.launchGatewayClient<OtherWorkerClass>("/path/to/other.ts");
        await OtherWorkerGateway.someMethod(this, arg1, arg2);

        // Constructor usage
        const client = new OtherWorkerGateway(this);
        await client.someMethod(arg1, arg2);
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        static launchGatewayClient<TWorker extends WorkerThreadInit>(path: string): WorkerThreadGatewayProxy<TWorker> &
        {
                new (owner: WorkerThreadInit): WorkerThreadAsyncMethods<TWorker>;
            };
      parameters:
        - id: path
          description: Path to the target worker file. Must match target init `path`<!-- -->.
          type: string
      return:
        type: |-
          <xref uid="gramstax!WorkerThreadGatewayProxy:type" />&lt;TWorker&gt; & {
                  new (owner: <xref uid="gramstax!WorkerThreadInit:class" />): <xref uid="gramstax!WorkerThreadAsyncMethods:type" />&lt;TWorker&gt;;
              }
        description: Proxy that can be used as static methods or as constructor.
