### YamlMime:TSTypeAlias
name: IUpdateErrorEvent
uid: gramstax!IUpdateErrorEvent:type
package: gramstax!
fullName: IUpdateErrorEvent
summary: Structured error event emitted by `onUpdateError`<!-- -->.
remarks: >-
  Built by `_emitUpdateError` / `_onCatch` / `_onStartupError` and delivered to the `hookUpdateError` class hook
  (Sentry-style sink). Sibling hooks: `hookSendError` (per-send failures) and `hookTrace` (every routed update).
example:
  - |-
    ```typescript
    class MyBot extends Gramstax {
      override hookUpdateError(event: IUpdateErrorEvent): void {
        Sentry.captureException(event.error, {tags: {listener: event.listenerName}})
      }
    }
    ```
isPreview: false
isDeprecated: false
syntax: |-
  type IUpdateErrorEvent = {
      traceId: string;
      listenerName: string;
      state: `error` | `timeout` | `blocked` | `no-handler` | `validation`;
      error: unknown;
      durationMs: number;
      isEdit: boolean;
  };
