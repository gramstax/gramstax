name: WorkerThreadGatewayClient
uid: gramstax!WorkerThreadGatewayClient:class
package: gramstax!
fullName: WorkerThreadGatewayClient
summary: \[LOW-LEVEL\] Provides IPC client functionality for inter-worker communication using Unix domain sockets.
remarks: >-
  Low-level infrastructure. In most cases use
  [WorkerThreadInit.createGatewayClient()](xref:gramstax!WorkerThreadInit%23createGatewayClient:member(1)) instead of
  constructing this directly.


  Uses `net-ipc` library for Unix domain socket communication.
example: []
isPreview: false
isDeprecated: false
