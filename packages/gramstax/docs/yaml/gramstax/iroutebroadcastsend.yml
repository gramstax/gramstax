### YamlMime:TSTypeAlias
name: IRouteBroadcastSend
uid: gramstax!IRouteBroadcastSend:type
package: gramstax!
fullName: IRouteBroadcastSend
summary: 'Route atom: broadcast send.'
remarks: >-
  The fully-rendered block is SENT (never edited) to every entry of `broadcast.ids` with its own language code from
  `broadcast.languageCode`<!-- -->; `keyboard`<!-- -->, `data`<!-- -->, `AGBaseId`<!-- -->, `options`<!-- -->, and
  `rich` are forwarded. The fan-out pacing uses `broadcast.chunkSize`<!-- -->/`broadcast.chunkDelayMs`<!-- -->, so the
  top-level `chunkSize` is never read — and `mode`<!-- -->, the edit-only keys, and `fallback` are never read either,
  since nothing edits.
example: []
isPreview: false
isDeprecated: false
syntax: |-
  type IRouteBroadcastSend = INeverFields<`mode` | `editOptions` | `fallbackOptions` | `fallback` | `chunkSize`> & {
      broadcast: IBroadcastSendParams;
      keyboard?: IInBoKb | null;
      rich?: IOptReplyRich[0] | null;
      richOptions?: IOptRichSend | null;
      options?: IOptReply | null;
  };
