### YamlMime:TSTypeAlias
name: IOptRich
uid: gramstax!IOptRich:type
package: gramstax!
fullName: IOptRich
summary: Rich-edit options — fields legal on BOTH the rich send and the rich edit.
remarks: >-
  `NonNullable<IOptReplyRich[1]> & IOptEdit`<!-- -->: a key that only `replyWithRichMessage` accepts cannot reach
  `editMessageText`<!-- -->. The old `[payload, options?]` tuple is gone — the `InputRichMessage` payload rides on the
  route atoms' `rich` field and these options on their `richOptions` field, so neither is a tuple anymore.
example: []
isPreview: false
isDeprecated: false
syntax: type IOptRich = NonNullable<IOptReplyRich[1]> & IOptEdit;
