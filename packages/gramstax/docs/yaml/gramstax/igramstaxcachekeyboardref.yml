### YamlMime:TSTypeAlias
name: IGramstaxCacheKeyboardRef
uid: gramstax!IGramstaxCacheKeyboardRef:type
package: gramstax!
fullName: IGramstaxCacheKeyboardRef
summary: >-
  `cacheKeyboard` slot: a path-ref to a `Map` subclass, an entries array, or a plain object (entries via
  `Object.entries`<!-- -->).
remarks: >-
  Four accepted shapes (enforced by the loader): - a module path string resolving to a `Map` subclass - an `{override:
  {module, export?, args?}}` ref resolving to a `Map` subclass - an entries array (`Array<[string, unknown]>`<!-- -->)
  used as `new Map(entries)` - a plain object whose entries seed the map via `Object.entries`
example:
  - |-
    ```typescript
    const fromPath: IGramstaxCacheKeyboardRef = `./src/keyboard-cache.ts`
    const entries: IGramstaxCacheKeyboardRef = [[`main:en`, {text: `Main`}]]
    const plain: IGramstaxCacheKeyboardRef = {[`main:en`]: {text: `Main`}}
    ```
isPreview: false
isDeprecated: false
syntax: type IGramstaxCacheKeyboardRef = IGramstaxPathRef | Array<[string, unknown]> | Record<string, unknown>;
