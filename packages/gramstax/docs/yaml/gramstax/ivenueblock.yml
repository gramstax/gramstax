### YamlMime:TSTypeAlias
name: IVenueBlock
uid: gramstax!IVenueBlock:type
package: gramstax!
fullName: IVenueBlock
summary: Venue block configuration for Telegram venues.
remarks: >-
  Declared with `<g-venue>` blocks. All four fields support the same `{{var|filter}}` interpolation pipeline as poll
  questions; the compiled strings are validated at runtime before any API call (non-empty title/address plus
  `Ctx.assertLocation` range checks on the coordinates).
example:
  - |-
    ```typescript
    const venue: IVenueBlock = {
      title: `Cafe {{name}}`,
      address: `Jl. Merdeka 1`,
      latitude: `-6.2`,
      longitude: `106.8`
    }
    ```
isPreview: false
isDeprecated: false
syntax: |-
  type IVenueBlock = {
      title: string;
      address: string;
      latitude: string;
      longitude: string;
  };
