### YamlMime:TSTypeAlias
name: IMediaBlock
uid: gramstax!IMediaBlock:type
package: gramstax!
fullName: IMediaBlock
summary: Represents a media block configuration for Telegram messages.
remarks: >-
  This type defines the structure for various media types supported by Telegram, including file-based media (photo,
  video, audio, document, animation, voice, video\_note, sticker), location, and contact.
example:
  - |-
    ```typescript
    const photoMedia: IMediaBlock = {
      type: 'photo',
      src: 'path/to/image.jpg',
      caption: 'A beautiful sunset'
    };

    const locationMedia: IMediaBlock = {
      type: 'location',
      latitude: '37.7749',
      longitude: '-122.4194'
    };

    const contactMedia: IMediaBlock = {
      type: 'contact',
      phone: '+1234567890',
      first_name: 'John',
      last_name: 'Doe'
    };
    ```
isPreview: false
isDeprecated: false
syntax: |-
  type IMediaBlock = {
      type: `photo` | `video` | `audio` | `document` | `animation` | `voice` | `video_note` | `sticker` | `location` | `contact`;
      src?: string;
      caption?: string;
      latitude?: string;
      longitude?: string;
      phone?: string;
      first_name?: string;
      last_name?: string;
      vcard?: string;
  };
