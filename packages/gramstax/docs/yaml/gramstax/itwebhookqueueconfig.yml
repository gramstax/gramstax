### YamlMime:TSTypeAlias
name: ITWebhookQueueConfig
uid: gramstax!ITWebhookQueueConfig:type
package: gramstax!
fullName: ITWebhookQueueConfig
summary: Webhook queue configuration for backpressure and worker pooling.
remarks: >-
  Enable this only for webhook deployments. The queue buffers incoming updates and dispatches them to a worker pool,
  decoupling HTTP latency from handler work.
example:
  - |-
    ```typescript
    webhookQueue: {
      enabled: true,
      maxQueueSize: 5000,
      workerCount: 8,
      perChatConcurrency: 1,
      blockWhenFull: true
    }
    ```
isPreview: false
isDeprecated: false
syntax: |-
  type ITWebhookQueueConfig = {
      enabled?: boolean;
      maxQueueSize?: number;
      workerCount?: number;
      perChatConcurrency?: number;
      blockWhenFull?: boolean;
      enqueueTimeoutMs?: number;
  };
