methods:
  - name: capacity()
    uid: gramstax!UpdateQueue#capacity:member(1)
    package: gramstax!
    fullName: capacity()
    summary: Number of free slots available right now.
    remarks: >-
      Used as the `getUpdates` `limit` hint so fetch slows under load instead of over-fetching into a full buffer.
      Saturates at 0; callers clamp to 1..100. A closed queue reports 0 because it accepts nothing, however much room is
      physically left in the buffer.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
