### YamlMime:TSType
name: UpdateQueue
uid: gramstax!UpdateQueue:class
package: gramstax!
fullName: UpdateQueue
summary: Update queue — in-memory bounded FIFO for sequential processing.
remarks: >-
  Provides a bounded FIFO queue for Telegram updates, ensuring they are processed sequentially. Shared by both deploy
  modes: webhook/serverless enqueue from HTTP requests, polling enqueues from the `getUpdates` loop. Useful for
  long-polling fallback or rate-limited processing.
example: []
isPreview: false
isDeprecated: false
