      return:
        type: number
        description: ''
  - name: close()
    uid: gramstax!UpdateQueue#close:member(1)
    package: gramstax!
    fullName: close()
    summary: Close the queue and release all waiting consumers and producers.
    remarks: Workers waiting on `dequeue()` resolve with `undefined` (sentinel). Enqueueing after close throws.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
