### YamlMime:TSTypeAlias
name: ITMockTelegramServerOptions
uid: gramstax!ITMockTelegramServerOptions:type
package: gramstax!
fullName: ITMockTelegramServerOptions
summary: Options for configuring the mock Telegram server.
remarks: Use `handlers` to override specific methods, and `defaultHandler` as a fallback for any unmatched method.
example:
  - |-
    ```typescript
    const options: ITMockTelegramServerOptions = {
      port: 0,
      handlers: {
        getMe: () => ({ok: true, result: {is_bot: true}})
      }
    }
    ```
isPreview: false
isDeprecated: false
syntax: |-
  type ITMockTelegramServerOptions = {
      hostname?: string;
      port?: number;
      log?: ITMockTelegramLog | boolean | null;
      handlers?: Record<string, ITMockTelegramHandler>;
      defaultHandler?: ITMockTelegramHandler;
  };
