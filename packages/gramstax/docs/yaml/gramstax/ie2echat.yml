  `type` `private`<!-- -->, `first_name` `Test`<!-- -->). Consumed by `E2eHelper._defaultChat`<!-- -->.
example: []
isPreview: false
isDeprecated: false
syntax: |-
  type IE2eChat = {
      id?: number;
      type?: `private` | `group` | `supergroup` | `channel`;
      first_name?: string;
      last_name?: string;
      username?: string;
      title?: string;
  };
