### YamlMime:TSTypeAlias
name: IShippingErrorBlock
uid: gramstax!IShippingErrorBlock:type
package: gramstax!
fullName: IShippingErrorBlock
summary: Shipping error block for Telegram payments.
remarks: >-
  Declared with `<g-shipping-error>` blocks. `text` supports the same `{{var|filter}}` interpolation pipeline as poll
  questions and becomes the `error_message` shown when the address is rejected (plain text without HTML per the Bot API
  `answerShippingQuery` limits).
example:
  - |-
    ```typescript
    const rejected: IShippingErrorBlock = {
      text: `Di luar zona {{city}}`
    }
    ```
isPreview: false
isDeprecated: false
syntax: |-
  type IShippingErrorBlock = {
      text: string;
  };
