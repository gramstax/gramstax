### YamlMime:TSType
name: WorkerThreadPool
uid: gramstax!WorkerThreadPool:class
package: gramstax!
fullName: WorkerThreadPool
summary: Manages multiple worker thread instances, providing pooled access and broadcast functionality.
remarks: Uses `Map` with `threadId` as key for thread registry. Supports sending requests to all workers via broadcast.
example:
  - |-
    ```typescript
    import { WorkerThreadPool, WorkerThreadLaunch } from "gramstax";

    const workers = await Promise.all(
      [1, 2, 3, 4].map(async (i) => {
        const w = new WorkerThreadLaunch("./processor.ts", [String(i)]);
        await w.ready();
        return w;
      })
    );

    const pool = new WorkerThreadPool(workers);
    console.log(`Pool has ${pool.threadCount} workers`);

    // Broadcast to all workers
    const statuses = await pool.broadcastRequest("getStatus", []);
    ```
isPreview: false
isDeprecated: false
