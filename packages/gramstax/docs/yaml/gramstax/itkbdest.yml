### YamlMime:TSTypeAlias
name: ITKbDest
uid: gramstax!ITKbDest:type
package: gramstax!
fullName: ITKbDest
summary: Keyboard column configuration pattern.
remarks: >-
  Defines the button distribution pattern per row in the keyboard layout. Can be: - Single number: `"1"` to `"6"` - All
  rows have this many buttons (e.g., `"3"` = 3 buttons per row) - Pattern format: `"x-y"` - First rows have x buttons,
  last row has y buttons
example:
  - |-
    ```typescript
    // All rows with 3 buttons each
    const cols1: IKbCols = "3"

    // First rows with 1 button, last row with 2 buttons
    const cols2: IKbCols = "1-2"

    // First rows with 2 buttons, last row with 4 buttons
    const cols3: IKbCols = "2-4"
    ```
isPreview: false
isDeprecated: false
syntax: type ITKbDest = typeof Ctx | Ctx | string;
