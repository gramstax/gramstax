name: IData
uid: gramstax!IData:type
package: gramstax!
fullName: IData
summary: Generic data object for template interpolation.
remarks: Used throughout Gramstax for passing dynamic data to templates and methods. Accepts any key-value pairs.
example:
  - |-
    ```ts
    const data: IData = {name: `John`, count: 3}
    await this.renderText({data})
    ```
