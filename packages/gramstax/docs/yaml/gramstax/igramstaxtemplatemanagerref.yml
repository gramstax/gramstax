### YamlMime:TSTypeAlias
name: IGramstaxTemplateManagerRef
uid: gramstax!IGramstaxTemplateManagerRef:type
package: gramstax!
fullName: IGramstaxTemplateManagerRef
summary: >-
  `templateManager` slot: a path-ref to a `TemplateManager` subclass, or builtin `ITemplateOptions` passed to `new
  TemplateManager(params)`<!-- -->.
remarks: >-
  Three accepted shapes (enforced by the loader): - a module path string resolving to a `TemplateManager` subclass - an
  `{override: {module, export?, args?}}` ref resolving to a `TemplateManager` subclass - builtin template options
  (`path`<!-- -->, `enableWatch?`<!-- -->, `watchOptions?`<!-- -->, `onReload?`<!-- -->) passed to `new
  TemplateManager(params)` — `path` must be a non-empty array of non-empty strings, `enableWatch` a boolean,
  `watchOptions` an object, `onReload` a function. Unknown fields are rejected.
example:
  - |-
    ```typescript
    const fromPath: IGramstaxTemplateManagerRef = `./src/templates.ts`
    const builtin: IGramstaxTemplateManagerRef = {path: [`./src/pages`], enableWatch: true}
    ```
isPreview: false
isDeprecated: false
syntax: type IGramstaxTemplateManagerRef = IGramstaxPathRef | ITemplateOptions;
