### YamlMime:TSTypeAlias
name: IGramstaxCloudflareModOptions
uid: gramstax!IGramstaxCloudflareModOptions:type
package: gramstax!
fullName: IGramstaxCloudflareModOptions
summary: '`cloudflare-mod` adapter section of `optionsDeploy.serverless`<!-- -->.'
remarks: >-
  The adapter is the KEY, so this type only exists under the `cloudflare-mod` key. Fields that do not apply to
  Cloudflare are absent from this type rather than present-and-ignored.


  `compatibilityDate` and `compatibilityFlags` are emitted into `wrangler.toml`<!-- -->. When `undefined` they are
  written as commented lines carrying the default, so the emitted file documents what would be used.
example:
  - |-
    ```typescript
    const section: IGramstaxCloudflareModOptions = {
      name: `gramstax-worker`,
      compatibilityDate: `2026-01-01`,
      compatibilityFlags: [`nodejs_compat`],
      url: `https://example.com/webhook`,
      secretToken: process.env.BOT_WEBHOOK_SECRET ?? ``,
      toml: {account_id: `abc123`}
    }
    ```
isPreview: false
isDeprecated: false
syntax: |-
  type IGramstaxCloudflareModOptions = {
      name?: string;
      compatibilityDate?: string;
      compatibilityFlags?: string[];
      url?: string;
      secretToken?: string;
      toml?: Record<string, unknown>;
  };
