    syntax:
      content: 'request(method: string, params: any, _wait?: boolean, _others?: any): Promise<any>;'
      parameters:
        - id: method
          description: Method name to call in worker. Must exist on WorkerThreadInit.
          type: string
        - id: params
          description: Method parameters. Passed as array to worker method.
          type: any
        - id: _wait
          description: Wait for response. If false, fire-and-forget. Defaults to `true`<!-- -->.
          type: boolean
        - id: _others
          description: Additional RPC data. Merged into RPC payload.
          type: any
      return:
        type: Promise&lt;any&gt;
        description: Promise resolving with worker response.
