### YamlMime:TSTypeAlias
name: IRenderEditKeyboardParams
uid: gramstax!IRenderEditKeyboardParams:type
package: gramstax!
fullName: IRenderEditKeyboardParams
summary: Parameters for `renderEditKeyboard`<!-- -->.
remarks: >-
  `params = CONTENT & ROUTE`<!-- -->: the shared template content (`data`<!-- -->, `AGBaseId`<!-- -->) on the
  forced-edit route (`IRouteEdit`<!-- -->), with `mode` declared `never` — this method always edits, the mode is not a
  choice. Sent via `editMessageReplyMarkup` and never touching message text; when `keyboard` is null, the markup
  resolves from the `<g-keyboard>` block of the given `AGBaseId` itself, which is what makes `AGBaseId` meaningful here.
  The `keyboard` slot stays inline-only, because `editMessageReplyMarkup` rejects a bottom keyboard.
example: []
isPreview: false
isDeprecated: false
syntax: |-
  type IRenderEditKeyboardParams = IContent & Omit<IRouteEdit, `mode` | `options`> & {
      mode?: never;
      options?: IOptEditKeyboard | null;
  };
