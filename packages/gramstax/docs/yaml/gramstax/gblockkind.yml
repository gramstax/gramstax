name: GBlockKind
uid: gramstax!GBlockKind:type
package: gramstax!
fullName: GBlockKind
summary: Discriminator identifying which `getG*` block a result was rendered from.
remarks: >-
  One member per `TemplateManager.getG*` getter. Consumers narrow the `G*Result` payloads by `kind`<!-- -->; every
  payload carries its fields flat alongside this discriminator.
