### YamlMime:TSType
name: LabelKeyboard
uid: gramstax!LabelKeyboard:class
package: gramstax!
fullName: LabelKeyboard
summary: Provides static utilities for keyboard data manipulation, specifically for reversing keyboard button order.
remarks: >-
  Used as base class for user-defined keyboard data classes. Provides button order manipulation for multi-language
  keyboards.
example:
  - |-
    ```typescript
    import { LabelKeyboard } from "gramstax";

    export class KeyboardLabel extends LabelKeyboard {
      static home = {
        id: "Rumah",
        en: "Home"
      }
      static backNext = {
        id: "Kembali, Lanjut",
        en: "Back, Next"
      }
      static oneTwo = this._reverseObj({
        id: "Satu, Dua",
        en: "One, Two"
      })
      static threeFour = {
        id: this._reverse("Tiga, Empat"),
        en: "Three, Four"
      }
    }

    const kbl = KeyboardLabel
    kbl.home.id // => "Rumah"
    kbl.backNext.id // => "Kembali, Lanjut"
    kbl.oneTwo.id // => "Dua, Satu"
    kbl.oneTwo.en // => "Two, One"
    kbl.threeFour.id // => "Empat, Tiga"
    kbl.threeFour.en // => "Three, Four"
    ```
