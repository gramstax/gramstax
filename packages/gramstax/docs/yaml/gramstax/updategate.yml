### YamlMime:TSType
name: UpdateGate
uid: gramstax!UpdateGate:class
package: gramstax!
fullName: UpdateGate
summary: Per-key concurrency gate.
remarks: >-
  Extracted verbatim from the closure that used to live inside `Gramstax._runWebhook`<!-- -->, then generalized from
  "chat id" to "gate key" so polling and webhook share one implementation. Same-key updates serialize; different keys
  run concurrently. Entries are removed as soon as their last holder releases, so the maps do not grow with key
  cardinality.
example: []
isPreview: false
isDeprecated: false
