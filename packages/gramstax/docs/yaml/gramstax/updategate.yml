    fullName: acquire(key)
    summary: Acquire the gate for `key`<!-- -->, returning a release function.
    remarks: >-
      Resolves immediately (with a no-op release) when gating is disabled or `key` is `undefined`<!-- -->. Otherwise
      parks FIFO until the key has a free slot.
