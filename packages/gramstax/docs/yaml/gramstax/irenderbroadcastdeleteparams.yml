### YamlMime:TSTypeAlias
name: IRenderBroadcastDeleteParams
uid: gramstax!IRenderBroadcastDeleteParams:type
package: gramstax!
fullName: IRenderBroadcastDeleteParams
summary: Parameters for `renderBroadcastDelete` — the expiry-cleanup delete fan-out.
remarks: >-
  Reads no template block and renders nothing: it operates on stored message ids, so it has no CONTENT half (`data`<!--
  -->/`AGBaseId`<!-- -->) and no route layer at all. Same checkpoint-first controls as the revise fan-out (`renderMedia`
  with `broadcast.targets`<!-- -->) via `reviseOptions`<!-- -->; a failed delete has no text fallback by design, since
  there is no replacement content to deliver.
example: []
isPreview: false
isDeprecated: false
syntax: |-
  type IRenderBroadcastDeleteParams = {
      targets: IBroadcastEditTarget[];
      reviseOptions?: Omit<IBroadcastEditOpts, `fallback`> | null;
  };
