name: IContent
uid: gramstax!IContent:type
package: gramstax!
fullName: IContent
summary: 'Template content shared by every render method: what to render.'
remarks: >-
  `params = CONTENT & ROUTE`<!-- -->: the content half names the template fields (`data`<!-- -->, `AGBaseId`<!-- -->),
  the route atoms say how the rendered block is delivered (send, edit, chunked, broadcast). A method with a richer
  content body (media kind, gift target, template-backed answer) intersects its own fields on top.
example: []
