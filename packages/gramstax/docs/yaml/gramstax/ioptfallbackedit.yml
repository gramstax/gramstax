### YamlMime:TSTypeAlias
name: IOptFallbackEdit
uid: gramstax!IOptFallbackEdit:type
package: gramstax!
fullName: IOptFallbackEdit
summary: Fallback behavior when an edit operation fails.
remarks: >-
  - `delete-reply` (default): deletes the original message, then sends a new one — the result looks like an in-place
  edit. - `reply`<!-- -->: sends a new message without deleting the original. - `disable`<!-- -->: rethrows the edit
  error (no fallback).
example:
  - |-
    ```ts
    await ctx.edit({fallback: `reply`})
    ```
isPreview: false
isDeprecated: false
syntax: type IOptFallbackEdit = `delete-reply` | `reply` | `disable`;
