### YamlMime:TSTypeAlias
name: ISessionLockOnContended
uid: gramstax!ISessionLockOnContended:type
package: gramstax!
fullName: ISessionLockOnContended
summary: Contention policy when the session lease cannot be acquired.
remarks: >-
  - `skip` — drop the contended update (`withLock` resolves `null`<!-- -->). - `wait` — retry every `10ms` until
  `leaseMs` elapses, then give up with `null`<!-- -->. - `serialize` — queue per session key so contended updates run in
  order.
example: []
isPreview: false
isDeprecated: false
syntax: type ISessionLockOnContended = `skip` | `wait` | `serialize`;
