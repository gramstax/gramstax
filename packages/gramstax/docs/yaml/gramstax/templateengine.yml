  - name: compileBlockKeyboards(template, baseBlocks)
    uid: gramstax!TemplateEngine.compileBlockKeyboards:member(1)
    package: gramstax!
    fullName: compileBlockKeyboards(template, baseBlocks)
    summary: Compiles keyboard blocks from a template into executable functions.
    remarks: >-
      This method parses `<keyboard>` blocks from the template and compiles them into functions that generate button
      label arrays. The result is organized by base ID and language, with separate `inline` and `bottom` keyboard modes.
      Comma-separated labels are split into individual button strings.


      Processing pipeline (in order, per keyboard label): 1. `_processScriptBlocks` – converts `<script>` blocks into
      executable expressions 2. `_processMapBlocks` – converts `<map>` blocks into array map expressions 3.
      `_processSwitchBlocks` – converts `<switch>` blocks into switch expressions 4. `_processScopeExec` – evaluates
      scope execution blocks (implementation-defined) 5. `_processScopeVariables` – resolves scope variables
      (implementation-defined) 6. `_compileToFunction(processedLabels, true)` – produces the final render function


      Notes: - Keyboard content is split by commas into individual labels. - Escaped commas with double backslash
      (`\\,`<!-- -->) are preserved as literal commas. - Each label is processed independently through the pipeline.


      Output shape: - First level key: `baseId` (from `<base id="...">`<!-- -->, or `"default"` if omitted) - Second
      level key: `lang` (from `<keyboard lang="...">`<!-- -->, or `"default"` if omitted) - Third level key: `mode`<!--
      -->: - `inline` (default) - `bottom` - Value: `(data?: Record<string, any>) => string[]`
    example:
      - |-
        ```typescript
        const template = `
          <base>
            <keyboard>Yes, No, {{action}}</keyboard>
            <keyboard type="bottom">Menu, Help</keyboard>
          </base>
        `;
        const keyboards = TemplateEngine.compileBlockKeyboards(template);
        const inline = keyboards.default?.default?.inline?.({ action: 'Cancel' });
        // Result: ['Yes', 'No', 'Cancel']
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        static compileBlockKeyboards(template: string, baseBlocks?: ReturnType<typeof
        TemplateEngine._processBaseBlocks>): {
                [baseId: string]: {
