    uid: gramstax!TemplateEngine._toConcatExpr:member(1)
    package: gramstax!
    fullName: _toConcatExpr(processed)
    summary: Converts processed template output into a concatenation expression.
    remarks: >-
      Splits `processed` on balanced `${...}` spans (quote-aware, brace-nesting-aware): spans passing
      [TemplateEngine.\_isGeneratedCode()](xref:gramstax!TemplateEngine._isGeneratedCode:member(1)) are emitted as
      parenthesized code, everything else — including attacker-controlled `${...}`<!-- -->-lookalikes — is emitted as
      `JSON.stringify` string literals joined with `+`<!-- -->. Static segments can therefore never break out into code;
      this is the core guarantee behind `_compileToFunction`<!-- -->. An unterminated `${` is treated as literal text.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static _toConcatExpr(processed: string): string;'
      parameters:
        - id: processed
          description: Template output after block/scope processing.
          type: string
      return:
        type: string
        description: A JS expression evaluating to the rendered string.
  - name: _tokenizeExpression(expr)
    uid: gramstax!TemplateEngine._tokenizeExpression:member(1)
    package: gramstax!
    fullName: _tokenizeExpression(expr)
    summary: Splits a `<g-ifelse>` body into tokens so identifiers can be rewritten without a JavaScript parser dependency.
    remarks: >-
      Token types: `word`<!-- -->, `number`<!-- -->, `string`<!-- -->, `template`<!-- -->, `regex`<!-- -->, `punct`<!--
      -->. Whitespace and comments are dropped — spacing is not preserved because the output is re-emitted source.


      Two constructs are tokenized as opaque single tokens and therefore never rewritten: regex literals, and template
      literals (so `${...}` inside them cannot be silently reinterpreted). Template literals that do carry `${`
      interpolation are rejected by
      [TemplateEngine.validateBlockGIfElseBody()](xref:gramstax!TemplateEngine.validateBlockGIfElseBody:member(1))
      rather than mis-rewritten here.


      A `/` is read as division when the previous token can end a value (word, number, string, template, `)`<!-- -->,
      `]`<!-- -->, `++`<!-- -->, `--`<!-- -->) and as a regex literal otherwise. This is the standard heuristic and is
      ambiguous for `if (x) /re/.test(s)`<!-- -->; it resolves toward division, which is the common case in a template
      conditional.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        static _tokenizeExpression(expr: string): Array<{
                type: string;
                value: string;
            }>;
      parameters:
        - id: expr
          description: The raw `<g-ifelse>` body
          type: string
      return:
        type: |-
          Array&lt;{
                  type: string;
                  value: string;
              }&gt;
        description: The token list
