    fullName: _rewriteScopeIdentifiers(expr)
    summary: Rewrites bare identifiers in a `<g-ifelse>` body to optional `data` reads.
    remarks: >-
      `user.name` becomes `data?.user?.name` — an optional chain, so a missing branch never throws — rather than
      `(data?.user).name`<!-- -->, which would. A member chain is consumed as a unit so the whole chain stays optional.
      Identifiers already qualified by `.`<!-- -->/`?.`<!-- -->, object-literal keys, arrow-function parameters,
      reserved words, and the standard globals are left alone; shorthand object properties are expanded so they keep
      reading from `data`<!-- -->.
    example:
      - |-
        ```typescript
        TemplateEngine._rewriteScopeIdentifiers(`user.isAdmin ? "admin" : "user"`);
        // Result: 'data?.user?.isAdmin ? "admin" : "user"'
        ```
