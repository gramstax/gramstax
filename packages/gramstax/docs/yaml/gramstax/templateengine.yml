  - name: _processGMediaBlocks(template)
    uid: gramstax!TemplateEngine._processGMediaBlocks:member(1)
    package: gramstax!
    fullName: _processGMediaBlocks(template)
    summary: 'Block: g-media Extracts and parses `<g-media>` blocks from a template string.'
    remarks: >-
      This internal method identifies all `<g-media>` blocks and extracts their attributes and content. It supports
      various media types including photo, video, audio, document, animation, voice, video\_note, sticker, location, and
      contact. The inner content becomes the caption for supported types.


      \*\*Attributes:\*\* - `lang` (optional): Language key for the output map. Defaults to `"default"`<!-- -->. -
      `type` (required): Media type discriminator. Expected values: - `photo`<!-- -->, `video`<!-- -->, `audio`<!-- -->,
      `document`<!-- -->, `animation`<!-- -->, `voice`<!-- -->, `video_note`<!-- -->, - `sticker`<!-- -->,
      `location`<!-- -->, `contact`<!-- -->. - `src` (optional): File path / URL / file identifier for file-based media.
      - `latitude` (optional): Location latitude (used when `type="location"`<!-- -->). - `longitude` (optional):
      Location longitude (used when `type="location"`<!-- -->). - `phone` (optional): Contact phone number (used when
      `type="contact"`<!-- -->). - `first_name` (optional): Contact first name (used when `type="contact"`<!-- -->). -
      `last_name` (optional): Contact last name (used when `type="contact"`<!-- -->). - `vcard` (optional): Contact
      vCard payload (used when `type="contact"`<!-- -->).


      Media rules (based on `type`<!-- -->): - If `src` exists, it is assigned as `mediaBlock.src` (for any type). - If
      `src` contains pipe-delimited values, `mediaBlock.srcList` is populated with up to 10 trimmed entries for Telegram
      media groups. - If caption exists and `type !== "video_note"` and `type !== "sticker"`<!-- -->, it is assigned as
      `mediaBlock.caption`<!-- -->. - If `type === "location"`<!-- -->, `latitude` and `longitude` are copied if
      present, and caption (if present) is also allowed. - If `type === "contact"`<!-- -->, `phone`<!-- -->,
      `first_name`<!-- -->, `last_name`<!-- -->, and `vcard` are copied if present, and caption (if present) is also
      allowed.


      Note: - If multiple `<g-media>` blocks share the same `lang`<!-- -->, the last one wins (it overwrites the
      previous entry).
    example:
      - >-
        ```typescript

        const template = '<g-media type="photo" src="image.jpg|image-2.jpg" lang="en">Hello</g-media>';

        const media = TemplateEngine._processGMediaBlocks(template);

        // Result: { en: { type: 'photo', src: 'image.jpg|image-2.jpg', srcList: ['image.jpg', 'image-2.jpg'], caption:
        'Hello' } }

        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        static _processGMediaBlocks(template: string): {
                [lang: string]: IMediaBlock;
            };
      parameters:
        - id: template
          description: The template string containing `<g-media>` blocks
          type: string
      return:
        type: |-
          {
                  [lang: string]: <xref uid="gramstax!IMediaBlock:type" />;
              }
        description: An object mapping language keys to their corresponding media block configurations
