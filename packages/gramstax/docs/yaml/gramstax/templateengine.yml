  - name: ALLOWED_BLOCKS
    uid: gramstax!TemplateEngine.ALLOWED_BLOCKS:member
    package: gramstax!
    fullName: ALLOWED_BLOCKS
    summary: Registry of all supported template block tags.
    remarks: >-
      These are the actual XML-like tags recognized by `TemplateEngine`<!-- -->. Each corresponds to a `<tagName>`
      element in template strings.


      \*\*Content blocks:\*\* `g-base`<!-- -->, `g-message`<!-- -->, `g-keyboard`<!-- -->, `g-media`<!-- -->,
      `g-description` \*\*Logic blocks:\*\* `g-script`<!-- -->, `g-switch`<!-- -->, `g-case`<!-- -->, `g-default`<!--
      -->, `g-map`<!-- -->, `g-div` \*\*Utility blocks:\*\* `import`<!-- -->, `space`


      \*\*Telegram Rich HTML (passed through to `html` field):\*\* - \*Inline:\* `a`<!-- -->, `b`<!-- -->, `code`<!--
      -->, `del`<!-- -->, `em`<!-- -->, `i`<!-- -->, `ins`<!-- -->, `mark`<!-- -->, `s`<!-- -->, `strike`<!-- -->,
      `strong`<!-- -->, `sub`<!-- -->, `sup`<!-- -->, `tg-spoiler`<!-- -->, `u` - \*Block/structural:\* `aside`<!-- -->,
      `blockquote`<!-- -->, `blockquote expandable`<!-- -->, `br`<!-- -->, `caption`<!-- -->, `details`<!-- -->,
      `footer`<!-- -->, `h1`<!-- -->-`h6`<!-- -->, `hr`<!-- -->, `li`<!-- -->, `ol`<!-- -->, `p`<!-- -->, `pre`<!-- -->,
      `summary`<!-- -->, `table`<!-- -->, `td`<!-- -->, `th`<!-- -->, `tr`<!-- -->, `ul` - \*Telegram-specific:\*
      `tg-collage`<!-- -->, `tg-emoji`<!-- -->, `tg-map`<!-- -->, `tg-math`<!-- -->, `tg-math-block`<!-- -->,
      `tg-reference`<!-- -->, `tg-slideshow`<!-- -->, `tg-time` - \*Media:\* `audio`<!-- -->, `cite`<!-- -->,
      `figcaption`<!-- -->, `figure`<!-- -->, `img`<!-- -->, `video` - \*Forms:\* `input`
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static ALLOWED_BLOCKS: string[];'
      return:
        type: string[]
  - name: ALLOWED_SCOPE
    uid: gramstax!TemplateEngine.ALLOWED_SCOPE:member
    package: gramstax!
    fullName: ALLOWED_SCOPE
    summary: Registry of supported scope interpolation syntaxes.
    remarks: >-
      These are the variable/expression delimiters recognized within template content. Each entry represents a pair of
      opening/closing delimiters that trigger a specific interpolation behavior at compile time.


      \*\*Supported scopes:\*\* - `{{}}` — Mustache-style variable interpolation. Placeholders like `{{name}}` are
      replaced with the corresponding value from the `data` object at render time. Nullish values produce an empty
      string. - `{~~}` — Inline execution blocks. Expressions like `{~ status ? "Success" : "Failed" ~}` are evaluated
      as JavaScript expressions with access to the `data` object.


      This array is used for reference/documentation purposes; the actual parsing is handled by `_processScopeVariables`
      (for `{{}}`<!-- -->) and `_processScopeExec` (for `{~~}`<!-- -->).
    example:
      - |-
        ```typescript
        console.log(TemplateEngine.ALLOWED_SCOPE)
        // Result: ['{{}}', '{~~}']
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static ALLOWED_SCOPE: string[];'
      return:
        type: string[]
