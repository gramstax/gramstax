          description: The raw template string to validate
          type: string
      return:
        type: |-
          {
                  valid: boolean;
                  errors: Array&lt;{
                      line: number;
                      message: string;
                  }&gt;;
              }
        description: An object with a `valid` boolean and an `errors` array
  - name: validateTelegramAttributeValuesBlock(template)
    uid: gramstax!TemplateEngine.validateTelegramAttributeValuesBlock:member(1)
    package: gramstax!
    fullName: validateTelegramAttributeValuesBlock(template)
    summary: Validates that Telegram Rich HTML tag attribute values match their expected formats.
    remarks: >-
      Runs after
      [TemplateEngine.validateTelegramAttributesBlock()](xref:gramstax!TemplateEngine.validateTelegramAttributesBlock:member(1))
      (which checks presence) to catch format-level issues. Validates: - `<tg-time unix>` must be a positive integer;
      `<tg-time format>` must be non-empty - `<tg-map lat>` ∈ \[-90, 90\], `<tg-map long>` ∈ \[-180, 180\], `<tg-map
      zoom>` ∈ \[0, 24\] - `<tg-emoji emoji-id>` must be a numeric string - `<a href>` must use http(s)://, mailto:,
      tel:, tg://, or \# scheme - `<input type>` must be a known HTML input type


      Tags without value validators (e.g. `<b>`<!-- -->, `<p>`<!-- -->, `<table>`<!-- -->) are skipped. See
      [TemplateEngine.\_TELEGRAM\_ATTR\_VALUE\_VALIDATORS](xref:gramstax!TemplateEngine._TELEGRAM_ATTR_VALUE_VALIDATORS:member)
      for the full spec.
    example:
      - >-
        ```typescript

        const result = TemplateEngine.validateTelegramAttributeValuesBlock(`
          <g-base>
            <g-message><tg-time unix="1647531900" format="wDT">22:45</tg-time></g-message>
          </g-base>
        `);

        // Result: { valid: true, errors: [] }


        const bad = TemplateEngine.validateTelegramAttributeValuesBlock(`
          <g-base>
            <g-message><tg-time unix="abc" format="wDT">x</tg-time></g-message>
          </g-base>
        `);

        // Result: { valid: false, errors: [{ line: 3, message: '<tg-time> unix must be a positive integer (got "abc")'
        }] }

        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        static validateTelegramAttributeValuesBlock(template: string): {
                valid: boolean;
                errors: Array<{
                    line: number;
                    message: string;
                }>;
            };
      parameters:
