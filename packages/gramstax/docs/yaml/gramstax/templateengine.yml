    fullName: compileBlockGDescription(template, gBaseBlocks)
    summary: Compiles description blocks from a template into executable functions.
    remarks: >-
      This method parses `<g-description>` blocks from the template and compiles them into functions that generate
      rendered description strings. The result is organized by base ID, scope, and language. Used for Telegram bot
      command descriptions.


      Processing pipeline (in order, per description): 1. `_processGScriptBlocks` – converts `<g-script>` blocks into
      executable expressions 2. `_processGMapBlocks` – converts `<g-map>` blocks into array map expressions 3.
      `_processGSwitchBlocks` – converts `<g-switch>` blocks into switch expressions 4. `_processScopeExec` – evaluates
      scope execution blocks (implementation-defined) 5. `_processScopeVariables` – resolves scope variables
      (implementation-defined) 6. `_compileToFunction(processed, false)` – produces the final render function


      Output shape: - First level key: `AGBaseId` (from `<g-base id="...">`<!-- -->, or `"default"` if omitted) - Second
      level key: `AScope` (from `<g-description scope="...">`<!-- -->, or `"default"` if omitted) - Third level key:
      `ALang` (from `<g-description lang="...">`<!-- -->, or `"default"` if omitted) - Value: `(data?: Record<string,
