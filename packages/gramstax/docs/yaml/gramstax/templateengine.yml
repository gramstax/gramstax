  - name: validateTelegramAttributesBlock(template)
    uid: gramstax!TemplateEngine.validateTelegramAttributesBlock:member(1)
    package: gramstax!
    fullName: validateTelegramAttributesBlock(template)
    summary: Validates that Telegram Rich HTML tags in the template carry their required attributes.
    remarks: >-
      Telegram tags with required attributes (per the Rich HTML spec) are checked: `<a>` (href or name), `<img/>`<!--
      -->, `<video>`<!-- -->, `<audio>` (src), `<tg-emoji>` (emoji-id), `<tg-time>` (unix, format), `<tg-map/>` (lat,
      long, zoom), `<tg-reference>` (name), `<input/>` (type). For `<a>`<!-- -->, at least one of `href` (link) or
      `name` (anchor) must be present.


      Tags without required attributes (e.g. `<b>`<!-- -->, `<table>`<!-- -->, `<p>`<!-- -->) are not checked. See
      [TemplateEngine.\_TELEGRAM\_REQUIRED\_ATTRS](xref:gramstax!TemplateEngine._TELEGRAM_REQUIRED_ATTRS:member) for the
      full spec.
    example:
      - |-
        ```typescript
        const result = TemplateEngine.validateTelegramAttributesBlock(`
          <g-base>
            <g-message><a href="https://t.me/">link</a></g-message>
          </g-base>
        `);
        // Result: { valid: true, errors: [] }

        const bad = TemplateEngine.validateTelegramAttributesBlock(`
          <g-base>
            <g-message><a>broken</a></g-message>
          </g-base>
        `);
        // Result: { valid: false, errors: [{ line: 3, message: '<a> must have one of: href | name' }] }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        static validateTelegramAttributesBlock(template: string): {
                valid: boolean;
