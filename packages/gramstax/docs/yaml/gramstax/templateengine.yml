      parameters:
        - id: template
          description: Processed template source, or one source per language when `isArray` is `true`<!-- -->.
          type: 'T extends true ? string[] : string'
        - id: isArray
          description: When `true`<!-- -->, compile to a renderer returning `string[]`<!-- -->.
          type: T
      return:
        type: <xref uid="gramstax!~ITemplateRenderer:type" />&lt;T&gt;
        description: A renderer taking `data` and returning the compiled output.
