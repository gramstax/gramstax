methods:
  - name: _buildFunctionBody(template, isArray)
    uid: gramstax!TemplateEngine._buildFunctionBody:member(1)
    package: gramstax!
    fullName: _buildFunctionBody(template, isArray)
    summary: Builds the JavaScript function body for a processed template.
    remarks: >-
      Runs the three structural pre-processors in a fixed order — script blocks, then `<g-div>`<!-- -->, then
      `<g-space>` — before converting the result to a concatenation expression. The body is returned as source text,
      never evaluated here: `_compileToFunction` is what turns it into a callable.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static _buildFunctionBody<T extends boolean>(template: T extends true ? string[] : string, isArray: T): string;'
      parameters:
        - id: template
          description: Processed template source, or one source per language when `isArray` is `true`<!-- -->.
          type: 'T extends true ? string[] : string'
        - id: isArray
          description: When `true`<!-- -->, emit a body returning `string[]`<!-- -->.
          type: T
      return:
        type: string
        description: The `return` statement source for the compiled function.
  - name: _compileFilterChain(access, expr, warned)
    uid: gramstax!TemplateEngine._compileFilterChain:member(1)
    package: gramstax!
    fullName: _compileFilterChain(access, expr, warned)
    summary: Applies `|filter:arg` pipes to an already-resolved head expression.
    remarks: >-
      Split out of
      [TemplateEngine.\_processScopeVariables()](xref:gramstax!TemplateEngine._processScopeVariables:member(1)) so
      `<g-map>` can run the same whitelist over its own loop variables instead of re-deriving the pipe grammar. The
      caller resolves the head — a `data` path or a loop variable — and passes the whole expression; the leading segment
      is dropped because it is already baked into `access`<!-- -->.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static _compileFilterChain(access: string, expr: string, warned: Set<string>): string;'
      parameters:
        - id: access
          description: JavaScript expression for the head, e.g. `(data?.user)` or `(e.name)`
          type: string
        - id: expr
          description: The full expression including its head segment, used for the warning text
          type: string
        - id: warned
          description: Filter names already reported, so each unknown filter warns once
          type: Set&lt;string&gt;
      return:
        type: string
        description: The chained call, or `""` when a filter is not on the whitelist
  - name: _compileMediaSrc(rawSrc, stringFn)
    uid: gramstax!TemplateEngine._compileMediaSrc:member(1)
    package: gramstax!
    fullName: _compileMediaSrc(rawSrc, stringFn)
    summary: Wraps a compiled string `src` fn so bare placeholders pass objects by reference.
    remarks: >-
