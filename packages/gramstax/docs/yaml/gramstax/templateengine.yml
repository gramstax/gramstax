  - name: processImportBlocks(template, resolver, depth, importCache)
    uid: gramstax!TemplateEngine.processImportBlocks:member(1)
    package: gramstax!
    fullName: processImportBlocks(template, resolver, depth, importCache)
    summary: Recursively processes and resolves `<import>` blocks in a template.
    remarks: >-
      This method resolves all `<import>` directives in a template by calling the provided resolver function to fetch
      external template content. It supports recursive imports with a depth limit of 10 to prevent infinite loops. An
      optional cache can be provided to avoid redundant resolutions.
    example:
      - |-
        ```typescript
        const template = '<import src="header" block="message" />\n<message>Main content</message>';
        const resolver = (src: string) => {
          if (src === 'header') return '<message>Header text</message>';
          return null;
        };
        const result = TemplateEngine.processImportBlocks(template, resolver);
        // Result: '<message>Header text</message>\n<message>Main content</message>'
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        static processImportBlocks(template: string, resolver: (src: string) => string | null, depth?: number,
        importCache?: Map<string, string>): string;
      parameters:
        - id: template
          description: Template string containing `<import>` directives
          type: string
        - id: resolver
          description: Function that resolves import sources to template content
          type: '(src: string) =&gt; string | null'
        - id: depth
          description: Current recursion depth (defaults to 0)
          type: number
        - id: importCache
          description: Optional Map to cache resolved imports for reuse
          type: Map&lt;string, string&gt;
      return:
        type: string
        description: Template with all `<import>` blocks resolved and replaced
