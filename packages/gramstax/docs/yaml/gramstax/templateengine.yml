        const processed = TemplateEngine._processGScriptBlocks(template);

        // Result: '${(() => { if (!data) return ''; try { with(data) { return name ? `Hello ${name}` : `Hello`; } }
        catch(e) { return '' } })()}'

        ```
    isPreview: false
    isDeprecated: false
