        - id: baseBlocks
          description: Optional pre-parsed base blocks for reuse
          type: ReturnType&lt;typeof <xref uid="gramstax!TemplateEngine._processGBaseBlocks:member" />&gt;
      return:
        type: |-
          {
                  [AGBaseId: string]: {
