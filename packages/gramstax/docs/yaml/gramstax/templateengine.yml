  - name: validateFormatBlock(template)
    uid: gramstax!TemplateEngine.validateFormatBlock:member(1)
    package: gramstax!
    fullName: validateFormatBlock(template)
    summary: Validates block syntax format (self-closing vs regular open/close).
    remarks: >-
      This method checks that each block tag uses the correct syntax format:


      \*\*Must be self-closing:\*\* - `<g-space />` — whitespace control block - `<g-import ... />` — import directive
      block - `<hr/>`<!-- -->, `<img/>`<!-- -->, `<input/>`<!-- -->, `<br/>`<!-- -->, `<tg-map/>` — Telegram Rich HTML
      void elements


      \*\*Must NOT be self-closing (must use open/close tags):\*\* - `<g-base>...</g-base>`<!-- -->,
      `<g-message>...</g-message>`<!-- -->, `<g-keyboard>...</g-keyboard>`<!-- -->, `<g-media>...</g-media>`<!-- -->,
      `<g-description>...</g-description>`<!-- -->, `<g-script>...</g-script>`<!-- -->, `<g-switch>...</g-switch>`<!--
      -->, `<g-case>...</g-case>`<!-- -->, `<g-default>...</g-default>`<!-- -->, `<g-map>...</g-map>`<!-- -->,
      `<g-div>...</g-div>`


      Telegram HTML formatting tags with content (e.g. `<b>`<!-- -->, `<p>`<!-- -->, `<table>`<!-- -->) passthrough and
      are not format-checked — both `<b>text</b>` and `<b/>` are accepted.
    example:
      - >-
        ```typescript

        const result = TemplateEngine.validateFormatBlock(`<g-space>content</g-space>`);

        // Result: { valid: false, errors: [{ line: 1, message: 'Block <g-space> must be self-closing: use <g-space />
        instead' }] }

        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        static validateFormatBlock(template: string): {
                valid: boolean;
                errors: Array<{
                    line: number;
                    message: string;
