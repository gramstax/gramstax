methods:
  - name: _compileToFunction(template, isArray)
    uid: gramstax!TemplateEngine._compileToFunction:member(1)
    package: gramstax!
    fullName: _compileToFunction(template, isArray)
    summary: Compiles a processed template string into an executable function.
    remarks: >-
      This internal method takes a pre-processed template (or array of templates) and compiles it into a JavaScript
      function that accepts a `data` object and returns the rendered result. The function is created using `new
      Function()`<!-- -->.
    example:
      - |-
        ```typescript
        const processed = '${(data && data["name"]) ?? ""}';
        const fn = TemplateEngine._compileToFunction(processed, false);
        const result = fn({ name: 'John' });
        // Result: 'John'
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        static _compileToFunction<T extends boolean>(template: T extends true ? string[] : string, isArray: T):
        ITTemplateRenderer<T>;
      parameters:
        - id: template
          description: The processed template string or array of strings
          type: 'T extends true ? string[] : string'
        - id: isArray
          description: Whether the template parameter is an array
          type: T
      return:
        type: <xref uid="gramstax!~ITTemplateRenderer:type" />&lt;T&gt;
        description: A function that accepts optional data and returns the rendered string or string array
  - name: _escape(str)
    uid: gramstax!TemplateEngine._escape:member(1)
    package: gramstax!
    fullName: _escape(str)
    summary: Escapes special characters in a string for safe use in template literals.
    remarks: >-
      This internal method escapes backslashes and backticks to prevent them from interfering with template literal
      syntax during compilation.
    example:
      - |-
        ```typescript
        const escaped = TemplateEngine._escape('Hello `world`');
        // Result: 'Hello \\`world\\`'
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static _escape(str: string): string;'
      parameters:
        - id: str
          description: The input string to escape
          type: string
      return:
        type: string
        description: The escaped string with backslashes and backticks properly escaped
  - name: _escapeData(value)
    uid: gramstax!TemplateEngine._escapeData:member(1)
    package: gramstax!
    fullName: _escapeData(value)
    summary: HTML-escapes a runtime value for safe interpolation into rich-HTML messages.
    remarks: >-
      Non-string values are stringified; `null`<!-- -->/`undefined` become empty string. Escaped code points: `&` →
      `&amp;`<!-- -->, `<` → `&lt;`<!-- -->, `>` → `&gt;`<!-- -->.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static _escapeData(value: unknown): string;'
      parameters:
        - id: value
          description: The runtime value to escape.
          type: unknown
      return:
        type: string
        description: The escaped string.
  - name: _extractBlock(content, blocks, AGBaseId, section, lang)
    uid: gramstax!TemplateEngine._extractBlock:member(1)
    package: gramstax!
    fullName: _extractBlock(content, blocks, AGBaseId, section, lang)
    summary: Extracts specific blocks from template content with optional filtering.
    remarks: >-
      This internal method extracts content from templates based on base ID, block type, language, and section mode. It
      supports scoped extraction with indentation normalization for clean output.
    example:
      - |-
        ```typescript
        const template = `
          <g-base id="main">
            <g-message>Hello</g-message>
            <g-keyboard>Yes, No</g-keyboard>
          </g-base>
        `;
        const result = TemplateEngine._extractBlock(template, 'message', 'main', 'value');
        // Result: 'Hello'
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        static _extractBlock(content: string, blocks?: string | string[], AGBaseId?: string, section?: `all` | `value`,
        lang?: string): string;
      parameters:
        - id: content
          description: The template content to extract from
          type: string
        - id: blocks
          description: Block type(s) to extract, or `"all"` for all blocks
          type: string | string[]
        - id: AGBaseId
          description: The base ID to extract from (defaults to `"default"`<!-- -->)
          type: string
        - id: section
          description: Whether to return the full block (`"all"`<!-- -->) or just inner content (`"value"`<!-- -->)
          type: '`all` | `value`'
        - id: lang
          description: Optional language filter for blocks
          type: string
      return:
        type: string
        description: The extracted content as a string
  - name: _extractBlockNames(blocks)
    uid: gramstax!TemplateEngine._extractBlockNames:member(1)
    package: gramstax!
    fullName: _extractBlockNames(blocks)
    summary: Extracts lowercase block tag names from an array of tag literals.
    remarks: >-
      Strips leading `</` or `<`<!-- -->, any trailing `>`<!-- -->, any attributes that follow a space, and lowercases
      the result. Self-closing tags like `<g-import/>` are normalised to their bare name. Entries with attributes after
      a space (e.g. `<blockquote expandable>`<!-- -->) are returned with the attribute suffix preserved.
    example:
      - |-
        ```typescript
        const names = TemplateEngine._extractBlockNames([
          "<g-base>",
          "<g-import/>",
          "<BLOCKQUOTE expandable>"
        ]);
        // => Set { "g-base", "g-import", "blockquote expandable" }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static _extractBlockNames(blocks: string[]): Set<string>;'
      parameters:
        - id: blocks
          description: Array of tag literals (e.g. `["<g-base>", "<message/>", "<blockquote expandable>"]`<!-- -->)
          type: string[]
      return:
        type: Set&lt;string&gt;
        description: Set of normalized lowercase block names
  - name: _processGBaseBlocks(template)
    uid: gramstax!TemplateEngine._processGBaseBlocks:member(1)
    package: gramstax!
    fullName: _processGBaseBlocks(template)
    summary: 'Block: g-base Extracts and parses `<g-base>` blocks from a template string.'
    remarks: >-
      This internal method identifies all `<g-base>` blocks in the template and extracts their content, organizing them
      by their `id` attribute. Blocks without an `id` are stored under the key `"default"`<!-- -->. Leading whitespace
      and surrounding newlines are trimmed from the inner content.


      \*\*Attributes:\*\* - `id` (optional): Identifier for the base block. If not specified, defaults to
      `"default"`<!-- -->. Used to reference specific base blocks when compiling templates or extracting content.
    example:
      - |-
        ```typescript
        const template = `
          <g-base id="main">
            <g-message>Hello World</g-message>
          </g-base>
          <g-base id="error">
            <g-message>Error occurred</g-message>
          </g-base>
          <g-base>
            <g-message>Default block</g-message>
          </g-base>
        `;
        const bases = TemplateEngine._processGBaseBlocks(template);
        // Result: {
        //   main: '<g-message>Hello World</g-message>',
        //   error: '<g-message>Error occurred</g-message>',
        //   default: '<g-message>Default block</g-message>'
        // }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        static _processGBaseBlocks(template: string): {
                [AGBaseId: string]: string;
            };
      parameters:
        - id: template
          description: The raw template string containing `<g-base>` blocks
          type: string
      return:
        type: |-
          {
                  [AGBaseId: string]: string;
              }
        description: An object mapping base IDs to their cleaned inner content
  - name: _processGDescriptionBlocks(template)
    uid: gramstax!TemplateEngine._processGDescriptionBlocks:member(1)
    package: gramstax!
    fullName: _processGDescriptionBlocks(template)
    summary: 'Block: g-description Extracts and parses `<g-description>` blocks from a template string.'
    remarks: >-
      This internal method identifies all `<g-description>` blocks and extracts their content organized by language and
      scope. Blocks without a `lang` attribute are stored under `"default"` language, and blocks without a `scope`
      attribute are stored under `"default"` scope.


      \*\*Attributes:\*\* - `lang` (optional): Language key for the output map. Defaults to `"default"`<!-- -->. -
      `scope` (optional): Scope key for the nested output map. Defaults to `"default"`<!-- -->.
    example:
      - |-
        ```typescript
        const template = `
          <g-description>Start the bot</g-description>
          <g-description lang="id">Mulai bot</g-description>
          <g-description scope="chat_administrators">Admin command</g-description>
        `;
        const descriptions = TemplateEngine._processGDescriptionBlocks(template);
        // Result: {
        //   default: { default: 'Start the bot', chat_administrators: 'Admin command' },
        //   id: { default: 'Mulai bot' }
        // }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        static _processGDescriptionBlocks(template: string): {
                [lang: string]: {
                    [scope: string]: string;
                };
            };
      parameters:
        - id: template
          description: The template string containing `<g-description>` blocks
          type: string
      return:
        type: |-
          {
                  [lang: string]: {
                      [scope: string]: string;
                  };
              }
        description: A nested object mapping language keys to scopes to their cleaned content
  - name: _processGDivBlocks(template)
    uid: gramstax!TemplateEngine._processGDivBlocks:member(1)
    package: gramstax!
    fullName: _processGDivBlocks(template)
    summary: 'Block: g-div Normalizes content within `<g-div>` blocks by removing indentation.'
    remarks: >-
      This internal method processes `<g-div>` blocks and cleans their inner content by removing leading tabs/spaces per
      line and trimming surrounding newlines. The `<g-div>` tags themselves are removed from the output.


      \*\*Attributes:\*\* - none
    example:
      - |-
        ```typescript
        const template = '<g-div>\n    Line 1\n    Line 2\n</g-div>';
        const processed = TemplateEngine._processGDivBlocks(template);
        // Result: 'Line 1\nLine 2'
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static _processGDivBlocks(template: string): string;'
      parameters:
        - id: template
          description: The template string containing `<g-div>` blocks
          type: string
      return:
        type: string
        description: The template with `<g-div>` blocks replaced by their de-indented content
  - name: _processGImportBlocks(template)
    uid: gramstax!TemplateEngine._processGImportBlocks:member(1)
    package: gramstax!
    fullName: _processGImportBlocks(template)
    summary: Parses `<g-import>` directives from a template and extracts import metadata.
    remarks: >-
      This internal method identifies all `<g-import>` tags in a template and replaces them with placeholders while
      collecting their metadata (src, blocks, base, lang, section, indent). The placeholders are later resolved by
      `processGImportBlocks`<!-- -->.


      \*\*Attributes:\*\* - `src` (required): Import source identifier (e.g., template/page key). If missing, the tag is
      removed (replaced with an empty string). - `block` (optional): Block selector. Supported forms: - `"all"`<!-- -->:
      import all supported blocks - `"block1"`<!-- -->: import a single block - `"block1,block2"` / `"block1,
      block2"`<!-- -->: import multiple blocks (comma-separated) - `base` (optional): Base id selector for the imported
      template. Defaults to `"default"`<!-- -->. - `lang` (optional): Language selector for the imported content (passed
      through as metadata). - `section` (optional): Import section selector. Supported values: - `"all"` (default):
      include block - `"value"`<!-- -->: only value
    example:
      - |-
        ```typescript
        const template = '<g-import src="other-page" block="message" />';
        const { processed, imports } = TemplateEngine._processGImportBlocks(template);
        // processed: '__IMPORT_0__'
