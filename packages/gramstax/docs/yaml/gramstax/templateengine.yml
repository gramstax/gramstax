  - name: validateFormatBlock(template)
    uid: gramstax!TemplateEngine.validateFormatBlock:member(1)
    package: gramstax!
    fullName: validateFormatBlock(template)
    summary: Validates block syntax format (self-closing vs regular open/close).
    remarks: >-
      This method checks that each block tag uses the correct syntax format:


      \*\*Must be self-closing:\*\* the set holds `space`<!-- -->, `import`<!-- -->, `hr`<!-- -->, `img`<!-- -->,
      `input`<!-- -->, `br` and `tg-map`<!-- -->. - `<hr/>`<!-- -->, `<img/>`<!-- -->, `<input/>`<!-- -->, `<br/>`<!--
      -->, `<tg-map/>` — Telegram Rich HTML void elements - `space` and `import` are listed, but the captured tag name
      is `g-space` / `g-import`<!-- -->, so that branch never matches those two. Write them self-closing by convention.


      \*\*Must NOT be self-closing (must use open/close tags):\*\* - `<g-base>...</g-base>`<!-- -->,
      `<g-message>...</g-message>`<!-- -->, `<g-keyboard>...</g-keyboard>`<!-- -->, `<g-media>...</g-media>`<!-- -->,
      `<g-poll>...</g-poll>`<!-- -->, `<g-question>...</g-question>`<!-- -->, `<g-option>...</g-option>`<!-- -->,
      `<g-invoice>...</g-invoice>`<!-- -->, `<g-paid-media>...</g-paid-media>`<!-- -->,
      `<g-description>...</g-description>`<!-- -->, `<g-script>...</g-script>`<!-- -->, `<g-switch>...</g-switch>`<!--
      -->, `<g-case>...</g-case>`<!-- -->, `<g-default>...</g-default>`<!-- -->, `<g-map>...</g-map>`<!-- -->,
      `<g-div>...</g-div>`<!-- -->, `<g-web-app-answer>...</g-web-app-answer>`


      Nine page blocks appear in neither set and accept either form: `<g-price>`<!-- -->, `<g-venue>`<!-- -->,
      `<g-dice>`<!-- -->, `<g-gift>`<!-- -->, `<g-callback-answer>`<!-- -->, `<g-precheckout-error>`<!-- -->,
      `<g-shipping-error>`<!-- -->, `<g-inline-button>`<!-- -->, `<g-answer-note>`<!-- -->.


      Telegram HTML formatting tags with content (e.g. `<b>`<!-- -->, `<p>`<!-- -->, `<table>`<!-- -->) passthrough and
      are not format-checked — both `<b>text</b>` and `<b/>` are accepted.
    example:
      - >-
        ```typescript

        const result = TemplateEngine.validateFormatBlock(`<hr>`);

        // Result: { valid: false, errors: [{ line: 1, message: 'Block <hr> must be self-closing: use <hr /> instead' }]
        }

        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        static validateFormatBlock(template: string): {
                valid: boolean;
                errors: Array<{
                    line: number;
                    message: string;
                }>;
            };
      parameters:
        - id: template
          description: The raw template string to validate
          type: string
      return:
        type: |-
          {
                  valid: boolean;
                  errors: Array&lt;{
                      line: number;
                      message: string;
                  }&gt;;
              }
        description: >-
          An object with a `valid` boolean and an `errors` array containing line numbers and descriptive messages for
          each format violation found
