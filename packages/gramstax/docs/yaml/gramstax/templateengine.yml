    fullName: _compileToFunction(template, isArray)
    summary: Compiles a processed template body into a callable renderer.
    remarks: >-
      Three mutually exclusive paths, in priority order: `__linkHook` resolves a pre-registered body (the AOT link
      phase, used by edge output with no `Function` constructor), `__emitHook` records the body and returns a stub (the
      AOT collect phase), otherwise the body is compiled through `new Function` — the exact JIT path taken when neither
      hook is set.


      The compiled renderer closes over `_escapeData` and `DEFAULT_FILTERS`<!-- -->, so callers pass only `data`<!--
      -->. `isArray` selects the return shape: `string[]` for media-group style templates, `string` otherwise.
