### YamlMime:TSType
name: TemplateEngine
uid: gramstax!TemplateEngine:class
package: gramstax!
fullName: TemplateEngine
summary: Static utility class for parsing and compiling HTML-like templates.
remarks: >-
  The `TemplateEngine` provides methods for parsing HTML-like template syntax with custom blocks (base, message,
  keyboard, media, description, etc.) and compiling them into executable functions. It supports variable interpolation,
  conditional rendering, array mapping, script execution, and template imports.


  Templates are typically organized into `<g-base>` blocks containing various content blocks like `<g-message>`<!-- -->,
  `<g-keyboard>`<!-- -->, `<g-media>`<!-- -->, and `<g-description>`<!-- -->. Each block supports a `lang` attribute for
  internationalization.
example:
  - |-
    ```typescript
    import { TemplateEngine } from 'gramstax';

    const template = `
      <g-base>
        <g-keyboard>Back, Next</g-keyboard>
        <g-message>Welcome {{name}}!</g-message>
      </g-base>
    `;

    const messages = TemplateEngine.compileBlockGMessages(template);
    const keyboards = TemplateEngine.compileBlockGKeyboards(template);

    const msg = messages.default?.default?.({ name: 'John' });
    // Result: {text: 'Welcome John!', rich: false}
    ```
isPreview: false
isDeprecated: false
type: class
properties:
  - name: __emitHook
    uid: gramstax!TemplateEngine.__emitHook:member
    package: gramstax!
    fullName: __emitHook
    summary: >-
      AOT collect hook: when set, `_compileToFunction` records the body and returns a tagged stub instead of calling
      `new Function`<!-- -->.
    remarks: >-
      Build tooling only (`AotEmitter` installs it around compilation and always uninstalls in `finally`<!-- -->).
      `undefined` (default) runs the exact JIT path — no behavior change.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        static __emitHook?: (body: string, meta: {
                isArray: boolean;
            }) => (...args: unknown[]) => unknown;
      return:
        type: |-
          (body: string, meta: {
                  isArray: boolean;
              }) =&gt; (...args: unknown[]) =&gt; unknown
  - name: __linkHook
    uid: gramstax!TemplateEngine.__linkHook:member
    package: gramstax!
    fullName: __linkHook
    summary: >-
      AOT link hook: when set, `_compileToFunction` returns the pre-registered inline function matching the body instead
      of calling `new Function`<!-- -->.
    remarks: >-
      Edge-runtime path (`AotEmitter` output): emitted modules pre-register every collected body, then rebuild wrapper
      blocks through the normal compilers with this hook resolving hits. A miss throws (template drift — regenerate).
      Never set together with `__emitHook`<!-- -->.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static __linkHook?: (body: string, isArray: boolean) => (...args: unknown[]) => unknown;'
      return:
        type: '(body: string, isArray: boolean) =&gt; (...args: unknown[]) =&gt; unknown'
