### YamlMime:TSType
name: TemplateEngine
uid: gramstax!TemplateEngine:class
package: gramstax!
fullName: TemplateEngine
summary: Static utility class for parsing and compiling HTML-like templates.
remarks: >-
  The `TemplateEngine` provides methods for parsing HTML-like template syntax with custom blocks (base, message,
  keyboard, media, description, etc.) and compiling them into executable functions. It supports variable interpolation,
  conditional rendering, array mapping, script execution, and template imports.


  Templates are typically organized into `<g-base>` blocks containing various content blocks like `<g-message>`<!-- -->,
  `<g-keyboard>`<!-- -->, `<g-media>`<!-- -->, and `<g-description>`<!-- -->. Each block supports a `lang` attribute for
  internationalization.
example:
  - |-
    ```typescript
    import { TemplateEngine } from 'gramstax';

    const template = `
      <g-base>
        <g-keyboard>Back, Next</g-keyboard>
        <g-message>Welcome {{name}}!</g-message>
      </g-base>
    `;

    const messages = TemplateEngine.compileBlockGMessages(template);
    const keyboards = TemplateEngine.compileBlockGKeyboards(template);

    const msg = messages.default?.default?.({ name: 'John' });
    // Result: 'Welcome John!'
    ```
isPreview: false
isDeprecated: false
type: class
properties:
  - name: _PAGE_ATTR_VALUE_VALIDATORS
    uid: gramstax!TemplateEngine._PAGE_ATTR_VALUE_VALIDATORS:member
    package: gramstax!
    fullName: _PAGE_ATTR_VALUE_VALIDATORS
    summary: Attribute value validators for `<g-*>` PAGE blocks.
    remarks: >-
      Per-tag, per-attribute map of validators. Each validator receives the raw attribute value (after quote-stripping)
      and returns either `null` (valid) or a descriptive error string. The value validation runs after the per-block
      attribute validation, so unknown attributes are reported separately by `validateBlockG*Attributes` methods.


      Currently covers: - `<g-base id>` — must not be empty - `<g-keyboard type>` — must be `inline` or `bottom` -
      `<g-media type>` — must be one of: photo, video, audio, document, animation, voice, video\_note, sticker,
      location, contact - `<g-media shared>` — must be `true` or `false`


      Validators are intentionally lenient — they catch obvious bugs (wrong type, invalid value) but do not enforce
      every framework-level constraint.
    example:
      - >-
        ```typescript

        TemplateEngine._PAGE_ATTR_VALUE_VALIDATORS["g-keyboard"].type("inline")   // => null

        TemplateEngine._PAGE_ATTR_VALUE_VALIDATORS["g-keyboard"].type("sidebar") // => "Attribute \"type\" on
        <g-keyboard> must be \"inline\" or \"bottom\", got \"sidebar\""

        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static _PAGE_ATTR_VALUE_VALIDATORS: Record<string, Record<string, (value: string) => string | null>>;'
      return:
        type: 'Record&lt;string, Record&lt;string, (value: string) =&gt; string | null&gt;&gt;'
  - name: _PAGE_REQUIRED_ATTRS
    uid: gramstax!TemplateEngine._PAGE_REQUIRED_ATTRS:member
    package: gramstax!
    fullName: _PAGE_REQUIRED_ATTRS
    summary: Required-attribute specification for `<g-*>` PAGE blocks.
    remarks: >-
      Most PAGE block attributes are optional — there are no strictly required attributes. This spec is reserved for
      future use (e.g. context-dependent requirements). The shape mirrors
      [TemplateEngine.\_TELEGRAM\_REQUIRED\_ATTRS](xref:gramstax!TemplateEngine._TELEGRAM_REQUIRED_ATTRS:member)<!--
      -->: - `string[]` — every entry must be present - `{ oneOf: string[][] }` — at least one of the listed sets must
      be fully present
    example:
      - |-
        ```typescript
        TemplateEngine._PAGE_REQUIRED_ATTRS  // => {} (no strictly required attrs yet)
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        static _PAGE_REQUIRED_ATTRS: Record<string, string[] | {
                oneOf: string[][];
            }>;
      return:
        type: |-
          Record&lt;string, string[] | {
                  oneOf: string[][];
              }&gt;
  - name: _TELEGRAM_ALLOWED_ATTRS
    uid: gramstax!TemplateEngine._TELEGRAM_ALLOWED_ATTRS:member
    package: gramstax!
    fullName: _TELEGRAM_ALLOWED_ATTRS
    summary: Per-tag allowlist of attribute names for Telegram Rich HTML tags.
    remarks: >-
      Single source of truth for the unknown-attribute validation pass
      ([TemplateEngine.\_validateTelegramTagUnknownAttributes()](xref:gramstax!TemplateEngine._validateTelegramTagUnknownAttributes:member(1))<!--
      -->). Built from the official Telegram Bot API 10.3 rich HTML style examples
      (core.telegram.org/bots/api\#rich-html-style) unioned with legacy parse\_mode HTML attributes still tolerated
      (blockquote expandable, cite attributes, li checkbox/checked). Tags with an empty array allow NO attributes — any
      attribute on them is an error.


      `{{placeholder}}` is only valid as an attribute VALUE, never as a name. Generic HTML attributes (style, id,
      data-\*) are not supported by the spec and are NOT whitelisted.
    example:
      - |-
        ```typescript
        TemplateEngine._TELEGRAM_ALLOWED_ATTRS["table"] // => ["bordered", "striped"]
        TemplateEngine._TELEGRAM_ALLOWED_ATTRS["b"]     // => [] (no attributes)
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static _TELEGRAM_ALLOWED_ATTRS: Record<string, readonly string[]>;'
      return:
        type: Record&lt;string, readonly string[]&gt;
  - name: _TELEGRAM_ATTR_VALUE_VALIDATORS
    uid: gramstax!TemplateEngine._TELEGRAM_ATTR_VALUE_VALIDATORS:member
    package: gramstax!
    fullName: _TELEGRAM_ATTR_VALUE_VALIDATORS
    summary: Attribute value validators for Telegram Rich HTML tags.
    remarks: >-
      Per-tag, per-attribute map of validators. Each validator receives the raw attribute value (after quote-stripping)
      and returns either `null` (valid) or a descriptive error string. The value validation runs after the
      required-attribute check, so missing attributes are reported separately by
      [TemplateEngine.\_TELEGRAM\_REQUIRED\_ATTRS](xref:gramstax!TemplateEngine._TELEGRAM_REQUIRED_ATTRS:member)<!--
      -->.


      Value rules follow the Telegram Bot API 10.3 Rich Message Formatting Options spec (see `BOT_API_VERSION`<!-- -->).
      `{{placeholder}}` values and boolean attributes (no `=value`<!-- -->) are skipped by the caller.
    example:
      - >-
        ```typescript

        TemplateEngine._TELEGRAM_ATTR_VALUE_VALIDATORS["tg-time"].unix("1647531900") // => null

        TemplateEngine._TELEGRAM_ATTR_VALUE_VALIDATORS["tg-time"].unix("abc")       // => "unix must be a positive
        integer (got \"abc\")"

        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static _TELEGRAM_ATTR_VALUE_VALIDATORS: Record<string, Record<string, (value: string) => string | null>>;'
      return:
        type: 'Record&lt;string, Record&lt;string, (value: string) =&gt; string | null&gt;&gt;'
  - name: _TELEGRAM_REQUIRED_ATTRS
    uid: gramstax!TemplateEngine._TELEGRAM_REQUIRED_ATTRS:member
    package: gramstax!
    fullName: _TELEGRAM_REQUIRED_ATTRS
    summary: Required-attribute specification for Telegram Rich HTML tags.
    remarks: >-
      Per-tag table mapping tag name to the attribute(s) it must have. Two shapes are supported: - `string[]` — every
      entry must be present - `{ oneOf: string[][] }` — at least one of the listed sets must be fully present (used for
      `<a>` which can be either a link or an anchor)


      Tags not listed here have no required attributes.
    example:
      - >-
        ```typescript

        TemplateEngine._TELEGRAM_REQUIRED_ATTRS["a"]       // => { oneOf: [["href"], ["name"]] }

        TemplateEngine._TELEGRAM_REQUIRED_ATTRS["tg-time"] // => ["unix"]  (format is optional, value-validated when
        present)

        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        static _TELEGRAM_REQUIRED_ATTRS: Record<string, string[] | {
                oneOf: string[][];
            }>;
      return:
        type: |-
          Record&lt;string, string[] | {
                  oneOf: string[][];
              }&gt;
