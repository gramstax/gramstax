    uid: gramstax!TemplateEngine._escapeStaticExceptInterpolation:member(1)
    package: gramstax!
    fullName: _escapeStaticExceptInterpolation(content)
    summary: Escapes static template text while preserving template syntax spans.
    remarks: >-
      Walks `content` char-by-char: `{{{...}}}`<!-- -->, `{{...}}`<!-- -->, and `{~...~}` spans pass through untouched
      (they are converted to generated code later). A balanced `${...}` span is preserved live only when its inner code
      passes [TemplateEngine.\_isGeneratedCode()](xref:gramstax!TemplateEngine._isGeneratedCode:member(1)) — i.e. it was
      produced by an inner block processor (nested `<g-map>` bodies carry `${(() => ...)}` / `${__esc(...)}` spans
      through outer escaping). Any other `${` sequence (untrusted/static text, unterminated spans) is neutralized via
      [TemplateEngine.\_escape()](xref:gramstax!TemplateEngine._escape:member(1))<!-- -->, consistent with top-level
      static text. Every other character goes through
      [TemplateEngine.\_escape()](xref:gramstax!TemplateEngine._escape:member(1))<!-- -->, neutralizing breakout
