  - name: validatePageAttributeValuesBlock(template)
    uid: gramstax!TemplateEngine.validatePageAttributeValuesBlock:member(1)
    package: gramstax!
    fullName: validatePageAttributeValuesBlock(template)
    summary: Validates that `<g-*>` PAGE block attribute values match their expected formats.
    remarks: >-
      Runs after `TemplateEngine.validateBlockG*Attributes` (which check allowed attrs) to catch format-level issues.
      Currently validates: - `<g-base id>` — must not be empty - `<g-keyboard type>` — must be `inline` or `bottom` -
      `<g-media type>` — must be one of: photo, video, audio, document, animation, voice, video\_note, sticker,
      location, contact - `<g-media shared>` — must be `true` or `false` - `<g-media filename>` — any string, always
      valid - `<g-poll type>` — must be `regular` or `quiz` - `<g-poll correct>` — must be a non-negative option index -
      `<g-poll explanation>` — any string, always valid - `<g-poll anonymous>` / `<g-poll multiple>` — must be `true` or
      `false` - `<g-venue title>` / `<g-venue address>` — any string, always valid - `<g-venue latitude>` — must be a
      number between -90 and 90; `{{}}` values skip the static check (runtime-enforced) - `<g-venue longitude>` — must
      be a number between -180 and 180; `{{}}` values skip the static check (runtime-enforced) - `<g-dice emoji>` — must
      be one of 🎲🎯🏀⚽🎳🎰; `{{}}` values skip the static check (runtime-enforced) - `<g-invoice currency>` — must be a
      3-letter code (`XTR` or fiat); `{{}}` values skip the static check (runtime-enforced) - `<g-price amount>` — must
      be a positive integer in smallest currency units - `<g-paid-media stars>` — must be a positive integer 1–25000;
      `{{}}` values skip the static check (runtime-enforced)


      Tags without value validators (e.g. `<g-message>`<!-- -->, `<g-script>`<!-- -->, `<g-div>`<!-- -->) are skipped.
      See
      [TemplateEngine.\_PAGE\_ATTR\_VALUE\_VALIDATORS](xref:gramstax!TemplateEngine._PAGE_ATTR_VALUE_VALIDATORS:member)
      for the full spec.
    example:
      - >-
        ```typescript

        const result = TemplateEngine.validatePageAttributeValuesBlock(`
          <g-base>
            <g-keyboard type="inline">A, B</g-keyboard>
          </g-base>
        `);

        // Result: { valid: true, errors: [] }


        const bad = TemplateEngine.validatePageAttributeValuesBlock(`
          <g-base>
            <g-keyboard type="sidebar">A, B</g-keyboard>
          </g-base>
        `);

        // Result: { valid: false, errors: [{ line: 3, message: 'Attribute "type" on <g-keyboard> must be "inline" or
        "bottom", got "sidebar"' }] }

        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        static validatePageAttributeValuesBlock(template: string): {
                valid: boolean;
                errors: Array<{
                    line: number;
                    message: string;
                }>;
            };
      parameters:
        - id: template
          description: The raw template string to validate
          type: string
      return:
        type: |-
          {
                  valid: boolean;
                  errors: Array&lt;{
                      line: number;
                      message: string;
                  }&gt;;
              }
        description: An object with a `valid` boolean and an `errors` array
  - name: validatePositionsBlock(template)
    uid: gramstax!TemplateEngine.validatePositionsBlock:member(1)
    package: gramstax!
    fullName: validatePositionsBlock(template)
    summary: Validates block positioning and nesting rules in a template string.
    remarks: >-
      This method checks a template string for structural block nesting violations. It ensures that blocks are placed in
      their allowed parent contexts.


      \*\*Nesting hierarchy:\*\*


      ```

      __root__
        ├── g-base             (root level only)
        │   ├── g-message      (content block)
        │   │   ├── g-switch   (logic block)
        │   │   │   ├── case
        │   │   │   └── default
        │   │   ├── g-map      (logic block)
        │   │   ├── g-script   (logic block)
        │   │   └── g-space    (utility)
        │   ├── g-keyboard     (content block)
        │   │   ├── g-switch   (logic block)
        │   │   │   ├── g-case
        │   │   │   └── g-default
        │   │   ├── g-map      (logic block)
        │   │   ├── g-script   (logic block)
        │   │   └── g-space    (utility)
        │   ├── g-media        (content block)
        │   │   ├── g-switch   (logic block)
        │   │   │   ├── g-case
        │   │   │   └── g-default
        │   │   ├── g-map      (logic block)
        │   │   ├── g-script   (logic block)
        │   │   └── g-space    (utility)
        │   ├── g-description  (content block)
        │   │   ├── g-switch   (logic block)
        │   │   │   ├── g-case
        │   │   │   └── g-default
        │   │   ├── g-map      (logic block)
        │   │   ├── g-script   (logic block)
        │   │   └── g-space    (utility)
        │   ├── g-import       (utility)
        │   ├── g-description  (utility)
        │   ├── g-script       (logic block)
        └   └── g-space        (utility)
      ```

      \*\*Enforced rules:\*\* - `<g-base>` must be at the outermost level and cannot be nested inside any other block. -
      `<g-message>`<!-- -->, `<g-keyboard>`<!-- -->, `<g-media>`<!-- -->, `<g-media-group>`<!-- -->, `<g-poll>`<!-- -->,
      `<g-invoice>`<!-- -->, `<g-paid-media>`<!-- -->, `<g-venue>`<!-- -->, `<g-dice>`<!-- -->, `<g-description>`<!--
      -->, `<g-import>`<!-- -->, `<g-script>`<!-- -->, `<g-space>` can only appear directly inside `<g-base>`<!-- -->. -
      `<g-media>` can also appear directly inside `<g-media-group>` as a group item, or inside `<g-paid-media>` as a
      paywall item. - `<g-question>` and `<g-option>` can only appear directly inside `<g-poll>`<!-- -->. - `<g-price>`
      can only appear directly inside `<g-invoice>`<!-- -->. - `<g-switch>`<!-- -->, `<g-map>` can only appear inside
      `<g-message>`<!-- -->, `<g-keyboard>`<!-- -->, `<g-media>`<!-- -->, or `<g-description>`<!-- -->. - `<g-case>` and
      `<g-default>` can only appear inside `<g-switch>`<!-- -->. - `<g-map>` is also allowed inside `<g-case>` and
      `<g-default>` (explicitly and via parent-child inheritance — see `inheritsContentFromParent`<!-- -->). - Telegram
      formatting tags (`<b>`<!-- -->, `<i>`<!-- -->, `<u>`<!-- -->, `<s>`<!-- -->, `<code>`<!-- -->, `<pre>`<!-- -->,
      `<a>`<!-- -->, `<blockquote>`<!-- -->, `<blockquote expandable>`<!-- -->) are passthrough and ignored during
      validation.
    example:
      - |-
        ```typescript
        // Valid template
        const result = TemplateEngine.validatePositionsBlock(`
          <g-base>
            <g-message>Hello {{name}}!</g-message>
            <g-keyboard>Yes, No</g-keyboard>
          </g-base>
        `);
        // Result: { valid: true, errors: [] }

        // Invalid: <g-base> nested inside <g-message>
        const bad = TemplateEngine.validatePositionsBlock(`
          <g-base>
            <g-message>
              <g-base>Nested base</g-base>
            </g-message>
          </g-base>
        `);
        // Result: { valid: false, errors: [{ line: 4, message: 'Block <g-base> is not allowed inside <g-message>' }] }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        static validatePositionsBlock(template: string): {
                valid: boolean;
                errors: Array<{
