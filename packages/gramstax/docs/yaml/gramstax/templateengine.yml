  - name: _isGeneratedCode(code)
    uid: gramstax!TemplateEngine._isGeneratedCode:member(1)
    package: gramstax!
    fullName: _isGeneratedCode(code)
    summary: Compiles a processed template string into an executable function.
    remarks: >-
      This internal method takes a pre-processed template (or array of templates) and compiles it into a JavaScript
      function that accepts a `data` object and returns the rendered result. The function is created using `new
      Function()`<!-- -->. Static segments are emitted via string concatenation (`JSON.stringify` literals joined with
      `+`<!-- -->), never wrapped in a raw backtick literal, so static backticks, backslashes, and `${` sequences cannot
      break out into code. Only `${...}` spans produced by the block/scope processors are evaluated.
    example:
      - |-
        ```typescript
