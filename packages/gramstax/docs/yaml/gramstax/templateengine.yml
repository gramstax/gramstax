    uid: gramstax!TemplateEngine.validateBlockGMessageRich:member(1)
    package: gramstax!
    fullName: validateBlockGMessageRich(html)
    summary: 'Validates all aspects of a template: block names, scopes, block format, block positioning, and base attributes.'
    remarks: >-
      This is a convenience method that runs all validators in order:


      1. [TemplateEngine.validateNamesBlock()](xref:gramstax!TemplateEngine.validateNamesBlock:member(1)) — checks that
      all tags are known 2. [TemplateEngine.validateScopes()](xref:gramstax!TemplateEngine.validateScopes:member(1)) —
      checks that all interpolation scopes are known 3.
      [TemplateEngine.validateFormatBlock()](xref:gramstax!TemplateEngine.validateFormatBlock:member(1)) — checks
      self-closing vs regular tag syntax 4.
      [TemplateEngine.validatePositionsBlock()](xref:gramstax!TemplateEngine.validatePositionsBlock:member(1)) — checks
      structural nesting rules 5.
      [TemplateEngine.validateTelegramAttributesBlock()](xref:gramstax!TemplateEngine.validateTelegramAttributesBlock:member(1))
      — checks required attributes on Telegram Rich HTML tags 6.
      [TemplateEngine.validateTelegramAttributeValuesBlock()](xref:gramstax!TemplateEngine.validateTelegramAttributeValuesBlock:member(1))
      — checks value formats on Telegram Rich HTML tag attributes 7.
      [TemplateEngine.validateTelegramUnknownAttributesBlock()](xref:gramstax!TemplateEngine.validateTelegramUnknownAttributesBlock:member(1))
      — rejects unknown attribute names on Telegram Rich HTML tags 8.
      [TemplateEngine.validateBlockGBaseAttributes()](xref:gramstax!TemplateEngine.validateBlockGBaseAttributes:member(1))
      — checks `<g-base>` block attributes 9.
      [TemplateEngine.validateBlockGMessageAttributes()](xref:gramstax!TemplateEngine.validateBlockGMessageAttributes:member(1))
      — checks `<g-message>` block attributes 10.
      [TemplateEngine.validateBlockGKeyboardAttributes()](xref:gramstax!TemplateEngine.validateBlockGKeyboardAttributes:member(1))
      — checks `<g-keyboard>` block attributes 11.
      [TemplateEngine.validateBlockGMediaAttributes()](xref:gramstax!TemplateEngine.validateBlockGMediaAttributes:member(1))
      — checks `<g-media>` block attributes 12.
      [TemplateEngine.validateBlockGMediaGroupAttributes()](xref:gramstax!TemplateEngine.validateBlockGMediaGroupAttributes:member(1))
      — checks `<g-media-group>` block attributes 13.
      [TemplateEngine.validateBlockGPollAttributes()](xref:gramstax!TemplateEngine.validateBlockGPollAttributes:member(1))
      — checks `<g-poll>` block attributes 14.
      [TemplateEngine.validateBlockGDescriptionAttributes()](xref:gramstax!TemplateEngine.validateBlockGDescriptionAttributes:member(1))
      — checks `<g-description>` block attributes 15.
      [TemplateEngine.validateBlockGScriptAttributes()](xref:gramstax!TemplateEngine.validateBlockGScriptAttributes:member(1))
      — checks `<g-script>` block attributes 16.
      [TemplateEngine.validateBlockGSwitchAttributes()](xref:gramstax!TemplateEngine.validateBlockGSwitchAttributes:member(1))
      — checks `<g-switch>` block attributes 17.
      [TemplateEngine.validateBlockGCaseAttributes()](xref:gramstax!TemplateEngine.validateBlockGCaseAttributes:member(1))
      — checks `<g-case>` block attributes 18.
      [TemplateEngine.validateBlockGDefaultAttributes()](xref:gramstax!TemplateEngine.validateBlockGDefaultAttributes:member(1))
      — checks `<g-default>` block attributes 19.
      [TemplateEngine.validateBlockGMapAttributes()](xref:gramstax!TemplateEngine.validateBlockGMapAttributes:member(1))
      — checks `<g-map>` block attributes 20.
      [TemplateEngine.validateBlockGDivAttributes()](xref:gramstax!TemplateEngine.validateBlockGDivAttributes:member(1))
      — checks `<g-div>` block attributes 21.
      [TemplateEngine.validateBlockGImportAttributes()](xref:gramstax!TemplateEngine.validateBlockGImportAttributes:member(1))
      — checks `<g-import>` block attributes 22.
      [TemplateEngine.validateBlockGSpaceAttributes()](xref:gramstax!TemplateEngine.validateBlockGSpaceAttributes:member(1))
      — checks `<g-space>` block attributes 23.
      [TemplateEngine.validateBlockGVenueAttributes()](xref:gramstax!TemplateEngine.validateBlockGVenueAttributes:member(1))
      — checks `<g-venue>` block attributes 24.
      [TemplateEngine.validateBlockGDiceAttributes()](xref:gramstax!TemplateEngine.validateBlockGDiceAttributes:member(1))
      — checks `<g-dice>` block attributes 25.
      [TemplateEngine.validateBlockGCallbackAnswerAttributes()](xref:gramstax!TemplateEngine.validateBlockGCallbackAnswerAttributes:member(1))
      — checks `<g-callback-answer>` block attributes and plain-text content 26.
      [TemplateEngine.validateBlockGPrecheckoutErrorAttributes()](xref:gramstax!TemplateEngine.validateBlockGPrecheckoutErrorAttributes:member(1))
      — checks `<g-precheckout-error>` block attributes and plain-text content 27.
      [TemplateEngine.validateBlockGShippingErrorAttributes()](xref:gramstax!TemplateEngine.validateBlockGShippingErrorAttributes:member(1))
      — checks `<g-shipping-error>` block attributes and plain-text content 28.
      [TemplateEngine.validateBlockGInlineButtonAttributes()](xref:gramstax!TemplateEngine.validateBlockGInlineButtonAttributes:member(1))
      — checks `<g-inline-button>` block attributes, required text, and start-parameter format 29.
      [TemplateEngine.validateBlockGAnswerNoteAttributes()](xref:gramstax!TemplateEngine.validateBlockGAnswerNoteAttributes:member(1))
      — checks `<g-answer-note>` block attributes and plain-text content 30.
      [TemplateEngine.validateBlockGWebAppAnswerAttributes()](xref:gramstax!TemplateEngine.validateBlockGWebAppAnswerAttributes:member(1))
      — checks `<g-web-app-answer>` block attributes and plain-text content 31.
      [TemplateEngine.validateBlockGGiftAttributes()](xref:gramstax!TemplateEngine.validateBlockGGiftAttributes:member(1))
      — checks `<g-gift>` block attributes (HTML content is legal) 32.
      [TemplateEngine.validatePageAttributesBlock()](xref:gramstax!TemplateEngine.validatePageAttributesBlock:member(1))
      — checks required attributes on `<g-*>` PAGE blocks (centralized) 33.
      [TemplateEngine.validatePageAttributeValuesBlock()](xref:gramstax!TemplateEngine.validatePageAttributeValuesBlock:member(1))
      — checks value formats on `<g-*>` PAGE block attributes (centralized)


      Errors from all validators are combined into a single result.
    example:
      - |-
        ```typescript
        const result = TemplateEngine.validateTemplate(`
          <g-base>
            <g-message>Hello {{name}}!</g-message>
          </g-base>
        `);
        // Result: { valid: true, errors: [] }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        static validateBlockGMessageRich(html: string): {
                valid: boolean;
                errors: Array<{
                    line: number;
                    message: string;
