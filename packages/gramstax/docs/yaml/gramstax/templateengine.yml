  - name: validatePositionsBlock(template)
    uid: gramstax!TemplateEngine.validatePositionsBlock:member(1)
    package: gramstax!
    fullName: validatePositionsBlock(template)
    summary: Validates block positioning and nesting rules in a template string.
    remarks: >-
      This method checks a template string for structural block nesting violations. It ensures that blocks are placed in
      their allowed parent contexts.


      \*\*Nesting hierarchy:\*\*


      ```

      __root__
        ├── base             (root level only)
        │   ├── message      (content block)
        │   │   ├── switch   (logic block)
        │   │   │   ├── case
        │   │   │   └── default
        │   │   ├── map      (logic block)
        │   │   ├── script   (logic block)
        │   │   └── space    (utility)
        │   ├── keyboard     (content block)
        │   │   ├── switch   (logic block)
        │   │   │   ├── case
        │   │   │   └── default
        │   │   ├── map      (logic block)
        │   │   ├── script   (logic block)
        │   │   └── space    (utility)
        │   ├── media        (content block)
        │   │   ├── switch   (logic block)
        │   │   │   ├── case
        │   │   │   └── default
        │   │   ├── map      (logic block)
        │   │   ├── script   (logic block)
        │   │   └── space    (utility)
        │   ├── description  (content block)
        │   │   ├── switch   (logic block)
        │   │   │   ├── case
        │   │   │   └── default
        │   │   ├── map      (logic block)
        │   │   ├── script   (logic block)
        │   │   └── space    (utility)
        │   ├── import       (utility)
        │   ├── description  (utility)
        │   ├── script       (logic block)
        └   └── space        (utility)
      ```

      \*\*Enforced rules:\*\* - `<base>` must be at the outermost level and cannot be nested inside any other block. -
      `<message>`<!-- -->, `<keyboard>`<!-- -->, `<media>`<!-- -->, `<description>`<!-- -->, `<import>`<!-- -->,
      `<script>`<!-- -->, `<space>` can only appear directly inside `<base>`<!-- -->. - `<switch>`<!-- -->, `<map>` can
      only appear inside `<message>`<!-- -->, `<keyboard>`<!-- -->, `<media>`<!-- -->, or `<description>`<!-- -->. -
      `<case>` and `<default>` can only appear inside `<switch>`<!-- -->. - Telegram formatting tags (`<b>`<!-- -->,
      `<i>`<!-- -->, `<u>`<!-- -->, `<s>`<!-- -->, `<code>`<!-- -->, `<pre>`<!-- -->, `<a>`<!-- -->, `<blockquote>`<!--
      -->, `<blockquote expandable>`<!-- -->) are passthrough and ignored during validation.
    example:
      - |-
        ```typescript
        // Valid template
        const result = TemplateEngine.validatePositionsBlock(`
          <base>
            <message>Hello {{name}}!</message>
            <keyboard>Yes, No</keyboard>
          </base>
        `);
        // Result: { valid: true, errors: [] }

        // Invalid: <base> nested inside <message>
        const bad = TemplateEngine.validatePositionsBlock(`
          <base>
            <message>
              <base>Nested base</base>
            </message>
          </base>
        `);
        // Result: { valid: false, errors: [{ line: 4, message: 'Block <base> is not allowed inside <message>' }] }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        static validatePositionsBlock(template: string): {
                valid: boolean;
                errors: Array<{
                    line: number;
                    message: string;
                }>;
            };
      parameters:
        - id: template
          description: The raw template string to validate
          type: string
      return:
        type: |-
          {
                  valid: boolean;
                  errors: Array&lt;{
                      line: number;
                      message: string;
                  }&gt;;
              }
        description: >-
          An object with a `valid` boolean and an `errors` array containing line numbers and descriptive messages for
          each violation found
  - name: validateScopes(template)
    uid: gramstax!TemplateEngine.validateScopes:member(1)
    package: gramstax!
    fullName: validateScopes(template)
    summary: Validates that all interpolation scope syntaxes in a template are recognized.
    remarks: >-
      Every interpolation scope delimited by `{X...X}` (where X is a non-word character) must match a known scope name
      from [TemplateEngine.ALLOWED\_SCOPE](xref:gramstax!TemplateEngine.ALLOWED_SCOPE:member)<!-- -->.


      For example, `{{variable}}` uses scope `{{}}` and `{~ expr ~}` uses `{~~}`<!-- -->. Any other delimiter like `{#
      comment #}` would be reported as unsupported.
    example:
      - |-
        ```typescript
        const result = TemplateEngine.validateScopes(`{# comment #}`);
        // Result: { valid: false, errors: [{ line: 1, message: 'Unsupported template scope: {# #}' }] }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        static validateScopes(template: string): {
                valid: boolean;
                errors: Array<{
                    line: number;
                    message: string;
                }>;
            };
      parameters:
        - id: template
          description: The raw template string to validate
          type: string
      return:
        type: |-
          {
                  valid: boolean;
                  errors: Array&lt;{
                      line: number;
                      message: string;
                  }&gt;;
              }
        description: >-
          An object with a `valid` boolean and an `errors` array containing line numbers and descriptive messages for
          each unsupported scope found
  - name: validateTemplate(template)
    uid: gramstax!TemplateEngine.validateTemplate:member(1)
    package: gramstax!
    fullName: validateTemplate(template)
    summary: 'Validates all aspects of a template: block names, scopes, block format, block positioning, and base attributes.'
    remarks: >-
      This is a convenience method that runs all validators in order:


      1. [TemplateEngine.validateNamesBlock()](xref:gramstax!TemplateEngine.validateNamesBlock:member(1)) — checks that
      all tags are known 2. [TemplateEngine.validateScopes()](xref:gramstax!TemplateEngine.validateScopes:member(1)) —
      checks that all interpolation scopes are known 3.
      [TemplateEngine.validateFormatBlock()](xref:gramstax!TemplateEngine.validateFormatBlock:member(1)) — checks
      self-closing vs regular tag syntax 4.
      [TemplateEngine.validatePositionsBlock()](xref:gramstax!TemplateEngine.validatePositionsBlock:member(1)) — checks
      structural nesting rules 5.
      [TemplateEngine.validateBlockBaseAttributes()](xref:gramstax!TemplateEngine.validateBlockBaseAttributes:member(1))
      — checks `<base>` block attributes 6.
      [TemplateEngine.validateBlockMessageAttributes()](xref:gramstax!TemplateEngine.validateBlockMessageAttributes:member(1))
      — checks `<message>` block attributes 7.
      [TemplateEngine.validateBlockKeyboardAttributes()](xref:gramstax!TemplateEngine.validateBlockKeyboardAttributes:member(1))
      — checks `<keyboard>` block attributes 8.
      [TemplateEngine.validateBlockMediaAttributes()](xref:gramstax!TemplateEngine.validateBlockMediaAttributes:member(1))
      — checks `<media>` block attributes 9.
      [TemplateEngine.validateBlockDescriptionAttributes()](xref:gramstax!TemplateEngine.validateBlockDescriptionAttributes:member(1))
      — checks `<description>` block attributes 10.
      [TemplateEngine.validateBlockScriptAttributes()](xref:gramstax!TemplateEngine.validateBlockScriptAttributes:member(1))
      — checks `<script>` block attributes 11.
      [TemplateEngine.validateBlockSwitchAttributes()](xref:gramstax!TemplateEngine.validateBlockSwitchAttributes:member(1))
      — checks `<switch>` block attributes 12.
      [TemplateEngine.validateBlockCaseAttributes()](xref:gramstax!TemplateEngine.validateBlockCaseAttributes:member(1))
      — checks `<case>` block attributes 13.
      [TemplateEngine.validateBlockDefaultAttributes()](xref:gramstax!TemplateEngine.validateBlockDefaultAttributes:member(1))
      — checks `<default>` block attributes 14.
      [TemplateEngine.validateBlockMapAttributes()](xref:gramstax!TemplateEngine.validateBlockMapAttributes:member(1)) —
      checks `<map>` block attributes 15.
      [TemplateEngine.validateBlockDivAttributes()](xref:gramstax!TemplateEngine.validateBlockDivAttributes:member(1)) —
      checks `<div>` block attributes 16.
      [TemplateEngine.validateBlockImportAttributes()](xref:gramstax!TemplateEngine.validateBlockImportAttributes:member(1))
      — checks `<import>` block attributes 17.
      [TemplateEngine.validateBlockSpaceAttributes()](xref:gramstax!TemplateEngine.validateBlockSpaceAttributes:member(1))
      — checks `<space>` block attributes


      Errors from all validators are combined into a single result.
    example:
      - |-
        ```typescript
        const result = TemplateEngine.validateTemplate(`
          <base>
            <message>Hello {{name}}!</message>
          </base>
        `);
        // Result: { valid: true, errors: [] }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        static validateTemplate(template: string): {
                valid: boolean;
                errors: Array<{
                    line: number;
                    message: string;
                }>;
            };
      parameters:
        - id: template
          description: The raw template string to validate
          type: string
      return:
        type: |-
          {
                  valid: boolean;
                  errors: Array&lt;{
                      line: number;
                      message: string;
                  }&gt;;
              }
        description: >-
          An object with a `valid` boolean and a combined `errors` array containing line numbers and descriptive
          messages for every violation found
