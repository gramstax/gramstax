  - name: processGImportBlocks(template, resolver, depth, importCache)
    uid: gramstax!TemplateEngine.processGImportBlocks:member(1)
    package: gramstax!
    fullName: processGImportBlocks(template, resolver, depth, importCache)
    summary: Recursively processes and resolves `<g-import>` blocks in a template.
    remarks: >-
      This method resolves all `<g-import>` placeholders produced by `_processGImportBlocks` by invoking a user-provided
      `resolver` function.


      Resolution behavior: - Each `<g-import>` is resolved by calling `resolver(src)` to obtain raw template content. -
      The resolved content is filtered using `_extractBlock` based on the import metadata (`blocks`<!-- -->, `base`<!--
      -->, `section`<!-- -->, `lang`<!-- -->). - If the resolved content itself contains `<g-import>` directives, they
      are processed recursively.


      Recursion and safety: - Recursive import resolution is limited to a maximum depth of \*\*10\*\* to prevent
      infinite import loops. - If the depth limit is exceeded, an empty string is returned.


      Output behavior: - `<g-import>` placeholders (`__IMPORT_N__`<!-- -->) are replaced sequentially. - If the resolver
      returns `null` or an empty result, the import is replaced with an empty string.
    example:
      - |-
        ```typescript
        const template = '<g-import src="header" block="message" />\n<g-message>Main content</g-message>';
        const resolver = (src: string) => {
          if (src === 'header') return '<g-message>Header text</g-message>';
          return null;
        };
        const result = TemplateEngine.processGImportBlocks(template, resolver);
        // Result: '<g-message>Header text</g-message>\n<g-message>Main content</g-message>'
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        static processGImportBlocks(template: string, resolver: (src: string) => string | null, depth?: number,
        importCache?: Map<string, string>): string;
      parameters:
        - id: template
          description: Template string containing `<g-import>` directives
          type: string
        - id: resolver
          description: Function that resolves import sources to template content
          type: '(src: string) =&gt; string | null'
        - id: depth
          description: Current recursion depth (defaults to 0)
          type: number
        - id: importCache
          description: Optional Map to cache resolved imports for reuse
          type: Map&lt;string, string&gt;
      return:
        type: string
        description: Template with all `<g-import>` blocks resolved and replaced
