  - name: validateBlockGIfElseBody(template)
    uid: gramstax!TemplateEngine.validateBlockGIfElseBody:member(1)
    package: gramstax!
    fullName: validateBlockGIfElseBody(template)
    summary: Validates the body of every `<g-ifelse>` block.
    remarks: >-
      Four rules, all required to keep the block a conditional and unambiguous:


      1. The body must not be empty. 2. `{{}}` and `{~~}` interpolation must not appear — the body is already
      JavaScript, and nesting the interpolation syntaxes inside it would give one construct two grammars. 3. Template
      literals must not interpolate `${...}` — that is a third spelling of the same interpolation. Use string
      concatenation inside the conditional instead. 4. The body must actually branch: a ternary, or a `&&` / `||` / `??`
      short-circuit. A plain expression such as `items.length` belongs in `{~~}` and is rejected here so `<g-ifelse>`
      cannot silently become a second `{~~}`<!-- -->.
    example:
      - >-
        ```typescript

        TemplateEngine.validateBlockGIfElseBody(`<g-ifelse>items.length</g-ifelse>`);

        // Result: { valid: false, errors: [{ line: 1, message: '<g-ifelse> body must be a conditional expression — use
        a ternary (test ? a : b) or a short-circuit (&&, ||, ??), got "items.length". Use {~~ items.length ~~} for a
        plain expression' }] }

        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        static validateBlockGIfElseBody(template: string): {
                valid: boolean;
                errors: Array<{
                    line: number;
                    message: string;
                }>;
            };
      parameters:
        - id: template
          description: The raw template string to validate
          type: string
      return:
        type: |-
          {
                  valid: boolean;
                  errors: Array&lt;{
                      line: number;
                      message: string;
                  }&gt;;
              }
        description: An object with a `valid` boolean and an `errors` array
