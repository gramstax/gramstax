      content: 'static _processScopeExec(template: string): string;'
      parameters:
        - id: template
          description: The template string containing `{~ code ~}` expressions
          type: string
      return:
        type: string
        description: The template with inline execution blocks converted to executable expressions
  - name: _processScopeVariables(template)
    uid: gramstax!TemplateEngine._processScopeVariables:member(1)
    package: gramstax!
    fullName: _processScopeVariables(template)
    summary: 'Scope: `{{}}` Converts `{{variable}}` placeholders to JavaScript template literal expressions.'
    remarks: >-
      This internal method transforms Mustache-like variable syntax into JavaScript template literal interpolation.
      `{{key}}` is HTML-escaped at runtime; `{{{key}}}` is inserted raw. Variables are accessed from the `data` object,
      with nullish coalescing to empty string when undefined. Surrounding whitespace inside the braces is trimmed. Each
      filter segment splits its name on the first `:` only; the remainder is passed as one combined argument (so
      `date:HH:mm:ss` stays whole; `plural` splits its combined `one:many` argument itself). Filter arguments are
      embedded via `JSON.stringify`<!-- -->, never raw backticks. Unknown filter warnings are deduplicated per compile
      call; other expressions in the same template still render (unknown one renders empty).
    example:
      - |-
        ```typescript
        const processed = TemplateEngine._processScopeVariables('Hello {{name}}!');
        // Result: 'Hello ${__esc((data && data["name"]) ?? "")}!'
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static _processScopeVariables(template: string): string;'
      parameters:
        - id: template
          description: The template string containing `{{variable}}` placeholders
          type: string
      return:
        type: string
        description: The processed template with placeholders converted to `${data["key"]}` syntax
