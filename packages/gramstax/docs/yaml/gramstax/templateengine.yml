  - name: validateFormatBlock(template)
    uid: gramstax!TemplateEngine.validateFormatBlock:member(1)
    package: gramstax!
    fullName: validateFormatBlock(template)
    summary: Validates block syntax format (self-closing vs regular open/close).
    remarks: >-
      This method checks that each block tag uses the correct syntax format:


      \*\*Must be self-closing:\*\* - `<space />` — whitespace control block - `<import ... />` — import directive block


      \*\*Must NOT be self-closing (must use open/close tags):\*\* - `<base>...</base>`<!-- -->,
      `<message>...</message>`<!-- -->, `<keyboard>...</keyboard>`<!-- -->, `<media>...</media>`<!-- -->,
      `<description>...</description>`<!-- -->, `<script>...</script>`<!-- -->, `<switch>...</switch>`<!-- -->,
      `<case>...</case>`<!-- -->, `<default>...</default>`<!-- -->, `<map>...</map>`<!-- -->, `<div>...</div>`


      Telegram HTML formatting tags passthrough and are ignored.
    example:
      - >-
        ```typescript

        const result = TemplateEngine.validateFormatBlock(`<space>content</space>`);

        // Result: { valid: false, errors: [{ line: 1, message: 'Block <space> must be self-closing: use <space />
        instead' }] }

        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        static validateFormatBlock(template: string): {
                valid: boolean;
                errors: Array<{
                    line: number;
                    message: string;
                }>;
            };
      parameters:
        - id: template
          description: The raw template string to validate
          type: string
      return:
        type: |-
          {
                  valid: boolean;
                  errors: Array&lt;{
                      line: number;
                      message: string;
                  }&gt;;
              }
        description: >-
          An object with a `valid` boolean and an `errors` array containing line numbers and descriptive messages for
          each format violation found
  - name: validateNamesBlock(template)
