  - name: _processSwitchBlocks(template)
    uid: gramstax!TemplateEngine._processSwitchBlocks:member(1)
    package: gramstax!
    fullName: _processSwitchBlocks(template)
    summary: 'Block: switch Transforms `<switch>` blocks into JavaScript switch statement expressions.'
    remarks: >-
      This internal method converts `<switch>` blocks with `<case>` and `<default>` sub-blocks into self-invoking
      JavaScript switch expressions. The `value` attribute specifies which data key to switch on. Case values can be
      comma-separated for multiple matches.


      \*\*Attributes:\*\* - <switch> - `value` (required): The key name in the `data` object whose value will be used as
      the switch expression. - <case> - `is` (required): One or more literal match values. Multiple values may be
      provided as a comma-separated list. - <default> - none
    example:
      - |-
        ```typescript
        const template = `
          <switch value="status">
            <case is="active">Active status</case>
            <case is="pending">Pending status</case>
            <default>Unknown status</default>
          </switch>
        `;
        const processed = TemplateEngine._processSwitchBlocks(template);
        // Result: '${(() => { switch((data && data["status"])) { case "active": return `Active status`; ... } })()}'
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static _processSwitchBlocks(template: string): string;'
      parameters:
        - id: template
          description: The template string containing `<switch>` blocks
          type: string
      return:
        type: string
        description: The template with `<switch>` blocks converted to executable switch expressions
  - name: compileBlockDescription(template, baseBlocks)
    uid: gramstax!TemplateEngine.compileBlockDescription:member(1)
    package: gramstax!
    fullName: compileBlockDescription(template, baseBlocks)
    summary: Compiles description blocks from a template into executable functions.
    remarks: >-
      This method parses `<description>` blocks from the template and compiles them into functions that generate
      rendered description strings. The result is organized by base ID, scope, and language. Used for Telegram bot
      command descriptions.


      Processing pipeline (in order, per description): 1. `_processScriptBlocks` – converts `<script>` blocks into
      executable expressions 2. `_processMapBlocks` – converts `<map>` blocks into array map expressions 3.
      `_processSwitchBlocks` – converts `<switch>` blocks into switch expressions 4. `_processScopeExec` – evaluates
      scope execution blocks (implementation-defined) 5. `_processScopeVariables` – resolves scope variables
      (implementation-defined) 6. `_compileToFunction(processed, false)` – produces the final render function


      Output shape: - First level key: `baseId` (from `<base id="...">`<!-- -->, or `"default"` if omitted) - Second
      level key: `scope` (from `<description scope="...">`<!-- -->, or `"default"` if omitted) - Third level key: `lang`
      (from `<description lang="...">`<!-- -->, or `"default"` if omitted) - Value: `(data?: Record<string, any>) =>
      string`
    example:
      - |-
        ```typescript
        const template = `
          <base>
            <description>Start the bot</description>
            <description scope="chat_administrators">Admin command</description>
          </base>
        `;
