### YamlMime:TSTypeAlias
name: IRouteMediaAuto
uid: gramstax!IRouteMediaAuto:type
package: gramstax!
fullName: IRouteMediaAuto
summary: 'Media route atom: runtime-decided single media message.'
remarks: >-
  `auto` edits when the update carries a `callbackQuery`<!-- -->, otherwise sends; `edit` always edits. Both reach the
  same kind-specific calls, so they share one member — narrowing `keyboard` per mode is not possible here anyway,
  because the delete-and-resend path is a send.
example: []
isPreview: false
isDeprecated: false
syntax: >-
  type IRouteMediaAuto<T extends IMediaKind> = INeverFields<`options` | `editOptions` | `rich` | `richOptions` |
  `captionOptions`> & {
      mode?: `auto` | `edit`;
      keyboard?: IInBoKb | null;
      media?: IMediaEditOpt1<T> | null;
      mediaOptions?: IOptEditMedia2 | null;
      resendOptions?: IMediaReplyOpt<T> | null;
      fallback?: IOptFallbackEdit;
      fallbackOptions?: IMediaReplyOpt<T> | null;
      broadcast?: null | undefined;
      chunkSize?: null | undefined;
  };
