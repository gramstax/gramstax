### YamlMime:TSTypeAlias
name: IRenderMediaKindParams
uid: gramstax!IRenderMediaKindParams:type
package: gramstax!
fullName: IRenderMediaKindParams
summary: >-
  `IRenderMediaParams` for one media kind — the per-kind wrappers (`renderPhoto`<!-- -->, `renderVideo`<!-- -->, …)
  accept this shape and supply `type`<!-- -->.
remarks: >-
  The broadcast-SEND route (R3) is deliberately EXCLUDED. On that loop `renderMedia` never forwards `params.type` to
  `_broadcastSendMedia` — the kind is read from the `<g-media>` block — so a wrapper whose whole purpose is to fix the
  kind would fix nothing: `renderPhoto({broadcast: {ids}})` would send whatever the block holds while the method name
  said photo. That route is rejected at the type level; use `renderMedia` for it.


  The broadcast-REVISE route (R4) IS kept, because that loop forwards `type` and therefore honours the wrapper's fixed
  kind. `Omit` is applied per union member — applied to the union it would collapse the routes together.
example: []
isPreview: false
isDeprecated: false
syntax: >-
  type IRenderMediaKindParams<T extends IMediaKind> = Omit<IMediaR1<T>, `type`> | Omit<IMediaR2<T>, `type`> |
  Omit<IMediaR4<T>, `type`>;
