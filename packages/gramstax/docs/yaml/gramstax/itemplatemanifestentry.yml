### YamlMime:TSTypeAlias
name: ITemplateManifestEntry
uid: gramstax!ITemplateManifestEntry:type
package: gramstax!
fullName: ITemplateManifestEntry
summary: One embedded `.html` template entry of a static app manifest.
remarks: >-
  Collected by `collectHtmlTemplates` — only `.html` files are embedded; class-inline `static template` strings ride the
  page classes instead. Consumed by `_pageLoadsFromManifest` via `templateManager.compile(key, template)`<!-- -->.
example: []
isPreview: false
