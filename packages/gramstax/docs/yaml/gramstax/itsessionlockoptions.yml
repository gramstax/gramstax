### YamlMime:TSTypeAlias
name: ITSessionLockOptions
uid: gramstax!ITSessionLockOptions:type
package: gramstax!
fullName: ITSessionLockOptions
summary: Configuration for the distributed session lock.
remarks: >-
  Redis-only: the lock uses atomic `SET NX PX` leases on the session key so concurrent updates for the same user/chat
  are serialized or skipped across instances. When the bot's cache is NOT Redis-backed, the feature is auto-disabled
  with a warning (single-instance deployments do not need it).
example: []
isPreview: false
isDeprecated: false
syntax: |-
  type ITSessionLockOptions = {
      enabled?: boolean;
      leaseMs?: number;
      onContended?: ITSessionLockOnContended;
      key?: (ctx: Ctx) => string;
  };
