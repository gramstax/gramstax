### YamlMime:TSTypeAlias
name: ITPageData
uid: gramstax!ITPageData:type
package: gramstax!
fullName: ITPageData
summary: Page routing data configuration.
remarks: >-
  Full page data with typed `callbackQueryData` according to the args configured via `buildData`<!-- -->. Every page
  SHOULD define `static data` via `buildData(...)` to enable callback query routing.


  - `buildData()` (no args) → `callbackQueryData(): string` — 0 args only - `buildData((a: string, b: string) => ...)` →
  `callbackQueryData(a, b): string` - `buildData((a?: string) => ...)` → `callbackQueryData(a?): string`
example: []
isPreview: false
isDeprecated: false
syntax: |-
  type ITPageData<T extends Array<string | undefined> = string[]> = ITPageDataBase & {
      callbackQueryData(...args: T): string;
  };
