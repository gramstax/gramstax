name: IMockTelegramHandler
uid: gramstax!IMockTelegramHandler:type
package: gramstax!
fullName: IMockTelegramHandler
summary: Handler signature for mock Telegram methods.
remarks: >-
  Return a Bot API-like JSON object. `method` is the Telegram method name extracted from the URL path (e.g. `getMe`<!--
  -->, `setWebhook`<!-- -->).
example:
  - |-
    ```typescript
    const handler: IMockTelegramHandler = ({method}) => ({ok: true, result: {method}})
    ```
isPreview: false
isDeprecated: false
syntax: |-
  type IMockTelegramHandler = (payload: {
      method: string;
      request: Request;
  }) => Promise<IMockTelegramJson> | IMockTelegramJson;
