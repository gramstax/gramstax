### YamlMime:TSTypeAlias
name: IGramstaxPollingDeployOptions
uid: gramstax!IGramstaxPollingDeployOptions:type
package: gramstax!
fullName: IGramstaxPollingDeployOptions
summary: Polling deploy branch of `optionsDeploy`<!-- -->.
remarks: >-
  Only meaningful when `deploy` is `polling`<!-- -->. Carries the retry budget that used to live at the root
  `pollingMaxRetries` field, plus the optional `queue` sink that turns the sequential `getUpdates` loop into a bounded
  worker pool. Omitting `queue` leaves polling exactly as it was: sequential processing, one update at a time.
example:
  - >-
    ```typescript

    const polling: IGramstaxPollingDeployOptions = {maxRetries: 5}

    const concurrent: IGramstaxPollingDeployOptions = {maxRetries: 5, queue: {enabled: true, workerCount: 8,
    perChatConcurrency: 1}}

    ```
isPreview: false
isDeprecated: false
syntax: |-
  type IGramstaxPollingDeployOptions = {
      maxRetries?: number;
      dropPendingUpdates?: boolean;
      queue?: IUpdateQueueConfig;
  };
