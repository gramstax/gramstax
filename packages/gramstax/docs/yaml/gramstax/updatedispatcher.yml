### YamlMime:TSType
name: UpdateDispatcher
uid: gramstax!UpdateDispatcher:class
package: gramstax!
fullName: UpdateDispatcher
summary: Worker pool that drains a bounded queue through a per-key gate.
remarks: >-
  Replaces the fire-and-forget loop in `Gramstax._startWebhookWorker`<!-- -->. Unlike that loop it stores its worker
  promises so `stop()` can join them, wraps the whole iteration in `try/catch` so one throw cannot silently shrink the
  pool, and reports the residual count instead of abandoning updates without a trace.
example: []
