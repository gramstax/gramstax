name: IRenderInvoiceParams
uid: gramstax!IRenderInvoiceParams:type
package: gramstax!
fullName: IRenderInvoiceParams
summary: Parameters for `renderInvoice`<!-- -->.
remarks: >-
  `params = CONTENT & ROUTE`<!-- -->: the shared template content (`data`<!-- -->, `AGBaseId`<!-- -->, read from the
  `<g-invoice>` block) plus `provider_token`<!-- -->, on the forced-send route (`IRouteReply`<!-- -->), with the option
  slot narrowed to the `sendInvoice` call (`IOptInvoice`<!-- -->).


  Provider tokens are security-critical and NEVER come from templates: the validator rejects a `provider_token`
  attribute outright, so the params' own `provider_token` field is the only way to supply one.
example: []
isPreview: false
isDeprecated: false
syntax: |-
  type IRenderInvoiceParams = IContent & Omit<IRouteForcedReply, `keyboard` | `options`> & {
      provider_token?: string | null;
      keyboard?: IInlineKb | null;
      options?: IOptInvoice | null;
  };
