### YamlMime:TSTypeAlias
name: IRouteForcedReply
uid: gramstax!IRouteForcedReply:type
package: gramstax!
fullName: IRouteForcedReply
summary: 'Route atom: forced reply for a method whose ONLY route is a send.'
remarks: >-
  Identical to [IRouteReply](xref:gramstax!IRouteReply:type) except that `mode` is optional. On a method with a single
  route there is nothing for `mode` to discriminate, so requiring it would force every call site to write a value that
  carries no information — `renderDice({mode: 'reply'})` says nothing the method name has not already said. `mode` stays
  in the key set and keeps its single legal value, so an explicit `mode: 'reply'` is still accepted and anything else is
  a compile error.
example: []
isPreview: false
isDeprecated: false
syntax: |-
  type IRouteForcedReply = INeverFields<`editOptions` | `fallbackOptions` | `fallback`> & {
      mode?: `reply`;
      keyboard?: IInBoKb | null;
      rich?: IOptReplyRich[0] | null;
      richOptions?: IOptRichSend | null;
      options?: IOptReply | null;
      broadcast?: null | undefined;
      chunkSize?: null | undefined;
  };
