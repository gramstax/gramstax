### YamlMime:TSTypeAlias
name: IRenderGiftParams
uid: gramstax!IRenderGiftParams:type
package: gramstax!
fullName: IRenderGiftParams
summary: Parameters for `renderGift` — a single gift send.
remarks: >-
  `params = CONTENT & ROUTE`<!-- -->: the gift content (`target`<!-- -->, `giftId`<!-- -->, `data`<!-- -->,
  `AGBaseId`<!-- -->) on the forced-send route (`IRouteReply`<!-- -->), with the option slot narrowed to the `sendGift`
  call (`IOptGift`<!-- -->). `target` (user id) is explicit because gifts do not always go to the active chat — unlike
  every other render method. A failed gift never degrades into sending the card as plain text.
example: []
isPreview: false
isDeprecated: false
syntax: |-
  type IRenderGiftParams = IContent & Omit<IRouteForcedReply, `options`> & {
      target: number;
      giftId: string;
      keyboard?: never;
      options?: IOptGift | null;
  };
