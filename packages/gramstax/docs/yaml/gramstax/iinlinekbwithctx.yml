### YamlMime:TSType
name: IInlineKbWithCtx
uid: gramstax!IInlineKbWithCtx:interface
package: gramstax!
fullName: IInlineKbWithCtx
summary: >-
  Inline keyboard whose `.text()` also accepts a page class/instance as callback data — calls
  `page.data.callbackQueryData()` automatically.
remarks: ''
example:
  - |-
    ```ts
    k.text(`Settings`, SettingsPage)
    // equivalent to: k.text(`Settings`, SettingsPage.data.callbackQueryData())
    ```
isPreview: false
isDeprecated: false
type: interface
methods:
  - name: text(text, data)
    uid: gramstax!IInlineKbWithCtx#text:member(1)
    package: gramstax!
    fullName: text(text, data)
    summary: >-
      Add a callback button. `text` and/or `data` can be a page (class/instance) or string. A page passed as `text`
      resolves to its `intentText` label; a page passed as `data` resolves to its `callbackQueryData()`<!-- -->.


      When `data` is a callback data object (`Page.data.callbackQueryData(...)`<!-- -->), the destination page must
      define `handleCallbackQueryData` (no args) or `handleArgsCallbackQueryData` (with args) — enforced at compile
      time.
    remarks: ''
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        text<D extends IKbCallbackData<typeof Ctx, Array<string | undefined>>>(text:
        Parameters<InlineKeyboard[`text`]>[0] | IKbPageLike | IKbButtonWithPageText, data: D & IKbCallbackDataCheck<D>):
        this;
      parameters:
        - id: text
          description: string, grammY button object (or with page text), or class Page (resolves to intentText)
          type: >-
            Parameters&lt;<xref uid="grammy!InlineKeyboard:class" />[`text`]&gt;[0] | <xref
            uid="gramstax!IKbPageLike:type" /> | <xref uid="gramstax!IKbButtonWithPageText:type" />
        - id: data
          description: >-
            string callback\_data, grammY button object, class Page, or callback data object from
            `page.data.callbackQueryData(...)`
          type: D & <xref uid="gramstax!IKbCallbackDataCheck:type" />&lt;D&gt;
      return:
        type: this
        description: ''
  - name: text(text, data)
    uid: gramstax!IInlineKbWithCtx#text:member(2)
    package: gramstax!
    fullName: text(text, data)
    summary: ''
    remarks: ''
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        text(text: Parameters<InlineKeyboard[`text`]>[0] | IKbPageLike | IKbButtonWithPageText, data?:
        Parameters<InlineKeyboard[`text`]>[1] | IKbPageLike): this;
      parameters:
        - id: text
          description: ''
          type: >-
            Parameters&lt;<xref uid="grammy!InlineKeyboard:class" />[`text`]&gt;[0] | <xref
