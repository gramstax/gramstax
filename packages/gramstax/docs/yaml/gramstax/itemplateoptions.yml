### YamlMime:TSTypeAlias
name: ITemplateOptions
uid: gramstax!ITemplateOptions:type
package: gramstax!
fullName: ITemplateOptions
summary: Configuration options for TemplateManager initialization.
remarks: Pass this object to the TemplateManager constructor to configure template paths, hot-reloading, and watcher behavior.
example:
  - |-
    ```typescript
    const options = {
      path: [join(process.cwd(), `src`, `pages`)],
      enableWatch: true,
      watchOptions: {ignored: /node_modules/}
    }
    ```
isPreview: false
isDeprecated: false
syntax: |-
  type ITemplateOptions = {
      path: string[];
      enableWatch?: boolean;
      watchOptions?: ChokidarOptions;
      onReload?: () => void;
  };
