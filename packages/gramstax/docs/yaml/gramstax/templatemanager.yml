### YamlMime:TSType
name: TemplateManager
uid: gramstax!TemplateManager:class
package: gramstax!
fullName: TemplateManager
summary: Manages template loading, compilation, caching, and hot-reloading from page files.
remarks: >-
  The `TemplateManager` class provides a centralized system for handling templates used in Gramstax bots. It supports: -
  Loading templates from static `template` properties in page classes - Loading templates from external `.html` files -
  Hot-reloading templates during development via file watching - Multi-language support with fallback to `default`


  Templates are compiled once and cached for efficient retrieval.
example:
  - |-
    ```typescript
    import {TemplateManager} from "gramstax"
    import {join} from "path"

    const tm = new TemplateManager({
      path: [join(process.cwd(), "src", "pages")],
      enableWatch: process.env.NODE_ENV === "development"
    })

    // Get a compiled message
    const message = tm.getMessage("start", "default", "en", {name: "John"})
    ```
isPreview: false
isDeprecated: false
type: class
constructors:
  - name: (constructor)(options)
    uid: gramstax!TemplateManager:constructor(1)
    package: gramstax!
    fullName: (constructor)(options)
    summary: Creates a new TemplateManager instance.
    remarks: >-
      The constructor validates paths, initializes watchers (if enabled), and loads all template files from the
      specified paths.
    example:
      - |-
        ```typescript
        const tm = new TemplateManager({
          path: [join(process.cwd(), "src", "pages")],
          enableWatch: true,
          watchOptions: {
            ignored: /node_modules/,
            persistent: true
          }
        })
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'constructor(options: ITemplateOptions);'
      parameters:
        - id: options
          description: Configuration options for the template manager
          type: <xref uid="gramstax!~ITemplateOptions:type" />
