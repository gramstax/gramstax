  - name: write(filename, template)
    uid: gramstax!TemplateManager#write:member(1)
    package: gramstax!
    fullName: write(filename, template)
    summary: Writes a template to file and updates the cache.
    remarks: >-
      Only `.html` files are supported for writing. The method searches all configured paths for an existing file and
      updates it in place. After writing, the template is recompiled and cached.
    example:
      - |-
        ```typescript
        const success = await tm.write("welcome.html", newTemplateContent)
        if (success) {
          console.log("Template updated")
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'write(filename: string, template: string): Promise<boolean | null>;'
      parameters:
        - id: filename
          description: Target filename with `.html` extension
          type: string
        - id: template
          description: Template string content to write
          type: string
      return:
        type: Promise&lt;boolean | null&gt;
        description: '`true` if file was written, `null` if file not found or invalid extension'
