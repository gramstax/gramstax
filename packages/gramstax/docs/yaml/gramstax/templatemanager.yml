  - name: closeWatchers()
    uid: gramstax!TemplateManager#closeWatchers:member(1)
    package: gramstax!
    fullName: closeWatchers()
    summary: Closes file watchers, cancels pending reloads, and awaits in-flight reloads.
    remarks: >-
      Three things can outlive a reload, and all three must be settled before the process exits or a test asserts on a
      clean slate. Listeners are detached before each watcher closes so `close()` does not fire teardown handlers;
      pending debounce timers are cleared; and `_reloadChain` is awaited so a reload already in progress finishes rather
      than racing the close.


      Safe to call when nothing was ever watched — every branch is guarded.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'closeWatchers(): Promise<void>;'
      return:
        type: Promise&lt;void&gt;
        description: Nothing; resolves once no reload is outstanding.
  - name: compile(key, template, keepIfExist, importCache, rawCache, filename)
    uid: gramstax!TemplateManager#compile:member(1)
    package: gramstax!
    fullName: compile(key, template, keepIfExist, importCache, rawCache, filename)
    summary: Compiles a raw template string and stores the result in the cache.
    remarks: >-
      This method processes import blocks, compiles media, polls, messages, keyboards, and descriptions from the
      template. It uses `TemplateEngine` for compilation. The `keepIfExist` parameter allows partial recompilation when
      only specific template parts have changed.
    example:
      - |-
        ```typescript
        this.compile("welcome", rawHtmlContent)

        const importCache = new Map<string, string>()
        const rawCache = new Map([["partial", partialHtml]])
        this.compile("main", mainHtml, undefined, importCache, rawCache)
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        compile(key: string, template: string, keepIfExist?: Partial<{
                [K in keyof ICompiledTemplate]: boolean;
            }>, importCache?: Map<string, string>, rawCache?: Map<string, string>, filename?: string): void;
      parameters:
        - id: key
          description: Template cache key (filename without extension)
          type: string
        - id: template
          description: Raw template HTML string
          type: string
        - id: keepIfExist
          description: Optional flags to preserve existing compiled parts
          type: |-
            Partial&lt;{
                    [K in keyof <xref uid="gramstax!ICompiledTemplate:type" />]: boolean;
                }&gt;
        - id: importCache
          description: Optional shared cache for import resolution
          type: Map&lt;string, string&gt;
        - id: rawCache
          description: Optional pre-loaded raw template cache for batch loading
          type: Map&lt;string, string&gt;
        - id: filename
          description: Optional source filename recorded on the cache entry (defaults to `key`<!-- -->)
          type: string
      return:
        type: void
        description: ''
  - name: destroy()
    uid: gramstax!TemplateManager#destroy:member(1)
    package: gramstax!
    fullName: destroy()
    summary: Cleans up resources and closes file watchers.
    remarks: >-
      Call this method when shutting down the bot to properly release file system resources. Clears the template cache
      as well.
    example:
      - |-
        ```typescript
        // Cleanup on shutdown
        process.on("SIGINT", async () => {
          await tm.destroy()
          process.exit(0)
        })
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'destroy(): Promise<void>;'
      return:
        type: Promise&lt;void&gt;
        description: Promise that resolves after watchers are closed
