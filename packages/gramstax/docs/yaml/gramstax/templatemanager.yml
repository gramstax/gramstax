  - name: _initializeWatcher(options)
    uid: gramstax!TemplateManager#_initializeWatcher:member(1)
    package: gramstax!
    fullName: _initializeWatcher(options)
    summary: Initializes file system watchers for hot reloading.
    remarks: >-
      This method sets up file system watchers on each path in `_path` when `enableWatch` is true. It listens for
      `change`<!-- -->, `add`<!-- -->, `unlink`<!-- -->, and `error` events. The watchers are configured with
      `awaitWriteFinish` to avoid partial file reads.
    example:
      - |-
        ```typescript
        this._initializeWatcher({
          ignored: /node_modules/,
          persistent: true
        })
        ```
