    uid: gramstax!TemplateManager#destroy:member(1)
    package: gramstax!
    fullName: destroy()
    summary: Cleans up resources and closes file watchers.
    remarks: >-
      Call this method when shutting down the bot to properly release file system resources. Clears the template cache
      as well.
    example:
      - |-
        ```typescript
        // Cleanup on shutdown
        process.on("SIGINT", async () => {
          await tm.destroy()
          process.exit(0)
        })
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'destroy(): Promise<void>;'
      return:
        type: Promise&lt;void&gt;
        description: Promise that resolves after watchers are closed
