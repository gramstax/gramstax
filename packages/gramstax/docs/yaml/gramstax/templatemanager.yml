  - name: _validateTemplate(AGBaseId, template, filename)
    uid: gramstax!TemplateManager#_validateTemplate:member(1)
    package: gramstax!
    fullName: _validateTemplate(AGBaseId, template, filename)
    summary: >-
      Validates template syntax and throws a descriptive error on failure.


      The error message includes the enclosing `<g-base id="...">` based on the error line. If the `<g-base>` has no
      `id` or no `<g-base>` tag is found, the `on base` prefix is omitted.
    remarks: ''
    example:
      - |-
        ```typescript
        // base with id:
        this._validateTemplate("start", '<g-base id="kb"><kop/></g-base>', "start.html")
        // => throws: Template on base "kb" (start.html, line 1): Unsupported template block: <kop>

        // base without id:
        this._validateTemplate("start", '<g-base><kop/></g-base>', "start.html")
        // => throws: Template (start.html, line 1): Unsupported template block: <kop>
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: '_validateTemplate(AGBaseId: string, template: string, filename?: string): void;'
      parameters:
        - id: AGBaseId
          description: Cache key (filename without extension), used as default filename
          type: string
        - id: template
          description: Template content to validate
          type: string
        - id: filename
          description: Source filename with extension, shown in error location
          type: string
      return:
        type: void
        description: ''
