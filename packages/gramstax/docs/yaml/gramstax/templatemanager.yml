  - name: _loadAllFiles()
    uid: gramstax!TemplateManager#_loadAllFiles:member(1)
    package: gramstax!
    fullName: _loadAllFiles()
    summary: Loads all template files during initialization with batch optimization.
    remarks: >-
      This method scans all paths for valid template files (`.html`<!-- -->, `.ts`<!-- -->, `.js`<!-- -->), collects
      their raw contents, and compiles them in a batch. It uses shared caches for imports to optimize performance. After
      compilation, raw templates are cleared and `Page.template` properties are set to `undefined` for memory cleanup.
    example:
      - |-
        ```typescript
        this._loadAllFiles()
        ```
    isPreview: false
    isDeprecated: false
