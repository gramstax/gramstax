  - name: _getGBaseAtLine(template, line)
    uid: gramstax!TemplateManager#_getGBaseAtLine:member(1)
    package: gramstax!
    fullName: _getGBaseAtLine(template, line)
    summary: Finds the `<g-base>` block (open + close) that encloses the given line number.
    remarks: ''
    example:
      - |-
        ```typescript
        const tpl = '<g-base id="kb">\n<kop/></g-base>';
        this._getBaseAtLine(tpl, 2) // => { AGBaseId: "kb", hasId: true }

        const tpl2 = '<g-base>\n<kop/></g-base>';
        this._getBaseAtLine(tpl2, 2) // => { AGBaseId: null, hasId: false }

        const tpl3 = '</g-base>\n{-lah-}\n<g-base>';
        this._getBaseAtLine(tpl3, 2) // => null
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        _getGBaseAtLine(template: string, line: number): {
                AGBaseId: string | null;
                hasId: boolean;
            } | null;
      parameters:
        - id: template
          description: Processed template string
          type: string
        - id: line
          description: 1-based line number to check
          type: number
      return:
        type: |-
          {
                  AGBaseId: string | null;
                  hasId: boolean;
              } | null
        description: Object with `AGBaseId` and `hasId`<!-- -->, or `null` if not inside any `<g-base>` block
