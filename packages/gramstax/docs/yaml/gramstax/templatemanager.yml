  - name: validateTemplate(AGBaseId, template, filename)
    uid: gramstax!TemplateManager#validateTemplate:member(1)
    package: gramstax!
    fullName: validateTemplate(AGBaseId, template, filename)
    summary: >-
      Validates template syntax and throws a descriptive error on failure.


      The error message includes the enclosing `<g-base id="...">` based on the error line. If the `<g-base>` has no
      `id` or no `<g-base>` tag is found, the `on base` prefix is omitted.
    remarks: ''
    example:
      - |-
        ```typescript
        // base with id:
        this.validateTemplate("start", '<g-base id="kb"><kop/></g-base>', "start.html")
        // => throws: Template on base "kb" (start.html, line 1): Unsupported template block: <kop>

        // base without id:
        this.validateTemplate("start", '<g-base><kop/></g-base>', "start.html")
        // => throws: Template (start.html, line 1): Unsupported template block: <kop>
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'validateTemplate(AGBaseId: string, template: string, filename?: string): void;'
      parameters:
        - id: AGBaseId
          description: Cache key (filename without extension), used as default filename
          type: string
        - id: template
          description: Template content to validate
          type: string
        - id: filename
          description: Source filename with extension, shown in error location
          type: string
      return:
        type: void
        description: ''
  - name: write(filename, template)
    uid: gramstax!TemplateManager#write:member(1)
    package: gramstax!
    fullName: write(filename, template)
    summary: Writes a template to file and updates the cache.
    remarks: >-
      Only `.html` files are supported for writing. The method searches all configured paths for an existing file and
      updates it in place. After writing, the template is recompiled and cached.
    example:
      - |-
        ```typescript
        const success = await tm.write("welcome.html", newTemplateContent)
        if (success) {
          console.log("Template updated")
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'write(filename: string, template: string): Promise<boolean | null>;'
      parameters:
        - id: filename
          description: Target filename with `.html` extension
          type: string
        - id: template
          description: Template string content to write
          type: string
      return:
        type: Promise&lt;boolean | null&gt;
        description: '`true` if file was written, `null` if file not found or invalid extension'
