methods:
  - name: _compile(key, template, keepIfExist, importCache, rawCache, filename)
    uid: gramstax!TemplateManager#_compile:member(1)
    package: gramstax!
    fullName: _compile(key, template, keepIfExist, importCache, rawCache, filename)
    summary: Compiles a raw template string and stores the result in the cache.
    remarks: >-
      This method processes import blocks, compiles media, messages, keyboards, and descriptions from the template. It
      uses `TemplateEngine` for compilation. The `keepIfExist` parameter allows partial recompilation when only specific
      template parts have changed.
    example:
      - |-
        ```typescript
        this._compile("welcome", rawHtmlContent)

        const importCache = new Map<string, string>()
        const rawCache = new Map([["partial", partialHtml]])
        this._compile("main", mainHtml, undefined, importCache, rawCache)
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        _compile(key: string, template: string, keepIfExist?: Partial<{
                [K in keyof ITCompiledTemplate]: boolean;
            }>, importCache?: Map<string, string>, rawCache?: Map<string, string>, filename?: string): void;
      parameters:
        - id: key
          description: Template cache key (filename without extension)
          type: string
        - id: template
          description: Raw template HTML string
          type: string
        - id: keepIfExist
          description: Optional flags to preserve existing compiled parts
          type: |-
            Partial&lt;{
                    [K in keyof <xref uid="gramstax!ITCompiledTemplate:type" />]: boolean;
                }&gt;
        - id: importCache
          description: Optional shared cache for import resolution
          type: Map&lt;string, string&gt;
        - id: rawCache
          description: Optional pre-loaded raw template cache for batch loading
          type: Map&lt;string, string&gt;
        - id: filename
          description: ''
          type: string
      return:
        type: void
        description: ''
