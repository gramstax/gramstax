    uid: gramstax!TemplateManager:constructor(1)
    package: gramstax!
    fullName: (constructor)(options)
    summary: Creates a new TemplateManager instance.
    remarks: >-
      The constructor validates paths, initializes watchers (if enabled), and loads all template files from the
      specified paths.
    example:
      - |-
        ```typescript
        const tm = new TemplateManager({
          path: [join(process.cwd(), "src", "pages")],
          enableWatch: true,
          watchOptions: {
            ignored: /node_modules/,
            persistent: true
          }
        })
        ```
    isPreview: false
    isDeprecated: false
