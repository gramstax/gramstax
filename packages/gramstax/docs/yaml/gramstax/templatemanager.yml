  - name: destroy()
    uid: gramstax!TemplateManager#destroy:member(1)
    package: gramstax!
    fullName: destroy()
    summary: Cleans up resources and closes file watchers.
    remarks: >-
      Call this method when shutting down the bot to properly release file system resources. Clears the template cache
      as well.
    example:
      - |-
        ```typescript
        // Cleanup on shutdown
        process.on("SIGINT", async () => {
          await tm.destroy()
          process.exit(0)
        })
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'destroy(): Promise<void>;'
      return:
        type: Promise&lt;void&gt;
        description: Promise that resolves after watchers are closed
  - name: getDescription(key, baseId, language, scope, data)
    uid: gramstax!TemplateManager#getDescription:member(1)
    package: gramstax!
    fullName: getDescription(key, baseId, language, scope, data)
    summary: Gets a command description for Telegram menu.
    remarks: >-
      Retrieves the compiled description function for the specified template, scope, and language, then executes it with
      the provided data.
    example:
      - |-
        ```typescript
        const desc = tm.getDescription("start", "default", "en")
        // => "Start the bot"
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        getDescription(key: string, baseId?: string, language?: string, scope?: string, data?: Record<string, any>):
        string;
      parameters:
        - id: key
          description: Template identifier (filename without extension)
          type: string
        - id: baseId
          description: Base block ID matching `<base id="...">`
          type: string
        - id: language
          description: Target language code (falls back to `default`<!-- -->)
          type: string
        - id: scope
          description: Telegram bot command scope (e.g., `default`<!-- -->, `admin`<!-- -->)
          type: string
        - id: data
          description: Template variables for interpolation
          type: Record&lt;string, any&gt;
      return:
        type: string
        description: Rendered description string, or empty string if not found
