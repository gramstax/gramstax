        unknown>): GDescriptionResult;
      parameters:
        - id: key
          description: Template identifier (filename without extension)
          type: string
        - id: AGBaseId
          description: Base block ID matching `<g-base id="...">`
          type: string
        - id: ALang
          description: Target language code (falls back to `default`<!-- -->)
          type: string
        - id: AScope
          description: Telegram bot command scope (e.g., `default`<!-- -->, `admin`<!-- -->)
          type: string
        - id: data
          description: Template variables for interpolation
          type: Record&lt;string, unknown&gt;
      return:
