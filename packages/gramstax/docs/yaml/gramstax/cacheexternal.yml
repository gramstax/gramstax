### YamlMime:TSType
name: CacheExternal
uid: gramstax!CacheExternal:class
package: gramstax!
fullName: CacheExternal
summary: >-
  Extends [Keyv](https://github.com/jaredwray/keyv) to provide a unified caching interface with built-in support for
  memory and Redis storage.
remarks: >-
  Storage modes: - \*\*Memory mode:\*\* when `url` is `"memory"` (default), uses an in-memory `Map`<!-- -->. - \*\*Redis
  mode:\*\* when `url` starts with `"redis"`<!-- -->, uses `@keyv/redis` adapter. - \*\*Custom mode:\*\* when
  `more.forceStore` is provided, uses the custom store.
example:
  - |-
    ```typescript
    import { CacheExternal } from "gramstax";

    // Memory cache (default)
    const memoryCache = new CacheExternal();

    // Redis cache
    const redisCache = new CacheExternal("redis://localhost:6379", 3600000, "s");

    // With namespace and TTL
    const cache = new CacheExternal("memory", 60000, "myapp");

    // Set and get data
    await cache.set("user:123", { name: "John" });
    const user = await cache.get("user:123");
    ```
isPreview: false
isDeprecated: false
type: class
