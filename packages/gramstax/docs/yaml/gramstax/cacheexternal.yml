methods:
  - name: refreshLruCache(maxLength)
    uid: gramstax!CacheExternal#refreshLruCache:member(1)
    package: gramstax!
    fullName: refreshLruCache(maxLength)
    summary: Refreshes the LRU cache by re-accessing keys in order.
    remarks: >-
      This method iterates through the store keys and calls `get()` on each to refresh the LRU order. Only applicable
      for memory-based stores using `Map`<!-- -->.
    example:
      - |-
        ```typescript
        const cache = new CacheExternal("memory", 60000, "app");

        // Refresh all keys
        cache.refreshLruCache();

        // Refresh only the first 100 keys
        cache.refreshLruCache(100);
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'refreshLruCache(maxLength?: number): void;'
      parameters:
        - id: maxLength
          description: Maximum number of keys to refresh. If omitted, refreshes all keys.
          type: number
      return:
        type: void
        description: ''
