remarks: >-
  Three accepted shapes (enforced by the loader): - a module path string resolving to a `CacheExternal` subclass - an
  `{override: {module, export?, args?}}` ref resolving to a `CacheExternal` subclass - builtin params `{store, ttlMs?,
  namespace?}` passed to `new CacheExternal(params)`
example:
  - |-
    ```typescript
    const fromPath: IGramstaxCacheSessionRef = `./src/session-cache.ts`
    const builtin: IGramstaxCacheSessionRef = {store: `redis://localhost:6379`, ttlMs: 3600000}
    ```
