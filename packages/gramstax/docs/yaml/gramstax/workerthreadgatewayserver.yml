name: WorkerThreadGatewayServer
uid: gramstax!WorkerThreadGatewayServer:class
package: gramstax!
fullName: WorkerThreadGatewayServer
summary: Provides IPC server functionality for inter-worker communication using Unix domain sockets.
remarks: >-
  Uses `net-ipc` library for Unix domain socket communication. Supports connections from multiple gateway clients.
  Typically created via
  [WorkerThreadInit.createGatewayServer()](xref:gramstax!WorkerThreadInit%23createGatewayServer:member(1))<!-- -->.
example:
  - |-
    ```typescript
    import { WorkerThreadGatewayServer } from "gramstax";

    const server = new WorkerThreadGatewayServer();
    await server.start("/tmp/my-server.sock", {
      ping: () => "pong",
      getData: (key) => database.get(key),
    });
    ```
isPreview: false
isDeprecated: false
