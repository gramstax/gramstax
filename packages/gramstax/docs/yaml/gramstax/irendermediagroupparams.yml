### YamlMime:TSTypeAlias
name: IRenderMediaGroupParams
uid: gramstax!IRenderMediaGroupParams:type
package: gramstax!
fullName: IRenderMediaGroupParams
summary: Parameters for `renderMediaGroup` — the single media-group send/edit method.
remarks: >-
  A two-route union: `auto` (default) edits when the update carries a `callbackQuery`<!-- -->, `reply` always sends.
  Media groups have no in-place edit, so every edit route deletes the original message first and the `delete-reply`
  fallback deletes again before re-sending. `options` feeds the direct reply branch and the delete-then-resend branches
  alike, and there is no keyboard field — Telegram media groups do not support reply markup.
example: []
isPreview: false
isDeprecated: false
syntax: type IRenderMediaGroupParams = IGroupR1 | IGroupR2;
