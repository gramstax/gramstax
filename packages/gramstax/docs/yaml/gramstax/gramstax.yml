  - name: hookBeforeRoute(ctx, listenerName)
    uid: gramstax!Gramstax#hookBeforeRoute:member(1)
    package: gramstax!
    fullName: hookBeforeRoute(ctx, listenerName)
    summary: Hook called before routing an update.
    remarks: Override this method to add pre-routing logic like authentication, rate limiting, or logging.
    example:
      - |-
        ```typescript
        async hookBeforeRoute(ctx: Ctx, listenerName: string) {
          if (ctx.userId === blockedUserId) {
            return false // Block this user
          }
          return true
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        /** @virtual */
        hookBeforeRoute(ctx: ICtx, listenerName: string): Promise<boolean>;
      parameters:
        - id: ctx
          description: The context instance.
          type: ICtx
        - id: listenerName
          description: The name of the listener handling this update.
          type: string
      return:
        type: Promise&lt;boolean&gt;
        description: True to continue routing, false to abort.
