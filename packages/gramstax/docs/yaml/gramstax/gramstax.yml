  - name: e2e
    uid: gramstax!Gramstax#e2e:member
    package: gramstax!
    fullName: e2e
    summary: In-process E2E testing helper.
    remarks: >-
      Available only when `deploy: "test"`<!-- -->. Provides methods to simulate Telegram updates without any HTTP
      server. See [E2eHelper](xref:gramstax!E2eHelper:class) for full API documentation.


      When `deploy` is a `"test"` variant, this is typed as `E2eHelper`<!-- -->; otherwise it is `undefined`<!-- -->.
    example:
      - |-
        ```typescript
        const bot = new Gramstax({deploy: "test", token: "test"})
        const responses = await bot.e2e.sendText("/start", {user: {id: 2001}})
        ```
    isPreview: false
    isDeprecated: false
