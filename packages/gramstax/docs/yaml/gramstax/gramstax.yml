methods:
  - name: _pageRoutes(ctx, fromListener)
    uid: gramstax!Gramstax#_pageRoutes:member(1)
    package: gramstax!
    fullName: _pageRoutes(ctx, fromListener)
    summary: Routes an incoming update to the appropriate page handler.
    remarks: >-
      The routing follows a strict \*\*priority hierarchy\*\*. When a match is found at any level, the method executes
      the handler and returns immediately. If no match is found, it falls through to the next level.


      \*\*Routing Priority (executed in order):\*\*


      1. \*\*staticSession\*\* — Session-aware routes, filtered by input type (O(n) lookup)  - Only runs when the user
      has an active session (`session.method` is set)  - Iterates `routeStaticSession` and matches by `session.method`
      value  - \*\*Filtered by input type\*\*: only routes whose name ends with `fromListener`  are checked (e.g.,
      callback queries only match `*CallbackQueryData` session routes,  text only matches `*Text`<!-- -->, photo
      captions only match `*CaptionPhoto`<!-- -->, etc.)  - This prevents cross-type handler misdispatch (e.g., a
      callback query  accidentally matching `handleSessionFreeText`<!-- -->)  - Example: session with method "7-mypage"
      → finds `handleSessionFreeText["7-mypage"]`  when `fromListener = "text"`


      2. \*\*static\*\* — Exact intent match routes (O(1) lookup)  - Matches exact text/callback data to page intents  -
      Example: "start" → `handleText()`<!-- -->, "/help" → `handleCommandText()`


      3. \*\*staticIntent\*\* — Intent with args routes (O(1) lookup)  - Matches intent prefix when args are present  -
      Example: "start:123" → `handleArgsCallbackQueryData()`<!-- -->, "/add item" → `handleCommandArgsText()`


      4. \*\*dynamicSpesific\*\* — Non-session free handlers (O(n) iteration)  - Runs all `handleFree*` handlers
      (defined directly on the page, not inherited)  - `handleSessionFree*` variants are NOT dispatched here — they go
      through id=1  - Example: `handleFreeText()`<!-- -->, `handleFreePhoto()`  - \*\*All matching handlers are
      executed\*\* (no early return)


      5. \*\*dynamic\*\* — Global fallback handlers (O(n) iteration)  - Runs all `handleFree()` handlers from pages that
      define them  - Last resort when nothing else matches  - \*\*All matching handlers are executed\*\* (no early
      return)
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        _pageRoutes(ctx: ICtx, fromListener: string): Promise<{
                state: `matched` | `no-match` | `no-handler` | `blocked`;
            }>;
      parameters:
        - id: ctx
          description: The context instance.
          type: ICtx
        - id: fromListener
          description: The listener type that triggered the route.
          type: string
      return:
        type: |-
          Promise&lt;{
                  state: `matched` | `no-match` | `no-handler` | `blocked`;
              }&gt;
        description: A `PageRouteResult` with `state` indicating what happened
  - name: buildCtxParams(ct, extra)
    uid: gramstax!Gramstax#buildCtxParams:member(1)
    package: gramstax!
    fullName: buildCtxParams(ct, extra)
    summary: Builds the params for one page `Ctx`<!-- -->, plus optional app extras.
    remarks: >-
      Only assembly point for `createCtx`<!-- -->: per-update `ct` plus the constructor-built `ctxScope` plus a fresh
      `temp`<!-- -->. App values (e.g. a database handle) ride in `extra` through the params object, but the `Ctx`
      constructor does NOT attach them — assign each one explicitly in your subclass constructor so every wiring stays
      visible and easy to troubleshoot. `extra` keys must not be `ct`<!-- -->/`temp` (thrown here).
    example:
      - |-
        ```typescript
        class MyBot extends Gramstax {
          db = new Db()
          override buildCtxParams<T extends Record<string, unknown> = Record<string, never>>(ct: ICt, _extra?: T): ICtxParams & T & {db: Db} {
            return super.buildCtxParams(ct, {db: this.db}) as ICtxParams & T & {db: Db}
          }
        }
        class CtxCore extends Ctx {
          declare db: Db
          constructor(params: ICtxParams & {db: Db}) {
            super(params)
            this.db = params.db
          }
        }
        // inside any page extending CtxCore: this.db — fully typed, zero casts.
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'buildCtxParams<T extends Record<string, unknown> = Record<string, never>>(ct: ICt, extra?: T): ICtxParams & T;'
      parameters:
        - id: ct
          description: The grammy context for the current update.
          type: <xref uid="gramstax!ICt:type" />
        - id: extra
          description: Optional app values forwarded into every page `Ctx`<!-- -->.
          type: T
      return:
        type: <xref uid="gramstax!ICtxParams:type" /> & T
        description: Params for `new Ctx(...)`<!-- -->, shaped as `ICtxParams & T`<!-- -->.
