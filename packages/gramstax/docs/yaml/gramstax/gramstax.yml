### YamlMime:TSType
name: Gramstax
uid: gramstax!Gramstax:class
package: gramstax!
fullName: Gramstax
summary: Main bot framework class for building Telegram bots.
remarks: >-
  Gramstax provides a page-based routing system for handling Telegram updates. It automatically loads page classes from
  the file system and routes incoming messages and callbacks to the appropriate handlers.
example:
  - |-
    ```typescript
    import {Gramstax} from "gramstax"

    const bot = new Gramstax({
      token: process.env.BOT_TOKEN!,
      deploy: "polling",
      log: true
    })
    ```
isPreview: false
isDeprecated: false
type: class
constructors:
  - name: (constructor)(params)
    uid: gramstax!Gramstax:constructor(1)
    package: gramstax!
    fullName: (constructor)(params)
    summary: Creates a new Gramstax bot instance.
    remarks: ''
    example:
      - >-
        ```typescript

        // Polling mode (development, local testing)

        new Gramstax({token: "BOT_TOKEN", deploy: "polling"})


        // Webhook mode with Bun's HTTP server

        new Gramstax({token: "BOT_TOKEN", deploy: "webhook", optionsDeploy: {webhook: {url: "https://example.com/bot",
        secretToken: "s3cr3t"}}})

        ```
      - |-
        ```typescript
        // Serverless mode — worker adapter
        //
        // The bot does NOT self-host; instead it sets up handlerBotUpdate
        // for your serverless runtime. Export the handler and let your
        // platform invoke it per HTTP request.

        // bot.ts — instantiation
        const bot = new Gramstax({
          token: process.env.BOT_TOKEN!,
          deploy: "serverless",
          optionsDeploy: {serverless: {"cloudflare-mod": {url: "https://example.com/webhook", secretToken: env.BOT_WEBHOOK_SECRET}}}
        })

        // handler.ts — server entry point
        import {bot} from "./bot"

        // Bun's built-in HTTP server
        Bun.serve({
          port: 3000,
          async fetch(req) {
            const url = new URL(req.url)
            if (url.pathname === "/webhook") {
              // Forward the request to gramstax's handler
              return await bot.handlerBotUpdate(req)
            }
            return new Response("Not found", {status: 404})
          }
        })
        ```
      - |-
        ```typescript
        // Serverless mode — AWS Lambda
        //
        // bot.ts
        const bot = new Gramstax({
          token: process.env.BOT_TOKEN!,
          deploy: "serverless",
          optionsDeploy: {serverless: {"aws-lambda-async": {url: "https://example.com/webhook", secretToken: process.env.BOT_WEBHOOK_SECRET}}}
        })

        // lambda.ts
        import {bot} from "./bot"
        import type {APIGatewayProxyEvent, Context} from "aws-lambda"

        export const handler = async (event: APIGatewayProxyEvent, _ctx: Context) => {
          // webhookCallback(bot.bot, "aws-lambda") wraps the raw event
          // into a compatible format internally
          return await bot.handlerBotUpdate(event)
        }
        ```
      - >-
        ```typescript

        // Serverless mode — Cloudflare Workers

        //

        // bot.ts

        const bot = new Gramstax({token: env.BOT_TOKEN, deploy: "serverless", optionsDeploy: {serverless:
        {"cloudflare-mod": {url: "https://example.com/webhook", secretToken: env.BOT_WEBHOOK_SECRET}}}})


        // worker.ts

        import {bot} from "./bot"


        export default {
          async fetch(request: Request) {
            const url = new URL(request.url)
            if (url.pathname === "/webhook") {
              return await bot.handlerBotUpdate(request)
            }
            return new Response("OK")
          }
        }

        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'constructor(params: IGramstaxParams);'
      parameters:
        - id: params
          description: Configuration options. See [IGramstaxParams](xref:gramstax!IGramstaxParams:type) for all available options.
          type: <xref uid="gramstax!IGramstaxParams:type" />
