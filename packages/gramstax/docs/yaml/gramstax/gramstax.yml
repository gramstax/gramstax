  - name: hookBeforeStart()
    uid: gramstax!Gramstax#hookBeforeStart:member(1)
    package: gramstax!
    fullName: hookBeforeStart()
    summary: Hook called before the bot starts.
    remarks: >-
      Override this method to run \*\*one-off initialization logic\*\* that must complete before the bot begins
      dispatching updates — for example, connecting to a database, warming a cache, validating external service
      credentials, or setting up shared singletons that pages will read from.


      This hook fires exactly once, after `cacheSession`<!-- -->, `templateManager`<!-- -->, `bot`<!-- -->, and `pages`
      are initialized, and before polling/webhook/serverless actually begins receiving updates.


      \*\*Do NOT register middleware here.\*\* Middleware belongs in
      [Gramstax.registerLowPlugin()](xref:gramstax!Gramstax%23registerLowPlugin:member(1))<!-- -->, which is the
      dedicated channel for code that should run on every incoming update. `hookBeforeStart` runs once and is the wrong
      place for per-update logic.


      For background tasks that need the bot to be alive (cron jobs, periodic cleanup, queue processors), use
      [Gramstax.hookAfterStart()](xref:gramstax!Gramstax%23hookAfterStart:member(1)) instead.
    example:
      - |-
        ```typescript
        class MyBot extends Gramstax {
          async hookBeforeStart() {
            // Validate external service credentials before the bot goes live
            if (!process.env.REDIS_URL) {
              throw new Error(`REDIS_URL is required`)
            }
            this.log?.info?.(`Verifying external service connection...`)
            await pingRedis(process.env.REDIS_URL)
            this.log?.success?.(`External services ready`)
          }
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        /** @virtual */
        hookBeforeStart?(): Promise<void>;
      return:
        type: Promise&lt;void&gt;
        description: ''
