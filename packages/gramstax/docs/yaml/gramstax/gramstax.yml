### YamlMime:TSType
name: Gramstax
uid: gramstax!Gramstax:class
package: gramstax!
fullName: Gramstax
summary: Main bot framework class for building Telegram bots.
remarks: >-
  Gramstax provides a page-based routing system for handling Telegram updates. It automatically loads page classes from
  the file system and routes incoming messages and callbacks to the appropriate handlers.
example:
  - |-
    ```typescript
    import {Gramstax} from "gramstax"

    const bot = new Gramstax({
      token: process.env.BOT_TOKEN!,
      deploy: "polling",
      log: true
    })
    ```
isPreview: false
isDeprecated: false
type: class
