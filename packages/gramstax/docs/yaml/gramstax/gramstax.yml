  - name: _pageRoutes(ctx, fromListener)
    uid: gramstax!Gramstax#_pageRoutes:member(1)
    package: gramstax!
    fullName: _pageRoutes(ctx, fromListener)
    summary: Routes an incoming update to the appropriate page handler.
    remarks: >-
      The routing follows a strict \*\*priority hierarchy\*\*. When a match is found at any level, the method executes
      the handler and returns immediately. If no match is found, it falls through to the next level.


      \*\*Routing Priority (executed in order):\*\*


      1. \*\*staticSession\*\* — Session-aware routes, filtered by input type (O(n) lookup) - Only runs when the user
      has an active session (`session.method` is set) - Iterates `routeStaticSession` and matches by `session.method`
      value - \*\*Filtered by input type\*\*: only routes whose name ends with `fromListener` are checked (e.g.,
      callback queries only match `*CallbackQueryData` session routes, text only matches `*Text`<!-- -->, photo captions
      only match `*CaptionPhoto`<!-- -->, etc.) - This prevents cross-type handler misdispatch (e.g., a callback query
      accidentally matching `handleSessionFreeText`<!-- -->) - Example: session with method "7-mypage" → finds
      `handleSessionFreeText["7-mypage"]` when `fromListener = "text"`


      2. \*\*static\*\* — Exact intent match routes (O(1) lookup) - Matches exact text/callback data to page intents -
      Example: "start" → `handleText()`<!-- -->, "/help" → `handleCommandText()`


      3. \*\*staticIntent\*\* — Intent with args routes (O(1) lookup) - Matches intent prefix when args are present -
      Example: "start:123" → `handleArgsCallbackQueryData()`<!-- -->, "/add item" → `handleCommandArgsText()`


      4. \*\*dynamicSpesific\*\* — Non-session free handlers (O(n) iteration) - Runs all `handleFree*` handlers (defined
      directly on the page, not inherited) - `handleSessionFree*` variants are NOT dispatched here — they go through
      id=1 - Example: `handleFreeText()`<!-- -->, `handleFreePhoto()` - \*\*All matching handlers are executed\*\* (no
      early return)


      5. \*\*dynamic\*\* — Global fallback handlers (O(n) iteration) - Runs all `handleFree()` handlers from pages that
      define them - Last resort when nothing else matches - \*\*All matching handlers are executed\*\* (no early return)
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        _pageRoutes(ctx: ICtx, fromListener: string): Promise<{
                state: `matched` | `no-match` | `no-handler` | `blocked`;
            }>;
      parameters:
        - id: ctx
          description: The context instance.
          type: ICtx
        - id: fromListener
          description: The listener type that triggered the route.
          type: string
      return:
        type: |-
          Promise&lt;{
                  state: `matched` | `no-match` | `no-handler` | `blocked`;
              }&gt;
        description: A `PageRouteResult` with `state` indicating what happened
  - name: _pageSorts(Page, pages, indexPage)
    uid: gramstax!Gramstax#_pageSorts:member(1)
    package: gramstax!
    fullName: _pageSorts(Page, pages, indexPage)
    summary: Sorts and categorizes page routes into routing tables.
    remarks: >-
      Registration happens in 3 phases:


      \*\*Phase 1 — Non-session static/intent routes\*\* (id=2, id=3): Iterates `listRouteStatic` and
      `listRouteStaticIntent`<!-- -->. Registers exact-match routes (`handleCallbackQueryData`<!-- -->, `handleText`<!--
      -->, `handleCommandText`<!-- -->, `handleCaption*`<!-- -->, `handleCommandCaption*`<!-- -->) into `routeStatic` —
      and intent-with-args variants (`handleArgs*`<!-- -->, `handleCommandArgs*`<!-- -->, `handleCaptionArgs*`<!-- -->,
      `handleCommandCaptionArgs*`<!-- -->) into `routeStaticIntent`<!-- -->. Routes are keyed by `intentCommandText`
      (prefixed with `/`<!-- -->), `intentCallbackQueryData`<!-- -->, `intentText`<!-- -->, or `Page.data.name`<!-- -->.


      \*\*Phase 2 — Session routes\*\* (id=1): Iterates `listRouteStaticSession`<!-- -->. Registers session-aware
      variants of all static and free routes (`handleSession*`<!-- -->) into `routeStaticSession`<!-- -->. Keyed by the
      return value of the corresponding `methodSession*()` method (e.g., `methodSessionFreeText(PageName)` → session
      method string).


      \*\*Phase 3 — Non-session free handlers\*\* (id=4): Scans for `handleFree*` methods defined directly on the page
      (via `Object.hasOwn(proto, routeName)`<!-- -->). Excludes inherited `handleSessionFree*` variants — those are
      dispatched exclusively via session routing (id=1).


      Also populates: - `routeDynamic[Page.data.name]` — global fallback `handleFree()` handler - `all[Page.data.name]`
      — page class reference
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: '_pageSorts(Page: typeof Ctx, pages: typeof Gramstax.prototype.pages, indexPage: number): void;'
      parameters:
        - id: Page
          description: The page class.
          type: typeof <xref uid="gramstax!Ctx:class" />
        - id: pages
          description: The pages routing structure.
          type: typeof gramstax!Gramstax#<xref uid="pages:member" />
        - id: indexPage
          description: The page index (used for shortCallbackQueryData).
          type: number
      return:
        type: void
        description: ''
