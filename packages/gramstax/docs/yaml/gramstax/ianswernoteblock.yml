### YamlMime:TSTypeAlias
name: IAnswerNoteBlock
uid: gramstax!IAnswerNoteBlock:type
package: gramstax!
fullName: IAnswerNoteBlock
summary: Answer-note block for query answers without template content.
remarks: >-
  Declared with `<g-answer-note>` blocks. Guest and web app answers carry caller-built results, so the block exists only
  as fail-fast validation that the template provides the required `AGBaseId` (plus a future content slot). `text`
  supports the same `{{var|filter}}` interpolation pipeline as poll questions.
example:
  - |-
    ```typescript
    const note: IAnswerNoteBlock = {
      text: `Guest answer`
    }
    ```
isPreview: false
isDeprecated: false
syntax: |-
  type IAnswerNoteBlock = {
      text: string;
  };
