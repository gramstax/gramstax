name: WebhookQueue
uid: gramstax!WebhookQueue:class
package: gramstax!
fullName: WebhookQueue
summary: Webhook update queue — in-memory bounded FIFO for sequential processing.
remarks: >-
  Provides a bounded FIFO queue for Telegram webhook updates, ensuring they are processed sequentially. Useful for
  long-polling fallback or rate-limited webhook processing.
