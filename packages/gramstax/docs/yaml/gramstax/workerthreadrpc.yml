  - name: makeRequest(method, params, _wait, _others)
    uid: gramstax!WorkerThreadRpc#makeRequest:member(1)
    package: gramstax!
    fullName: makeRequest(method, params, _wait, _others)
    summary: Create and send an RPC request.
    remarks: ''
    example:
      - |-
        ```typescript
        // Wait for response
        const result = await rpc.makeRequest("add", [1, 2]);
        console.log(result); // 3

        // Fire and forget
        rpc.makeRequest("log", ["message"], false);
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'makeRequest(method: string, params: any, _wait?: boolean, _others?: Record<string, any>): Promise<any>;'
      parameters:
        - id: method
          description: Method name to call. Targets registered method.
          type: string
        - id: params
          description: Method parameters. Sent as positional array.
          type: any
        - id: _wait
          description: Wait for response. If false, returns send result. Defaults to `true`<!-- -->.
          type: boolean
        - id: _others
          description: Additional data to include. Merged into RPC payload.
          type: Record&lt;string, any&gt;
      return:
        type: Promise&lt;any&gt;
        description: Promise resolving to the result if waiting, or send result if not.
