name: WorkerThreadRpc
uid: gramstax!WorkerThreadRpc:class
package: gramstax!
fullName: WorkerThreadRpc
summary: Handles JSON-RPC style communication between threads.
remarks: >-
  Uses simple JSON-RPC style messages with `id`<!-- -->, `method`<!-- -->, `params`<!-- -->, `result`<!-- -->,
  `error`<!-- -->. Typically used internally by [WorkerThreadInit](xref:gramstax!WorkerThreadInit:class) and
  [WorkerThreadLaunch](xref:gramstax!WorkerThreadLaunch:class)<!-- -->.
example:
  - |-
    ```typescript
    import { WorkerThreadRpc } from "gramstax";

    const rpc = new WorkerThreadRpc((data) => postMessage(data), {
      add: (a: number, b: number) => a + b,
      multiply: (a: number, b: number) => a * b,
    });

    // Handle incoming messages
    parentPort.on("message", (data) => {
      rpc.make(data);
    });
    ```
isPreview: false
isDeprecated: false
