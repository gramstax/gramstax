### YamlMime:TSTypeAlias
name: IMockTelegramServerOptions
uid: gramstax!IMockTelegramServerOptions:type
package: gramstax!
fullName: IMockTelegramServerOptions
summary: Options for configuring the mock Telegram server.
remarks: Use `handlers` to override specific methods, and `defaultHandler` as a fallback for any unmatched method.
example:
  - |-
    ```typescript
    const options: IMockTelegramServerOptions = {
      port: 0,
      handlers: {
        getMe: () => ({ok: true, result: {is_bot: true}})
      }
    }
    ```
isPreview: false
isDeprecated: false
syntax: |-
  type IMockTelegramServerOptions = {
      hostname?: string;
      port?: number;
      log?: IMockTelegramLog | boolean | null;
      handlers?: Record<string, IMockTelegramHandler>;
      defaultHandler?: IMockTelegramHandler;
  };
