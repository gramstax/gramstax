### YamlMime:TSTypeAlias
name: IWidgetAnswerBlock
uid: gramstax!IWidgetAnswerBlock:type
package: gramstax!
fullName: IWidgetAnswerBlock
summary: Widget-answer block for Telegram widget-query feedback.
remarks: >-
  Declared with `<g-widget-answer>` blocks. `text` supports the same `{{var|filter}}` interpolation pipeline as callback
  answers; the compiled value is an opaque data payload for the widget's JS (not user-facing copy), plain text without
  HTML, at most 1024 UTF-8 bytes per the Bot API `answerWidgetQuery` limits.
example:
  - |-
    ```typescript
    const answer: IWidgetAnswerBlock = {
      text: `ok {{orderId}}`
    }
    ```
isPreview: false
isDeprecated: false
syntax: |-
  type IWidgetAnswerBlock = {
      text: string;
  };
