### YamlMime:TSTypeAlias
name: ITInvoiceBlock
uid: gramstax!ITInvoiceBlock:type
package: gramstax!
fullName: ITInvoiceBlock
summary: Represents an invoice block configuration for Telegram payments.
remarks: >-
  This type defines the structure for template-driven invoices declared with `<g-invoice>` blocks. The title,
  description, payload, and price labels support the same `{{var|filter}}` interpolation pipeline as poll questions; the
  compiled strings are length-checked at runtime before any API call (title 1–32 chars, description 1–255 chars, payload
  1–128 bytes per the Bot API `sendInvoice` limits). `currency` is a 3-letter code (`XTR` for Telegram Stars, otherwise
  an ISO 4217 fiat code). `prices` holds 1 or more line items with positive integer `amount` values in the smallest
  currency units. Provider tokens are NEVER part of this type — they must come from `renderInvoice` options, never
  templates.
example:
  - |-
    ```typescript
    const stars: ITInvoiceBlock = {
      title: `VIP 30 hari`,
      description: `Akses semua konten`,
      payload: `order-1`,
      currency: `XTR`,
      prices: [{label: `VIP 30 hari`, amount: 100}]
    };
    ```
isPreview: false
isDeprecated: false
syntax: |-
  type ITInvoiceBlock = {
      title: string;
      description: string;
      payload: string;
      currency: string;
      prices: Array<{
          label: string;
          amount: number;
      }>;
  };
