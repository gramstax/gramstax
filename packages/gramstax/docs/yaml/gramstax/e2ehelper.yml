    remarks: ''
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'constructor(bot: Gramstax);'
      parameters:
        - id: bot
          description: The parent Gramstax instance.
          type: <xref uid="gramstax!Gramstax:class" />
properties:
