### YamlMime:TSType
name: E2eHelper
uid: gramstax!E2eHelper:class
package: gramstax!
fullName: E2eHelper
summary: In-process E2E testing helper — simulates Telegram updates without HTTP.
remarks: >-
  Provides a lightweight alternative to spinning up a full webhook server for E2E tests. Uses `bot.api.config.use()` to
  intercept all outbound Bot API calls in memory (0 HTTP, 0 Bun.serve), and injects Telegram Update objects directly via
  `bot.bot.handleUpdate()`<!-- -->.


  Attached to `Gramstax.e2e` when the bot is created with `deploy: "test"`<!-- -->. All methods simulate Telegram
  updates without any HTTP server or port binding.


  \*\*Typical usage:\*\*


  ```typescript

  import {BotCore} from "../src/core/bot"


  const bot = new BotCore({deploy: "test", token: "test", log: false})

  const e2e = bot.e2e


  const responses = await e2e.sendText("/start", {user: {id: 2001}})

  expect(responses[0]?.body?.text).toContain("Welcome")

  ```
