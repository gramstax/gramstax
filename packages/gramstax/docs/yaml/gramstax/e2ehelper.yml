      parameters:
        - id: page
          description: Page name.
          type: string
        - id: aGBaseId
          description: Base block ID.
          type: string
        - id: aType
          description: Keyboard type (`"inline"` or `"bottom"`<!-- -->).
          type: '`inline` | `bottom`'
        - id: data
          description: Template data variables.
          type: Record&lt;string, any&gt;
        - id: aLang
          description: Language code (default `"default"`<!-- -->).
