name: E2eHelper
uid: gramstax!E2eHelper:class
package: gramstax!
fullName: E2eHelper
summary: In-process E2E testing helper for Gramstax bots.
remarks: >-
  Attached to `Gramstax.e2e` when the bot is created with `deploy: "test"`<!-- -->. All methods simulate Telegram
  updates without any HTTP server or port binding.
example: []
isPreview: false
isDeprecated: false
type: class
constructors:
