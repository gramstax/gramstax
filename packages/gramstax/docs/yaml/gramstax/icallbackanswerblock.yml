### YamlMime:TSTypeAlias
name: ICallbackAnswerBlock
uid: gramstax!ICallbackAnswerBlock:type
package: gramstax!
fullName: ICallbackAnswerBlock
summary: Callback-answer block for Telegram inline-button feedback.
remarks: >-
  Declared with `<g-callback-answer>` blocks. `text` supports the same `{{var|filter}}` interpolation pipeline as poll
  questions; the compiled value is length-checked at runtime before any API call (toast text at most 200 chars, plain
  text without HTML per the Bot API `answerCallbackQuery` limits).
example:
  - |-
    ```typescript
    const answer: ICallbackAnswerBlock = {
      text: `Pesanan {{orderId}} diproses`
    }
    ```
isPreview: false
isDeprecated: false
syntax: |-
  type ICallbackAnswerBlock = {
      text: string;
  };
