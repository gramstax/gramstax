### YamlMime:TSType
name: LabelGKeyboard
uid: gramstax!LabelGKeyboard:class
package: gramstax!
fullName: LabelGKeyboard
summary: Provides static utilities for keyboard data manipulation, specifically for reversing keyboard button order.
remarks: >-
  Used as base class for user-defined keyboard data classes. Provides button order manipulation for multi-language
  keyboards.
example:
  - |-
    ```typescript
    import { LabelGKeyboard } from "gramstax";

    export class KeyboardGLabel extends LabelGKeyboard {
      static home = {
        id: "Rumah",
        en: "Home"
      }
      static backNext = {
        id: "Kembali, Lanjut",
        en: "Back, Next"
      }
      static oneTwo = this._reverseObj({
        id: "Satu, Dua",
        en: "One, Two"
      })
      static threeFour = {
        id: this._reverse("Tiga, Empat"),
        en: "Three, Four"
      }
    }

    const kbl = KeyboardGLabel
    kbl.home.id // => "Rumah"
    kbl.backNext.id // => "Kembali, Lanjut"
    kbl.oneTwo.id // => "Dua, Satu"
    kbl.oneTwo.en // => "Two, One"
    kbl.threeFour.id // => "Empat, Tiga"
    kbl.threeFour.en // => "Three, Four"
    ```
isPreview: false
isDeprecated: false
type: class
methods:
  - name: _reverse(input)
    uid: gramstax!LabelGKeyboard._reverse:member(1)
    package: gramstax!
    fullName: _reverse(input)
    summary: Reverse the order of comma-separated button labels.
    remarks: ''
    example:
      - |-
        ```typescript
        const reversed = LabelGKeyboard._reverse("Back, Next, Submit");
        // => "Submit, Next, Back"

        // Escaped commas are preserved
        const preserved = LabelGKeyboard._reverse("Option A\\, B, Option C");
        // => "Option C, Option A\\, B"
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static _reverse(input: string): string;'
      parameters:
        - id: input
          description: Comma-separated button labels. Escaped commas (`\,`<!-- -->) are preserved.
          type: string
      return:
        type: string
        description: Reversed comma-separated labels.
  - name: _reverseObj(input)
    uid: gramstax!LabelGKeyboard._reverseObj:member(1)
    package: gramstax!
    fullName: _reverseObj(input)
    summary: Reverse button order for all languages in an object.
    remarks: ''
    example:
      - |-
        ```typescript
        const reversed = LabelGKeyboard._reverseObj({
          en: "Back, Next",
          id: "Kembali, Lanjut",
        });
        // => { en: "Next, Back", id: "Lanjut, Kembali" }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static _reverseObj<T extends Record<string, string>>(input: T): T;'
      parameters:
        - id: input
          description: >-
            Object with language keys and button values. Applies
            [LabelGKeyboard.\_reverse()](xref:gramstax!LabelGKeyboard._reverse:member(1)) to each value.
          type: T
      return:
        type: T
        description: Object with reversed labels.
