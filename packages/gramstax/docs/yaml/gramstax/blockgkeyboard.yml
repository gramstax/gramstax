### YamlMime:TSType
name: BlockGKeyboard
uid: gramstax!BlockGKeyboard:class
package: gramstax!
fullName: BlockGKeyboard
summary: Provides static methods for generating keyboard template blocks from `LabelGKeyboard` definitions.
remarks: >-
  This class generates HTML-like `<g-keyboard>` blocks for the template engine. Requires `LabelGKeyboard` to be set via
  [BlockGKeyboard.label](xref:gramstax!BlockGKeyboard.label:member) before using
  [BlockGKeyboard.\_build()](xref:gramstax!BlockGKeyboard._build:member(1))<!-- -->.
example:
  - |-
    ```typescript
    // blocks/g-keyboard.ts
    import { BlockGKeyboard, LabelGKeyboard } from "gramstax";

    class KeyboardGBlock extends BlockGKeyboard {
      static label = class extends LabelGKeyboard {
        static backNext = {en: "Back, Next", id: "Kembali, Lanjut"}
      }
      static backNext = (lang?: string, type?: string) => this._build(`backNext`, lang, type)
    }

    // base/page.ts
    import {KeyboardGBlock} from "~/blocks/g-keyboard"
    export abstract class PageBase extends CtxCore {
      static kbk = KeyboardGBlock
      static kbl = KeyboardGBlock.label
    }

    // pages/some.ts
    import {PageBase} from "~/base/page"
    export class SomePage extends PageBase {
      static template = `
        <g-base>
          ${this.kbk.backNext()}
          <g-message>Default message hello world</g-message>
        </g-base>
        <g-base id="others-id-1">
          <g-message>Message from others id 1 with keyboard from base id default</g-message>
        </g-base>
        <g-base id="others-id-2">
          <g-base>${this.kbk.backNext()}</g-base>
          <g-message>Message from others id 3 with keyboard in same base</g-message>
        </g-base>
      `
    }

    // understanding example
    this.kbk.backNext() // will show all language with block template
    this.kbk.backNext("id") // will show all language only (lang="id") with block template
    this.kbk.backNext("default") // will show all language only (lang="default" or without lang) with block template
    ```
isPreview: false
isDeprecated: false
type: class
properties:
  - name: label
    uid: gramstax!BlockGKeyboard.label:member
    package: gramstax!
    fullName: label
    summary: Reference to the `LabelGKeyboard` class containing keyboard definitions.
    remarks: Must be set before using [BlockGKeyboard.\_build()](xref:gramstax!BlockGKeyboard._build:member(1))<!-- -->.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        /** @virtual */
        static label: typeof LabelGKeyboard;
      return:
        type: typeof <xref uid="gramstax!LabelGKeyboard:class" />
methods:
  - name: _build(key, lang, type, reverse)
    uid: gramstax!BlockGKeyboard._build:member(1)
    package: gramstax!
    fullName: _build(key, lang, type, reverse)
    summary: Build keyboard blocks by calling a method from the linked `LabelGKeyboard`<!-- -->.
    remarks: ''
    example:
      - |-
        ```typescript
        // Assuming BlockGKeyboard.label = MyKeyboards with backNext() method

        const kbk = BlockGKeyboard
        kbk._build("backNext");
        // => '<g-keyboard type="inline" lang="en">Back, Next</g-keyboard> ...'

        kbk._build("backNext", "en", "bottom");
        // => '<g-keyboard type="bottom" lang="en">Back, Next</g-keyboard>'
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static _build(key: string, lang?: string, type?: string, reverse?: boolean): string;'
      parameters:
        - id: key
          description: Method name in LabelGKeyboard. Must exist or throws.
          type: string
        - id: lang
          description: Target language. If set, returns single language block.
          type: string
        - id: type
          description: Keyboard type. Values are `"inline"` or `"bottom"`<!-- -->. Defaults to `"inline"`<!-- -->.
          type: string
        - id: reverse
          description: Reverse button order. If true, reverses comma-separated labels.
          type: boolean
      return:
        type: string
        description: Keyboard block string.
