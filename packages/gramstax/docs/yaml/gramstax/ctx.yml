        undefined, AGBaseId: string, options?: IOptGift | null): Promise<true>;
      parameters:
        - id: target
          description: Gift recipient user id.
          type: number
        - id: giftId
          description: Telegram gift identifier.
          type: string
        - id: keyboard
          description: >-
            Must stay null: `sendGift` carries no reply markup, so a non-null keyboard throws before any API call (or
            null to omit).
