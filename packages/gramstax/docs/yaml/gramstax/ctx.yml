  - name: startGiveaway(params, options)
    uid: gramstax!Ctx#startGiveaway:member(1)
    package: gramstax!
    fullName: startGiveaway(params, options)
    summary: Starts a channel giveaway from a single params object.
    remarks: >-
      Data-driven by design (no `<g-giveaway>` block): `sendGiveaway` has no `parse_mode`<!-- -->, so template
      interpolation adds no value. Requires the bot to be an administrator in the target channel; the installed grammy
      exposes no typed `sendGiveaway` (neither `api.` nor `api.raw.`<!-- -->), so this validates fail-fast then sends
      through a structurally-typed raw call (grammy's raw client dispatches any method name at runtime). Fail-fast
      validation (1+ channels, future integer `date`<!-- -->, positive integer `winners`<!-- -->, non-empty `prize`<!--
      -->) runs BEFORE any API call — programmer errors always throw, never fall back. The first channel receives the
      giveaway message and doubles as the primary `chats` entry. Channel-targeted by design, so this keeps `api.raw`
      (context-aware `replyWith*` can only reach the current chat).


      Observe-only send-error coverage (mirrors `renderDice`<!-- -->): failures are classified via
      `Ctx.classifySendError`<!-- -->, reported to `notifySendError`<!-- -->, and logged (`retryable` → `log.error`<!--
      -->, `fallback-text` → `log.warn`<!-- -->). There is no degraded fallback content for giveaways, so after
      notify+log the original error is ALWAYS rethrown untouched.
    example:
      - |-
        ```typescript
        async handleLaunch() {
          await this.startGiveaway({channels: `@mychannel`, date: 1893456000, winners: 2, prize: `iPhone 16`})
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'startGiveaway(params?: IGiveawayParams | null, options?: IGiveawayOptions | null): Promise<unknown>;'
      parameters:
        - id: params
          description: Giveaway params `{channels, date, winners, prize}` (or null — throws).
          type: <xref uid="gramstax!IGiveawayParams:type" /> | null
        - id: options
          description: Optional giveaway flags such as `onlyNewMembers` (or null to omit).
          type: <xref uid="gramstax!IGiveawayOptions:type" /> | null
      return:
        type: Promise&lt;unknown&gt;
        description: The sent giveaway message object.
  - name: stopLiveLocation(chatId, messageId, options)
    uid: gramstax!Ctx#stopLiveLocation:member(1)
    package: gramstax!
    fullName: stopLiveLocation(chatId, messageId, options)
    summary: Stops a live location message, freezing it at its last position.
    remarks: >-
      Thin passthrough to `api.stopMessageLiveLocation` — no template involved. Use with a message previously sent by
      [Ctx.renderLocation()](xref:gramstax!Ctx%23renderLocation:member(1)) with a `live` period. There is no live-edit
      method by design: live position updates go via raw `api.editMessageLiveLocation`<!-- -->.


      why-not-base: base `Context.stopMessageLiveLocation` omits `chat_id`<!-- -->/`message_id` (current-context only);
      this targets any chat/message.
    example:
      - |-
        ```typescript
        async handleStopSharing() {
          await this.stopLiveLocation(this.chat!.id, 42)
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        stopLiveLocation(chatId: number, messageId: number, options?:
        Parameters<Ctx[`api`][`stopMessageLiveLocation`]>[2] | null): Promise<true | (grammy_types.Update.Edited &
        grammy_types.Message.CommonMessage & {
                location: grammy_types.Location;
            })>;
      parameters:
        - id: chatId
          description: Chat holding the live location message.
          type: number
        - id: messageId
          description: Message id of the live location to stop.
          type: number
        - id: options
          description: Optional extra `stopMessageLiveLocation` fields (or null to omit).
          type: Parameters&lt;<xref uid="gramstax!Ctx:class" />[`api`][`stopMessageLiveLocation`]&gt;[2] | null
      return:
        type: >-
          Promise&lt;true | (<xref uid="@grammyjs/types!Update.Edited:interface" /> & <xref
          uid="@grammyjs/types!Message.CommonMessage:interface" /> & {
                  location: <xref uid="@grammyjs/types!Location:interface" />;
              })&gt;
        description: '`true` on success.'
  - name: stopPoll(chatId, messageId, options)
    uid: gramstax!Ctx#stopPoll:member(1)
    package: gramstax!
    fullName: stopPoll(chatId, messageId, options)
    summary: Stops a live poll, closing voting and returning the final results.
    remarks: >-
      Primary form `stopPoll(chatId, messageId, options?)` is a thin passthrough to `api.stopPoll` — no template
      involved. Use with a message previously sent by [Ctx.renderPoll()](xref:gramstax!Ctx%23renderPoll:member(1))<!--
      -->. The inherited `Context.stopPoll(other?, signal?)` form still works and stops the poll in the current context.


      why-not-base: base `Context.stopPoll` omits `chat_id`<!-- -->/`message_id` (current-context only); the explicit
      form targets any chat.
    example:
      - |-
        ```typescript
        async handleStopPoll() {
          await this.stopPoll(this.chat!.id, 42)
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        stopPoll(chatId?: number | Parameters<Context[`stopPoll`]>[0], messageId?: number |
        Parameters<Context[`stopPoll`]>[1], options?: Parameters<Ctx[`api`][`stopPoll`]>[2] | null):
        Promise<grammy_types.Poll>;
      parameters:
        - id: chatId
          description: Chat holding the poll message, or the inherited `stopPoll` options object.
          type: number | Parameters&lt;<xref uid="grammy!Context:class" />[`stopPoll`]&gt;[0]
        - id: messageId
          description: Message id of the poll to stop, or the inherited abort signal.
          type: number | Parameters&lt;<xref uid="grammy!Context:class" />[`stopPoll`]&gt;[1]
        - id: options
          description: Optional extra `stopPoll` fields (or null to omit).
          type: Parameters&lt;<xref uid="gramstax!Ctx:class" />[`api`][`stopPoll`]&gt;[2] | null
      return:
        type: Promise&lt;<xref uid="@grammyjs/types!Poll:interface" />&gt;
        description: The stopped poll with final vote counts.
extends: <xref uid="grammy!Context:class" />
