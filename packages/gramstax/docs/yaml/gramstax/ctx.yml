  - name: renderRich(keyboard, data, AGBaseId, options1, options2)
    uid: gramstax!Ctx#renderRich:member(1)
    package: gramstax!
    fullName: renderRich(keyboard, data, AGBaseId, options1, options2)
    summary: Sends a rich message reply using the page template.
    remarks: >-
      Uses `replyWithRichMessage` (Telegram Bot API
      [TemplateEngine.BOT\_API\_VERSION](xref:gramstax!TemplateEngine.BOT_API_VERSION:member)<!-- -->) to send
      structured rich text with headings, lists, tables, media, block quotations, collapsible blocks, footnotes, and
      formulas.


      The page template's `<g-message>` HTML content is passed as the `html` field of `InputRichMessage`<!-- -->. Use
      the Bot API 10.1 Rich HTML tags in your template (e.g. `<h1>`<!-- -->, `<table>`<!-- -->, `<blockquote>`<!-- -->)
      — they are validated by
      [TemplateEngine.validateBlockGMessageRich()](xref:gramstax!TemplateEngine.validateBlockGMessageRich:member(1))<!--
      -->.


      Rich message limits: - Up to 32,768 UTF-8 characters - Up to 500 blocks - Up to 16 nesting levels - Up to 20 table
      columns
    example:
      - |-
        ```typescript
        async handleCallbackQueryData() {
          // Rich message with template content
          await this.renderRich()

          // With keyboard and data
          const kb = this.inlineKeyboard((k) => k.text("OK", "ok"))
          await this.renderRich(kb, {name: "John"})
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        renderRich(keyboard?: ITInBoKb | null, data?: ITData | null, AGBaseId?: string | null, options1?:
        ITOptReplyRich[0] | null, options2?: ITOptReplyRich[1] | null):
        Promise<grammy_types.Message.RichMessageMessage>;
      parameters:
        - id: keyboard
          description: >-
            Optional keyboard markup from [Ctx.inlineKeyboard()](xref:gramstax!Ctx%23inlineKeyboard:member(1)) or
            [Ctx.bottomKeyboard()](xref:gramstax!Ctx%23bottomKeyboard:member(1)) (or null to omit).
          type: <xref uid="gramstax!ITInBoKb:type" /> | null
        - id: data
          description: Optional template interpolation data (or null to omit).
          type: <xref uid="gramstax!ITData:type" /> | null
        - id: AGBaseId
          description: Optional template base ID position for block message (or null to use default).
          type: string | null
        - id: options1
          description: Optional `InputRichMessage` fields (`is_rtl`<!-- -->, `skip_entity_detection`<!-- -->) (or null to omit).
          type: <xref uid="gramstax!ITOptReplyRich:type" />[0] | null
        - id: options2
          description: Optional send options (or null to omit).
          type: <xref uid="gramstax!ITOptReplyRich:type" />[1] | null
      return:
        type: Promise&lt;<xref uid="@grammyjs/types!Message.RichMessageMessage:type" />&gt;
        description: The sent message object.
