  - name: broadcast(ids, languageCode, keyboard, data, baseId, options, throwError)
    uid: gramstax!Ctx#broadcast:member(1)
    package: gramstax!
    fullName: broadcast(ids, languageCode, keyboard, data, baseId, options, throwError)
    summary: Sends a message to multiple users in bulk.
    remarks: >-
      Automatically throttles after 30 messages to respect Telegram rate limits. Uses each user's specified language
      code for template rendering.
    example:
      - |-
        ```typescript
        async callback() {
          const userIds = [123456, 789012]
          const langs = ["en", "id"]
          await this.broadcast(userIds, langs)
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        broadcast(ids: number[], languageCode: string[], keyboard?: ITInBoKb, data?: ITData, baseId?: string, options?:
        ITOptReply, throwError?: boolean): Promise<void>;
      parameters:
        - id: ids
          description: Array of user IDs to send the message to.
          type: number[]
        - id: languageCode
          description: Array of language codes corresponding to each user.
          type: string[]
        - id: keyboard
          description: Optional keyboard markup.
          type: <xref uid="gramstax!ITInBoKb:type" />
        - id: data
          description: Optional template interpolation data.
          type: <xref uid="gramstax!ITData:type" />
        - id: baseId
          description: Optional template base ID position for block message.
          type: string
        - id: options
          description: Optional grammY send options.
          type: <xref uid="gramstax!ITOptReply:type" />
        - id: throwError
          description: If true, throws errors instead of swallowing them.
          type: boolean
      return:
        type: Promise&lt;void&gt;
        description: ''
