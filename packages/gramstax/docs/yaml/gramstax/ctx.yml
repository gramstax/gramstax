        ITOptReplyVoice | ITOptReplyVideoNote | ITOptReplySticker | ITOptReplyLocation | ITOptReplyContact, throwError?:
        boolean): Promise<{
                successCount: number;
                failedCount: number;
                totalCount: number;
            }>;
      parameters:
        - id: ids
          description: Array of user IDs to send the media to.
          type: number[]
        - id: languageCode
