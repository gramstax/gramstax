    uid: gramstax!Ctx.MEDIA_UPLOAD_LIMITS:member
    package: gramstax!
    fullName: MEDIA_UPLOAD_LIMITS
    summary: Bot API upload size limits in bytes, per media type.
    remarks: >-
      Values follow the documented Bot API defaults: photo 10MB, animation 10MB, sticker 512KB,
      document/video/audio/voice 50MB. `video_note` uses 50MB as a best-effort byte check — its real constraint is the
      640x640 dimension enforced server-side. Types without an entry (`location`<!-- -->, `contact`<!-- -->) carry no
      bytes and are never size-checked.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static readonly MEDIA_UPLOAD_LIMITS: Record<string, number>;'
      return:
