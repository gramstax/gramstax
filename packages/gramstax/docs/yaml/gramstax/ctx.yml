    uid: gramstax!Ctx#replyWithStream:member(1)
    package: gramstax!
    fullName: replyWithStream(stream, otherMessageDraft, otherMessage, signal)
    summary: >-
      Streams an iterator of message pieces to the current chat, making text appear progressively as editing message
      drafts.
    remarks: >-
      Provided at runtime by the `\@grammyjs/stream` plugin middleware. The `stream()` plugin must be installed on the
      bot for this method to be available. Gramstax registers it by default.


      Each `MessageDraftPiece` is either a plain string or an object `{text, entities?, draft_id?}`<!-- -->. Chunks with
      the same `draft_id` belong to the same draft; the first chunk crossing 4096 chars is split into a new message.
      Entities offsets are relative to the entire stream, not per-chunk.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        replyWithStream(stream: Iterable<MessageDraftPiece> | AsyncIterable<MessageDraftPiece>, otherMessageDraft?:
