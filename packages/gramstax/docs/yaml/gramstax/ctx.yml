  - name: renderEditMedia(type, keyboardInline, data, AGBaseId, options1, options2, fallbackEdit)
    uid: gramstax!Ctx#renderEditMedia:member(1)
    package: gramstax!
    fullName: renderEditMedia(type, keyboardInline, data, AGBaseId, options1, options2, fallbackEdit)
    summary: |-
      Edits an existing media message with dynamic type selection.

      Template block: `<g-media>` (read via `getGMedia`<!-- -->).
    remarks: >-
      For media types that cannot be edited (voice, video\_note, sticker, location, contact), the original message is
      deleted and a new one is sent. Multi-src media groups cannot replace a single message, so supported pipe-delimited
      media groups also delete the original message and send a new media group.


      If the edit itself fails, the fallback behavior is controlled by `fallbackEdit` (default `delete-reply`<!-- -->:
      deletes the original message and re-sends the same media — the result looks like an in-place edit). The fallback
      re-send drops `options1`<!-- -->/ `options2` (edit options do not map to reply options) and logs a `log.warn` when
      non-empty options are dropped; the re-send itself follows `Ctx.classifySendError` via `renderMedia` (`retryable`
      rethrows the original error untouched, `fallback-text` replies with fallback text). Fail-fast validation runs
      BEFORE any API call — programmer errors always throw, never fall back.
    example:
      - |-
        ```typescript
        async handleArgsCallback() {
          await this.renderEditMedia("photo")
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        renderEditMedia<T extends Exclude<IMediaBlock[`type`], `group`>>(type: T, keyboardInline?: IInlineKb | null,
        data?: IData | null, AGBaseId?: string | null, options1?: (T extends `voice` ? IOptReplyVoice : T extends
        `video_note` ? IOptReplyVideoNote : T extends `sticker` ? IOptReplySticker : T extends `location` ?
        IOptReplyLocation : T extends `contact` ? IOptReplyContact : IOptEditMedia1) | null, options2?: IOptEditMedia2 |
        null, fallbackEdit?: IOptFallbackEdit): Promise<unknown>;
      parameters:
        - id: type
          description: The media type.
          type: T
        - id: keyboardInline
          description: Optional inline keyboard markup (or null to omit).
          type: <xref uid="gramstax!IInlineKb:type" /> | null
        - id: data
          description: Optional template interpolation data (or null to omit).
          type: <xref uid="gramstax!IData:type" /> | null
        - id: AGBaseId
          description: Optional template g-base ID position for block media (or null to use default).
          type: string | null
        - id: options1
          description: Type-specific media options (or null to omit).
          type: >-
            (T extends `voice` ? <xref uid="gramstax!IOptReplyVoice:type" /> : T extends `video_note` ? <xref
            uid="gramstax!IOptReplyVideoNote:type" /> : T extends `sticker` ? <xref uid="gramstax!IOptReplySticker:type"
            /> : T extends `location` ? <xref uid="gramstax!IOptReplyLocation:type" /> : T extends `contact` ? <xref
            uid="gramstax!IOptReplyContact:type" /> : <xref uid="gramstax!IOptEditMedia1:type" />) | null
        - id: options2
          description: Additional edit options (or null to omit).
          type: <xref uid="gramstax!IOptEditMedia2:type" /> | null
        - id: fallbackEdit
          description: >-
            Fallback when the edit fails: `delete-reply` (default) deletes the original message then re-sends the media;
            `reply` sends without deleting; `disable` rethrows the error.
          type: <xref uid="gramstax!IOptFallbackEdit:type" />
      return:
        type: Promise&lt;unknown&gt;
        description: The edited/sent message object.
  - name: renderEditMediaGroup(type, data, AGBaseId, options, fallbackEdit)
    uid: gramstax!Ctx#renderEditMediaGroup:member(1)
    package: gramstax!
    fullName: renderEditMediaGroup(type, data, AGBaseId, options, fallbackEdit)
    summary: Replaces the current message with a media group filtered by the given type.
    remarks: >-
      Deletes the original message and sends a new media group via `replyMediaGroup`<!-- -->. When `type` is omitted or
      `undefined`<!-- -->, all items in the `<g-media-group>` are sent. For a hardcoded type, use the convenience
      methods (`editPhotoGroup`<!-- -->, `editVideoGroup`<!-- -->, etc.). If the delete-and-send fails, the fallback
      behavior is controlled by `fallbackEdit` with identical semantics to `renderEditMedia` (`delete-reply` retries the
      delete then re-sends; `reply` re-sends without deleting; `disable` rethrows). The re-send follows
      `Ctx.classifySendError` via `renderMediaGroup`<!-- -->. Fail-fast validation runs BEFORE any API call.
    example:
      - |-
        ```typescript
        async handleCallbackQueryData() {
          // send only photos
          await this.renderEditMediaGroup("photo")
        }

        async handleShowAll() {
          // send all media-group items
          await this.renderEditMediaGroup()
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        renderEditMediaGroup(type?: IMediaGroupType | null, data?: IData | null, AGBaseId?: string | null, options?:
        IOptReplyPhoto | IOptReplyVideo | IOptReplyAudio | IOptReplyDocument | null, fallbackEdit?: IOptFallbackEdit):
        Promise<unknown>;
      parameters:
        - id: type
          description: Optional media type filter. All items sent when omitted.
          type: <xref uid="gramstax!~IMediaGroupType:type" /> | null
        - id: data
          description: Optional template interpolation data (or null to omit).
          type: <xref uid="gramstax!IData:type" /> | null
        - id: AGBaseId
          description: Optional template g-base ID position for block media (or null to use default).
          type: string | null
        - id: options
          description: Optional media-agnostic options (or null to omit).
          type: >-
            <xref uid="gramstax!IOptReplyPhoto:type" /> | <xref uid="gramstax!IOptReplyVideo:type" /> | <xref
            uid="gramstax!IOptReplyAudio:type" /> | <xref uid="gramstax!IOptReplyDocument:type" /> | null
        - id: fallbackEdit
          description: >-
            Fallback when the edit fails: `delete-reply` (default) deletes the original message then sends a new one;
            `reply` sends without deleting; `disable` rethrows the error.
          type: <xref uid="gramstax!IOptFallbackEdit:type" />
      return:
        type: Promise&lt;unknown&gt;
        description: The sent media group messages.
