  - name: sessionKey()
    uid: gramstax!Ctx#sessionKey:member(1)
    package: gramstax!
    fullName: sessionKey()
    summary: Builds the cache key that scopes this session.
    remarks: >-
      Keyed by user id \*\*and\*\* chat id so the same user in two chats keeps two independent sessions — a private chat
      and a group must not share pending state. The userless case (channel posts, anonymous admins) degrades to
      `:chatId`<!-- -->, which still scopes by chat instead of collapsing every userless update into one shared bucket.


      A missing chat id yields an empty second segment rather than throwing, so private chats still key on the user
      alone.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'sessionKey(): string;'
      return:
        type: string
        description: The `userId:chatId` session cache key.
  - name: setSession(method, params, moreRoot)
    uid: gramstax!Ctx#setSession:member(1)
    package: gramstax!
    fullName: setSession(method, params, moreRoot)
    summary: \[LOW-LEVEL\] Sets session data for the current user.
    remarks: >-
      Low-level API. In most cases use the shorthand `setSession*` methods instead (e.g.
      [Ctx.setSessionFreeText()](xref:gramstax!Ctx%23setSessionFreeText:member(1))<!-- -->,
      [Ctx.setSessionCallbackQueryData()](xref:gramstax!Ctx%23setSessionCallbackQueryData:member(1))<!-- -->).


      This method is only needed when: - \*\*Multi-session\*\* — binding the same params to multiple route handlers at
      once: `setSession([methodSessionFreeVideo(), methodSessionFreeText()], params)` - \*\*Dynamic method name\*\* —
      method string is computed at runtime rather than known at dev-time, so `methodSession*()` cannot be called.
    example:
      - |-
        ```typescript
        // ❌ Avoid — use setSessionFreeText({...}) instead
        await this.setSession(this.methodSessionFreeText(), {step: "awaiting_name"})

        // ✅ Multi-session — bind one payload to two listeners
        await this.setSession(
          [this.methodSessionFreeVideo(), this.methodSessionFreeText()],
          {mediaId: "abc123"}
        )
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        setSession(method: string | string[], params?: Record<string, unknown>, moreRoot?: Record<string, unknown>):
        Promise<boolean | null>;
      parameters:
        - id: method
          description: Route method name(s). Use `this.methodSession*()` helpers for type-safe names, not a hardcoded string.
          type: string | string[]
        - id: params
          description: The session parameters to store.
          type: Record&lt;string, unknown&gt;
        - id: moreRoot
          description: Additional root-level properties to merge.
          type: Record&lt;string, unknown&gt;
      return:
        type: Promise&lt;boolean | null&gt;
        description: True if the session was set successfully, or null on error.
