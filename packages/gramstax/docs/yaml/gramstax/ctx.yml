          Promise&lt;{
                  successCount: number;
                  failedCount: number;
                  totalCount: number;
              }&gt;
        description: ''
  - name: renderBroadcastMedia(ids, languageCode, keyboard, data, AGBaseId, options, throwError)
    uid: gramstax!Ctx#renderBroadcastMedia:member(1)
    package: gramstax!
    fullName: renderBroadcastMedia(ids, languageCode, keyboard, data, AGBaseId, options, throwError)
    summary: Sends a media message to multiple users in bulk.
    remarks: >-
      Media type and arg are inferred from the template `<g-media>` block. If a supported media type (`photo`<!-- -->,
      `video`<!-- -->, `audio`<!-- -->, `document`<!-- -->) uses a pipe-delimited `src`<!-- -->, it is sent as a
      Telegram media group. Telegram media groups do not support reply markup, so keyboards are ignored for grouped
      media. Automatically throttles after 30 messages to respect Telegram rate limits. Uses each user's specified
      language code for template rendering.
    example:
      - |-
        ```typescript
        async handleCallbackQueryData() {
          const userIds = [123456, 789012]
          const langs = ["en", "id"]
          await this.renderBroadcastMedia(userIds, langs)
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        renderBroadcastMedia(ids: number[], languageCode: string[], keyboard?: ITInBoKb | null, data?: ITData | null,
        AGBaseId?: string | null, options?: ITOptReplyPhoto | ITOptReplyVideo | ITOptReplyAudio | ITOptReplyDocument |
        ITOptReplyAnimation | ITOptReplyVoice | ITOptReplyVideoNote | ITOptReplySticker | ITOptReplyLocation |
        ITOptReplyContact | null, throwError?: boolean | null): Promise<{
                successCount: number;
                failedCount: number;
                totalCount: number;
            }>;
      parameters:
        - id: ids
          description: Array of user IDs to send the media to.
          type: number[]
        - id: languageCode
          description: Array of language codes corresponding to each user.
          type: string[]
        - id: keyboard
          description: Optional keyboard markup (or null to omit).
          type: <xref uid="gramstax!ITInBoKb:type" /> | null
        - id: data
          description: Optional template interpolation data (or null to omit).
          type: <xref uid="gramstax!ITData:type" /> | null
        - id: AGBaseId
          description: Optional template g-base ID position for block media (or null to use default).
          type: string | null
        - id: options
          description: Optional send options for the inferred media type (or null to omit).
          type: >-
            <xref uid="gramstax!ITOptReplyPhoto:type" /> | <xref uid="gramstax!ITOptReplyVideo:type" /> | <xref
            uid="gramstax!ITOptReplyAudio:type" /> | <xref uid="gramstax!ITOptReplyDocument:type" /> | <xref
            uid="gramstax!ITOptReplyAnimation:type" /> | <xref uid="gramstax!ITOptReplyVoice:type" /> | <xref
            uid="gramstax!ITOptReplyVideoNote:type" /> | <xref uid="gramstax!ITOptReplySticker:type" /> | <xref
            uid="gramstax!ITOptReplyLocation:type" /> | <xref uid="gramstax!ITOptReplyContact:type" /> | null
        - id: throwError
          description: If true, throws errors instead of swallowing them (or null to use false).
          type: boolean | null
      return:
        type: |-
          Promise&lt;{
                  successCount: number;
                  failedCount: number;
                  totalCount: number;
              }&gt;
        description: ''
