    uid: gramstax!Ctx#renderVenue:member(1)
    package: gramstax!
    fullName: renderVenue(keyboard, data, AGBaseId, options)
    summary: Sends a template-driven venue using the page `<g-venue>` block.
    remarks: >-
      Fail-fast validation (`Ctx.assertVenue`<!-- -->: non-empty title/address plus `Ctx.assertLocation` range checks)
      runs on the COMPILED strings BEFORE any API call — programmer errors always throw, never fall back.


      Observe-only send-error coverage (mirrors `renderPoll`<!-- -->): failures are classified via
      `Ctx.classifySendError`<!-- -->, reported to `notifySendError`<!-- -->, and logged (`retryable` → `log.error`<!--
      -->, `fallback-text` → `log.warn`<!-- -->). There is no degraded fallback content for venues, so after notify+log
      the original error is ALWAYS rethrown untouched.
    example:
      - |-
        ```typescript
        async handleCallbackQueryData() {
          const kb = this.inlineKeyboard((k) => k.text("OK", "ok"))
          await this.renderVenue(kb, {name: `Cafe`, street: `Jl. Merdeka 1`, lat: `-6.2`, long: `106.8`})
        }
        ```
      - |-
        ```typescript
        async handleVenueId() {
          // Template: <g-base id="promo"><g-venue lang="id" title="{{name}}" address="{{street}}" latitude="{{lat}}" longitude="{{long}}"/></g-base>
          await this.renderVenue(null, {name: `Kafe`, street: `Jl. Merdeka 1`, lat: `-6.2`, long: `106.8`}, `promo`)
        }
        ```
