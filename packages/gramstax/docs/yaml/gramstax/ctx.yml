  - name: sessionSet(method, params, moreRoot)
    uid: gramstax!Ctx#sessionSet:member(1)
    package: gramstax!
    fullName: sessionSet(method, params, moreRoot)
    summary: Sets session data for the current user.
    remarks: >-
      Session data is stored in the external cache and persists across requests. Used to maintain state between
      different page interactions.
    example:
      - |-
