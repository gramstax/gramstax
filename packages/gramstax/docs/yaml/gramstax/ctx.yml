  - name: hookAfterRoute()
    uid: gramstax!Ctx#hookAfterRoute:member(1)
    package: gramstax!
    fullName: hookAfterRoute()
    summary: Page-level hook after a route handler execution.
    remarks: >-
      Always runs after the handler returns (even when the handler returns undefined / null). Ideal for cleanup,
      analytics, or chained side effects.


      Useful for: - Recording page visit timestamps - Auto-clearing stale session data - Firing post-processing jobs
    example:
      - |-
        ```typescript
        // Notify admins of high-value actions
        async hookAfterRoute() {
          if (this.temp.session?.params.amount > 10000) {
            await this.api.sendMessage(ADMIN_CHAT_ID, `Large withdrawal: ${this.temp.session.amount}`)
          }
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        /** @virtual */
        hookAfterRoute?(): Promise<void>;
      return:
        type: Promise&lt;void&gt;
        description: ''
  - name: hookBeforeRoute()
    uid: gramstax!Ctx#hookBeforeRoute:member(1)
    package: gramstax!
    fullName: hookBeforeRoute()
    summary: Page-level hook before route handler execution.
    remarks: >-
      Return `false` to \*\*skip only the target route handler\*\* (e.g. `handleFreeText`<!-- -->,
      `handleCallbackQueryData`<!-- -->, etc.). The rest of the framework is untouched — you can still call
      `.render()`<!-- -->, `.renderEdit()`<!-- -->, `.renderCallbackAnswer()`<!-- -->, and other Ctx methods normally
      inside this hook before returning `false`<!-- -->.


      In other words: returning `false` does NOT freeze the page — it only prevents one specific handler from running.


      Useful for: - Per-page cooldown / rate limiting (reply "please wait" then abort) - Precondition checks (reply with
      redirect page then abort) - Session validity gates
    example:
      - |-
        ```typescript
        // Cooldown — reply then abort the handler
        async hookBeforeRoute() {
          const last = await this.cacheSession.get(`${this.from.id}:lastAction`)
          if (last && Date.now() - Number(last) < 2000) {
            await this.renderCallbackAnswer(true, undefined, `cooldown`) // still works
            return false // only skips the target handler
          }
          await this.cacheSession.set(`${this.from.id}:lastAction`, String(Date.now()))
          return true
        }
        ```
      - |-
        ```typescript
        // KYC gate — send redirect page then abort
        async hookBeforeRoute() {
          const profile = await this.db.getUser(this.from.id)
          if (!profile?.kycVerified) {
            await new KycPage(this).showForm() // redirect works
            return false // only skips the guarded handler
          }
          return true
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        /** @virtual */
        hookBeforeRoute?(): Promise<boolean>;
      return:
        type: Promise&lt;boolean&gt;
        description: '`true` to continue (handler runs), `false` to abort (handler skipped).'
  - name: inlineKeyboard(callback, params)
