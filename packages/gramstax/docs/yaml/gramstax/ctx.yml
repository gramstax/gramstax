    uid: gramstax!Ctx#renderWebAppAnswer:member(1)
    package: gramstax!
    fullName: renderWebAppAnswer(webAppQueryId, result, data, AGBaseId, options)
    summary: Answers a web app query via the Bot API with a caller-built result.
    remarks: >-
      Unlike the other answers this carries an explicit query id (there is no context-aware alias — web app queries
      arrive without an answerable update), mirroring `renderGift`<!-- -->'s explicit target. The result content is
      built by the caller from `data` (multilang payloads); the `<g-answer-note>` block is resolved as fail-fast
      validation that the template exists, per the AGBaseId-required policy.


      Observe-only send-error coverage (mirrors `renderGift`<!-- -->): failures are classified via
      `Ctx.classifySendError`<!-- -->, reported to `notifySendError`<!-- -->, and logged (`retryable` → `log.error`<!--
      -->, `fallback-text` → `log.warn`<!-- -->). After notify+log the original error is ALWAYS rethrown untouched.
    example:
      - |-
        ```typescript
        async handleWebAppData() {
          await this.renderWebAppAnswer(queryId, article, undefined, `webapp-card`)
        }
        ```
