      -->/`5xx`<!-- -->/network) never abort the run: they are recorded in `retryable` (absolute `index` + `id` +
      `error`<!-- -->, completion order) while the checkpoint keeps advancing, so callers can re-drive just those
      entries with a fresh pass. `firstError` stays the first failure of any kind. Checkpoint-first (anti-spam over
      speed): `startFrom` resumes after a restart without resending (indexes below count as skipped, `done` in
      `onProgress` counts processed recipients, `total` is `ids.length`<!-- -->); `concurrency` defaults to `1`
      (sequential) and can be raised when throughput matters. Every resolved media input is cloned per recipient via
      `Ctx.cloneMediaInput`<!-- -->, so parallel workers never share one mutable `InputFile` instance.
    example:
