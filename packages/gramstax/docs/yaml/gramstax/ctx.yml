        - id: baseId
          description: Optional template base ID position for block media.
          type: string
        - id: options
          description: Optional grammY send options for the inferred media type.
          type: >-
            <xref uid="gramstax!ITOptReplyPhoto:type" /> | <xref uid="gramstax!ITOptReplyVideo:type" /> | <xref
