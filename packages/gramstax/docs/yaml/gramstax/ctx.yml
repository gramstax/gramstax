  - name: render(keyboard, data, AGBaseId, options)
    uid: gramstax!Ctx#render:member(1)
    package: gramstax!
    fullName: render(keyboard, data, AGBaseId, options)
    summary: |-
      Sends a text message reply using the page template.

      Template block: `<g-message>` (read via `getGMessage`<!-- -->).
    remarks: >-
      Observe-only send-error coverage (mirrors `renderMedia`<!-- -->): failures are classified via
      `Ctx.classifySendError`<!-- -->, reported to `notifySendError`<!-- -->, and logged (`retryable` → `log.error`<!--
      -->, `fallback-text` → `log.warn`<!-- -->). Unlike the media paths there is no degraded fallback content for text,
      so after notify+log the original error is ALWAYS rethrown untouched.
    example:
      - |-
        ```typescript
        async handleCallbackQueryData() {
          // Automatic reply with content from this.template
          await this.render()

          // With keyboard builder and data
          const kb = this.inlineKeyboard((k) => k.text("OK", "ok"))
          await this.render(kb, {name: "John"})

          // With keyboard short and custom AGBaseId between reply and keyboard
          const kb = this.inlineKeyboardT([StartPage], `1`, "my-custom-id")
          await this.render(kb, {name: "John"}, "id-hello-world")
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        render(keyboard?: IInBoKb | null, data?: IData | null, AGBaseId?: string | null, options?: IOptReply | null):
        Promise<grammy_types.Message.TextMessage>;
      parameters:
        - id: keyboard
          description: >-
            Optional keyboard markup from [Ctx.inlineKeyboard()](xref:gramstax!Ctx%23inlineKeyboard:member(1)) or
            [Ctx.bottomKeyboard()](xref:gramstax!Ctx%23bottomKeyboard:member(1)) (or null to omit).
          type: <xref uid="gramstax!IInBoKb:type" /> | null
        - id: data
          description: Optional template interpolation data (or null to omit).
          type: <xref uid="gramstax!IData:type" /> | null
        - id: AGBaseId
          description: Optional template base ID position for block message (or null to use default).
          type: string | null
        - id: options
          description: Optional reply options (or null to omit).
          type: <xref uid="gramstax!IOptReply:type" /> | null
      return:
        type: Promise&lt;<xref uid="@grammyjs/types!Message.TextMessage:type" />&gt;
        description: The sent message object.
