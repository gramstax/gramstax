  - name: cloneMediaInput(value, _roots)
    uid: gramstax!Ctx.cloneMediaInput:member(1)
    package: gramstax!
    fullName: cloneMediaInput(value, _roots)
    summary: Clone a resolved media input so parallel broadcast sends never share one mutable instance.
    remarks: >-
      `resolveMediaInput` returns a pre-built `InputFile` as-is when no `filename` is given; sharing that single
      instance across concurrent `send*` calls risks interleaved stream state. Broadcast paths wrap every resolved value
      with this helper (per recipient, inside the worker), so each send owns its copy. Non-`InputFile` values (`string`
      sources) pass through unchanged. The trailing `roots` param exists for call-site uniformity with
      `resolveMediaInput` and is intentionally ignored — cloning never re-evaluates the jail.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static cloneMediaInput<T>(value: T, _roots?: readonly string[] | null): T;'
      parameters:
        - id: value
          description: Resolved media input (`string` or `InputFile`<!-- -->).
          type: T
        - id: _roots
          description: Ignored; accepted so jail-forwarding call sites read uniformly.
          type: readonly string[] | null
      return:
        type: T
        description: A prototype-preserving shallow clone for `InputFile`<!-- -->, else `value` unchanged.
  - name: deleteBusinessStory(businessConnectionId, storyId)
    uid: gramstax!Ctx#deleteBusinessStory:member(1)
    package: gramstax!
    fullName: deleteBusinessStory(businessConnectionId, storyId)
    summary: Deletes a story previously posted on behalf of a managed business account.
    remarks: >-
      Business-connection-only like [Ctx.postBusinessStory()](xref:gramstax!Ctx%23postBusinessStory:member(1))<!-- -->:
      the same `business_connection_id` (with `can_manage_stories`<!-- -->) that posted the story is required. Only
      presence and the positive-integer `storyId` are fail-fast validated — programmer errors always throw, never fall
      back.


      why-not-base: base `Context.deleteStory` takes no `business_connection_id` at all; this deletes under any
      connection.


      Observe-only send-error coverage (mirrors `renderDice`<!-- -->): failures are classified via
      `Ctx.classifySendError`<!-- -->, reported to `notifySendError`<!-- -->, and logged (`retryable` → `log.error`<!--
      -->, `fallback-text` → `log.warn`<!-- -->). The original error is ALWAYS rethrown untouched after notify+log.
    example:
      - |-
        ```typescript
        async handleDeleteStory() {
          await this.deleteBusinessStory(`conn-1`, 21)
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'deleteBusinessStory(businessConnectionId?: string | null, storyId?: number | null): Promise<true>;'
      parameters:
        - id: businessConnectionId
          description: Business connection id (or null — throws).
          type: string | null
        - id: storyId
          description: Id of the posted story (or null — throws).
          type: number | null
      return:
        type: Promise&lt;true&gt;
        description: '`true` on success.'
