  - name: reply(keyboard, data, baseId, options)
    uid: gramstax!Ctx#reply:member(1)
    package: gramstax!
    fullName: reply(keyboard, data, baseId, options)
    summary: Sends a text message reply using the page template.
    remarks: ''
    example:
      - |-
        ```typescript
        async callback() {
          // Automatic reply with content from this.template
          await this.reply()

          // With keyboard builder and data
          const kb = this.inlineKeyboard((k) => k.text("OK", "ok"))
          await this.reply(kb, {name: "John"})

          // With keyboard short and custom baseId between reply and keyboard
          const kb = this.inlineKeyboardT([StartPage], `1`, "my-custom-id")
          await this.reply(kb, {name: "John"}, "id-hello-world")
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        reply(keyboard?: ITInBoKb, data?: ITData, baseId?: string, options?: ITOptReply):
        Promise<grammy_types.Message.TextMessage>;
      parameters:
        - id: keyboard
          description: >-
            Optional keyboard markup from [Ctx.inlineKeyboard()](xref:gramstax!Ctx%23inlineKeyboard:member(1)) or
            [Ctx.bottomKeyboard()](xref:gramstax!Ctx%23bottomKeyboard:member(1))<!-- -->.
          type: <xref uid="gramstax!ITInBoKb:type" />
        - id: data
          description: Optional template interpolation data.
          type: <xref uid="gramstax!ITData:type" />
        - id: baseId
          description: Optional template base ID position for block message.
          type: string
        - id: options
          description: Optional grammY reply options.
          type: <xref uid="gramstax!ITOptReply:type" />
      return:
        type: Promise&lt;<xref uid="@grammyjs/types!Message.TextMessage:type" />&gt;
        description: The sent message object.
