  - name: resolveMedia(src, filename)
    uid: gramstax!Ctx#resolveMedia:member(1)
    package: gramstax!
    fullName: resolveMedia(src, filename)
    summary: Resolve a media `src` through the instance path jail.
    remarks: >-
      Forwards `this.mediaRoots` into `Ctx.resolveMediaInput`<!-- -->. Jail denial is detected by comparing the jailed
      form against the free form: when the free form would upload (`InputFile`<!-- -->) but the jailed form passes
      through (`string`<!-- -->), the path was denied and a `log.warn` names the rejected path (never file contents).
      Null-safe: an absent `log` stays silent.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'resolveMedia(src: string | InputFile | Buffer | Uint8Array | undefined, filename?: string): string | InputFile;'
      parameters:
        - id: src
          description: Template media `src` (file path, `file_id`<!-- -->, URL, or binary payload).
          type: string | <xref uid="grammy!InputFile:class" /> | Buffer | Uint8Array | undefined
        - id: filename
          description: Optional upload filename forwarded to `resolveMediaInput`<!-- -->.
          type: string
      return:
        type: string | <xref uid="grammy!InputFile:class" />
        description: '`InputFile` for allowed local files and binary payloads, otherwise `src` unchanged.'
  - name: resolveMediaInput(src, filename, roots)
    uid: gramstax!Ctx.resolveMediaInput:member(1)
    package: gramstax!
    fullName: resolveMediaInput(src, filename, roots)
    summary: Resolve a template media `src` into an uploadable value.
    remarks: >-
      When `src` points at a real local file (`existsSync` + `statSync().isFile()`<!-- -->), it is wrapped in `new
      InputFile(src, filename)` so grammy uploads it. `file_id` values, URLs, and missing paths pass through unchanged —
      never throws. Pre-built `InputFile` instances pass through as-is when no `filename` is given; a defined `filename`
      returns a prototype-preserving clone (`Object.create` + `Object.assign`<!-- -->) so shared caller instances are
      never mutated. `Buffer`<!-- -->/`Uint8Array` payloads are wrapped in `new InputFile(src, filename)`<!-- -->.


      Opt-in local-path jail (Q8 option b): when `roots` is a non-empty list, a local file uploads ONLY when its
      resolved absolute form sits under one of the resolved roots — otherwise it passes through unchanged (sent as a
      `file_id`<!-- -->, never throws, never uploads). `null`<!-- -->/empty `roots` keeps current behavior unchanged.
      `file_id`<!-- -->/URL/`Buffer`<!-- -->/`InputFile` sources are unaffected by the jail. Symlink limitation: the
      check is lexical (`resolve` without `realpath` — see `Ctx.isPathUnderRoots`<!-- -->).
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        static resolveMediaInput(src: string | InputFile | Buffer | Uint8Array | undefined, filename?: string, roots?:
        readonly string[] | null): string | InputFile;
      parameters:
        - id: src
          description: Template media `src` (file path, `file_id`<!-- -->, URL, or binary payload).
          type: string | <xref uid="grammy!InputFile:class" /> | Buffer | Uint8Array | undefined
        - id: filename
          description: Optional upload filename; overrides `InputFile.filename` on a clone when defined.
          type: string
        - id: roots
          description: Optional jail roots; `null`<!-- -->/empty disables the jail.
          type: readonly string[] | null
      return:
        type: string | <xref uid="grammy!InputFile:class" />
        description: '`InputFile` for local files and binary payloads, otherwise `src` unchanged.'
