    fullName: renderChunked(keyboard, data, AGBaseId, options, chunkSize)
    summary: |-
      Sends a long template text as sequential chunks using the page template.

      Template block: `<g-message>` (read via `getGMessage`<!-- -->).
    remarks: >-
      Renders the full block FIRST (placeholders never split), then splits deterministically (boundary priority `\n\n` →
