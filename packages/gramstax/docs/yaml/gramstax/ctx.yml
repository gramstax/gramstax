  - name: inlineKeyboardT(PageDest, layout, AGBaseId, data)
    uid: gramstax!Ctx#inlineKeyboardT:member(1)
    package: gramstax!
    fullName: inlineKeyboardT(PageDest, layout, AGBaseId, data)
    summary: Creates an inline keyboard with template-based buttons linked to page destinations.
    remarks: >-
      Shorthand for [Ctx.inlineKeyboard()](xref:gramstax!Ctx%23inlineKeyboard:member(1)) with automatic callback data
      from page destinations.
    example:
      - |-
        ```typescript
        async handleCallbackQueryData() {
          const kb = this.inlineKeyboardT([SettingsPage, HelpPage], "2")
          await this.render(kb)

          // Or with arg
          const kb = this.inlineKeyboardT([SettingsPage.data.callbackQueryData(1), HelpPage.data.callbackQueryData(`hi`)], "2")
          await this.render(kb)

          // Compare with builder for basic but not recomended because very long syntax, only use builder when needed.!
          this.inlineKeyboard((k, a) => k.text(SettingsPage.data.callbackQueryData(), a[0]!).text(HelpPage.data.callbackQueryData(), a[1]!))
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        inlineKeyboardT(PageDest: IKbDest[], layout?: IKbCols, AGBaseId?: string | null, data?: IData | null):
        IInlineKbWithCtx;
      parameters:
        - id: PageDest
          description: Array of page classes or callback data strings.
          type: <xref uid="gramstax!IKbDest:type" />[]
        - id: layout
          description: 'Layout format: "cols" or "cols-lastRow". Default: "1".'
          type: <xref uid="gramstax!IKbCols:type" />
        - id: AGBaseId
          description: >-
            Optional template g-base ID position block keyboard. IMPORTANT: If a `<g-base id="...">` is defined in the
            template, you must set AGBaseId to the same value. Leaving AGBaseId as undefined in this case will cause
            errors (for example, keyboard bindings will not work). A common mistake is defining a base ID in the
            template but not reusing it in the keyboard configuration (or null to use default).
          type: string | null
        - id: data
          description: Optional template interpolation data (or null to omit).
          type: <xref uid="gramstax!IData:type" /> | null
      return:
        type: <xref uid="gramstax!IInlineKbWithCtx:interface" />
        description: The inline keyboard instance.
  - name: isPathUnderRoots(src, roots)
    uid: gramstax!Ctx.isPathUnderRoots:member(1)
    package: gramstax!
    fullName: isPathUnderRoots(src, roots)
    summary: Check whether a local path sits under one of the jail roots.
    remarks: >-
      Both `src` and every root are compared in resolved absolute form (`resolve`<!-- -->); a path equal to a root or
      nested under it (root + separator prefix) is allowed. Symlinks are NOT dereferenced — `resolve` without `realpath`
      is purely lexical, so a symlinked escape inside an allowed root is the operator's responsibility (keep roots free
      of untrusted symlinks or pre-resolve with `realpath` before configuring).
    example: []
    isPreview: false
