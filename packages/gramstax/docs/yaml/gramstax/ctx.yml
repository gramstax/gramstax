    fullName: inlineKeyboard(callback, params)
    summary: Creates an inline keyboard using a builder callback.
    remarks: >-
      The callback receives the keyboard instance and an array of button labels from the template. Supports optional
      caching for performance.
    example:
      - |-
        ```typescript
        async handleCallbackQueryData() {
          const kb = this.inlineKeyboard((k, labels) => {
            labels.forEach((label, i) => k.text(label, `action:${i}`))
            return k
          })
          await this.render(kb)
        }
        ```
