  - name: buildData(callbackQueryData)
    uid: gramstax!Ctx.buildData:member(1)
    package: gramstax!
    fullName: buildData(callbackQueryData)
    summary: Creates page routing data configuration.
    remarks: >-
      This method has multiple overloads: - `buildData()` - Returns default page data with no args. -
      `buildData(callbackQueryData)` - Returns intentCallbackQueryData + args. - `buildData(options)` - Returns page
      data with custom options.


      The callback must return an array of arg values that will be joined with the intent using colon separators.
    example:
      - |-
        ```typescript
        class MyPage extends Ctx {
          // Simple callback arg
          static data = this.buildData((id: string) => [id])

          // With custom intents
          static data = this.buildData({
            callbackQueryData: (action: string) => [action],
            intentText: "my_page",
            intentCommandText: "mycommand"
          })
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        static buildData<C extends (...args: string[]) => Array<string | undefined>>(callbackQueryData: C):
        ITPageData<Parameters<C>>;
      parameters:
        - id: callbackQueryData
          description: A function that returns arg values as an array.
          type: C
      return:
        type: <xref uid="gramstax!ITPageData:type" />&lt;Parameters&lt;C&gt;&gt;
        description: The page data configuration object.
