    uid: gramstax!Ctx.buildData:member(1)
    package: gramstax!
    fullName: buildData(callbackData)
    summary: Creates page routing data configuration.
    remarks: >-
      This method has multiple overloads: - `buildData()` - Returns default page data with no args. -
      `buildData(callbackData)` - Returns intentCallbackData + args. - `buildData(options)` - Returns page data with
      custom options.


      The callback must return an array of arg values that will be joined with the intent using colon separators.
    example:
      - |-
        ```typescript
        class MyPage extends Ctx {
          // Simple callback arg
          static data = this.buildData((id: string) => [id])

          // With custom intents
          static data = this.buildData({
            callbackData: (action: string) => [action],
            intentText: "my_page",
            intentCommandText: "mycommand"
          })
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static buildData<C extends (...args: any[]) => any>(callbackData: C): ITPageData<Parameters<C>>;'
