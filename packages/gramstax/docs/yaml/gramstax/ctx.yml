      [TemplateEngine.BOT\_API\_VERSION](xref:gramstax!TemplateEngine.BOT_API_VERSION:member)<!-- -->). This method can
      edit both text and rich messages — pass a rich HTML template and it will be sent as structured rich content.


      If editing fails (e.g. message too old) and `fallbackReply` is true, a new rich message reply is sent instead.


      Rich message limits: - Up to 32,768 UTF-8 characters - Up to 500 blocks - Up to 16 nesting levels - Up to 20 table
      columns
