  - name: renderCallbackAnswer(showAlert, data, AGBaseId, options)
    uid: gramstax!Ctx#renderCallbackAnswer:member(1)
    package: gramstax!
    fullName: renderCallbackAnswer(showAlert, data, AGBaseId, options)
    summary: Answers the active callback query with template text.
    remarks: >-
      Template-backed counterpart to answering inline-button taps: the `<g-callback-answer>` block supplies the
      notification text (multilang via `data`<!-- -->), shown either as a toast or as an alert. There is no message to
      send, so this takes no keyboard and never falls back to a reply.


      Observe-only send-error coverage (mirrors `renderDice`<!-- -->): failures are classified via
      `Ctx.classifySendError`<!-- -->, reported to `notifySendError`<!-- -->, and logged (`retryable` → `log.error`<!--
      -->, `fallback-text` → `log.warn`<!-- -->). After notify+log the original error is ALWAYS rethrown untouched.


      Toast text is limited by Telegram to 200 characters — keep the block short.
    example:
      - |-
        ```typescript
        async handleCallbackQueryData() {
          await this.renderCallbackAnswer(false, undefined, `tap-card`)
        }
        ```
