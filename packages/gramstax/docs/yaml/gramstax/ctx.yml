        AGBaseId?: string | null, options?: ITOptReply | null, throwError?: boolean | null): Promise<{
                successCount: number;
                failedCount: number;
                totalCount: number;
            }>;
      parameters:
        - id: ids
          description: Array of user IDs to send the message to.
          type: number[]
        - id: languageCode
          description: Array of language codes corresponding to each user.
          type: string[]
        - id: keyboard
          description: Optional keyboard markup (or null to omit).
          type: <xref uid="gramstax!ITInBoKb:type" /> | null
        - id: data
          description: Optional template interpolation data (or null to omit).
          type: <xref uid="gramstax!ITData:type" /> | null
        - id: AGBaseId
