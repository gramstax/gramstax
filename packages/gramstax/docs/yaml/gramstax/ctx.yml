          type: string[]
        - id: keyboard
          description: Optional keyboard markup.
          type: <xref uid="gramstax!ITInBoKb:type" />
        - id: data
          description: Optional template interpolation data.
          type: <xref uid="gramstax!ITData:type" />
        - id: baseId
