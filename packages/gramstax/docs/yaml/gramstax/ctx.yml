  - name: renderInlineAnswer(results, data, AGBaseId, options, buttonStartParameter)
    uid: gramstax!Ctx#renderInlineAnswer:member(1)
    package: gramstax!
    fullName: renderInlineAnswer(results, data, AGBaseId, options, buttonStartParameter)
    summary: Answers the active inline query with caller-built results and template button text.
    remarks: >-
      Result contents are built by the caller from `data` (multilang payloads); the `<g-inline-button>` block supplies
      the default `button.text` label and `start_parameter`<!-- -->. Precedence: a caller-supplied `options.button` wins
      first, then the explicit `buttonStartParameter`<!-- -->, then the block's own `start-parameter`<!-- -->. The block
      is always resolved — even when no button is built — as fail-fast validation that the template exists.


      Observe-only send-error coverage (mirrors `renderDice`<!-- -->): failures are classified via
      `Ctx.classifySendError`<!-- -->, reported to `notifySendError`<!-- -->, and logged (`retryable` → `log.error`<!--
      -->, `fallback-text` → `log.warn`<!-- -->). After notify+log the original error is ALWAYS rethrown untouched.


      Telegram caps answers at 50 results; cache them with `cache_time` for identical queries.
    example:
      - |-
        ```typescript
        async handleInlineQuery() {
          await this.renderInlineAnswer([article], {name: `Ani`}, `inline-card`, undefined, `start=1`)
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        renderInlineAnswer(results: readonly InlineQueryResult[], data: IData | null | undefined, AGBaseId: string,
        options?: IOptInlineAnswer | null, buttonStartParameter?: string | null): Promise<true>;
      parameters:
