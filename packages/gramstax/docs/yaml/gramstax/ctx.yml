    fullName: ephemeralParams(receiverUserId, callbackQueryId, replace)
    summary: Build `EphemeralMessageParameters` for Bot API 10.3 ephemeral messages.
    remarks: >-
      Creates the `ephemeral_message_parameters` payload accepted by 13 send\* methods plus `sendRichMessage`<!-- -->.
      Ephemeral messages are short-lived notifications sent directly to a user — they disappear after the user reads (or
      ignores) them and are not kept in the chat history.


      The deprecated shim also accepts the pre-10.3 snake\_case object `{receiver_user_id, callback_query_id, ...}` and
      emits a `console.warn`<!-- -->.
    example:
      - |-
        Replace callback query message in place

        ```typescript
        async handleCallbackQueryData() {
          await this.api.sendMessage(this.chatId, `Order received!`, {
            ephemeral_message_parameters: this.ephemeralParams(this.from?.id, this.callbackQuery?.id, true)
          })
        }
        ```
      - |-
        Legacy 10.2 snake\_case object (warns once)

        ```typescript
        this.ephemeralParams({receiver_user_id: 123, callback_query_id: `cb_1`})
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        static ephemeralParams(receiverUserId?: number | Record<string, unknown>, callbackQueryId?: string, replace?:
        boolean): EphemeralMessageParameters | undefined;
      parameters:
        - id: receiverUserId
          description: Target user id, or a legacy object with snake\_case keys.
