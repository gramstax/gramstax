  - name: template
    uid: gramstax!Ctx.template:member
    package: gramstax!
    fullName: template
    summary: HTML-like template string for the page.
    remarks: Must contain a `<base></base>` block. Supports template interpolation with `{{variable}}` syntax.
    example:
      - |-
        Basic

        ```typescript
        class MyPage extends Ctx {
          static template = `
            <base>
              <keyboard>Button 1, Button 2</keyboard>
              <message>Hello {{name}}!</message>
            </base>
          `
        }
        ```
      - |-
        Multi Id

        ```typescript
        class MyPage extends Ctx {
          static template = `
            <base id="lah">
              <keyboard>Button 1, Button 2</keyboard>
            </base>
            <base>
              <message>Hello {{name}}!</message>
            </base>
          `
        }
        ```
      - |-
        Multi Language

        ```typescript
        class MyPage extends Ctx {
          static template = `
            <base id="lah">
              <keyboard>Button 1, Button 2</keyboard>
              <keyboard lang="id">Tombol 1, Tombol 2</keyboard>
            </base>
            <base>
              <message>Hello {{name}}!</message>
              <message lang="id">Halo {{name}}!</message>
            </base>
          `
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        /** @virtual */
        static template?: string;
      return:
        type: string
