  - name: template
    uid: gramstax!Ctx.template:member
    package: gramstax!
    fullName: template
    summary: HTML-like template string for the page.
    remarks: Must contain a `<g-base></g-base>` block. Supports template interpolation with `{{variable}}` syntax.
    example:
      - |-
        Basic

        ```typescript
        class MyPage extends Ctx {
          static template = `
            <g-base>
              <g-keyboard>Button 1, Button 2</g-keyboard>
              <g-message>Hello {{name}}!</g-message>
            </g-base>
          `
        }
        ```
      - |-
        Multi Id

        ```typescript
        class MyPage extends Ctx {
          static template = `
            <g-base id="lah">
              <g-keyboard>Button 1, Button 2</g-keyboard>
            </g-base>
            <g-base>
              <g-message>Hello {{name}}!</g-message>
            </g-base>
          `
        }
        ```
      - |-
        Multi Language

        ```typescript
        class MyPage extends Ctx {
          static template = `
            <g-base id="lah">
              <g-keyboard type="inline">Button 1, Button 2</g-keyboard>
              <g-keyboard type="inline" lang="id">Tombol 1, Tombol 2</g-keyboard>
            </g-base>
            <g-base>
              <g-message>Hello {{name}}!</g-message>
              <g-message lang="id">Halo {{name}}!</g-message>
            </g-base>
          `
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        /** @virtual */
        static template?: string;
      return:
        type: string
