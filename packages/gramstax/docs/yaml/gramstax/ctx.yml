          type: T
        - id: a
          description: Array of button labels.
          type: string[]
        - id: layout
          description: 'Layout format: "cols" or "cols-lastRow" (e.g., "2" or "3-2").'
          type: <xref uid="gramstax!~IKbCols:type" />
