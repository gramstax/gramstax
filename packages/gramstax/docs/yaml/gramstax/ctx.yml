  - name: >-
      renderBroadcast(ids, languageCode, keyboard, data, AGBaseId, options, throwError, chunkSize, chunkDelayMs,
      excludeIds, onProgress, startFrom, concurrency)
    uid: gramstax!Ctx#renderBroadcast:member(1)
    package: gramstax!
    fullName: >-
      renderBroadcast(ids, languageCode, keyboard, data, AGBaseId, options, throwError, chunkSize, chunkDelayMs,
      excludeIds, onProgress, startFrom, concurrency)
    summary: |-
      Sends a message to multiple users in bulk.

      Template block: `<g-message>` (read via `getGMessage`<!-- -->).
    remarks: >-
      Automatically throttles after 30 messages to respect Telegram rate limits. Uses each user's specified language
      code for template rendering. Per-recipient send failures follow `Ctx.classifySendError`<!-- -->: `retryable`
      errors are counted and the loop continues; `fallback-text` errors additionally trigger a best-effort fallback-text
      send to that recipient (nested failures ignored). `failedCount`<!-- -->/`firstError` semantics are preserved
      either way; loop structure and pacing are untouched. Retryable failures (`429`<!-- -->/`5xx`<!-- -->/network)
      never abort the run: they are recorded in `retryable` (absolute `index` + `id` + `error`<!-- -->, completion
      order) while the checkpoint keeps advancing, so callers can re-drive just those entries with a fresh pass.
      `firstError` stays the first failure of any kind. Checkpoint-first (anti-spam over speed): `startFrom` resumes
      after a restart without resending (indexes below count as skipped, `done` in `onProgress` counts processed
      recipients, `total` is `ids.length`<!-- -->); `concurrency` defaults to `1` (sequential) and can be raised when
      throughput matters. At \~`40` sends/sec, `1M` recipients take \~`7h` — size chunks and checkpoints accordingly.
    example:
      - |-
        ```typescript
        async handleCallbackQueryData() {
          const userIds = [123456, 789012]
          const langs = [`en`, `id`]
          await this.renderBroadcast(userIds, langs)
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        renderBroadcast(ids: number[], languageCode: string[], keyboard?: IInBoKb | null, data?: IData | null,
        AGBaseId?: string | null, options?: IOptReply | null, throwError?: boolean | null, chunkSize?: number | null,
        chunkDelayMs?: number | null, excludeIds?: number[] | null, onProgress?: ((done: number, total: number) => void
        | Promise<void>) | null, startFrom?: number | null, concurrency?: number | null): Promise<{
                successCount: number;
                failedCount: number;
                totalCount: number;
                skippedCount: number;
                retryable: Array<{
                    index: number;
                    id: number;
                    error: unknown;
                }>;
            }>;
      parameters:
        - id: ids
          description: Array of user IDs to send the message to.
          type: number[]
        - id: languageCode
          description: Array of language codes corresponding to each user.
          type: string[]
        - id: keyboard
          description: Optional keyboard markup (or null to omit).
          type: <xref uid="gramstax!IInBoKb:type" /> | null
        - id: data
          description: Optional template interpolation data (or null to omit).
          type: <xref uid="gramstax!IData:type" /> | null
        - id: AGBaseId
          description: Optional template g-base ID position for block message (or null to use default).
          type: string | null
        - id: options
          description: Optional send options (or null to omit).
          type: <xref uid="gramstax!IOptReply:type" /> | null
        - id: throwError
          description: If true, throws errors instead of swallowing them (or null to use false).
          type: boolean | null
        - id: chunkSize
          description: Optional custom chunk size for pacing sleeps (or null for free-limit pacing only).
          type: number | null
        - id: chunkDelayMs
          description: Optional delay in ms after each `chunkSize` chunk (or null for `500`<!-- -->).
          type: number | null
        - id: excludeIds
          description: Optional user IDs to skip, counted as skipped (or null to send to all).
          type: number[] | null
        - id: onProgress
          description: >-
            Optional checkpoint callback `(done, total)` fired after every pacing chunk and once at completion (or null
            to skip).
          type: '((done: number, total: number) =&gt; void | Promise&lt;void&gt;) | null'
        - id: startFrom
          description: >-
            Optional absolute recipient index to resume from; indexes below count as skipped and are never resent (or
            null to start at `0`<!-- -->).
          type: number | null
        - id: concurrency
          description: >-
            Optional parallel send workers; `1` keeps the sequential loop, floored at `1`<!-- -->, capped at `10`<!--
            -->, non-finite becomes `1` (or null for `1`<!-- -->).
          type: number | null
      return:
        type: |-
          Promise&lt;{
                  successCount: number;
                  failedCount: number;
                  totalCount: number;
                  skippedCount: number;
                  retryable: Array&lt;{
                      index: number;
                      id: number;
                      error: unknown;
                  }&gt;;
              }&gt;
        description: ''
  - name: renderBroadcastDelete(targets, broadcastOpts)
    uid: gramstax!Ctx#renderBroadcastDelete:member(1)
    package: gramstax!
    fullName: renderBroadcastDelete(targets, broadcastOpts)
    summary: |-
      Deletes already-sent messages for many recipients in bulk.

      Template block: none — operates on message ids, reads no template block.
    remarks: >-
      Expiry-cleanup counterpart of `renderBroadcastEdit`<!-- -->: same checkpoint-first resume (`startFrom`<!-- -->),
      bounded-concurrency stride lanes (`concurrency`<!-- -->, capped at `10`<!-- -->), pacing (`30`<!-- -->-message
      free-limit sleep plus optional `chunkSize`<!-- -->/`chunkDelayMs` sleeps with `onProgress`<!-- -->), and retryable
      separation (`retryable[]` with absolute `index` + `chatId` + `messageId` + `error`<!-- -->, completion order).


      Per-recipient failures are classified via `Ctx.classifySendError`<!-- -->: `retryable` errors are recorded and the
      loop continues; `fallback-text` errors only notify (`notifySendError`<!-- -->) and count as failed. A failed
      delete has no text fallback by design — there is no replacement content to deliver, so no `sendMessage` is
      attempted on either path.
    example:
      - |-
        ```typescript
        async handleExpireVip() {
          const sent = await this.db.sentRepo.listByCode(`vip-drop-7`)
          await this.renderBroadcastDelete(sent)
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        renderBroadcastDelete(targets: IBroadcastEditTarget[], broadcastOpts?: IBroadcastEditOpts | null):
        Promise<IBroadcastEditResult>;
      parameters:
        - id: targets
          description: Stored `{chatId, messageId}` rows to delete, in stable order (checkpoint index = array index).
          type: <xref uid="gramstax!IBroadcastEditTarget:type" />[]
        - id: broadcastOpts
          description: >-
            Optional broadcast controls (`onProgress`<!-- -->, `startFrom`<!-- -->, `concurrency`<!-- -->,
            `chunkSize`<!-- -->, `chunkDelayMs`<!-- -->) (or null for defaults; `fallbackEdit` is accepted but ignored —
            deletes have no resend).
          type: <xref uid="gramstax!IBroadcastEditOpts:type" /> | null
      return:
        type: Promise&lt;<xref uid="gramstax!IBroadcastEditResult:type" />&gt;
        description: Counts plus `retryable[]` for a re-drive pass.
  - name: renderBroadcastEdit(targets, type, keyboardInline, data, AGBaseId, options1, options2, broadcastOpts)
    uid: gramstax!Ctx#renderBroadcastEdit:member(1)
    package: gramstax!
    fullName: renderBroadcastEdit(targets, type, keyboardInline, data, AGBaseId, options1, options2, broadcastOpts)
    summary: |-
      Edits already-sent messages for many recipients in bulk.

      Template block: `<g-media>` (read via `getGMedia`<!-- -->).
    remarks: >-
      Mass typo-fix / content-revision counterpart of `renderBroadcastMedia`<!-- -->: same checkpoint-first resume
      (`startFrom`<!-- -->), bounded-concurrency stride lanes (`concurrency`<!-- -->, capped at `10`<!-- -->), pacing
      (`30`<!-- -->-message free-limit sleep plus optional `chunkSize`<!-- -->/`chunkDelayMs` sleeps with
      `onProgress`<!-- -->), retryable separation (`retryable[]` with absolute `index` + `chatId` + `messageId` +
      `error`<!-- -->, completion order), and fail-fast validation (programmer errors throw BEFORE any send).


      The intended input source is a stored sent-list such as the downstream `SentRepository` shape (`Array<{chatId,
      messageId}>` per content code): pass the rows back here to revise the same messages for every recipient.


      Per-recipient semantics mirror `renderEditMedia` exactly: `photo`<!-- -->, `video`<!-- -->, `audio`<!-- -->,
      `document`<!-- -->, and `animation` edit in place via `editMessageMedia` (with `InputFile` resolution + filename +
      caption); `voice`<!-- -->, `video_note`<!-- -->, `sticker`<!-- -->, `location`<!-- -->, and `contact` cannot be
      edited, so the old message is deleted and a new one is sent; pipe-delimited multi-src media deletes and resends a
      media group. Every resolved media input is cloned per recipient via `Ctx.cloneMediaInput`<!-- -->, so parallel
      workers never share one mutable `InputFile` instance.


      When the primary edit/delete+resend fails, the per-recipient `fallbackEdit` flow runs (default `delete-reply`<!--
      -->: best-effort delete, then resend the media without `options1`<!-- -->/`options2`<!-- -->, with a `log.warn`
      when non-empty edit options are dropped). A failed fallback is classified via `Ctx.classifySendError`<!-- -->:
      `fallback-text` triggers a best-effort fallback-text send to that recipient (nested failures ignored) and
      `failedCount++`<!-- -->; `retryable` appends to `retryable[]` and the loop continues. `fallbackEdit: disable`
      skips the resend and classifies the primary error directly.
    example:
      - |-
        ```typescript
        async handleTypoFix() {
          const sent = await this.db.sentRepo.listByCode(`vip-drop-7`)
          await this.renderBroadcastEdit(sent, `photo`, null, {price: `99`})
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        renderBroadcastEdit<T extends Exclude<IMediaBlock[`type`], `group`>>(targets: IBroadcastEditTarget[], type: T,
        keyboardInline?: IInlineKb | null, data?: IData | null, AGBaseId?: string | null, options1?: (T extends `voice`
        ? IOptReplyVoice : T extends `video_note` ? IOptReplyVideoNote : T extends `sticker` ? IOptReplySticker : T
        extends `location` ? IOptReplyLocation : T extends `contact` ? IOptReplyContact : IOptEditMedia1) | null,
        options2?: IOptEditMedia2 | null, broadcastOpts?: IBroadcastEditOpts | null): Promise<IBroadcastEditResult>;
      parameters:
        - id: targets
          description: Stored `{chatId, messageId}` rows to edit, in stable order (checkpoint index = array index).
          type: <xref uid="gramstax!IBroadcastEditTarget:type" />[]
        - id: type
          description: The media type (photo, video, audio, document, animation, voice, video\_note, sticker, location, contact).
          type: T
        - id: keyboardInline
          description: Optional inline keyboard markup (or null to omit).
          type: <xref uid="gramstax!IInlineKb:type" /> | null
        - id: data
          description: Optional template interpolation data (or null to omit).
          type: <xref uid="gramstax!IData:type" /> | null
        - id: AGBaseId
          description: Optional template g-base ID position for block media (or null to use default).
          type: string | null
        - id: options1
          description: Type-specific media options (or null to omit; dropped on fallback resend).
          type: >-
            (T extends `voice` ? <xref uid="gramstax!IOptReplyVoice:type" /> : T extends `video_note` ? <xref
            uid="gramstax!IOptReplyVideoNote:type" /> : T extends `sticker` ? <xref uid="gramstax!IOptReplySticker:type"
            /> : T extends `location` ? <xref uid="gramstax!IOptReplyLocation:type" /> : T extends `contact` ? <xref
            uid="gramstax!IOptReplyContact:type" /> : <xref uid="gramstax!IOptEditMedia1:type" />) | null
        - id: options2
          description: Additional edit options (or null to omit; dropped on fallback resend).
          type: <xref uid="gramstax!IOptEditMedia2:type" /> | null
        - id: broadcastOpts
          description: >-
            Optional broadcast controls (`onProgress`<!-- -->, `startFrom`<!-- -->, `concurrency`<!-- -->,
            `chunkSize`<!-- -->, `chunkDelayMs`<!-- -->, `fallbackEdit`<!-- -->) (or null for defaults).
          type: <xref uid="gramstax!IBroadcastEditOpts:type" /> | null
      return:
        type: Promise&lt;<xref uid="gramstax!IBroadcastEditResult:type" />&gt;
        description: Counts plus `retryable[]` for a re-drive pass.
