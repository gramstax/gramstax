    uid: gramstax!Ctx#renderAuto:member(1)
    package: gramstax!
    fullName: renderAuto(keyboard, data, AGBaseId, options, isEdit, fallbackReply)
    summary: >-
      Sends or edits a message using the page template, auto-selecting between
      [Ctx.render()](xref:gramstax!Ctx%23render:member(1)) and
      [Ctx.renderEdit()](xref:gramstax!Ctx%23renderEdit:member(1)) based on the `isEdit` flag.
    remarks: >-
      When `isEdit` is `true`<!-- -->, delegates to `renderEdit` (inline keyboard only). When `false`<!-- -->, delegates
      to `render` (inline or bottom keyboard).
    example:
      - |-
        ```typescript
        async handleCallbackQueryData() {
          const kb = this.inlineKeyboard((k) => k.text("OK", "ok"))
          // Auto-detect: callbackQuery exists → renderEdit
          await this.renderAuto(kb, {status: "updated"})
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        renderAuto(keyboard?: ITInBoKb | null, data?: ITData | null, AGBaseId?: string | null, options?: ITOptEdit |
        ITOptReply | null, isEdit?: boolean | null, fallbackReply?: boolean | null): Promise<true |
        grammy_types.Message.TextMessage | (grammy_types.Update.Edited & grammy_types.Message.CommonMessage & {
                rich_message: grammy_types.RichMessage;
            }) | undefined>;
      parameters:
        - id: keyboard
          description: Optional keyboard markup (or null to omit).
          type: <xref uid="gramstax!ITInBoKb:type" /> | null
        - id: data
          description: Optional template interpolation data (or null to omit).
          type: <xref uid="gramstax!ITData:type" /> | null
        - id: AGBaseId
          description: Optional template base ID position for block message (or null to use default).
          type: string | null
        - id: options
          description: Optional reply/edit options (or null to omit).
          type: <xref uid="gramstax!ITOptEdit:type" /> | <xref uid="gramstax!ITOptReply:type" /> | null
        - id: isEdit
          description: >-
            If `true`<!-- -->, edits the existing message; if `false`<!-- -->, sends a new one. Defaults to
            `!!this.callbackQuery` (auto-detected).
          type: boolean | null
        - id: fallbackReply
          description: If true, sends a new reply when edit fails (only when `isEdit` is true). Defaults to `null` (no fallback).
