            uid="gramstax!IOptReplyAudio:type" /> | <xref uid="gramstax!IOptReplyDocument:type" /> | <xref
            uid="gramstax!IOptReplyAnimation:type" /> | <xref uid="gramstax!IOptReplyVoice:type" /> | <xref
            uid="gramstax!IOptReplyVideoNote:type" /> | <xref uid="gramstax!IOptReplySticker:type" /> | <xref
            uid="gramstax!IOptReplyLocation:type" /> | <xref uid="gramstax!IOptReplyContact:type" /> | null
        - id: throwError
          description: If true, throws errors instead of swallowing them (or null to use false).
