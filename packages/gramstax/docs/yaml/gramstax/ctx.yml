    uid: gramstax!Ctx#bottomKeyboard:member(1)
    package: gramstax!
    fullName: bottomKeyboard(callback, params)
    summary: Creates a bottom (reply) keyboard using a builder callback.
    remarks: >-
      The callback receives the keyboard instance and an array of button labels from the template. Automatically applies
      `resized()` to the keyboard.
    example:
      - |-
        ```typescript
        async handleCallbackData() {
          const kb = this.bottomKeyboard((k, labels) => {
            labels.forEach(label => k.text(label))
            return k
          })
          await this.reply(kb)
        }
        ```
    isPreview: false
    isDeprecated: false
