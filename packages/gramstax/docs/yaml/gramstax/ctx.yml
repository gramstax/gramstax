  - name: data
    uid: gramstax!Ctx#data:member
    package: gramstax!
    fullName: data
    summary: Instance-level access to the page routing data.
    remarks: >-
      This property mirrors the static `data` property but is accessible via `this.data` within instance methods. Use
      `this.data.callbackQueryData()` internally.
    example:
      - |-
        ```typescript
        async handleCallbackQueryData() {
          const cbd = this.data.callbackQueryData("argument_1", "args2")
          console.log(cbd) // "page_name:argument_1:args2"
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'data: IPageData;'
      return:
        type: <xref uid="gramstax!IPageData:type" />
  - name: data
    uid: gramstax!Ctx.data:member
    package: gramstax!
    fullName: data
    summary: /\*\* Page routing data created by `Ctx.buildData`<!-- -->.
    remarks: >-
      Optional by default — pages that do NOT define `static data` inherit `IPageDataStatic | undefined`<!-- -->. Pages
      that override via `buildData(...)` get fully typed `callbackQueryData` with the configured args.
    example:
      - |-
        ```typescript
        class MyPage extends Ctx {
          // For args `handle*CallbackQueryData`
          static data = this.buildData((confirm?: string) => [confirm])

          // For args `handle*CallbackQueryData` and `handle*Text` and `handle*CommandText` (Besides "handleFree*")
          static data = this.buildData({
            callbackQueryData: (confirm?: string) => [confirm],
            intentText: `my_page`,
            intentCommandText: `hello`
          })
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static data?: IPageDataBase;'
      return:
        type: <xref uid="gramstax!IPageDataBase:type" />
