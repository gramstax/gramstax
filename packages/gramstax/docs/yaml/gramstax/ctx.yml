  - name: notifySendError(err, kind, chatId)
    uid: gramstax!Ctx#notifySendError:member(1)
    package: gramstax!
    fullName: notifySendError(err, kind, chatId)
    summary: Invoke the `onSendError` hook best-effort (Q9 option b).
    remarks: >-
      Builds `{page, kind, chatId}` and calls the hook inside a nested try/catch — a throwing hook is swallowed and
      never breaks the send flow. Silent when no hook is configured. Validation throws are programmer errors and never
      reach this helper (hook-free by design).
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'notifySendError(err: unknown, kind: `fallback-text` | `retryable`, chatId?: number): void;'
      parameters:
        - id: err
          description: The classified send error.
          type: unknown
        - id: kind
          description: The `Ctx.classifySendError` outcome.
          type: '`fallback-text` | `retryable`'
        - id: chatId
          description: Target recipient when known.
          type: number
      return:
        type: void
        description: ''
  - name: postBusinessStory(businessConnectionId, content, activePeriod, options)
    uid: gramstax!Ctx#postBusinessStory:member(1)
    package: gramstax!
    fullName: postBusinessStory(businessConnectionId, content, activePeriod, options)
    summary: Posts a story on behalf of a managed business account.
    remarks: >-
      Business-connection-only: a normal bot cannot call `postBusinessStory` — pass a `business_connection_id` from a
      `BusinessConnection` update with the `can_manage_stories` right, otherwise the Bot API rejects the call. Thin
      passthrough otherwise: `content` resolves through `resolveMedia` then uploads (`InputFile` as-is, URLs via
      `{url}`<!-- -->, `file_id` strings pass through) and only presence, the `photo`<!-- -->/`video` discriminant, and
      the fixed `active_period` set are fail-fast validated; areas, durations, and captions are adjudicated by the Bot
      API — programmer errors always throw, never fall back.


      why-not-base: explicit `businessConnectionId` (base `Context.postStory` uses the current update only) plus
      local-path `InputFile` resolution and fail-fast validation.


      Observe-only send-error coverage (mirrors `renderDice`<!-- -->): failures are classified via
      `Ctx.classifySendError`<!-- -->, reported to `notifySendError`<!-- -->, and logged (`retryable` → `log.error`<!--
      -->, `fallback-text` → `log.warn`<!-- -->). There is no degraded fallback content for stories, so after notify+log
      the original error is ALWAYS rethrown untouched.
    example:
      - |-
        ```typescript
        async handlePostStory() {
          await this.postBusinessStory(`conn-1`, {type: `photo`, src: `https://example.com/pic.jpg`}, 86400)
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        postBusinessStory(businessConnectionId?: string | null, content?: IStoryContent | null, activePeriod?: number |
        null, options?: Parameters<Ctx[`api`][`postStory`]>[3] | null): Promise<grammy_types.Story>;
      parameters:
        - id: businessConnectionId
          description: Business connection id (or null — throws).
          type: string | null
        - id: content
          description: 'Story content `{type: "photo"|"video", src}` (or null — throws).'
          type: <xref uid="gramstax!IStoryContent:type" /> | null
        - id: activePeriod
          description: 'Archive delay in seconds: 21600, 43200, 86400, or 172800 (or null — throws).'
          type: number | null
        - id: options
          description: Optional extra story fields such as `caption` (or null to omit).
          type: Parameters&lt;<xref uid="gramstax!Ctx:class" />[`api`][`postStory`]&gt;[3] | null
      return:
        type: Promise&lt;<xref uid="@grammyjs/types!Story:interface" />&gt;
        description: The posted story object.
