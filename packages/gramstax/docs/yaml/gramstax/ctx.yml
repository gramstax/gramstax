      bounded-concurrency stride lanes capped at `10`<!-- -->, `30`<!-- -->-message free-limit pacing plus optional
      `chunkSize`<!-- -->/`chunkDelayMs` sleeps with `onProgress`<!-- -->, `retryable[]` with absolute `index` + `id` +
      `error` in completion order, `excludeIds` skips, `throwError` rethrow). Per-recipient sends reuse the exact
      `api.sendPoll` arg construction from [Ctx.renderPoll()](xref:gramstax!Ctx%23renderPoll:member(1)) (duplicated here
      — not extracted — so `renderPoll` behavior is untouched). Per-recipient failures mirror the broadcast-media loop:
