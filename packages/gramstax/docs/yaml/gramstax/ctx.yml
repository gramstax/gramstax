    uid: gramstax!Ctx#renderGift:member(1)
    package: gramstax!
    fullName: renderGift(target, giftId, keyboard, data, AGBaseId, options)
    summary: |-
      Sends a Telegram gift with card text from the page template.

      Template block: `<g-gift>` (read via `getGGift`<!-- -->).
    remarks: >-
      Card text comes from the `<g-gift>` block via `getGGift` (the `text` param on `sendGift` is what qualifies this as
      `render*`<!-- -->) and is sent via `api.sendGift`<!-- -->. `target` (user id) is explicit because gifts do not
      always go to the active chat — unlike every other render method.


      Failure rule: insufficient Stars balance (`400`<!-- -->) throws after notify — a failed gift MUST NOT degrade into
      sending the card as plain text (that would deceive the user). No silent fallback on any path.
    example:
      - |-
        ```typescript
        async handleCallbackQueryData() {
          await this.renderGift(123456, `gift-id`, undefined, undefined, `gift-card`)
        }
        ```
    isPreview: false
