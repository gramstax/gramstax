  - name: ct
    uid: gramstax!Ctx#ct:member
    package: gramstax!
    fullName: ct
    summary: >-
      The underlying grammy context object. For new code this is the same as `this` (since
      [Ctx](xref:gramstax!Ctx:class) extends `Context`<!-- -->), but it is exposed here so that a `Ctx` instance
      structurally satisfies [ITCtxParams](xref:gramstax!ITCtxParams:type) — allowing `new SomePage(this)` to compile
      without a type assertion.


      The `& {[key: string]: any}` widening covers runtime-added methods (e.g. `\@grammyjs/stream` plugin) that
      TypeScript cannot know statically.
    remarks: ''
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        readonly ct: Context & StreamContextExtension & {
                [key: string]: unknown;
            };
      return:
        type: |-
          <xref uid="grammy!Context:class" /> & <xref uid="@grammyjs/stream!StreamContextExtension:interface" /> & {
                  [key: string]: unknown;
              }
  - name: data
    uid: gramstax!Ctx#data:member
    package: gramstax!
    fullName: data
    summary: Instance-level access to the page routing data.
    remarks: >-
      This property mirrors the static `data` property but is accessible via `this.data` within instance methods. Use
      `this.data.callbackQueryData()` internally.
    example:
      - |-
        ```typescript
        async handleCallbackQueryData() {
          const cbd = this.data.callbackQueryData("argument_1", "args2")
          console.log(cbd) // "page_name:argument_1:args2"
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'data: ITPageData;'
      return:
        type: <xref uid="gramstax!ITPageData:type" />
  - name: data
    uid: gramstax!Ctx.data:member
    package: gramstax!
    fullName: data
    summary: /\*\* Page routing data created by `Ctx.buildData`<!-- -->.
    remarks: >-
      Optional by default — pages that do NOT define `static data` inherit `ITPageDataStatic | undefined`<!-- -->. Pages
      that override via `buildData(...)` get fully typed `callbackQueryData` with the configured args.
    example:
      - |-
        ```typescript
        class MyPage extends Ctx {
          // For args `handle*CallbackQueryData`
          static data = this.buildData((confirm?: string) => [confirm])

          // For args `handle*CallbackQueryData` and `handle*Text` and `handle*CommandText` (Besides "handleFree*")
          static data = this.buildData({
            callbackQueryData: (confirm?: string) => [confirm],
            intentText: `my_page`,
            intentCommandText: `hello`
          })
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static data?: ITPageDataBase;'
      return:
        type: <xref uid="gramstax!ITPageDataBase:type" />
