      the Bot API 10.3 Rich HTML tags in your template (e.g. `<h1>`<!-- -->, `<table>`<!-- -->, `<blockquote>`<!-- -->)
      — they are validated by
      [TemplateEngine.validateBlockGMessageRich()](xref:gramstax!TemplateEngine.validateBlockGMessageRich:member(1))<!--
      -->.


