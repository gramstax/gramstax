  - name: answerPreCheckout(ok, errorMessage)
    uid: gramstax!Ctx#answerPreCheckout:member(1)
    package: gramstax!
    fullName: answerPreCheckout(ok, errorMessage)
    summary: Answers the current pre-checkout query, approving or rejecting payment.
    remarks: >-
      Thin passthrough to `api.answerPreCheckoutQuery` for the active update — no template involved. Call from
      `handleFreePreCheckoutQuery` (or `handleSessionFreePreCheckoutQuery`<!-- -->); the Bot API must receive the answer
      within 10 seconds of the query. Programmer error (no active pre-checkout query) always throws, never falls back.


      why-not-base: simplified `(ok, errorMessage?)` shape with a fail-fast page-named throw; base
      `Context.answerPreCheckoutQuery` needs manual `other` shaping.
    example:
      - |-
        ```typescript
        async handleFreePreCheckoutQuery() {
          await this.answerPreCheckout(true)
        }
        ```
      - |-
        ```typescript
        async handleFreePreCheckoutQuery() {
          await this.answerPreCheckout(false, `Stok habis`)
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'answerPreCheckout(ok: boolean, errorMessage?: string | null): Promise<true>;'
      parameters:
        - id: ok
          description: '`true` to approve the checkout, `false` to reject it.'
          type: boolean
        - id: errorMessage
          description: Optional rejection reason shown to the user (only sent when `ok` is `false`<!-- -->).
          type: string | null
      return:
        type: Promise&lt;true&gt;
        description: '`true` on success.'
