  - name: bottomKeyboard(callback, params)
    uid: gramstax!Ctx#bottomKeyboard:member(1)
    package: gramstax!
    fullName: bottomKeyboard(callback, params)
    summary: Creates a bottom (reply) keyboard using a builder callback.
    remarks: >-
      The callback receives the keyboard instance and an array of button labels from the template. Automatically applies
      `resized()` to the keyboard.
    example:
      - |-
        ```typescript
        async handleCallbackQueryData() {
          const kb = this.bottomKeyboard((k, labels) => {
            labels.forEach(label => k.text(label))
            return k
          })
          await this.render(kb)
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        bottomKeyboard(callback: (k: ITBottomKb, l: string[]) => ITBottomKb, params?: ITBottomKbParams | null):
        ITBottomKb;
      parameters:
        - id: callback
          description: Builder function that receives keyboard and labels.
          type: '(k: <xref uid="gramstax!ITBottomKb:type" />, l: string[]) =&gt; <xref uid="gramstax!ITBottomKb:type" />'
        - id: params
          description: Optional parameters (or null to omit). [ITBottomKbParams](xref:gramstax!ITBottomKbParams:type) for details.
          type: <xref uid="gramstax!ITBottomKbParams:type" /> | null
      return:
        type: <xref uid="gramstax!ITBottomKb:type" />
        description: The bottom keyboard instance.
  - name: bottomKeyboardT(layout, AGBaseId, data)
    uid: gramstax!Ctx#bottomKeyboardT:member(1)
    package: gramstax!
    fullName: bottomKeyboardT(layout, AGBaseId, data)
    summary: Creates a bottom keyboard with template-based text buttons.
    remarks: >-
      Shorthand for [Ctx.bottomKeyboard()](xref:gramstax!Ctx%23bottomKeyboard:member(1)) with automatic text button
      creation.
    example:
      - |-
        ```typescript
        async handleCallbackQueryData() {
          const kb = this.bottomKeyboardT("2")
          await this.render(kb)
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'bottomKeyboardT(layout: ITKbCols, AGBaseId?: string | null, data?: Record<string, unknown> | null): ITBottomKb;'
      parameters:
        - id: layout
          description: 'Layout format: "cols" or "cols-lastRow". Default: "1".'
          type: <xref uid="gramstax!ITKbCols:type" />
        - id: AGBaseId
          description: >-
            Optional template base ID position for block keyboard. IMPORTANT: If a `<g-base id="...">` is defined in the
            template, you must set AGBaseId to the same value. Leaving AGBaseId as undefined in this case will cause
            errors (for example, keyboard bindings will not work). A common mistake is defining a g-base ID in the
            template but not reusing it in the keyboard configuration (or null to use default).
          type: string | null
        - id: data
          description: Optional template interpolation data (or null to omit).
          type: Record&lt;string, unknown&gt; | null
      return:
        type: <xref uid="gramstax!ITBottomKb:type" />
        description: The bottom keyboard instance.
