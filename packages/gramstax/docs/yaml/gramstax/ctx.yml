  - name: buildData(callback)
    uid: gramstax!Ctx.buildData:member(1)
    package: gramstax!
    fullName: buildData(callback)
    summary: Creates page routing data configuration.
    remarks: >-
      This method has multiple overloads: - `buildData()` - Returns default page data with no payloads. -
      `buildData(callback)` - Returns page data with callback payloads. - `buildData(options)` - Returns page data with
      custom options.


      The callback must return an array of payload values that will be joined with the intent using colon separators.
    example:
      - |-
        ```typescript
        class MyPage extends Ctx {
          // Simple callback payload
          static data = this.buildData((id: string) => [id])

          // With custom intents
          static data = this.buildData({
            callback: (action: string) => [action],
            intentText: "my_page",
            intentTextCommand: "mycommand"
          })
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static buildData<C extends (...args: any[]) => any>(callback: C): ITPageData<Parameters<C>>;'
      parameters:
