  - name: data
    uid: gramstax!Ctx#data:member
    package: gramstax!
    fullName: data
    summary: Instance-level access to the page routing data.
    remarks: >-
      This property mirrors the static `data` property but is accessible via `this.data` within instance methods. Use
      `this.data.callback()` internally.
    example:
      - |-
        ```typescript
        async callback() {
          const callbackData = this.data.callback("payload1")
          console.log(callbackData) // "page_name:payload1"
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'data: ITPageData<any>;'
      return:
        type: <xref uid="gramstax!ITPageData:type" />&lt;any&gt;
  - name: data
    uid: gramstax!Ctx.data:member
    package: gramstax!
    fullName: data
    summary: Page routing data created by `Ctx.buildData`<!-- -->.
    remarks: >-
      Only define when you want to override the intent and have a callback payload. If nothing is needed, let the system
      handle it automatically.
    example:
      - |-
        ```typescript
        class MyPage extends Ctx {
          // For callback payload route only
          static data = this.buildData((confirm?: string) => [confirm])

          // For callback payload route and text/textCommand trigger
          static data = this.buildData({
            callback: (confirm?: string) => [confirm],
            intentText: `my_page`,
            intentTextCommand: `hello`
          })
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static data: ITPageData<any>;'
      return:
        type: <xref uid="gramstax!ITPageData:type" />&lt;any&gt;
