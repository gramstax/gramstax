          description: An iterable of text chunks that make up the message.
          type: >-
            Iterable&lt;<xref uid="@grammyjs/stream!MessageDraftPiece:type" />&gt; | AsyncIterable&lt;<xref
            uid="@grammyjs/stream!MessageDraftPiece:type" />&gt;
        - id: otherMessageDraft
