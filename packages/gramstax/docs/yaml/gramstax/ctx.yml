  - name: data
    uid: gramstax!Ctx#data:member
    package: gramstax!
    fullName: data
    summary: Instance-level access to the page routing data.
    remarks: >-
      This property mirrors the static `data` property but is accessible via `this.data` within instance methods. Use
      `this.data.callbackDataData()` internally.
    example:
      - |-
        ```typescript
        async handleCallbackData() {
          const callbackData = this.data.callbackData("argument_1", "args2")
          console.log(callbackData) // "page_name:argument_1:args2"
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'data: ITPageData<any>;'
      return:
        type: <xref uid="gramstax!ITPageData:type" />&lt;any&gt;
  - name: data
    uid: gramstax!Ctx.data:member
    package: gramstax!
    fullName: data
    summary: Page routing data created by `Ctx.buildData`<!-- -->.
    remarks: >-
      Only define when you want to override the intent and have a callback arg. If nothing is needed, let the system
      handle it automatically.
    example:
      - |-
        ```typescript
        class MyPage extends Ctx {
          // For args `handle*CallbackData`
          static data = this.buildData((confirm?: string) => [confirm])

          // For args `handle*CallbackData` and `handle*Text` and `handle*CommandText` (Besides "handleFree*")
          static data = this.buildData({
            callbackData: (confirm?: string) => [confirm],
            intentText: `my_page`,
            intentCommandText: `hello`
          })
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static data: ITPageData<any>;'
      return:
        type: <xref uid="gramstax!ITPageData:type" />&lt;any&gt;
