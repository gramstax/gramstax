          type: <xref uid="gramstax!IOptInlineAnswer:type" /> | null
        - id: buttonStartParameter
          description: Optional deep-link start parameter; enables the block-text button (or null to omit).
          type: string | null
      return:
        type: Promise&lt;true&gt;
        description: True on success.
  - name: renderInvoice(keyboard, data, AGBaseId, options)
    uid: gramstax!Ctx#renderInvoice:member(1)
    package: gramstax!
    fullName: renderInvoice(keyboard, data, AGBaseId, options)
    summary: Sends a template-driven invoice using the page `<g-invoice>` block.
    remarks: >-
      Fail-fast validation (`Ctx.assertInvoice`<!-- -->) runs BEFORE any API call on the COMPILED strings — programmer
      errors always throw, never fall back. The invoice is sent with NO `parse_mode`<!-- -->: the Bot API offers no HTML
      parsing for invoices.


      Provider tokens are security-critical and NEVER come from templates: the validator rejects a `provider_token`
      attribute outright. Resolution order is `options.provider_token` when present, otherwise Telegram Stars
      (`currency: "XTR"`<!-- -->) sends with no token at all, and any other (fiat) currency without a token throws
      before any API call.


      Pre-checkout queries for the sent invoice already route to page handlers via the existing `precheckoutquery`
      listener — define `handleFreePreCheckoutQuery` (or `handleSessionFreePreCheckoutQuery` in a session flow) on the
      page and answer with [Ctx.answerPreCheckout()](xref:gramstax!Ctx%23answerPreCheckout:member(1))<!-- -->. No new
      routing was added for this.


      Observe-only send-error coverage (mirrors `render`<!-- -->): failures are classified via
      `Ctx.classifySendError`<!-- -->, reported to `notifySendError`<!-- -->, and logged (`retryable` → `log.error`<!--
      -->, `fallback-text` → `log.warn`<!-- -->). There is no degraded fallback content for invoices, so after
      notify+log the original error is ALWAYS rethrown untouched — the `catch` below observes only and never swallows,
      because swallowing would hide a payment send failure from the caller.
    example:
      - |-
        ```typescript
        async handleCallbackQueryData() {
          const kb = this.inlineKeyboard((k) => k.text("OK", "ok"))
          await this.renderInvoice(kb, {days: 30, orderId: "o-1"})
        }
        ```
      - |-
        ```typescript
        async handleBuyFiat() {
          // Template: <g-invoice title="Pro" description="Plan" payload="{{orderId}}" currency="USD"><g-price label="Pro" amount="499"/></g-invoice>
          await this.renderInvoice(null, {orderId: "o-2"}, null, {provider_token: process.env.PAYMENT_PROVIDER_TOKEN})
        }
        ```
      - |-
        ```typescript
        async handleFreePreCheckoutQuery() {
          await this.answerPreCheckout(true)
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        renderInvoice(keyboard?: IInlineKb | null, data?: IData | null, AGBaseId?: string | null, options?:
        (Parameters<Ctx[`replyWithInvoice`]>[5] & {
                provider_token?: string;
            }) | null): Promise<grammy_types.Message.InvoiceMessage>;
      parameters:
        - id: keyboard
          description: >-
            Optional inline keyboard markup from [Ctx.inlineKeyboard()](xref:gramstax!Ctx%23inlineKeyboard:member(1))
            (or null to omit). Only inline keyboards are accepted — the Bot API `sendInvoice` reply markup is
            `InlineKeyboardMarkup`<!-- -->.
          type: <xref uid="gramstax!IInlineKb:type" /> | null
        - id: data
          description: Optional template interpolation data (or null to omit).
          type: <xref uid="gramstax!IData:type" /> | null
        - id: AGBaseId
          description: Optional template base ID position for block invoice (or null to use default).
          type: string | null
        - id: options
          description: >-
            Optional extra `sendInvoice` fields; `provider_token` here is the ONLY way to supply the payment provider
            secret (or null to omit).
          type: |-
            (Parameters&lt;<xref uid="gramstax!Ctx:class" />[`replyWithInvoice`]&gt;[5] & {
                    provider_token?: string;
                }) | null
      return:
        type: Promise&lt;<xref uid="@grammyjs/types!Message.InvoiceMessage:type" />&gt;
        description: The sent invoice message object.
