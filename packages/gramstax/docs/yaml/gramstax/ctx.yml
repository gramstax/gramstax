  - name: broadcastMedia(ids, languageCode, keyboard, data, baseId, options, throwError)
    uid: gramstax!Ctx#broadcastMedia:member(1)
    package: gramstax!
    fullName: broadcastMedia(ids, languageCode, keyboard, data, baseId, options, throwError)
    summary: Sends a media message to multiple users in bulk.
    remarks: >-
      Media type and arg are inferred from the template `<media>` block. If a supported media type (`photo`<!-- -->,
      `video`<!-- -->, `audio`<!-- -->, `document`<!-- -->) uses a pipe-delimited `src`<!-- -->, it is sent as a
      Telegram media group. Telegram media groups do not support reply markup, so keyboards are ignored for grouped
      media. Automatically throttles after 30 messages to respect Telegram rate limits. Uses each user's specified
      language code for template rendering.
    example:
      - |-
        ```typescript
        async handleCallbackData() {
          const userIds = [123456, 789012]
          const langs = ["en", "id"]
          await this.broadcastMedia(userIds, langs)
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        broadcastMedia(ids: number[], languageCode: string[], keyboard?: ITInBoKb, data?: ITData, baseId?: string,
