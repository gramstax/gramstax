  - name: inlineKeyboard(callback, params)
    uid: gramstax!Ctx#inlineKeyboard:member(1)
    package: gramstax!
    fullName: inlineKeyboard(callback, params)
    summary: Creates an inline keyboard using a builder callback.
    remarks: >-
      The callback receives the keyboard instance and an array of button labels from the template. Supports optional
      caching for performance.
    example:
      - |-
        ```typescript
        async handleCallbackData() {
          const kb = this.inlineKeyboard((k, labels) => {
            labels.forEach((label, i) => k.text(label, `action:${i}`))
            return k
          })
          await this.reply(kb)
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'inlineKeyboard(callback: (k: ITInlineKb, l: string[]) => ITInlineKb, params?: ITInlineKbParams): ITInlineKb;'
      parameters:
        - id: callback
          description: Builder function that receives keyboard and labels.
          type: '(k: <xref uid="gramstax!ITInlineKb:type" />, l: string[]) =&gt; <xref uid="gramstax!ITInlineKb:type" />'
        - id: params
          description: Optional parameters. [ITInlineKbParams](xref:gramstax!ITInlineKbParams:type) for details.
          type: <xref uid="gramstax!ITInlineKbParams:type" />
      return:
        type: <xref uid="gramstax!ITInlineKb:type" />
        description: The inline keyboard instance.
  - name: inlineKeyboardT(PageDest, layout, baseId, data)
    uid: gramstax!Ctx#inlineKeyboardT:member(1)
    package: gramstax!
    fullName: inlineKeyboardT(PageDest, layout, baseId, data)
    summary: Creates an inline keyboard with template-based buttons linked to page destinations.
    remarks: >-
      Shorthand for [Ctx.inlineKeyboard()](xref:gramstax!Ctx%23inlineKeyboard:member(1)) with automatic callback data
      from page destinations.
    example:
      - |-
        ```typescript
        async handleCallbackData() {
          const kb = this.inlineKeyboardT([SettingsPage, HelpPage], "2")
          await this.reply(kb)

          // Or with arg
          const kb = this.inlineKeyboardT([SettingsPage.data.callbackData(1), HelpPage.data.callbackData(`hi`)], "2")
          await this.reply(kb)

          // Compare with builder for basic but not recomended because very long syntax, only use builder when needed.!
          this.inlineKeyboard((k, a) => k.text(SettingsPage.data.callbackData(), a[0]!).text(HelpPage.data.callbackData(), a[1]!))
        }
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'inlineKeyboardT(PageDest: ITKbDest[], layout?: ITKbCols, baseId?: string | null, data?: ITData): InlineKeyboard;'
      parameters:
        - id: PageDest
          description: Array of page classes or callback data strings.
          type: <xref uid="gramstax!ITKbDest:type" />[]
        - id: layout
          description: 'Layout format: "cols" or "cols-lastRow". Default: "1".'
          type: <xref uid="gramstax!ITKbCols:type" />
        - id: baseId
          description: >-
            Optional template base ID position block keyboard. IMPORTANT: If a `<base id="...">` is defined in the
            template, you must set baseId to the same value. Leaving baseId as undefined in this case will cause errors
            (for example, keyboard bindings will not work). A common mistake is defining a base ID in the template but
            not reusing it in the keyboard configuration.
          type: string | null
        - id: data
          description: Optional template interpolation data.
          type: <xref uid="gramstax!ITData:type" />
      return:
        type: <xref uid="grammy!InlineKeyboard:class" />
        description: The inline keyboard instance.
