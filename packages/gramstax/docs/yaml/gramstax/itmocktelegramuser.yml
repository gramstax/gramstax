### YamlMime:TSTypeAlias
name: ITMockTelegramUser
uid: gramstax!ITMockTelegramUser:type
package: gramstax!
fullName: ITMockTelegramUser
summary: Basic Telegram mock user profile used when generating updates.
remarks: >-
  Mirrors the Telegram Bot API `User` object. Used by `sendText`<!-- -->, `sendPhoto`<!-- -->, `sendCallbackQuery`<!--
  -->, and other helper methods to construct mock message updates. The mock server fills missing fields with defaults
  (e.g. `language_code: "en"`<!-- -->).
example: []
isPreview: false
isDeprecated: false
syntax: |-
  type ITMockTelegramUser = {
      id?: number;
      is_bot?: boolean;
      first_name?: string;
      last_name?: string;
      username?: string;
      language_code?: string;
  };
