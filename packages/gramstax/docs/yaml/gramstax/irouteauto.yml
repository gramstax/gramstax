### YamlMime:TSTypeAlias
name: IRouteAuto
uid: gramstax!IRouteAuto:type
package: gramstax!
fullName: IRouteAuto
summary: 'Route atom: runtime-decided single message.'
remarks: >-
  `auto` edits when the update carries a `callbackQuery`<!-- -->, otherwise replies — so `keyboard` may be inline OR
  bottom (the runtime picks the call). It is the only atom that reads every one of the ten universal route keys:
  `options` feeds the reply, `editOptions` the edit, `fallbackOptions` the resend after a failed edit, and `rich`<!--
  -->/`richOptions` the rich payload and its edit-legal options.
example: []
isPreview: false
isDeprecated: false
syntax: |-
  type IRouteAuto = {
      mode?: `auto`;
      keyboard?: IInBoKb | null;
      rich?: IOptReplyRich[0] | null;
      richOptions?: IOptRich | null;
      options?: IOptReply | null;
      editOptions?: IOptEdit | null;
      fallbackOptions?: IOptReply | null;
      fallback?: IOptFallbackEdit;
      broadcast?: null | undefined;
      chunkSize?: null | undefined;
  };
