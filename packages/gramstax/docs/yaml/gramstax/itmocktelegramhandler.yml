name: ITMockTelegramHandler
uid: gramstax!ITMockTelegramHandler:type
package: gramstax!
fullName: ITMockTelegramHandler
summary: Handler signature for mock Telegram methods.
remarks: >-
  Return a Bot API-like JSON object. `method` is the Telegram method name extracted from the URL path (e.g. `getMe`<!--
  -->, `setWebhook`<!-- -->).
example:
  - |-
    ```typescript
    const handler: ITMockTelegramHandler = ({method}) => ({ok: true, result: {method}})
    ```
isPreview: false
isDeprecated: false
syntax: |-
  type ITMockTelegramHandler = (payload: {
      method: string;
      request: Request;
  }) => Promise<ITMockTelegramJson> | ITMockTelegramJson;
