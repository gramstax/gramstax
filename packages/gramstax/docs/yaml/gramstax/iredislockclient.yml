### YamlMime:TSTypeAlias
name: IRedisLockClient
uid: gramstax!IRedisLockClient:type
package: gramstax!
fullName: IRedisLockClient
summary: Minimal Redis client surface used by `SessionLock`<!-- -->.
remarks: >-
  Structurally compatible with the official `@redis/client` (`RedisClientType`<!-- -->) that backs the `@keyv/redis`
  store — only `set` (with `NX`<!-- -->/`PX`<!-- -->) and `eval` are required. Keeping a minimal structural type
  decouples the lock from concrete Redis client versions.
example: []
isPreview: false
isDeprecated: false
syntax: |-
  type IRedisLockClient = {
      set(key: string, value: string, options?: {
          PX?: number;
          NX?: boolean;
      }): Promise<string | null>;
      eval(script: string, options: {
          keys: string[];
          arguments: string[];
      }): Promise<unknown>;
  };
