### YamlMime:TSTypeAlias
name: ITBroadcastEditOpts
uid: gramstax!ITBroadcastEditOpts:type
package: gramstax!
fullName: ITBroadcastEditOpts
summary: Broadcast controls shared by `renderBroadcastEdit` and `renderBroadcastDelete`<!-- -->.
remarks: >-
  All fields are optional: defaults mirror broadcast-send behavior (sequential pool, `delete-reply` edit fallback).
  Checkpoint-first — `startFrom` resumes after a restart without re-editing (indexes below count as skipped).
example: []
isPreview: false
isDeprecated: false
syntax: |-
  type ITBroadcastEditOpts = {
      onProgress?: ((done: number, total: number) => void | Promise<void>) | null;
      startFrom?: number | null;
      concurrency?: number | null;
      chunkSize?: number | null;
      chunkDelayMs?: number | null;
      fallbackEdit?: ITOptFallbackEdit | null;
  };
