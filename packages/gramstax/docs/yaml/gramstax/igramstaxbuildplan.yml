### YamlMime:TSTypeAlias
name: IGramstaxBuildPlan
uid: gramstax!IGramstaxBuildPlan:type
package: gramstax!
fullName: IGramstaxBuildPlan
summary: Resolved `gramstax build --dry-run` plan printed without writing files.
remarks: >-
  Built in `GramstaxBuild.run` from the loaded `IGramstaxConfig` plus the `--target` flag, then rendered by
  `GramstaxBuild._printPlan`<!-- -->. Every value field carries a `*Source` provenance sibling.
example: []
isPreview: false
isDeprecated: false
syntax: |-
  type IGramstaxBuildPlan = {
      pagesDir: string;
      outDir: string;
      targets: string[];
      deploy: string;
      deploySource: IGramstaxPlanSource;
      adapter: string;
      adapterPath: string;
      adapterSource: IGramstaxPlanSource | `flag`;
      name: string;
      nameSource: IGramstaxPlanSource;
      url: string;
      urlSource: IGramstaxPlanSource;
  };
