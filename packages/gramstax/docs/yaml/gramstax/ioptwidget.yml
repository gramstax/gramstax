### YamlMime:TSTypeAlias
name: IOptWidget
uid: gramstax!IOptWidget:type
package: gramstax!
fullName: IOptWidget
summary: Widget send options — `Ctx.replyWithWidget` argument index `[1]` (the `other` bag of `sendWidget`<!-- -->).
remarks: >-
  Spread LAST over the template fields, like `renderPoll`<!-- -->'s `options`<!-- -->: a caller-supplied `caption` /
  `parse_mode` / `chat_data` overrides the template value. The template defaults are the contract — `caption` with a
  hardcoded `parse_mode: "HTML"` — and `options` is the power-user escape hatch, not a second template.
example: []
isPreview: false
isDeprecated: false
syntax: type IOptWidget = Parameters<Ctx[`replyWithWidget`]>[1];
