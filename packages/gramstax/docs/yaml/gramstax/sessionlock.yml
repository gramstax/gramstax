### YamlMime:TSType
name: SessionLock
uid: gramstax!SessionLock:class
package: gramstax!
fullName: SessionLock
summary: Distributed session lock using atomic Redis leases.
remarks: >-
  Acquires a `SET NX PX` lease on the session key (auto-expiring after `leaseMs`<!-- -->) so concurrent updates for the
  same user/chat are serialized or skipped across instances. Release is atomic via Lua (owned-release).
example: []
isPreview: false
isDeprecated: false
type: class
constructors:
  - name: (constructor)(redis, options)
    uid: gramstax!SessionLock:constructor(1)
    package: gramstax!
    fullName: (constructor)(redis, options)
    summary: Creates a lock bound to one Redis client and contention policy.
    remarks: >-
      The client and policy are constructor state rather than per-call arguments because both are fixed for the process
      lifetime; the per-instance `_queues` map then serializes same-key contenders locally before Redis is consulted.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        constructor(redis: IRedisLockClient, options: {
                leaseMs: number;
                onContended: ISessionLockOnContended;
            });
      parameters:
        - id: redis
          description: Redis client exposing the atomic `set` used for the lease.
          type: <xref uid="gramstax!IRedisLockClient:type" />
        - id: options
          description: Lease duration and what to do when a key is already held.
          type: |-
            {
                    leaseMs: number;
                    onContended: <xref uid="gramstax!ISessionLockOnContended:type" />;
                }
properties:
  - name: options
    uid: gramstax!SessionLock#options:member
    package: gramstax!
    fullName: options
    summary: ''
    remarks: ''
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        options: {
                leaseMs: number;
                onContended: ISessionLockOnContended;
            };
      return:
        type: |-
          {
                  leaseMs: number;
                  onContended: <xref uid="gramstax!ISessionLockOnContended:type" />;
              }
  - name: redis
    uid: gramstax!SessionLock#redis:member
    package: gramstax!
    fullName: redis
    summary: ''
    remarks: ''
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'redis: IRedisLockClient;'
      return:
        type: <xref uid="gramstax!IRedisLockClient:type" />
methods:
  - name: acquire(sessionKey)
    uid: gramstax!SessionLock#acquire:member(1)
    package: gramstax!
    fullName: acquire(sessionKey)
    summary: Try to acquire a lease for the given session key.
    remarks: ''
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'acquire(sessionKey: string): Promise<string | null>;'
      parameters:
        - id: sessionKey
          description: The session key to lock.
          type: string
      return:
        type: Promise&lt;string | null&gt;
        description: A token string on success, or `null` if the key is already held.
  - name: release(sessionKey, token)
    uid: gramstax!SessionLock#release:member(1)
    package: gramstax!
    fullName: release(sessionKey, token)
    summary: Release a lease. Atomic Lua — only deletes when the stored token matches.
    remarks: ''
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'release(sessionKey: string, token: string): Promise<void>;'
      parameters:
        - id: sessionKey
          description: The session key to unlock.
          type: string
        - id: token
          description: The token returned by `acquire`<!-- -->.
          type: string
      return:
        type: Promise&lt;void&gt;
        description: ''
  - name: withLock(sessionKey, fn)
    uid: gramstax!SessionLock#withLock:member(1)
    package: gramstax!
    fullName: withLock(sessionKey, fn)
    summary: Acquire a lease, run `fn`<!-- -->, and release.
    remarks: ''
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'withLock<T>(sessionKey: string, fn: () => Promise<T>): Promise<T | null>;'
      parameters:
        - id: sessionKey
          description: The session key to lock.
          type: string
        - id: fn
          description: The work to perform under the lock.
          type: () =&gt; Promise&lt;T&gt;
      return:
        type: Promise&lt;T | null&gt;
        description: >-
          The return value of `fn`<!-- -->, or `null` when the lock could not be acquired and the contention policy is
          `skip`<!-- -->.
