### YamlMime:TSTypeAlias
name: IRenderMediaParams
uid: gramstax!IRenderMediaParams:type
package: gramstax!
fullName: IRenderMediaParams
summary: Parameters for `renderMedia` — the single media send/edit method.
remarks: >-
  A disjoint union over the method's four runtime routes. Every field a route never reads is declared `never` on that
  route, so combinations such as `{mode: 'edit', broadcast: {...}}` are compile errors instead of silently dropped
  fields. `mode` resolves the send-versus-edit decision exactly like
  [IRenderTextParams](xref:gramstax!IRenderTextParams:type)<!-- -->: `auto` (default) edits when the update carries a
  `callbackQuery`<!-- -->, `reply` always sends, `edit` always edits. `options` feeds the reply branch (and the fallback
  re-send); `optionsEdit1`<!-- -->/`optionsEdit2` feed the edit branch only and are DROPPED by the single-chat fallback
  re-send (edit options do not map to reply options). `fallbackEdit` mirrors
  [IOptFallbackEdit](xref:gramstax!IOptFallbackEdit:type) and defaults to `delete-reply`<!-- -->.


  `broadcast` switches to multi-recipient fan-out: `broadcast.ids` runs the send loop (kind read from the template), and
  `broadcast.targets` runs the revise loop (`type` required). The per-kind wrappers accept the single-chat and revise
  routes — see [IRenderMediaKindParams](xref:gramstax!IRenderMediaKindParams:type)<!-- -->.
example: []
isPreview: false
isDeprecated: false
syntax: type IRenderMediaParams<T extends IMediaKind> = IMediaR1<T> | IMediaR2<T> | IMediaR3<T> | IMediaR4<T>;
