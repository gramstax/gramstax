### YamlMime:TSTypeAlias
name: IRenderMediaParams
uid: gramstax!IRenderMediaParams:type
package: gramstax!
fullName: IRenderMediaParams
summary: Parameters for `renderMedia` — the single media send/edit method.
remarks: >-
  All fields except `type` are optional. `mode` resolves the send-versus-edit decision exactly like
  [IRenderTextParams](xref:gramstax!IRenderTextParams:type)<!-- -->: `auto` (default) edits when the update carries a
  `callbackQuery`<!-- -->, `reply` always sends, `edit` always edits. `options` feeds the reply branch and the
  `editMessageMedia` error state; `optionsEdit1`<!-- -->/`optionsEdit2` feed the edit branch only and are DROPPED by the
  fallback re-send (edit options do not map to reply options). `fallbackEdit` mirrors
  [IOptFallbackEdit](xref:gramstax!IOptFallbackEdit:type) and defaults to `delete-reply`<!-- -->.


  `broadcast` switches to multi-recipient fan-out: `broadcast.ids` runs the send loop (`type` optional — the kind is
  read from the template), and `broadcast.targets` runs the revise loop (`type` required). `mode`<!-- -->,
  `fallbackEdit`<!-- -->, and the `options*` fields do not apply to the send loop. The per-kind wrappers accept only the
  revise loop — see [IRenderMediaKindParams](xref:gramstax!IRenderMediaKindParams:type)<!-- -->.
example: []
isPreview: false
isDeprecated: false
syntax: >-
  type IRenderMediaParams<T extends Exclude<IMediaBlock[`type`], `group`>> = IRenderMediaSingle<T> |
  IRenderMediaBroadcastSend<T> | IRenderMediaBroadcastRevise<T>;
