### YamlMime:TSTypeAlias
name: IPageDataBase
uid: gramstax!IPageDataBase:type
package: gramstax!
fullName: IPageDataBase
summary: Base page routing data — core properties only, no callbackQueryData.
remarks: >-
  The static type of `Ctx.data`<!-- -->. The instance field is assigned through a cast to
  [IPageData](xref:gramstax!IPageData:type) in `core/ctx.ts`<!-- -->, so `callbackQueryData` typechecks even on a page
  that omits `static data`<!-- -->; there the value is `undefined` at runtime. Pages that define `buildData(...)` get a
  real implementation with the configured args.
example: []
isPreview: false
isDeprecated: false
syntax: |-
  type IPageDataBase = {
      name: string;
      intentText: string;
      intentCommandText: string;
      _positionArgText: number;
      intentCallbackQueryData: string;
      intentTextMap?: Record<string, string>;
      intentCommandTextMap?: Record<string, string>;
  };
