name: MockTelegramServer
uid: gramstax!MockTelegramServer:class
package: gramstax!
fullName: MockTelegramServer
summary: In-process mock Telegram API server for local testing.
remarks: >-
  Provides a minimal subset of the Telegram Bot API for local development. It does not emulate network delays, rate
  limits, or full Telegram behavior.
example:
  - |-
    ```typescript
    const server = new MockTelegramServer({token: "BOT_TOKEN"})
    await server.start()
    console.log(server.apiRoot)
    await server.stop()
    ```
isPreview: false
isDeprecated: false
type: class
