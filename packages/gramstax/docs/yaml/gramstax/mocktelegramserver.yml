        - id: method
          description: Optional Telegram Bot API method name to filter by (e.g. `sendMessage`<!-- -->).
          type: string
      return:
        type: <xref uid="gramstax!IMockTelegramRequestRecord:type" /> | undefined
        description: The last matching request record, or `undefined` if none found.
