  - name: webhookSecretToken
    uid: gramstax!MockTelegramServer#webhookSecretToken:member
    package: gramstax!
    fullName: webhookSecretToken
    summary: '`secret_token` registered through `setWebhook`<!-- -->, replayed on every outbound webhook POST.'
    remarks: >-
      Real Telegram sends `X-Telegram-Bot-Api-Secret-Token` on each webhook delivery, and `Gramstax` rejects deliveries
      without it whenever `optionsDeploy.webhook.secretToken` is set. Omitting the header here made `_postUpdate`
      unusable against such a bot (every call 401s), so the mock now mirrors the header the same way Telegram does.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'webhookSecretToken: string | undefined;'
      return:
        type: string | undefined
