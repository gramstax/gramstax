    uid: gramstax!MockTelegramServer:constructor(1)
    package: gramstax!
    fullName: (constructor)(options)
    summary: Create a new mock server instance.
    remarks: 'Use `port: 0` to let Bun select a free port automatically.'
    example:
      - |-
        ```typescript
        const server = new MockTelegramServer({port: 0})
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'constructor(options?: IMockTelegramServerOptions);'
      parameters:
        - id: options
          description: Server options.
          type: <xref uid="gramstax!IMockTelegramServerOptions:type" />
