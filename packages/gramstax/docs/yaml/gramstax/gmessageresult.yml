### YamlMime:TSTypeAlias
name: GMessageResult
uid: gramstax!GMessageResult:type
package: gramstax!
fullName: GMessageResult
summary: Result of `TemplateManager.getGMessage` for a `<g-message>` block.
remarks: >-
  `text` is exactly the rendered message HTML string; `rich` is computed once at compile time from the raw block body
  and is `true` when the block contains at least one Telegram Rich HTML tag, so callers can pick `renderRich` over
  `render`<!-- -->. A missing block yields `{kind: "message", text: "", rich: false}`<!-- -->.
example: []
isPreview: false
isDeprecated: false
syntax: |-
  type GMessageResult = {
      kind: `message`;
      text: string;
      rich: boolean;
  };
