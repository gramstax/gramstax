  - name: kill()
    uid: '@gramstax/worker-thread!WorkerThreadLaunch#kill:member(1)'
    package: '@gramstax/worker-thread!'
    fullName: kill()
    summary: Terminate the worker thread immediately.
    remarks: >-
      Safe to call multiple times and after the worker has already exited — terminating an exited thread hangs on some
      runtimes, so exited workers resolve immediately instead.
    example:
      - |-
        ```typescript
        worker.kill();
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'kill(): Promise<number | void>;'
      return:
        type: Promise&lt;number | void&gt;
        description: Promise resolving when the thread has terminated.
