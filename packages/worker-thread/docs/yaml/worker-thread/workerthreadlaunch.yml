  - name: shutdown(timeoutMs)
    uid: '@gramstax/worker-thread!WorkerThreadLaunch#shutdown:member(1)'
    package: '@gramstax/worker-thread!'
    fullName: shutdown(timeoutMs)
    summary: Shut the worker down gracefully.
    remarks: >-
      Sends an RPC `shutdown` request to the worker — the worker runs its `onBeforeExit` hook (flush state, close
      connections) before replying. The worker is then terminated. If the worker does not confirm within `timeoutMs`<!--
      -->, it is force-terminated.
    example:
      - |-
        ```typescript
        await worker.shutdown(10_000);
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'shutdown(timeoutMs?: number): Promise<void>;'
      parameters:
        - id: timeoutMs
          description: How long to wait for the worker's shutdown confirmation. Defaults to `5000`<!-- -->.
          type: number
      return:
        type: Promise&lt;void&gt;
        description: Promise resolving when the worker has terminated.
