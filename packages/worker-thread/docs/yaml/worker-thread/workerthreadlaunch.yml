  - name: request(method, params, _wait, _others, timeoutMs)
    uid: '@gramstax/worker-thread!WorkerThreadLaunch#request:member(1)'
    package: '@gramstax/worker-thread!'
    fullName: request(method, params, _wait, _others, timeoutMs)
    summary: Make an RPC request to the worker thread.
    remarks: ''
    example:
      - |-
        ```typescript
        const result = await worker.request("processData", [[1, 2, 3]]);
        console.log("Result:", result);
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        request(method: string, params: unknown[], _wait?: boolean, _others?: Record<string, unknown>, timeoutMs?:
        number): Promise<unknown>;
      parameters:
        - id: method
          description: Method name to call in worker. Must exist on WorkerThreadInit.
          type: string
        - id: params
          description: Method parameters. Passed as array to worker method.
          type: unknown[]
        - id: _wait
          description: Wait for response. If false, fire-and-forget. Defaults to `true`<!-- -->.
          type: boolean
        - id: _others
          description: Additional RPC data. Merged into RPC payload.
          type: Record&lt;string, unknown&gt;
        - id: timeoutMs
          description: Optional timeout in milliseconds. Rejects the request when the worker does not respond in time.
          type: number
      return:
        type: Promise&lt;unknown&gt;
        description: Promise resolving with worker response.
