name: WorkerThreadErrorHandler
uid: '@gramstax/worker-thread!WorkerThreadErrorHandler:class'
package: '@gramstax/worker-thread!'
fullName: WorkerThreadErrorHandler
summary: Package-wide error routing for worker threads.
remarks: >-
  The library never writes errors to the console. Anything a `WorkerThreadLaunch`<!-- -->, `WorkerThreadInit`<!-- -->,
  `WorkerThreadPool`<!-- -->, or gateway peer reports goes through , which hands it to the package-wide default handler.
  The default is a silent drop, so an unobserved error is never fatal to the transport that reported it.
example: []
isPreview: false
isDeprecated: false
