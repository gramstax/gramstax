name: WorkerThreadGatewayPath
uid: '@gramstax/worker-thread!WorkerThreadGatewayPath:class'
package: '@gramstax/worker-thread!'
fullName: WorkerThreadGatewayPath
summary: Gateway socket path normalization.
remarks: >-
  Stateless helper — every member is static, so the class is never instantiated. Path rules live here so the gateway
  server and client normalize identically.
example: []
isPreview: false
isDeprecated: false
type: class
methods:
  - name: normalize(path)
    uid: '@gramstax/worker-thread!WorkerThreadGatewayPath.normalize:member(1)'
    package: '@gramstax/worker-thread!'
    fullName: normalize(path)
    summary: Normalize a gateway socket path for the current platform.
    remarks: >-
      On Windows, POSIX-style paths (`/tmp/server.sock`<!-- -->) and bare identifiers (`gateway-main`<!-- -->) are
      converted to named pipes (`\\.\pipe\...`<!-- -->). Dashes are escaped (`-` → `--`<!-- -->) before `/` is mapped to
      `-`<!-- -->, so `/tmp/a-b` and `/tmp/a/b` land on distinct pipes instead of colliding. Existing `\\.\pipe\` paths
      pass through unchanged.


      On POSIX, absolute paths pass through unchanged (after a length check); relative or bare identifiers are resolved
      against `os.tmpdir()` so socket files never pollute the process working directory.
    example:
      - |-
        ```typescript
        // On Windows: "\\\\.\\pipe\\gateway--main"
        WorkerThreadGatewayPath.normalize("gateway-main");
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static normalize(path: string): string;'
      parameters:
        - id: path
          description: Raw gateway path (POSIX path or bare identifier).
          type: string
      return:
        type: string
        description: Platform-appropriate socket path.
