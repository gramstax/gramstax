    isPreview: false
    isDeprecated: false
    syntax:
      content: 'makeId(): number;'
      return:
        type: number
        description: A monotonically increasing number unique within this instance.
  - name: makeRequest(method, params, wait, others, timeoutMs)
    uid: '@gramstax/worker-thread!WorkerThreadRpc#makeRequest:member(1)'
    package: '@gramstax/worker-thread!'
    fullName: makeRequest(method, params, wait, others, timeoutMs)
    summary: Create and send an RPC request.
    remarks: ''
    example:
      - |-
        ```typescript
        // Wait for response
        const result = await rpc.makeRequest("add", [1, 2]);
        console.log(result); // 3

        // Fire and forget
        rpc.makeRequest("log", ["message"], false);

        // With timeout
        await rpc.makeRequest("slow", [], true, undefined, 5000);
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        makeRequest(method: string, params: unknown[], wait: true, others?: Record<string, unknown>, timeoutMs?:
        number): Promise<unknown>;
      parameters:
        - id: method
          description: Method name to call. Targets registered method.
          type: string
        - id: params
          description: Method parameters. Sent as positional array.
          type: unknown[]
        - id: wait
          description: Wait for response. If false, returns send result. Defaults to `true`<!-- -->.
          type: 'true'
        - id: others
          description: Additional data to include. Merged into RPC payload.
          type: Record&lt;string, unknown&gt;
        - id: timeoutMs
          description: >-
            Optional timeout in milliseconds. When exceeded, the pending request is rejected with a timeout error and
            removed from the pending map. Defaults to `defaultTimeoutMs`<!-- -->; `0` disables the timeout.
          type: number
      return:
        type: Promise&lt;unknown&gt;
        description: Promise resolving to the result if waiting, or send result if not.
  - name: makeRequest(method, params, wait, others, timeoutMs)
    uid: '@gramstax/worker-thread!WorkerThreadRpc#makeRequest:member(2)'
