### YamlMime:TSType
name: WorkerThreadRpc
uid: '@gramstax/worker-thread!WorkerThreadRpc:class'
package: '@gramstax/worker-thread!'
fullName: WorkerThreadRpc
summary: \[LOW-LEVEL\] Handles JSON-RPC style communication between threads.
remarks: >-
  Low-level internal infrastructure. Used by [WorkerThreadInit](xref:@gramstax/worker-thread!WorkerThreadInit:class) and
  [WorkerThreadLaunch](xref:@gramstax/worker-thread!WorkerThreadLaunch:class) under the hood — you rarely need to touch
  it.


  Uses simple JSON-RPC style messages with `id`<!-- -->, `method`<!-- -->, `params`<!-- -->, `result`<!-- -->,
  `error`<!-- -->.
example: []
isPreview: false
isDeprecated: false
type: class
constructors:
  - name: (constructor)(send, register, options)
    uid: '@gramstax/worker-thread!WorkerThreadRpc:constructor(1)'
    package: '@gramstax/worker-thread!'
    fullName: (constructor)(send, register, options)
    summary: Creates a new WorkerThreadRpc instance.
    remarks: ''
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        constructor(send: (data: Record<string, unknown>) => unknown, register: Record<string, (...args: never[]) =>
        unknown>, options?: {
                maxMessageSize?: number;
                defaultTimeoutMs?: number;
            });
      parameters:
        - id: send
          description: Function to send data. Called with RPC payload.
          type: '(data: Record&lt;string, unknown&gt;) =&gt; unknown'
        - id: register
          description: Object with callable methods. Exposed RPC method map.
          type: 'Record&lt;string, (...args: never[]) =&gt; unknown&gt;'
        - id: options
          description: Optional settings (message-size cap, default timeout).
          type: |-
            {
                    maxMessageSize?: number;
                    defaultTimeoutMs?: number;
                }
properties:
