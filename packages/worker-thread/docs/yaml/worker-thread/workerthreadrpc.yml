    uid: '@gramstax/worker-thread!WorkerThreadRpc#context:member'
    package: '@gramstax/worker-thread!'
    fullName: context
    summary: Default context merged into every outgoing RPC payload.
    remarks: >-
      Useful for propagating correlation data (e.g. `traceId`<!-- -->) across threads: set it once and it is included in
      every `makeRequest` payload. Per-call `others` values take precedence over this context.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'context: Record<string, unknown>;'
      return:
        type: Record&lt;string, unknown&gt;
  - name: defaultTimeoutMs
    uid: '@gramstax/worker-thread!WorkerThreadRpc#defaultTimeoutMs:member'
    package: '@gramstax/worker-thread!'
    fullName: defaultTimeoutMs
    summary: >-
      Default timeout in milliseconds for `makeRequest` calls that omit `timeoutMs`<!-- -->. Initialized from
      `DEFAULT_REQUEST_TIMEOUT_MS`<!-- -->; assign `0` to wait indefinitely. Must stay a non-negative finite number.
    remarks: ''
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'defaultTimeoutMs: number;'
      return:
        type: number
