  - name: rejectAllPending(error)
    uid: '@gramstax/worker-thread!WorkerThreadRpc#rejectAllPending:member(1)'
    package: '@gramstax/worker-thread!'
    fullName: rejectAllPending(error)
    summary: Reject every pending request.
    remarks: >-
      Used when the transport dies (e.g. worker thread exits) so callers do not hang forever. All pending entries are
      rejected and removed from the map.
    example:
      - |-
        ```typescript
        rpc.rejectAllPending(new Error("worker exited"));
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'rejectAllPending(error: unknown): void;'
      parameters:
        - id: error
          description: Error to reject pending requests with.
          type: unknown
      return:
        type: void
        description: ''
  - name: use(middlewares)
    uid: '@gramstax/worker-thread!WorkerThreadRpc#use:member(1)'
    package: '@gramstax/worker-thread!'
    fullName: use(middlewares)
    summary: Register middleware for incoming requests.
    remarks: >-
      Middleware runs in registration order before the target method is dispatched. Each middleware receives a mutable
      [IRpcContext](xref:@gramstax/worker-thread!IRpcContext:type) and a `next` function; short-circuit by setting
      `ctx.result` and skipping `next`<!-- -->, or reject by throwing.
    example:
      - |-
        ```typescript
        rpc.use(async (ctx, next) => {
          console.log(`calling ${ctx.method}`);
          await next();
        });
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'use(...middlewares: IRpcMiddleware[]): this;'
      parameters:
        - id: middlewares
          description: Middleware functions to append to the chain.
          type: <xref uid="@gramstax/worker-thread!IRpcMiddleware:type" />[]
      return:
        type: this
        description: '`this` for chaining.'
