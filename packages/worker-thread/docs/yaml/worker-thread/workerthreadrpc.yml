methods:
  - name: estimatePayloadSize(value)
    uid: '@gramstax/worker-thread!WorkerThreadRpc.estimatePayloadSize:member(1)'
    package: '@gramstax/worker-thread!'
    fullName: estimatePayloadSize(value)
    summary: Estimate the in-memory footprint of a structured value.
    remarks: >-
      Recursive walker that counts strings, numbers, buffer bytes and keys with bounded double-count-avoidance. It
      deliberately does not serialize (`JSON.stringify` throws on `BigInt`<!-- -->, which messagepack payloads can
      contain), so we approximate the size the value occupies after decode.


      Static because it depends on no instance state — the gateway server uses it to decide whether a response is worth
      caching for duplicate suppression.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'static estimatePayloadSize(value: unknown): number;'
      parameters:
        - id: value
          description: The decoded value to measure.
          type: unknown
      return:
        type: number
        description: Estimated size in bytes.
  - name: make(data)
    uid: '@gramstax/worker-thread!WorkerThreadRpc#make:member(1)'
    package: '@gramstax/worker-thread!'
    fullName: make(data)
    summary: Process an incoming RPC message.
    remarks: >-
      Message types: - \*\*Request:\*\* `{ id, method, params }` - Calls registered method and sends result/error back.
      - \*\*Result:\*\* `{ id, result }` - Resolves pending request promise. - \*\*Error:\*\* `{ id, error }` - Rejects
      pending request promise.
    example:
      - |-
        ```typescript
        worker.on("message", (data) => {
          rpc.make(data);
        });
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: |-
        make(data: {
                id?: number;
                method?: string;
                params?: unknown[];
                result?: unknown;
                error?: unknown;
            }): Promise<void>;
      parameters:
        - id: data
          description: RPC message object. Shape is request/result/error.
          type: |-
            {
                    id?: number;
                    method?: string;
                    params?: unknown[];
                    result?: unknown;
                    error?: unknown;
                }
      return:
        type: Promise&lt;void&gt;
        description: ''
  - name: makeId()
    uid: '@gramstax/worker-thread!WorkerThreadRpc#makeId:member(1)'
    package: '@gramstax/worker-thread!'
    fullName: makeId()
    summary: Generate a unique request ID.
    remarks: ''
    example:
      - |-
        ```typescript
        const id = rpc.makeId();
