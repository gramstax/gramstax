### YamlMime:TSType
name: WorkerThreadInit
uid: '@gramstax/worker-thread!WorkerThreadInit:class'
package: '@gramstax/worker-thread!'
fullName: WorkerThreadInit
summary: >-
  Base class for worker thread implementations. Handles communication with the main thread and provides RPC
  functionality.
remarks: >-
  Extend this class when defining worker thread behavior. Uses `parentPort` for messaging with main thread. Constructor
  automatically signals readiness to main thread.
example:
  - |-
    ```typescript
    import { WorkerThreadInit, WorkerThreadExport } from "@gramstax/worker-thread";

    class Worker extends WorkerThreadInit {
      constructor() {
        super(); // Required - signals ready to main thread
        console.info(`Worker ${this.id} started`);
      }

      mtdProcess(data: unknown) {
        return { processed: data };
      }
    }

    export const MyWorker = WorkerThreadExport.init({
      path: __filename,
      WTInit: Worker,
    });
    ```
isPreview: false
isDeprecated: false
type: class
