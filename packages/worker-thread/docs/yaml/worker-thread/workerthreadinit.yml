  - name: shutdown()
    uid: '@gramstax/worker-thread!WorkerThreadInit#shutdown:member(1)'
    package: '@gramstax/worker-thread!'
    fullName: shutdown()
    summary: Graceful shutdown handler, callable via RPC from the main thread.
    remarks: >-
      Runs the [WorkerThreadInit.onBeforeExit()](xref:@gramstax/worker-thread!WorkerThreadInit%23onBeforeExit:member(1))
      hook (flush state, close connections, persist data), then closes gateway resources so no socket or reconnect timer
      keeps the worker alive. The main thread terminates the worker after this resolves. Override to customize, or just
      set `onBeforeExit`<!-- -->.


      Gateway cleanup runs in a `finally` block, so it ALWAYS executes even when `onBeforeExit` throws (the hook error
      still propagates to the caller). The hook runs at most once — a second `shutdown()` call returns `true`
      immediately. After cleanup the gateway registry is cleared (`gatewayClients` emptied, `gatewayServer` and
      `gatewayClientLatest` reset to `undefined`<!-- -->) so no closed handle is reused.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'shutdown(): Promise<boolean>;'
      return:
        type: Promise&lt;boolean&gt;
        description: Promise resolving to `true` when shutdown is complete.
