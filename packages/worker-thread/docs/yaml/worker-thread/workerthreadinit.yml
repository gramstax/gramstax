methods:
  - name: createGatewayClient(serverPath, options)
    uid: '@gramstax/worker-thread!WorkerThreadInit#createGatewayClient:member(1)'
    package: '@gramstax/worker-thread!'
    fullName: createGatewayClient(serverPath, options)
    summary: \[LOW-LEVEL\] Create a gateway client to connect to another worker.
    remarks: Low-level API. Use `launchGatewayClient` from `WorkerThreadExport` instead.
    example:
      - |-
        ```typescript
        const client = await this.createGatewayClient("/tmp/other-worker.sock");
        const result = await client.request("ping", []);
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'createGatewayClient(serverPath: string, options?: IGatewayClientOptions): Promise<WorkerThreadGatewayClient>;'
      parameters:
        - id: serverPath
          description: Unix socket path to connect. Matches server gateway.
          type: string
        - id: options
          description: Connection options (auth token, reconnect tuning, encoding).
          type: <xref uid="@gramstax/worker-thread!IGatewayClientOptions:type" />
      return:
        type: Promise&lt;<xref uid="@gramstax/worker-thread!WorkerThreadGatewayClient:class" />&gt;
        description: Promise resolving with connected client.
  - name: createGatewayServer(path, register, options)
    uid: '@gramstax/worker-thread!WorkerThreadInit#createGatewayServer:member(1)'
    package: '@gramstax/worker-thread!'
    fullName: createGatewayServer(path, register, options)
    summary: Create a gateway server for inter-worker communication.
    remarks: >-
      \*\*Security:\*\* when `register` is omitted the server exposes the entire worker instance (`this`<!-- -->) to
      every socket client, so a non-empty `allowedMethods` list is \*\*required\*\* in that case — otherwise the call
      throws instead of silently opening every `mtd*` method to any process that can reach the socket. Supply an
      explicit `register` object, a non-empty `allowedMethods`<!-- -->, or both.
    example:
      - |-
        ```typescript
        // Custom object and path (explicit register — no allow-list needed)
        await this.createGatewayServer(
          "/tmp/my-worker.sock",
          { ping: () => "pong" }
        );

        // Expose `this` at the given path — allowedMethods is mandatory here
        await this.createGatewayServer("/tmp/my-worker.sock", undefined, {
          allowedMethods: ["mtdPing"],
        });
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        createGatewayServer(path: string, register?: Record<string, (...args: never[]) => unknown>, options?:
        IGatewayServerOptions): Promise<boolean>;
      parameters:
        - id: path
          description: Unix socket path. Gateway identifier. Must be unique per server worker.
          type: string
        - id: register
          description: Object with value function to expose. Called by gateway clients. Defaults to `this`<!-- -->.
          type: 'Record&lt;string, (...args: never[]) =&gt; unknown&gt;'
        - id: options
          description: Gateway server options (auth token, method allow-list, connection cap).
          type: <xref uid="@gramstax/worker-thread!IGatewayServerOptions:type" />
      return:
        type: Promise&lt;boolean&gt;
        description: Promise that resolves to `true` when gateway is ready.
