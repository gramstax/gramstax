name: WorkerThreadGatewayServer
uid: '@gramstax/worker-thread!WorkerThreadGatewayServer:class'
package: '@gramstax/worker-thread!'
fullName: WorkerThreadGatewayServer
summary: \[LOW-LEVEL\] Provides IPC server functionality for inter-worker communication using Unix domain sockets.
remarks: >-
  Low-level infrastructure. In most cases use
  [WorkerThreadInit.createGatewayServer()](xref:@gramstax/worker-thread!WorkerThreadInit%23createGatewayServer:member(1))
  instead of constructing this directly.


  Uses `net-ipc` library for Unix domain socket communication. Supports connections from multiple gateway clients.
