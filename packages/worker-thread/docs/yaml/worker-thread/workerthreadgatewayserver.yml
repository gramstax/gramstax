methods:
  - name: close()
    uid: '@gramstax/worker-thread!WorkerThreadGatewayServer#close:member(1)'
    package: '@gramstax/worker-thread!'
    fullName: close()
    summary: Stop the gateway server and drop all connections.
    remarks: >-
      The socket is released so another server (or a restart of this one) can bind the same path. Tries a graceful close
      first, but force-destroys connections if the graceful handshake does not finish within 500ms — `close()` never
      hangs. The socket file is unlinked best-effort (a missing file is ignored) and calling `close()` twice is safe.
    example: []
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'close(): Promise<void>;'
      return:
        type: Promise&lt;void&gt;
        description: ''
  - name: start(path, register, options)
    uid: '@gramstax/worker-thread!WorkerThreadGatewayServer#start:member(1)'
    package: '@gramstax/worker-thread!'
    fullName: start(path, register, options)
    summary: Start the gateway server.
    remarks: ''
    example:
      - |-
        ```typescript
        await server.start("/tmp/data-worker.sock", {
          ping: () => "pong",
          getData: (key) => database.get(key),
          setData: (key, value) => database.set(key, value),
        }, {
          token: "shared-secret",
          allowedMethods: ["ping", "getData"],
        });
        console.log("Gateway server started");
        ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: >-
        start(path: string, register?: Record<string, (...args: never[]) => unknown>, options?: IGatewayServerOptions):
        Promise<this>;
      parameters:
        - id: path
          description: Unix socket path to bind. Gateway path identifier.
          type: string
        - id: register
          description: Object to expose to clients. Called by connected clients. Defaults to `{}`<!-- -->.
          type: 'Record&lt;string, (...args: never[]) =&gt; unknown&gt;'
        - id: options
          description: Server options (auth token, method allow-list, connection cap).
          type: <xref uid="@gramstax/worker-thread!IGatewayServerOptions:type" />
      return:
        type: Promise&lt;this&gt;
        description: Promise that resolves to this server instance when ready.
